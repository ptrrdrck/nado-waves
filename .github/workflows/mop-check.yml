# Archive CDIP MOP at the three Coronado breaks (and, with `points`, at points
# that are not breaks: collector.mop's EXTRA_POINTS) and set the chain's wrap
# against it (BRIEFING §56; §29 named this as "Next" and it was never done).
#
# This exists because of where it runs. Both CDIP hosts are refused at CONNECT
# by a Claude session's egress proxy (BRIEFING §8, collector/probe_mop.py's
# DENIAL_NOTE); a runner has no such policy in front of it.
#
# MOP is a MODEL. The report is a cross-check of one ray model against
# another, never a verification series, and nothing reads it: no forecast
# number changes because of it (CLAUDE.md, "Verification must be an
# observation, not another model").
#
# On demand only. collector.mop discovers the dataset names and checks every
# variable against the file's own DDS before reading it, and exits 1 with
# what it found when they differ, so a first run that stops is a finding
# about CDIP's layout, not a failure to retry.

name: MOP cross-check

on:
  workflow_dispatch:
    inputs:
      product:
        description: "MOP product: nowcast (driven by the buoys' observed spectra, as LIVE is) or hindcast"
        required: false
        default: "nowcast"
      since:
        description: "First day to archive (YYYY-MM-DD); the 46232 spectra archive starts 2026-08-04"
        required: false
        default: "2026-08-04"
      points:
        description: "breaks (the three Coronado breaks), extra (collector.mop's EXTRA_POINTS: points that are not breaks, handoff 24b), all, or census (collector.nearshore_census: which observed nearshore buoys could score the chain and MOP, handoff 24)"
        required: false
        default: "breaks"

permissions:
  contents: write

concurrency:
  group: mop-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Archive MOP at the breaks
        if: inputs.points != 'census'
        # Dispatch inputs go through the environment, never interpolated into
        # the shell command.
        env:
          PRODUCT: ${{ inputs.product }}
          SINCE: ${{ inputs.since }}
          POINTS: ${{ inputs.points }}
        # Exit 3: every series written, but a spectrum or metadata step
        # stopped. What was written is committed (the meta file says why it
        # stopped) and the last step turns the run red.
        run: |
          set -uo pipefail
          python -m collector.mop --product "${PRODUCT:-nowcast}" --since "${SINCE:-2026-08-04}" --points "${POINTS:-breaks}"
          code=$?
          echo "MOP_STATUS=${code}" >> "$GITHUB_ENV"
          if [ "${code}" -ne 0 ] && [ "${code}" -ne 3 ]; then exit "${code}"; fi

      - name: Set the chain against it
        if: inputs.points != 'census'
        run: |
          set -euo pipefail
          python -m forecast.mopcheck --out docs/mop_check.md
          cat docs/mop_check.md >> "$GITHUB_STEP_SUMMARY"

      # points=census: no MOP series and no cross-check, only the census of
      # observed nearshore spectra (collector.nearshore_census). Report only.
      # Exit 3: written, but a request failed (the report lists which).
      - name: Census of observed nearshore spectra
        if: inputs.points == 'census'
        run: |
          # Actions runs bash -e: without +e an exit 3 ends the step here,
          # before anything is committed (run 7).
          set +e
          python -m collector.nearshore_census
          code=$?
          set -e
          echo "CENSUS_STATUS=${code}" >> "$GITHUB_ENV"
          if [ "${code}" -ne 0 ] && [ "${code}" -ne 3 ]; then exit "${code}"; fi

      - name: Commit and push
        env:
          BRANCH: ${{ github.ref_name }}
          POINTS: ${{ inputs.points }}
        run: |
          set -euo pipefail

          git config user.name "nado-waves forecast"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Deliberately scoped: MOP's series and the report, or the census
          # and its report, nothing else.
          git add data/mop docs/mop_check.md data/nearshore_census docs/nearshore_census.md 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit \
            -m "data: CDIP MOP archive and cross-check, or the nearshore census (mop-check.yml, points=${POINTS})" \
            -m "Automated commit from .github/workflows/mop-check.yml."

          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); rebasing and retrying."
            if ! git pull -q --rebase --autostash origin "${BRANCH}"; then
              git rebase --abort || true
              echo "::error title=MOP check rebase conflict::Another job changed data/mop or the report"
              exit 1
            fi
            sleep $((2 ** attempt))
          done

          echo "::error title=MOP check push failed::Could not push the report"
          exit 1

      - name: A spectrum or metadata step stopped
        if: env.MOP_STATUS == '3'
        run: |
          echo "::error title=MOP spectrum or metadata incomplete::collector.mop exited 3; the series are committed, data/mop/<break>_meta.json says what stopped"
          exit 1

      - name: A census request failed
        if: env.CENSUS_STATUS == '3'
        run: |
          echo "::error title=Nearshore census incomplete::collector.nearshore_census exited 3; what it found is committed, docs/nearshore_census.md lists what failed"
          exit 1
