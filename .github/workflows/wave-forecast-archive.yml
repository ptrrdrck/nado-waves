# GFS-Wave bulletin archive — FORECAST ERROR WORK, run on demand.
#
# Not scheduled, and deliberately so. The 45-day urgency behind collect.yml does
# not apply: the NOAA Open Data bucket retains every cycle back to 2021-03, so a
# cycle missed today is fetchable next year. A timer here would only add commits
# and pull files nobody has asked a question of yet.
#
# This archive feeds SPEC section 12 (forecast error at the buoy) and nothing
# else. A GFS-Wave bulletin IS the public forecast, so it can never be a game
# input - see CLAUDE.md. This job must never write to data/observations.

name: Archive GFS-Wave bulletins (forecast error)

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First cycle date, YYYY-MM-DD"
        required: false
        default: "2023-01-01"
      end:
        description: "Last cycle date, YYYY-MM-DD"
        required: false
        default: "2025-12-31"
      stations:
        description: "Comma-separated station ids"
        required: false
        default: "46232,46224,46222"
      force:
        description: "Re-fetch cycles already archived"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: wave-forecast-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch archived cycles
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          STATIONS: ${{ inputs.stations }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          args=(--start "${START:-2023-01-01}" --end "${END:-2025-12-31}")
          if [ -n "${STATIONS:-}" ]; then
            args+=(--stations "${STATIONS}")
          fi
          if [ "${FORCE:-false}" = "true" ]; then
            args+=(--force)
          fi
          python -m collector.gfswave_backfill "${args[@]}"

      - name: Regenerate the measured error report
        env:
          STATIONS: ${{ inputs.stations }}
        run: |
          set -euo pipefail
          stations="${STATIONS:-46232,46224,46222}"
          {
            echo "# Forecast error at the buoy — measured"
            echo
            echo "Generated by \`python -m game.verify\` on $(date -u +%Y-%m-%d)."
            echo "Archived GFS-Wave 00Z cycles against the NDBC historical archive."
            echo
            echo "## All hours"
            echo
            echo '```'
            python -m game.verify --stations "${stations}" --quantity total
            echo '```'
            echo
            echo "## South-swell hours only (buoy DPD >= 14 s, MWD 160-230)"
            echo
            echo '```'
            python -m game.verify --stations "${stations}" --quantity south
            echo '```'
          } > docs/forecast_error.md

      - name: Commit and push
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "beat-the-buoy collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Deliberately scoped: this job must never touch data/observations.
          git add data/wave_forecasts docs/forecast_error.md

          if git diff --cached --quiet; then
            echo "No new forecast rows to commit."
            exit 0
          fi

          added=$(git diff --cached --numstat -- data/wave_forecasts \
            | awk '{sum += $1} END {print sum + 0}')

          git commit \
            -m "data: archive GFS-Wave bulletins (forecast error)" \
            -m "${added} row(s). Forecast-error work only - never a game input. See SPEC section 12."

          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            git pull --rebase --autostash origin "${BRANCH}" || true
            sleep $((2 ** attempt))
          done

          echo "::error title=Wave forecast archive push failed::Could not push rows"
          exit 1
