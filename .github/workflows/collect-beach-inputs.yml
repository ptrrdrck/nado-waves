# The three inputs the Coronado forecast needs that the NDBC standard-met
# collector does not already carry: directional spectra at 46232, wind at KNZY
# and tide at 9410170.
#
# Why this is a workflow and not something a session runs: all three hosts are
# denied at CONNECT from a Claude session — www.ndbc.noaa.gov,
# aviationweather.gov and api.tidesandcurrents.noaa.gov, re-checked 2026-09-18.
# A refused tunnel surfaces as a connection error, so the host looks dead
# rather than forbidden (BRIEFING section 8). A runner has no such policy in
# front of it. "Unreachable from a session" and "not published" are different
# claims and only this job can tell them apart.
#
# Each collector exits 2 on a denial and 1 on an incomplete fetch, so a denial
# is distinguishable from an outage in the run status alone — the distinction
# BRIEFING section 8 records as having cost hours to make by hand.
#
# Cadence: NDBC publishes spectra roughly hourly, METAR arrives hourly with
# specials in between, and the tide gauge measures every six minutes. Hourly
# collection catches the first two close to when they land and undersamples the
# third on purpose -- the measured water level moves a median 1.1 cm per
# six-minute step. Tide PREDICTIONS run four days ahead and barely change; they
# ride the same pass because the request is trivial and one schedule is easier
# to reason about than three.
#
# The cron below is a floor rather than the plan. See docs/collection_trigger.md
# for why, and for the trigger that is meant to keep the real cadence.

name: Collect beach inputs

on:
  schedule:
    # Hourly, because asking for more does not get more.
    #
    # Measured across four schedules on this account, the rate GitHub actually
    # DELIVERS is pinned near 0.2 runs an hour whatever the cron asks for:
    #
    #   asked 0.21/h (5 a day)   ->  0.18/h    84%
    #   asked 1.00/h (hourly)    ->  0.26/h    26%
    #   asked 2.00/h (:05,:35)   ->  0.22/h    11%
    #   asked 6.00/h (*/10)      ->  0.12/h     2%
    #
    # Over a 29x range in what was requested the delivered rate barely moves,
    # and */10 came out LOWER per hour than hourly did. Frequency is not a
    # lever here; asking harder is throttled harder. This replaced a */10 that
    # produced exactly one scheduled run in the five hours after it merged.
    #
    # Hourly is kept because it delivers marginally the best absolute rate of
    # the four, and because it is what `COLLECT_INTERVAL_MIN` in forecast/now.py
    # promises the countdown. The two must agree or the cards call themselves
    # late on a cadence nobody asked them to keep.
    #
    # This is a floor, not a plan. Reliable collection needs a trigger that is
    # not GitHub's scheduler at all.
    - cron: "0 * * * *"

  # The trigger that is meant to do the actual work.
  #
  # A `repository_dispatch` is an API call, not a scheduled event, so it is not
  # subject to the throttle the cron comment above measures. Anything that can
  # make an authenticated POST on a timer can drive this at whatever cadence it
  # keeps -- see docs/collection_trigger.md for the request and the token it
  # needs.
  #
  # Chosen over the two alternatives on cost. Getting spacing between runs
  # INSIDE Actions means a job that sleeps, and a sleeping job holds a runner
  # for the whole gap: roughly 24 runner-hours a day whether the spacing is ten
  # minutes or sixty, which is an always-on server wearing a workflow's
  # clothes. Driven from outside, each run is the ~25 seconds it already takes
  # -- about ten runner-minutes a day for hourly collection.
  #
  # Nothing here depends on it. Until something starts calling, the cron above
  # is the only trigger and this line is inert.
  repository_dispatch:
    types: [collect]

  workflow_dispatch:
    inputs:
      station:
        description: "Buoy for directional spectra"
        required: false
        default: "46232"
      skip_commit:
        description: "Fetch and report without committing"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  # To ask series-archive.yml for a rebuild when the archive no longer matches
  # today's chain (the step after "Rebuild the observed reading").
  actions: write

concurrency:
  group: beach-inputs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Each collector runs even if an earlier one failed. A spectra denial
      # must not cost the day's wind, and vice versa: they are independent
      # sources and a partial archive is worth more than none.
      - name: Directional spectra (46232)
        id: spectra
        continue-on-error: true
        env:
          STATION: ${{ inputs.station }}
        run: |
          set -euo pipefail
          python -m collector.spectra --station "${STATION:-46232}"

      # The hourly context buoys (collector.spectra.HOURLY_STATIONS): Origin
      # reads a train's DIRECTION from 46047 (forecast.origin, BRIEFING §37-38),
      # and the hurricane gate reads both 46047 and 46086 (forecast.stormtrack).
      # Hourly, so a new arrival's bearing lands with its distance rather than a
      # collect.yml run later; collect.yml no longer fetches them, so each file
      # has one writer. 46086 stays here while its wave sensor is dark: the
      # day it returns is archived the same hour.
      - name: Directional spectra (46047, 46086, hourly)
        id: bearing
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m collector.spectra --hourly

      # NHC's best tracks, eastern and central Pacific: the LIVE tab names a
      # hurricane only when its track, run forward, is borne out by 46047 or
      # 46086 (forecast.stormtrack, BRIEFING §37c), and NHC rewrites a working
      # track every six hours. Archived byte for byte; this job is their one
      # writer. ftp.nhc.noaa.gov is denied from a session, not from here.
      - name: Best tracks (NHC)
        id: besttracks
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m collector.besttracks

      - name: Wind (KNZY)
        id: wind
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m collector.wind

      - name: Tide (9410170)
        id: tide
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m collector.tide

      # "Now" is only as fresh as the job that publishes it. The forecast job
      # runs four times a day, which would make an hourly observation up to six
      # hours old before anyone saw it -- so the observed reading is rebuilt and
      # published here, hourly, right after the spectra land. It is ~2.6 KB
      # against forecast.json's 70 KB, which is why it is its own file.
      - name: Rebuild the observed reading
        id: now
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m forecast.now
          # The same chain for each of the last 48 h, for the blue line under
          # every past hour on the Forecast tab, and for every hour of the last
          # week (series.json) for the chart on the Now tab -- one rebuild
          # feeds both, ~37 s. Derived, like now.json. It also writes
          # series_all.json from the committed archive, checked against that
          # week, for the chart's zoomed-out views.
          python -m forecast.measured
          # The measured wind and tide each hour, and the next day's predicted
          # tide, for the Wind and Tide cards' charts. Read straight from the
          # archives, not rebuilt: ~0.3 s.
          python -m forecast.windtide
          # The Origins chart: the daily archive of arrivals and named
          # hurricanes, and what the newest spectra add to it. ~1 s, more only
          # while a hurricane's band is arriving at 46047 or 46086.
          python -m forecast.originhistory --live

      # The context buoys on the LIVE tab's Buoys tab (46047, Tanner Banks):
      # the newest spectrum at the buoy, carried to no break, with its own
      # measured countdown. Its own file and its own step: nothing on the chain
      # may read a context buoy (BRIEFING §3a), and `forecast.now` exits 1 when
      # 46232 is dark, which must not take 46047's reading with it. Also each
      # buoy's last six hours of roses (forecast.rose). ~2 s.
      - name: Context buoys
        id: buoys
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m forecast.buoys

      # The archive is withheld from the page when it no longer says what
      # today's chain says (or does not exist yet). Ask for the rebuild rather
      # than waiting for the daily one; series-archive.yml queues at most one.
      - name: Ask for the archive to be rebuilt if it is out of date
        if: ${{ steps.now.outcome == 'success' && !inputs.skip_commit }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if python -c "import json,sys; sys.exit(0 if json.load(open('data/live/series_all.json')).get('available') else 1)"; then
            echo "The archive matches today's chain."
          else
            python -c "import json; print(json.load(open('data/live/series_all.json')).get('why'))"
            gh workflow run series-archive.yml --ref "${{ github.ref_name }}"
          fi

      - name: Say which sources came back
        env:
          SPECTRA: ${{ steps.spectra.outcome }}
          TRACKS: ${{ steps.besttracks.outcome }}
          BEARING: ${{ steps.bearing.outcome }}
          WIND: ${{ steps.wind.outcome }}
          TIDE: ${{ steps.tide.outcome }}
        run: |
          set -euo pipefail
          # The collectors write their own tables to the step summary. This
          # only turns the outcomes into a headline, because "the job went red"
          # does not say which of three sources failed.
          failed=""
          for pair in "spectra:${SPECTRA}" "bearing-spectra:${BEARING}" "best-tracks:${TRACKS}" "wind:${WIND}" "tide:${TIDE}"; do
            name="${pair%%:*}"; outcome="${pair##*:}"
            if [ "${outcome}" != "success" ]; then
              failed="${failed} ${name}"
            fi
          done
          if [ -n "${failed}" ]; then
            echo "::warning title=Beach inputs incomplete::Did not collect:${failed}. Read the step summary - a CONNECT denial and an outage are different things."
          else
            echo "::notice title=Beach inputs collected::spectra, wind and tide all stored."
          fi

      - name: Commit and push
        if: ${{ !inputs.skip_commit }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "nado-waves collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/spectra data/wind data/tide data/besttracks 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No new beach inputs to commit."
            exit 0
          fi

          rows=$(git diff --cached --numstat -- data/spectra data/wind data/tide data/besttracks \
            | awk '{sum += $1} END {print sum + 0}')

          git commit \
            -m "data: archive beach inputs (spectra, wind, tide)" \
            -m "${rows} row(s) added. Automated commit from .github/workflows/collect-beach-inputs.yml."

          # Another run may have pushed since checkout. Rebase and retry: the
          # NDBC real-time feed retains 45 days and a lost run is lost history.
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); rebasing and retrying."
            git pull --rebase --autostash origin "${BRANCH}" || true
            sleep $((2 ** attempt))
          done

          echo "::error title=Beach inputs push failed::Could not push archived inputs"
          exit 1

      # Republish the bundle so the observed reading reaches the page within
      # the hour. forecast.json is rebuilt only by the forecast job, so this
      # re-copies whatever it last produced -- git sees no change in it and the
      # commit carries only now.json.
      - name: Publish the observed reading
        if: ${{ !inputs.skip_commit }}
        continue-on-error: true
        env:
          PAGES_REPO: ${{ vars.PAGES_REPO || 'ptrrdrck/nado-waves-forecast' }}
          PAGES_TOKEN: ${{ secrets.FORECAST_PAGES_TOKEN }}
          BUNDLE: build/now
          REASON: "Publish observed reading"
        run: |
          set -euo pipefail
          # now.json AND index.html, but not the forecast. publish-pages.sh
          # copies what it is given, so the forecast already in the public
          # repository is left exactly as the forecast job last wrote it.
          #
          # The page is here because it and its payload used to reach the
          # public repository on different cadences -- the page four times a
          # day with the forecast, now.json every cycle -- so a change to one
          # waited on the other. Both directions of that gap have now bitten
          # (BRIEFING §35, and the countdown on 2026-09-22). Both jobs write
          # byte-identical index.html; a test pins that.
          python -m forecast.publish --only-now --out build/now
          .github/scripts/publish-pages.sh
