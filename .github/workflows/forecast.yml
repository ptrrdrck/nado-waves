# Regenerate data/live/forecast.json, which is what app/forecast.html reads.
#
# The app surface is a static page against a committed JSON file — no server,
# same shape as the rest of this repository. That means the forecast is only as
# fresh as this job, so the schedule is the product decision it looks like.
#
# Cadence: GFS-Wave runs 00/06/12/18Z and publishes about five hours later, so
# this fires at 05:40 / 11:40 / 17:40 / 23:40 UTC — shortly after each cycle
# lands, offset from the top of the hour because scheduled jobs at :00 sit in
# the longest queue on GitHub's shared runners.
#
# It runs AFTER "Collect beach inputs" has had a chance to store the hour's
# wind and tide, because the forecast reads those from the repository rather
# than fetching them. A run that finds them missing still produces a forecast
# and says on screen that they were not collected.
#
# The last step publishes the page to a PUBLIC repository, because this one is
# private and GitHub Pages cannot serve it. Same pattern as nado-waves-log,
# which serves the observer form. Until PAGES_REPO and FORECAST_PAGES_TOKEN
# exist the step skips with a notice, so this workflow is safe to merge before
# the public repository is created.

name: Build forecast

on:
  schedule:
    - cron: "40 5,11,17,23 * * *"
  # A merge that changes what the forecast computes or how the page reads it.
  # Without this the page (republished by every collection) could run new code
  # against a forecast.json built by the old code for up to six hours -- the
  # Forecast tab then showed none of the surf-zone work while Now showed all
  # of it (2026-09-26). The paths leave out the collectors' hourly data
  # commits, which change neither.
  push:
    branches: [master]
    paths:
      - "forecast/**"
      - "app/**"
      - "collector/gfswave.py"
      - "collector/wavespec.py"
      - "data/nearshore/**"
      - "data/tide/stations.json"
      - "data/tide/comparison/**"
      - ".github/workflows/forecast.yml"
  workflow_dispatch:
    inputs:
      hours:
        description: "Forecast hours to publish"
        required: false
        default: "168"

# data/live is gitignored and the bundle goes to the public repository with
# its own token. The one thing committed back is data/forecast_log/: the
# permanent record of what each build said, which nothing can rebuild later
# (forecast/forecastlog.py). Its commits are outside the push paths above, so
# they cannot retrigger this workflow.
permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the forecast
        env:
          HOURS: ${{ inputs.hours }}
        run: |
          set -euo pipefail
          # --no-spectra falls back to partitions; the default fetches the
          # model's own directional grid (617 MB streamed, ~10 s, nothing
          # archived because NOAA serves every cycle back to 2021).
          python -m forecast.live --hours "${HOURS:-168}"

      - name: Build the public bundle
        run: |
          set -euo pipefail
          python -m forecast.publish --out build/site

      # data/live is gitignored -- it is derived output, rebuilt every cycle,
      # and the public repository's history is the record of what was shown.
      # `forecast.live` has appended this build's rows to data/forecast_log/,
      # which is committed: the record the model-bias report is built on.
      - name: Commit the forecast log
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "nado-waves forecast"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Deliberately scoped: this job never touches the collected series.
          git add data/forecast_log 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No new forecast log rows to commit."
            exit 0
          fi

          rows=$(git diff --cached --numstat -- data/forecast_log \
            | awk '{sum += $1} END {print sum + 0}')
          git commit \
            -m "data: log forecast build" \
            -m "${rows} row(s) added. Automated commit from .github/workflows/forecast.yml."

          # The collector pushes hourly to the same branch. Rebase and retry.
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); rebasing and retrying."
            git pull --rebase --autostash origin "${BRANCH}" || true
            sleep $((2 ** attempt))
          done

          echo "::error title=Forecast log push failed::Could not push the forecast log"
          exit 1

      - name: Publish the page
        env:
          PAGES_REPO: ${{ vars.PAGES_REPO || 'ptrrdrck/nado-waves-forecast' }}
          PAGES_TOKEN: ${{ secrets.FORECAST_PAGES_TOKEN }}
          BUNDLE: build/site
          REASON: "Publish forecast and observed reading"
        run: .github/scripts/publish-pages.sh
