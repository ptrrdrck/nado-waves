# Dead-man's check. A silently dead collector is the worst failure mode in this
# project: the lost days are unrecoverable, and nothing in the app surfaces the
# problem until scoring breaks months later.
#
# Alerts by opening (and updating) a GitHub issue, which needs no secrets and
# reaches the repository owner by their existing notification settings. The
# issue is also repository activity, which helps against the 60-day schedule
# disablement described in keepalive.yml.

name: Collector staleness check

on:
  schedule:
    - cron: "20 15 * * *" # daily, a few hours after the 13:35 UTC collection
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check observation freshness
        id: staleness
        continue-on-error: true
        run: |
          python -m collector.staleness \
            --max-age-hours 48 \
            --output "${RUNNER_TEMP}/staleness.md"

      - name: Open or update the alert issue
        if: ${{ steps.staleness.outcome == 'failure' }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync(process.env.RUNNER_TEMP + '/staleness.md', 'utf8');
            const title = 'Collector staleness alert: observations have stopped arriving';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const body = [
              'The dead-man check found stations with no observation newer than 48 hours.',
              '',
              report,
              '',
              `[Staleness run](${runUrl}) · [Collection runs](${context.serverUrl}/` +
                `${context.repo.owner}/${context.repo.repo}/actions/workflows/collect.yml)`,
              '',
              'NDBC keeps only 45 days of real-time data. Every day this stays broken is a',
              'day of history that cannot be recovered later.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'collector-alert',
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still stale as of ${new Date().toISOString()}.\n\n${report}`,
              });
              core.setFailed(`Collector still stale; updated issue #${existing.data[0].number}`);
              return;
            }

            // The label may not exist yet on a fresh repository.
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'collector-alert',
                color: 'b60205',
                description: 'The NDBC collector has stopped archiving observations',
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['collector-alert'],
            });
            core.setFailed(`Collector stale; opened issue #${created.data.number}`);

      - name: Close a resolved alert
        if: ${{ steps.staleness.outcome == 'success' }}
        uses: actions/github-script@v8
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'collector-alert',
            });
            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Observations are fresh again as of ${new Date().toISOString()}. ` +
                  'Closing automatically. Note that any days missed while the collector ' +
                  'was down are permanently gone from the NDBC real-time feed.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
