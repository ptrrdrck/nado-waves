# Probe CDIP's own directional spectra against NDBC's relay — run on demand.
#
# 46232 is CDIP station 191 (Point Loma South); NDBC republishes it hourly, and
# that republication is what data/spectra/46232/ archives. CDIP publishes the
# same buoy every 30 minutes. This answers, from a runner, whether collecting
# it from CDIP instead is sound: which CDIP record NDBC stamps HH:00, which
# Fourier-to-bearing convention reproduces NDBC's alpha1 bin by bin, the
# cadence and freshness CDIP actually delivers, and (the watch job) how soon
# each new sample is fetchable at CDIP against NDBC, for the same samples.
#
# Why a workflow: CDIP and NDBC are both denied at CONNECT from a Claude
# session (BRIEFING section 8, re-checked 2026-10-07). A runner has no such
# policy in front of it.
#
# Writes nothing back to the repository. The raw responses are uploaded as an
# artifact so a format surprise can be read rather than guessed at.
#
# DISPATCH ONLY, and only after CDIP has been written to. On 2026-10-07 the
# fourth run in ten minutes was refused on every CDIP host by its firewall
# (awselb/2.0: "Access Denied ... Please contact us at www@cdip.ucsd.edu"),
# as the very first request had been; runs two and three, on other runners,
# got through. Whether it keys on runner addresses or on volume is unknown.
# The probe now stops at the first such refusal and exits 3. This file used to
# run on every push that changed the probe; that is how four runs landed on
# CDIP in ten minutes, and it is gone.

name: Probe CDIP spectra

on:
  workflow_dispatch:
    inputs:
      station:
        description: "CDIP id = NDBC id, comma-separated (the NDBC id is checked against the dataset's wmo_id)"
        required: false
        default: "191p1=46232,220p1=46258"
      records:
        description: "Newest CDIP records to read (1500 at 30 min is about 31 days)"
        required: false
        default: "1500"
      watch_minutes:
        description: "Minutes to time both feeds, one small request per station every 2 minutes (0 = skip the watch job)"
        required: false
        default: "95"

permissions:
  contents: read

# One run at a time, queued rather than cancelled: never two runs asking CDIP
# at once, and never a cancelled watch (it holds minutes nothing can replay).
concurrency:
  group: probe-cdip
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compare CDIP with NDBC's relay
        env:
          STATION: ${{ inputs.station }}
          RECORDS: ${{ inputs.records }}
        run: |
          set -euo pipefail
          python -m collector.probe_cdip \
            --station "${STATION:-191p1=46232,220p1=46258}" \
            --records "${RECORDS:-1500}" \
            --raw-dir raw
      - name: Keep the raw responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdip-raw
          path: raw/
          if-no-files-found: ignore
          retention-days: 14

  watch:
    if: inputs.watch_minutes != '0'
    runs-on: ubuntu-latest
    # The one job here that holds a runner while it waits. It runs once, on
    # demand, to measure a lag nothing else can reconstruct afterwards.
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Time new samples at CDIP and at NDBC
        env:
          STATION: ${{ inputs.station }}
          MINUTES: ${{ inputs.watch_minutes }}
        run: |
          set -euo pipefail
          minutes="${MINUTES:-95}"
          python -m collector.probe_cdip --watch-only \
            --station "${STATION:-191p1=46232,220p1=46258}" \
            --watch-minutes "${minutes}" --poll-seconds 120
