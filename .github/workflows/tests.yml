name: Tests

on:
  # Every branch, but not the collector's own data commits - re-running the
  # suite four times a day on unchanged code just burns Actions minutes.
  push:
    branches: ["**"]
    paths-ignore:
      - "data/**"
      - ".github/keepalive.txt"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes the run before it: the older
# result could only ever describe a commit nobody is merging. master's runs
# are never cancelled, so every merge keeps its own result.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # The collector itself has no third-party dependencies, and the suite
      # makes no network calls - NDBC responses come from fixtures.
      # One worker per core (four on a public repository's runner), each
      # taking the next test as it frees: 347 s serial, 49 s on four, measured
      # 2026-10-12. The suite writes only into tmp_path, so tests share nothing.
      - run: python -m pytest tests -q -n auto --dist worksteal
