# Origin and the hurricanes, measured (forecast/origintracks.py,
# forecast/stormtrack.py -> docs/origin_best_tracks.md; BRIEFING §37a-c).
# Manual only. Reports, and refreshes GFS-Wave's hindcast at the buoys
# (collector/wavehindcast.py -> data/wave_hindcast/), whose one writer it is.
#
# The b-decks it reads are archived hourly by collect-beach-inputs.yml, their
# one writer; this job never writes them.

name: Origin against best tracks

on:
  workflow_dispatch:
    inputs:
      min_kt:
        description: "Count only best-track fixes at least this strong (kt)"
        required: false
        default: "64"

permissions:
  contents: write

concurrency:
  group: origin-tracks
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: GFS-Wave hindcast at the buoys
        run: python -m collector.wavehindcast --start 2026-08-04

      - name: Commit the hindcast
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "nado-waves collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wave_hindcast
          if git diff --cached --quiet; then
            echo "No hindcast change."
            exit 0
          fi
          git commit -m "data: GFS-Wave hindcast at the buoys" \
            -m "Automated commit from .github/workflows/origin-tracks.yml."
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi
            git pull --rebase --autostash origin "${BRANCH}" || true
            sleep $((2 ** attempt))
          done
          echo "::error title=Hindcast push failed::Could not push data/wave_hindcast"
          exit 1

      - name: Readings against the tracks (nearest fix)
        env:
          MIN_KT: ${{ inputs.min_kt }}
        run: python -m forecast.origintracks --min-kt "${MIN_KT:-64}"

      - name: Each hurricane run forward to the buoys, with controls and backtest
        env:
          MIN_KT: ${{ inputs.min_kt }}
        run: python -m forecast.stormtrack --min-kt "${MIN_KT:-64}"
