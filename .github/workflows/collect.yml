# The NDBC archiving job. This is the most important file in the repository:
# NDBC retains only 45 days of real-time data, so anything this job fails to
# commit is gone permanently.
#
# Cadence note: each station file is a rolling window of recent history, not a
# single latest reading. Four runs a day therefore capture every hourly
# observation with three-fold redundancy, at about a sixth of the Actions usage
# of an hourly job. Polling frequency and data resolution are independent here.
# Do not "fix" this by making it hourly.

name: Collect NDBC observations

on:
  schedule:
    # Routine archiving. Offset from the top of the hour because NDBC publishes
    # roughly 25 minutes after the hour, and because scheduled jobs at :00 sit
    # in the longest queue on GitHub's shared runners.
    # 01:35 / 07:35 / 19:35 UTC = 18:35 / 00:35 / 12:35 Pacific daylight.
    - cron: "35 1,7,19 * * *"

    # Resolution runs. A round cannot resolve until the resolving observation
    # has been archived (SPEC section 4), and rounds resolve at 06:00 LOCAL
    # (SPEC section 6, "The round rhythm"). Cron cannot follow daylight saving,
    # so the run is pinned twice: 13:35 UTC is 06:35 PDT, 14:35 UTC is 06:35
    # PST. One of the two is redundant in any half of the year, which costs
    # nothing. Without the second, a winter round would not resolve until 11:35
    # local - long after dawn patrol, which is the whole ritual the round is
    # built around. Do not delete either entry to "tidy up the schedule".
    - cron: "35 13,14 * * *"
  workflow_dispatch:
    inputs:
      stations:
        description: "Comma-separated station ids (blank = all in the registry)"
        required: false
        default: ""
      dry_run:
        description: "Fetch and report without writing or committing"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# Never let two collection runs race to commit the same files.
concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch and archive observations
        # Dispatch inputs go through the environment, never interpolated into
        # the shell command.
        env:
          STATIONS: ${{ inputs.stations }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${STATIONS:-}" ]; then
            args+=(--stations "${STATIONS}")
          fi
          if [ "${DRY_RUN:-false}" = "true" ]; then
            args+=(--dry-run)
          fi
          python -m collector.run ${args[@]+"${args[@]}"}

      - name: Commit and push new observations
        if: ${{ !inputs.dry_run }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "nado-waves collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No new observations to commit."
            exit 0
          fi

          added=$(git diff --cached --numstat -- data/observations \
            | awk '{sum += $1} END {print sum + 0}')
          stations=$(git diff --cached --name-only -- data/observations | wc -l | tr -d ' ')

          git commit \
            -m "data: archive NDBC observations" \
            -m "${added} row(s) changed across ${stations} station file(s). Automated commit from .github/workflows/collect.yml."

          # Another run (or a human) may have pushed since checkout. Rebase and
          # retry rather than failing: a lost run is a lost day of history.
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); rebasing and retrying."
            git pull --rebase --autostash origin "${BRANCH}" || true
            sleep $((2 ** attempt))
          done

          echo "::error title=Collector push failed::Could not push archived observations"
          exit 1
