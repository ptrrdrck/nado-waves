# The NDBC archiving job: standard met for every registered station, plus
# directional spectra for the three context buoys. This is the most important
# file in the repository: NDBC retains only 45 days of real-time data, so
# anything this job fails to commit is gone permanently.
#
# Cadence note: each station file is a rolling window of recent history, not a
# single latest reading. Four runs a day therefore capture every hourly
# observation with three-fold redundancy, at about a sixth of the Actions usage
# of an hourly job. Polling frequency and data resolution are independent here.
# Do not "fix" this by making it hourly.

name: Collect NDBC observations

on:
  schedule:
    # 46232 publishes on the half hour (observations land at :26 and :56), so
    # collection runs at :05 and :35 -- about ten minutes behind each, and off
    # the top of the hour because scheduled jobs at :00 sit in the longest
    # queue on GitHub's shared runners.
    #
    # This replaced five runs a day inherited from the predecessor game, whose
    # times were chosen so a round could resolve before dawn patrol rather than
    # so a forecast could be fresh. Measured on the archive before the change:
    # zero rows were being lost -- NDBC serves a 45-day window and any fetch
    # collects all of it -- but the newest observation on the page was a median
    # of 200 minutes old, and 424 at the 90th percentile. The cost of the old
    # schedule was never completeness, only staleness.
    - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      stations:
        description: "Comma-separated station ids (blank = all in the registry)"
        required: false
        default: ""
      dry_run:
        description: "Fetch and report without writing or committing"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# Never let two collection runs race to commit the same files.
concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch and archive observations
        # Dispatch inputs go through the environment, never interpolated into
        # the shell command.
        env:
          STATIONS: ${{ inputs.stations }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${STATIONS:-}" ]; then
            args+=(--stations "${STATIONS}")
          fi
          if [ "${DRY_RUN:-false}" = "true" ]; then
            args+=(--dry-run)
          fi
          python -m collector.run ${args[@]+"${args[@]}"}

      # Directional spectra for the context buoys not collected hourly: 46258.
      # 46047 and 46086 moved to collect-beach-inputs.yml on 2026-10-02, because
      # the Now tab's Origin reads a train's direction from them; each file
      # keeps one writer. See CONTEXT_STATIONS in collector/spectra.py for what
      # each one is for. The
      # real-time files hold 45 days, so this job's cadence is ample and the
      # hourly beach-inputs job - whose run time is the Now tab's freshness -
      # is left carrying 46232 alone. continue-on-error, because nothing here
      # may cost the standard met its commit.
      - name: Directional spectra (context buoys, 46258)
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m collector.spectra --context

      - name: Commit and push new observations
        if: ${{ !inputs.dry_run }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "nado-waves collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No new observations to commit."
            exit 0
          fi

          added=$(git diff --cached --numstat -- data/observations \
            | awk '{sum += $1} END {print sum + 0}')
          stations=$(git diff --cached --name-only -- data/observations | wc -l | tr -d ' ')

          git commit \
            -m "data: archive NDBC observations" \
            -m "${added} row(s) changed across ${stations} station file(s). Automated commit from .github/workflows/collect.yml."

          # Another run (or a human) may have pushed since checkout. Rebase and
          # retry rather than failing: a lost run is a lost day of history.
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); rebasing and retrying."
            git pull --rebase --autostash origin "${BRANCH}" || true
            sleep $((2 ** attempt))
          done

          echo "::error title=Collector push failed::Could not push archived observations"
          exit 1
