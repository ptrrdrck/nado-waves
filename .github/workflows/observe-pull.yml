# Pull the Observe service's ratings into data/beach_ratings/ratings.csv
# (collector/observepull.py; docs/design/observe.md, "The pull").
#
# The service never holds GitHub write access; this job reads from it with
# the OBSERVE_PULL_TOKEN secret and is the file's ONE writer. The pull is
# idempotent (import_rows skips an entry_id it holds) and the service keeps
# every row, so a failed run loses nothing and the next one catches up.
#
# Hourly is a backstop, not a promise: GitHub delivers about one scheduled run
# in five hours (docs/design/infrastructure.md). Nothing reads the ratings
# yet, so that is enough; dispatch it by hand to see a rating land now.

name: Observe pull

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: observe-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # A queued run starts from the branch's tip, not the commit that
      # triggered it (infrastructure.md, single-writer jobs).
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pull, import and commit
        env:
          BRANCH: ${{ github.ref_name }}
          OBSERVE_PULL_TOKEN: ${{ secrets.OBSERVE_PULL_TOKEN }}
        run: |
          set -uo pipefail

          git config user.name "nado-waves observe"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pull() {
            python -m collector.observepull
            status=$?
            # 3: rows refused at import. The rows taken are still committed,
            # and the run goes red at the end.
            if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
              exit "$status"
            fi
          }

          commit_ratings() {
            git add data/beach_ratings
            if git diff --cached --quiet; then
              return 1
            fi
            rows=$(git diff --cached --numstat -- data/beach_ratings | awk '{sum += $1} END {print sum + 0}')
            git commit -q -m "data: pull Observe ratings" \
              -m "${rows} row(s) added. Automated commit from .github/workflows/observe-pull.yml."
          }

          pull
          if ! commit_ratings; then
            echo "No new ratings."
            exit "$status"
          fi

          # A rejected push re-appends onto the new tip; it never rebases
          # (infrastructure.md). The pull is idempotent, so running it again
          # on the new tip adds exactly what is still missing.
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "Pushed on attempt ${attempt}."
              exit "$status"
            fi
            echo "Push failed (attempt ${attempt}); pulling again onto the new ${BRANCH}."
            sleep $((2 ** attempt))
            git fetch -q origin "${BRANCH}"
            git reset -q --hard "origin/${BRANCH}"
            pull
            if ! commit_ratings; then
              echo "These ratings are already on ${BRANCH}."
              exit "$status"
            fi
          done

          echo "::error title=Observe pull push failed::Could not push the ratings"
          exit 1
