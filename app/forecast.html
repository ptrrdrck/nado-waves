// A moment inside a Forecast pill: "Oct 15 at 5:00 AM".
const pillWhen = (iso) => `${new Date(iso).toLocaleDateString(undefined, {month: "short", day: "numeric"})}`
  + ` at ${clock(iso)}`;

// Which run a past hour's number came from, and how far ahead it was made:
// the last pill of the swell's and the model wind's provenance,
// "Oct 15 at 5:00 AM, 9 h ahead".
function runPill(step) {
  const run = step.from === "past" ? step.entry.cycle_utc : DATA.cycle_utc;
  if (!run) return "";
  const lead = step.lead_h != null ? `, ${step.lead_h} h ahead` : "";
  return `${pillWhen(run)}${lead}`;
}

function breakPanel(c) {
  // The energy through the window LEADS, untitled, in the buoy tab's own
  // shape: the value line there says "combined", here "in window", and the
  // trains beneath it are listed the same way, so flipping between a break and
  // the buoy compares like with like. The buoy's figure sits under the value
  // in the provenance style because that is what it is -- where the number
  // above came from -- and it is the same spectrum on either chain: the
  // forecast's is GFS-Wave AT 46232.
  //
  // The drawing carries the windows and what takes the swell (owner's design,
  // 2026-09-26), in place of the two lists that followed a rule here. When it
  // cannot be drawn, the list's own sentence says why. The windows' chart
  // provenance is on docs.html's aperture section, vertex by vertex, one tap away.
  const aged = c.aged || "";
  const value = `<span class="val"${aged}>${c.hsWindow != null
      ? `${height(c.hsWindow)} <span class="unit">${depthLabel(c)}</span>`
      : '<span class="unit">no spectrum</span>'}</span>`;
  const measured = measuredLine(c.measured, (m) => (m.breaks || {})[c.id]);

  // An earlier run's hour whose build kept only its headline: logged before
  // full hours were (2026-09-26) and not filled from what was published. The
  // card says so rather than borrowing this run's detail for an hour this run
  // never forecast.
  if (c.past) {
    return `${value}
    <div class="quiet">
      peak <b>${c.period ? c.period.toFixed(1) + " s" : "—"}</b>
      from <b>${compass(c.direction)}</b>
    </div>
    ${measured}
    ${windowList(c.swellWindow)}
    <div class="src">The calculation for this hour was not kept.</div>`;
  }

  const drawing = windowDrawing(c, aged);
  // Which trains have an arrow there, for the list's rows to pick.
  const drawn = (i) => !!drawing
    && (drawing.includes(`data-pick="t${i}"`) || drawing.includes(`data-pick="t${i}-`));
  // How the headline was made folds out beneath it, from a caret at the end
  // of the line (owner's layout, 2026-09-26). Without the effects to tabulate
  // there is no caret, and the buoy's figure stays as a provenance line.
  const table = calculationTable(c);
  const head = table
    ? `<div class="val-row">${value}${calcToggle(c.id)}</div>
    <div class="calc-fold" id="calc-${c.id}"${CALC_OPEN ? "" : " hidden"}>${table}</div>`
    : value;
  const offshore = !table && c.hsOffshore != null
    ? `<div class="src">${period(`of ${height(c.hsOffshore)} at the buoy`)}</div>` : "";
  // The forecast's own numbers first, then the measurement under them, then
  // the geometry: the measured line never sits between two forecast lines.
  return `
    ${head}

    ${c.trains && c.trains.length ? trainList(c.trains, {drawn, aged}) : `
    <div class="quiet"${aged}>
      peak <b>${c.period ? c.period.toFixed(1) + " s" : "—"}</b>
      from <b>${compass(c.direction)}</b>
    </div>`}

    ${measured}

    ${drawing || windowList(c.swellWindow)}

    ${offshore}`;
}

// ORIGIN, on the LIVE tab (owner's request, 2026-10-02), folding out from its
// own line right above "Charts", one per swell tab like the charts:
// where each train now arriving was born, read backwards off 46232's spectrum
// (`forecast.origin`). An origin belongs to a TRAIN, so a break shows only the
// arrivals that are one of its own trains above; which trains reach a break is
// the aperture's answer, never a test of one bearing against the window.
//
// Distances are rounded to 500 in each unit and said "about": two buoys
// reading one storm independently differ by ~18-25% at the median (BRIEFING
// §37), and nothing observes the storm itself. The place is a sea, never a
// pin. No upstream "confirmation" is shown: measured, that check never tested
// the distance.
function originFor(site) {
  const O = NOW && NOW.origin;
  const s = O && O.sites && O.sites[site];
  if (!s) return null;
  const A = O.arrivals || [];
  // A hurricane borne out by the buoys names its own train; Origin's
  // dispersion reading of that same train is then the weaker claim, and goes
  // -- unless Origin read it from somewhere else: past SAME_SOURCE_DEG of the
  // storm's bearing it is another swell sharing the period (forecast.
  // originhistory; on 29 Sep a 304° ridge shared a train with Polo at 161°).
  const hurricanes = (O.hurricanes || []).filter((h) => h.sites && h.sites[site])
    .map((h) => ({...h, at: h.sites[site]}));
  // An arrival whose bearing was withheld because 46047's energy at it was
  // split (BRIEFING §38) is the storm's only from within SAME_SOURCE_DEG of one
  // of the directions it held: withholding a place must not make a name easier.
  const near = (a, b) => Math.abs(((a - b) % 360 + 540) % 360 - 180) <= SAME_SOURCE_DEG;
  const sameSource = (a, deg) => a.bearing_deg != null ? near(a.bearing_deg, deg)
    : (a.bearing_lobes || []).length ? a.bearing_lobes.some(([h]) => near(h, deg))
    : true;
  const isNamed = (c) => hurricanes.some((h) => stormPeriods(h.at).includes(c.train_period_s)
    && sameSource(A[c.arrival], h.at.bearing_deg));
  return {
    hurricanes,
    current: (s.current || []).filter((c) => A[c.arrival] && !isNamed(c))
      .map((c) => ({...A[c.arrival], train_period_s: c.train_period_s})),
    last: s.last != null && A[s.last] ? A[s.last] : null,
    lastStorm: lastStormAt(site, O),
    site, lookback: O.lookback_days, names: O.station_names || {},
    cdips: O.station_cdips || {},
    bearingStations: O.bearing_stations || [],
  };
}

// The last storm the card named at this tab, from origins.json's named moments
// (forecast.originhistory): its newest within the lookback, as of now.json's
// spectrum, and the first moment it was named there with the fix that sent
// that same train, for the day the train shown arrived (owner's request,
// 2026-10-12: "Arrived Oct 5" under a train sent Oct 10 was the storm's first
// train at South, not this one). The
// "last readable arrival" is whichever of it and Origin's own last reading
// ended later (owner's report, 2026-10-12: South read "Aleutian storm track",
// ended 2 Oct, when Tropical Storm Rachel was named there to 11 Oct). A
// reading origins.json credits to a storm at this tab is that storm's, so it
// never stands in for it. Without origins.json, Origin's reading alone.
function lastStormAt(site, O) {
  const end = Date.parse((NOW && NOW.observed_utc) || "");
  if (!ORIGINS || !ORIGINS.named || !Number.isFinite(end)) return null;
  const from = end - (O.lookback_days || 21) * 24 * HOUR_MS;
  const here = ORIGINS.named.filter((n) => n.sites && n.sites[site])
    .map((n) => ({...n, t: Date.parse(n.time_utc)})).filter((n) => n.t <= end && n.t >= from);
  if (!here.length) return null;
  const last = here.reduce((a, b) => (b.t > a.t ? b : a));
  const sent = last.sites[site].fix_utc;
  const first = here.filter((n) => n.storm === last.storm && n.sites[site].fix_utc === sent)
    .reduce((a, b) => (b.t < a.t ? b : a));
  return {...last, at: last.sites[site], since: first.time_utc};
}
const namedHere = (a, site) => Boolean(a && ORIGINS && (ORIGINS.arrivals || []).some(
  (b) => b.first_utc === a.first_utc && (b.named || {})[site]));
function lastArrival(o) {
  const reading = o.last && !namedHere(o.last, o.site) ? o.last : null;
  const storm = o.lastStorm;
  if (storm && (!reading || storm.t >= Date.parse(reading.last_utc))) return {storm};
  return reading ? {reading} : o.last ? {reading: o.last} : {};
}

// Rounded in each unit to `step`: 500 for Origin's dispersion distances, which
// two buoys read about a fifth apart; 100 for a position from NHC's best track.
const about = (v, step) => Math.max(step, Math.round(v / step) * step).toLocaleString("en-US");
const farAway = (km, step = 500) => (UNITS === "metric" ? `about ${about(km, step)} km`
  : dual(`about ${about(km * MI_PER_KM, step)} mi`, `${about(km, step)} km`));
const sea = (region) => {
  const r = (region || "").replace(/^the /, "");
  return r ? r[0].toUpperCase() + r.slice(1) : "";
};
const onDay = (iso) => new Date(iso).toLocaleString(undefined, {month: "short", day: "numeric"});
// "A", "A and B", "A, B and C".
const andList = (xs) => (xs.length < 2 ? xs.join("") : `${xs.slice(0, -1).join(", ")} and ${xs[xs.length - 1]}`);

// Every origin is a head and one paragraph, whatever kind it is (owner's
// design, 2026-10-04; one paragraph since the owner's rewrite of 2026-10-14),
// and each part is a fixed run of slots (owner's formula, 2026-10-10,
// docs/origin_wording.md): a slot with no value is dropped with its joining
// words, and nothing is reworded per case.
//   WHAT:  the head alone (a hurricane or tropical storm by name, the name
//          linked to NHC's page, and its symbol; a sea; or an unplaced
//          storm); a tab's last readable arrival opens with a line saying no
//          readable swell is arriving there now.
//   SENT:  "The {T} s train, sent [about] {date} from about {far} away."
//          "about" when the day is fitted off the swell, bare when it is
//          NHC's fix.
//   HELD:  where its direction comes from, in a sentence of its own: a named
//          storm's "NHC had it at {deg}, with winds of {speed} and {mb} mb
//          pressure at that time", the fix that sent the train; a reading's,
//          naming the
//          buoy it is read at: the bearing it holds the train from; every
//          direction it holds it from, "so no place is given"; or that it
//          does not have it.
//   KNOWN: how long it has been arriving, "Arriving for {h} h so far." on
//          every kind (owner's call, 2026-10-14): a named storm's by its
//          track, a reading's as read off the swell; past, the day it
//          arrived, "no longer arriving", and no hours, on every kind.
// No provenance block follows them (owner's call, 2026-10-14): how a storm is
// read and matched is on docs.html, and each buoy is named where it is used.
const SAME_SOURCE_DEG = 45;
const ORIGIN_SEP = " &middot; ";
// NHC's own page for the storm, with its advisories, track and cone map
// (owner's call, 2026-10-12): the readable page rather than the best-track
// file collector.besttracks archives and the card reads. Rachel in 2026 is
// archive/2026/RACHEL_graphics.php.
const NHC_ARCHIVE = "https://www.nhc.noaa.gov/archive/";
const stormPageUrl = (name, iso) =>
  `${NHC_ARCHIVE}${new Date(iso).getUTCFullYear()}/${name.toUpperCase()}_graphics.php`;
// Each buoy by its name without the state, and by the number of whoever runs
// it: "Point Loma South (CDIP <n>)", "Tanner Banks (NDBC 46047)" (owner's
// request, 2026-10-13, replacing "Point Loma South, CA (NDBC 46232)").
const buoyName = (o, id) => {
  const feed = o.cdips && o.cdips[id] ? `CDIP ${o.cdips[id]}` : `NDBC ${id}`;
  return o.names && o.names[id] ? `${bareName(o.names[id])} (${feed})` : feed;
};
// A reading's direction is one of three things, and each is said differently:
// one bearing at the unshadowed buoy (placed); the buoy has the train from
// several directions, so its mean would point between them (split, BRIEFING
// §38); or the buoy does not have the train at all (unseen). Split and unseen
// are both an unplaced storm (owner's call, 2026-10-10); the sentence naming
// the buoy says which (`heldAt`).
const isPlaced = (a) => Boolean(a.region) && a.bearing_deg != null;
const isSplit = (a) => a.bearing_deg == null && (a.bearing_lobes || []).length > 0;
// What a named storm was when the fix that sent this train was made
// (forecast.stormtrack.strength): a hurricane that has weakened stays named,
// as a tropical storm, for the swell its tropical storm fixes sent (owner's
// request, 2026-10-11), and reads as a hurricane for the swell it sent as one.
// A mark from before then carries no strength, and was a hurricane's.
const stormKind = (at) => (at && at.strength === "tropical storm" ? "Tropical Storm" : "Hurricane");
const stormSymbol = (kind) => `<svg class="storm-sym" data-kind="${kind.toLowerCase().replace(" ", "-")}"`
  + ` viewBox="0 0 20 20" role="img" aria-label="${kind.toLowerCase()} symbol">`
  + `<path d="M6.6 10C6.6 4.2 12 1.6 17.6 3M13.4 10c0 5.8-5.4 8.4-11 7"/>`
  + `<circle class="eye" cx="10" cy="10" r="3.2"/></svg>`;
// On the fold the storm's name alone links to NHC's page for it (owner's
// call, 2026-10-14, when the provenance line that carried the link went),
// and its symbol follows the name. The Origins chart's readout, which a
// finger scrubs, names the storm with neither (owner's call, same day): the
// symbol is drawn by the fold's styles alone, and the dot is the chart's mark.
const stormName = (name, at, link = false) => `${stormKind(at)} `
  + (link ? `<a href="${stormPageUrl(name, at.fix_utc)}" rel="noopener">${name}</a>` : name);
const stormHead = (name, at) => stormName(name, at, true) + stormSymbol(stormKind(at));
// A tab's last readable arrival opens with a line of its own, and carries no
// tag (owner's request, 2026-10-12; reworded 2026-10-14, without the tab).
const LAST_INTRO = "No readable swell arriving here now. The last one was:";
function originEntry({head, intro, body, storm}) {
  return `<div class="origin${intro ? " last" : ""}"${storm ? ` data-hurricane="${storm}"` : ""}>
    ${intro ? `<span class="turn">${intro}</span>` : ""}
    <span class="val">${head}</span>
    <span class="turn">${body}</span>
  </div>`;
}

// The paragraph's first sentence, for every kind: the train, when it was
// sent, and how far.
const bearingText = (d) => `${Math.round(d)}&deg; ${point(d)}`;
// A storm's swell the break's splitter cut into adjacent rows is one band at
// the open-ocean buoy, and is named as one: "The 10.5 and 11.1 s trains"
// (owner's request, 2026-10-11; forecast.stormtrack `also_periods_s`).
const stormPeriods = (at) => [at.train_period_s, ...(at.also_periods_s || [])];
const trainAt = ({period, also = [], sent, fitted, km, step}) =>
  `The ${andList([period, ...also].sort((x, y) => x - y).map((p) => p.toFixed(1)))}`
  + `&nbsp;s train${also.length ? "s" : ""}, sent ${fitted ? "about " : ""}${onDay(sent)}`
  + ` from ${farAway(km, step)} away.`;

// A reading's direction, in a sentence naming the buoy it is read at (owner's
// rewrite, 2026-10-14): the bearing it holds the train from; every direction
// a split train is held from, and so no place; or that the buoy does not have
// the train, and so no place.
function heldAt(a, o) {
  const at = buoyName(o, a.bearing_from || o.bearingStations[0]);
  if (a.bearing_deg != null) return `${at} holds this train from ${bearingText(a.bearing_deg)}.`;
  if (isSplit(a)) {
    return `${at} holds this train from ${andList(a.bearing_lobes.map(([d]) => bearingText(d)))}`
      + ", so no place is given.";
  }
  const by = o.bearingStations.map((id) => buoyName(o, id));
  return (by.length === 1 ? `${by[0]} does not have`
    : by.length === 2 ? `Neither ${by[0]} nor ${by[1]} has` : `None of ${andList(by)} has`)
    + " this train, so no place is given.";
}

// A hurricane NHC is tracking, named when its best track run forward matches
// the directional energy 46047 or 46086 measured, as of now, better than the
// same track moved back in time does (forecast.stormtrack, BRIEFING §37c-d).
// The match itself is not on the card (owner's call, 2026-10-14: it is
// explained on docs.html); the last sentence is how long the storm's swell
// has been arriving by its track, the longest at any gate buoy it was matched
// at (`stormtrack.live`'s `hours`), and none when no buoy has a count. Never
// a probability, a percentage or a match word. It is about where a train came
// from, never how big it is. Where the storm was, and how strong, are NHC's: the fix that
// sent the train now arriving, in the sentence after the day it was sent,
// because the storm has moved on since. Never Origin's distance.
// Past, as a tab's last readable arrival (owner's request, 2026-10-12): after
// the line saying so, the head and the train's sentence, then "Arrived {date},
// no longer arriving." on the day the train shown first arrived; no counts.
function hurricaneEntry(h, o, past = false) {
  const s = h.at;
  const hours = Object.values(h.match || {}).map((m) => m.hours).filter((v) => v != null);
  return originEntry({
    head: stormHead(h.name, s),
    intro: past ? LAST_INTRO : "",
    storm: h.storm,
    body: trainAt({period: s.train_period_s, also: s.also_periods_s || [],
                   sent: s.fix_utc, fitted: false, km: s.distance_km, step: 100})
      + ` NHC had it at ${bearingText(s.bearing_deg)}, with winds of ${speed(s.vmax_kt)}`
      + (s.mslp_mb ? ` and ${s.mslp_mb} mb pressure` : "") + " at that time."
      + (past ? ` Arrived ${onDay(h.since)}, no longer arriving.`
        : hours.length ? ` Arriving for ${Math.max(...hours)} h so far.` : ""),
  });
}

// An arrival read backwards off the swell: still arriving, or the last one
// this tab had. The last is the train it was at its peak hour, when it was
// matched to this tab's own trains.
function readingEntry(a, o, past = false) {
  const hours = Math.max(1, Math.round(a.hours_read));
  return originEntry({
    head: isPlaced(a) ? sea(a.region) : "Unplaced storm",
    intro: past ? LAST_INTRO : "",
    body: trainAt({period: past ? (a.peak_period_s || a.lead_period_s) : a.train_period_s,
                   sent: a.generated_utc, fitted: true, km: a.distance_km, step: 500})
      + ` ${heldAt(a, o)} `
      + (past ? `Arrived ${onDay(a.first_utc)}, no longer arriving.`
        : `Arriving for ${hours} h so far.`),
  });
}

// What folds out under the "Origin" line: the entries, and nothing under them.
function originBody(o) {
  const now = o.hurricanes.length || o.current.length;
  const {storm, reading} = now ? {} : lastArrival(o);
  return now
    ? o.hurricanes.map((h) => hurricaneEntry(h, o)).join("")
      + o.current.map((a) => readingEntry(a, o)).join("")
    : storm ? hurricaneEntry(storm, o, true)
      : reading ? readingEntry(reading, o, true)
        : `<span class="val"><span class="unit">No readable swell in the last ${o.lookback} days.</span></span>`;
}

// Whether Origin is folded out. One state for every tab, like the charts',
// and kept across a refresh the same way.
let ORIGIN_OPEN = false;
// The count beside the title (owner's request, 2026-10-03), in parentheses and
// only when something is arriving (owner's call, same day): what the fold
// lists as arriving now, named hurricanes and Origin's own readings, each one
// of this tab's trains. A "last readable arrival" is not now, and is not counted.
function originCount(o) {
  return o.hurricanes.length + o.current.length;
}
function originFold(id, o, hidden = false) {
  if (!o) return "";
  const n = originCount(o);
  const said = `${n} origin${n === 1 ? "" : "s"} arriving now`;
  return `<div class="origin-fold" data-origin-tab="${id}"${hidden ? " hidden" : ""}>
    <div class="chart-head" data-origin-head><span>Origin${n ? ` <span class="count"
      data-origin-count title="${said}">(${n})</span>` : ""}</span><button type="button"
      class="calc-toggle" data-origin-toggle aria-controls="origin-fold-${id}"
      aria-expanded="${ORIGIN_OPEN}" aria-label="Origin${n ? `, ${said}` : ""}"><svg viewBox="0 0 16 16"
      aria-hidden="true"><path d="M3.5 10 8 5.5 12.5 10"/></svg></button></div>
    <div class="fold-body" id="origin-fold-${id}"${ORIGIN_OPEN ? "" : " hidden"}>${originBody(o)}</div>
  </div>`;
}
function setOriginOpen(open) {
  ORIGIN_OPEN = open;
  remember(KEEP.originOpen, open ? "open" : "closed");
  document.querySelectorAll("[data-origin-toggle]").forEach((btn) => {
    btn.setAttribute("aria-expanded", String(open));
    const fold = $(btn.getAttribute("aria-controls"));
    if (fold) fold.hidden = !open;
  });
}

// A depth for a label: whole feet, metres to one decimal below ten.
function depthText(m) {
  return dualText(`${Math.round(m * FT_PER_M)} ft`, `${m < 10 ? m.toFixed(1) : Math.round(m)} m`);
}

// What the headline number is. Where it breaks, when the payload carries the
// surf zone; otherwise a height at the depth the rays start from (no current
// tide); and an older payload without the nearshore block still says "in
// window", because that is what its number is.
// A breaking height says only that it is one (owner's call, 2026-10-09);
// the depth it breaks in is under "Wave break" in the calculation, as
// shoaling's start depth is under "Shoaling" (`breakDepth`).
function depthLabel(c) {
  const n = c.nearshore || {};
  const b = n.breaking;
  if (b && b.depth_m != null) return "breaking height";
  const d = n.depth_m;
  return d != null && isFinite(d)
    ? `at ${dualText(`${Math.round(d * FT_PER_M)} ft`, `${Math.round(d)} m`)} depth` : "in window";
}

// Where the headline's breaking height breaks, under "Wave break": the
// depth found, or the start depth "or deeper" when it is already breaking
// there and the break is further out.
function breakDepth(n) {
  const b = (n || {}).breaking;
  if (!b || b.depth_m == null) return "";
  return b.outside_start ? `at ${depthText(n.depth_m)} depth or deeper`
    : `at ${depthText(b.depth_m)} depth`;
}

// A step's change as a signed percentage of the step before it; one decimal
// under 1%, so a small effect reads as small rather than as zero.
function pct(to, from) {
  if (!(from > 0) || to == null) return "";
  const p = 100 * (to / from - 1);
  const v = Math.abs(p) < 1 ? p.toFixed(1) : String(Math.round(p));
  return `${p > 0 ? "+" : p < 0 ? "\u2212" : ""}${v.replace("-", "")}%`;
}

// A fetch, miles first: tenths below 10, whole past it.
const fetchText = (km) => {
  const f = (v) => (v < 10 ? v.toFixed(1) : String(Math.round(v)));
  return dualText(`${f(km * MI_PER_KM)} mi`, `${f(km)} km`);
};

// How the headline was made from the buoy's reading, one effect per row:
// what it changes the height by, that change as a share of the step before,
// and the height it leaves. Folds out under the headline from the caret at
// its end (owner's layout, 2026-09-26). Composed from the payload's
// `nearshore.effects`, never from constants; null when a payload carries no
// effects, and the card then keeps its one provenance line instead.
//
// The islands are a hard shadow in the window figure and in the refraction
// step alike, so refraction is the seabed alone, and the diffraction step is
// only what diffraction changes about the edges (forecast.nearshore.summarise).
function calculationTable(c) {
  const n = c.nearshore || {};
  const e = n.effects;
  if (!e || e.window_hs_m == null || e.shoaled_hs_m == null) return null;
  // The seabed, then diffraction at every window edge (the Coronado Islands,
  // the Point Loma tip, the Baja tangent), both on the bent rays and both as
  // a signed change: refraction against the straight-line window,
  // diffraction against the hard-edged refraction (forecast.nearshore).
  // `seabed_hs_m` is the older payload's name for the diffracted figure.
  const diffracted = e.diffracted_hs_m != null ? e.diffracted_hs_m : e.seabed_hs_m;
  const refracted = e.refracted_hs_m != null ? e.refracted_hs_m : diffracted;
  const change = (to, from) => {
    const d = to - from;
    return `${d < 0 ? "\u2212" : "+"}${height(Math.abs(d))}`;
  };
  const rows = [];
  const row = (calc, to, from, {note = "", bound = false} = {}) => rows.push(
    `<tr><th scope="row">${calc}${note ? ` <span class="unit">${note}</span>` : ""}</th>`
    + `<td>${from == null ? "\u2014" : change(to, from)}</td>`
    + `<td>${from == null ? "\u2014" : pct(to, from)}</td>`
    + `<td>${bound ? "\u2264 " : ""}${height(to)}</td></tr>`);
  row("Buoy", e.buoy_hs_m, null);
  row("Windows", e.window_hs_m, e.buoy_hs_m);
  row("Refraction", refracted, e.window_hs_m);
  row("Diffraction", diffracted, refracted);
  // Bottom friction along the rays' paths over the shelf, before shoaling
  // divides back in (forecast.raytrace.friction_rate). Absent from a payload
  // built before it was modelled.
  let before = diffracted;
  if (e.friction_hs_m != null) {
    row("Bottom friction", e.friction_hs_m, diffracted);
    before = e.friction_hs_m;
  }
  const start = n.depth_m != null ? `to ${depthText(n.depth_m)}` : "";
  row("Shoaling", e.shoaled_hs_m, before, {note: start});
  // Swell and chop together at the start depth; an older payload's `hs_m` is
  // that figure, a newer one's is the breaking height. Not a step the swell
  // takes, but without its row the column would not arrive at the headline.
  const withChop = e.with_chop_hs_m != null ? e.with_chop_hs_m : n.hs_m;
  if (e.local && withChop != null) {
    // The chop's period and the fetch it grew over (owner's call, 2026-10-15:
    // its kind and whose wind are on docs.html, not in the row). Behind land
    // that is the water to the land upwind; over open water, the reach
    // between the buoy and the break it was grown on by.
    const fetch = e.local.fetch_km != null ? `${fetchText(e.local.fetch_km)} of fetch` : "";
    const note = [`${e.local.tp_s.toFixed(1)} s`, fetch].filter(Boolean).join(", ");
    row("Local chop", withChop, e.shoaled_hs_m, {note});
  }
  // Then in to where it breaks, at this tide (forecast.surfzone). Already
  // breaking at the start depth means the break is further out, and the
  // figure is an upper bound rather than a break point found.
  const b = n.breaking;
  let foot = "";
  if (b && b.hs_m != null && withChop != null) {
    row("Wave break", b.hs_m, withChop, {note: breakDepth(n), bound: !!b.outside_start});
    if (b.outside_start) {
      const depth = n.depth_m != null ? depthText(n.depth_m) : "shallow";
      foot = `<div class="quiet">At this tide it is already breaking in ${depth}`
        + ` of water, so the break is further out and the last height is an upper bound.</div>`;
    }
  }
  return `<table class="calc-table">
      <thead><tr><th scope="col">Step</th><th scope="col">Change</th>`
    + `<th scope="col">%</th><th scope="col">Hs</th></tr></thead>
      <tbody>${rows.join("")}</tbody>
    </table>${foot}`;
}

// The caret at the end of the headline. One state for every break, so
// flipping between breaks keeps the table open, and kept across a refresh
// the way the tab choices are.
let CALC_OPEN = false;
function calcToggle(id) {
  return `<button type="button" class="calc-toggle" data-calc-toggle
    aria-controls="calc-${id}" aria-expanded="${CALC_OPEN}"
    aria-label="How this height was calculated"><svg viewBox="0 0 16 16" aria-hidden="true">`
    + `<path d="M3.5 10 8 5.5 12.5 10"/></svg></button>`;
}

// Flips every caret and table in place rather than re-rendering, so the
// countdowns and the drawing's picks keep their place.
function setCalcOpen(open) {
  CALC_OPEN = open;
  remember(KEEP.calc, open ? "open" : "closed");
  document.querySelectorAll("[data-calc-toggle]").forEach((btn) => {
    btn.setAttribute("aria-expanded", String(open));
    const fold = $(btn.getAttribute("aria-controls"));
    if (fold) fold.hidden = !open;
  });
}

// Larger than the first version (r 124 -> 140 in the same 320 box): the
// drawing is read AND tapped now, and a phone has room either side of it.
const DRAW = {w: 320, h: 200, cx: 160, cy: 162, r: 140, rim: 1};
// The 5 m arrowhead against its train's own offshore head (owner's call,
// 2026-10-22: slightly larger).
const NEAR_HEAD = 1.25;

// Plain text for SVG captions, which cannot hold the HTML `height()` returns.
// Same one conversion constant, so the rule that a factor appears once holds.
const heightText = (m) => dualText(`${(m * FT_PER_M).toFixed(1)} ft`, `${m.toFixed(2)} m`);
const svgText = (v) => String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;")
  .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const shareText = (share) => {
  const p = 100 * share;
  return `${p < 1 ? p.toFixed(1) : Math.round(p)}%`;
};

// One break's windows, drawn facing the way the break faces, and a way into
// what used to be two lists beneath it (owner's design, 2026-09-26). The
// drawing IS the windows and the blockers now: tap a grey shadow for the land
// casting it and the share of this swell it takes; tap a window for the land
// either side and its width; tap an arrow for that train. Each shows only its
// own edge headings and puts its line where "facing" was. Tap it again, or
// the sand below the chord, to return to the default drawing. A mouse
// previews on hover; the keyboard reaches every section with Tab.
function windowDrawing(c, aged = "") {
  if (c.normal == null || !isFinite(c.normal)) return "";
  const {w, h, cx, cy, r} = DRAW;
  // Bearing -> angle off the normal, -180..180. Negative is the reader's left.
  const rel = (b) => ((b - c.normal) % 360 + 540) % 360 - 180;
  const bearing = (a) => ((c.normal + a) % 360 + 360) % 360;
  const at = (a, rad) => {
    const t = a * Math.PI / 180;
    return [cx + rad * Math.sin(t), cy - rad * Math.cos(t)];
  };
  const xy = (p) => `${p[0].toFixed(1)},${p[1].toFixed(1)}`;
  const wedge = (a0, a1, rad = r) =>
    `M${cx},${cy} L${xy(at(a0, rad))} A${rad},${rad} 0 0 1 ${xy(at(a1, rad))} Z`;
  // The rim is a stroke centred on r, so anything ending AT r stops halfway
  // through it. Shadows and rays run to its outer edge instead.
  const outer = r + DRAW.rim / 2;

  const wins = (c.swellWindow || [])
    .filter((win) => win && isFinite(win.from) && isFinite(win.to))
    .map((win) => ({...win, a0: rel(win.from), a1: rel(win.to)}))
    .filter((win) => win.a0 >= -90 && win.a1 <= 90 && win.a0 < win.a1)
    .sort((p, q) => p.a0 - q.a0);
  if (!wins.length) return "";

  // The shadows are whatever the windows leave, and each is cast by the land
  // that closes the window before it -- the same name the blocker carries in
  // `taken_by`, so its share is looked up, never typed.
  const shadows = [];
  let from = -90;
  wins.forEach((win) => {
    if (win.a0 > from) shadows.push({a0: from, a1: win.a0, blocker: win.opened_by});
    from = win.a1;
  });
  if (from < 90) shadows.push({a0: from, a1: 90, blocker: wins[wins.length - 1].closed_by});
  const taken = (name) => (c.takenBy || []).find((tb) => tb.blocker === name);

  // Degree labels. At a chord end they sit just above it, inside the
  // drawing: below it is the caption's line, and outside the box is the card.
  // `side` is -1 for a section's low edge and +1 for its high edge; a pair
  // closer than 16 degrees is pushed apart, low to the left and high to the
  // right, or the 193° and 199° between the islands print on top of each other.
  const label = (a, show, side = 0, tight = false) => {
    const b = Math.round(bearing(a));
    if (Math.abs(a) >= 89.5) {
      const left = a < 0;
      return `<text class="deg" data-show="${show}" x="${cx + (left ? 6 - r : r - 6)}" y="${cy - 7}"`
        + ` text-anchor="${left ? "start" : "end"}"${show === "default" ? "" : " hidden"}>${b}°</text>`;
    }
    const [x, y] = at(a, r + 12);
    const s = Math.sin(a * Math.PI / 180);
    const anchor = tight ? (side < 0 ? "end" : "start")
      : s > 0.25 ? "start" : s < -0.25 ? "end" : "middle";
    return `<text class="deg" data-show="${show}" x="${x.toFixed(1)}" y="${y.toFixed(1)}"`
      + ` text-anchor="${anchor}"${show === "default" ? "" : " hidden"}>${b}°</text>`;
  };
  // The line where "facing" sits. Two lines when one would run off the box,
  // or where the text puts its own break ("\n": a train's 5 m heading).
  const caption = (text, show) => {
    const parts = text.includes("\n") ? text.split("\n")
      : text.length > 50 && text.includes(", ")
        ? [text.slice(0, text.indexOf(", ") + 1), text.slice(text.indexOf(", ") + 2)] : [text];
    return `<text class="faces" data-show="${show}" x="${cx}" y="${cy + 20}"`
      + `${show === "default" ? "" : " hidden"}>`
      + parts.map((part, i) => `<tspan x="${cx}" dy="${i ? 13 : 0}">${svgText(part)}</tspan>`).join("")
      + `</text>`;
  };

  const sections = [];      // what the pointer can pick, by angle
  const labels = [label(wins[0].a0, "default"), label(wins[wins.length - 1].a1, "default")];
  const captions = [caption(`facing ${compass(c.normal)}`, "default")];

  const windowPaths = wins.map((win, i) => {
    const key = `w${i}`;
    const soft = win.confidence && win.confidence !== "high";
    const text = `${shortBlocker(win.opened_by)} → ${shortBlocker(win.closed_by)}, `
      + `${point(midBearing(win.from, win.to))}, ${Math.round(win.a1 - win.a0)}° wide`
      + (soft ? ", one edge estimated" : "");
    sections.push({key, a0: win.a0, a1: win.a1});
    const tight = win.a1 - win.a0 < 16;
    labels.push(label(win.a0, key, -1, tight), label(win.a1, key, 1, tight));
    captions.push(caption(text, key));
    return `<path class="win" data-pick="${key}" tabindex="0" role="button"`
      + ` aria-label="${svgText(text)}" d="${wedge(win.a0, win.a1, outer)}"/>`;
  }).join("");

  const shading = shadows.map((sh, i) => {
    const key = `s${i}`;
    const tb = taken(sh.blocker);
    const text = tb
      ? `${sh.blocker}, blocking ${shareText(tb.share)} of this swell`
        + (tb.verified === false ? " (estimated)" : "")
      : `${sh.blocker}, blocking none of this swell`;
    sections.push({key, a0: sh.a0, a1: sh.a1});
    const tight = sh.a1 - sh.a0 < 16;
    labels.push(label(sh.a0, key, -1, tight), label(sh.a1, key, 1, tight));
    captions.push(caption(text, key));
    return `<path class="shadow" data-pick="${key}" tabindex="0" role="button"`
      + ` aria-label="${svgText(text)}" d="${wedge(sh.a0, sh.a1, outer)}"/>`;
  }).join("");

  // Every edge is a ray from the break to the rim.
  const rays = wins.flatMap((win) => [win.a0, win.a1]).map((a) => {
    const [x, y] = at(a, outer);
    return `<line class="ray" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
  }).join("");

  // Arrows come in from the rim along the heading each train arrives from,
  // and stop well short of the break: trains a few degrees apart would
  // otherwise meet in one knot of arrowheads at the centre. Drawn last so a
  // train is never hidden under a shadow it has leaked past. A train from
  // behind the beach is not drawn: it cannot arrive, and an arrow pointing out
  // of the sand would say it could.
  //
  // The head is its own triangle rather than an SVG marker: a marker cannot
  // take its colour from the line it sits on in every browser, and on some
  // the heads came out black and grey. The leg stops inside the head, where
  // the triangle is wider than the stroke, so it never shows either side of
  // the tip.
  // Local chop is made by the wind over the last few kilometres, not
  // carried in from the ocean, so it gets no arrow from the rim.
  const trains = [];
  // Where each train arrives from in 5 m of water, refracted toward the shore
  // (owner's request, 2026-10-22: on the drawing only, never in its row): an
  // arrowhead alone, pointing in at the break along that heading, a quarter
  // larger than its own offshore arrow's head (owner's call, same day: the
  // dashed leg looked bad), one per outer arrow, shown only while its train
  // is picked -- drawn for every train at once they would knot at the break.
  // A payload from before it, or a train no ray carried, has none.
  const nears = [];
  // A train from two directions gets an arrow from each (`headings`).
  const arrows = (c.trains || [])
    .flatMap((t, i) => headings(t).map((deg, j) => ({t, i, j, deg, a: rel(deg)})))
    .filter(({t, deg, a}) => !t.local && isFinite(deg) && a > -90 && a < 90)
    .reverse()
    .map(({t, i, j, deg, a}) => {
      const key = j ? `t${i}-${j}` : `t${i}`;
      const lead = i === 0;
      const len = lead ? 10 : 8, half = lead ? 4.5 : 3.5;
      const tip = r * 0.62;
      const [x0, y0] = at(a, r * 0.95);
      const [x1, y1] = at(a, tip + 0.6 * len);
      const th = a * Math.PI / 180;
      const [bx, by] = at(a, tip + len);
      const [px, py] = [Math.cos(th) * half, Math.sin(th) * half];
      const head = `${xy(at(a, tip))} ${xy([bx + px, by + py])} ${xy([bx - px, by - py])}`;
      const near = nearHeadings(t);
      const shown = near.filter((d) => d != null);
      const text = `${heightText(t.hs_m)} at ${t.period_s.toFixed(1)} s, ${pointsText(t)}`
        + (shown.length ? `\nfrom ${shown.map(compass).join(" & ")} in 5 m of water` : "")
        + (t.wind_sea ? ", wind sea" : "");
      const said = text.replace("\n", ", ");
      const an = near[j] == null ? null : rel(near[j]);
      if (an != null && an > -90 && an < 90) {
        const nlen = NEAR_HEAD * len, nhalf = NEAR_HEAD * half, ntip = r * 0.1;
        const nth = an * Math.PI / 180;
        const [nbx, nby] = at(an, ntip + nlen);
        const [npx, npy] = [Math.cos(nth) * nhalf, Math.sin(nth) * nhalf];
        nears.push(`<polygon class="near" data-show="${key}" hidden`
          + ` points="${xy(at(an, ntip))} ${xy([nbx + npx, nby + npy])} ${xy([nbx - npx, nby - npy])}"/>`);
      }
      const [ex, ey] = at(a, tip);
      trains.push({key, x0: +x0.toFixed(1), y0: +y0.toFixed(1), x1: +ex.toFixed(1), y1: +ey.toFixed(1)});
      labels.push(`<text class="deg" data-show="${key}" hidden x="${at(a, r + 12)[0].toFixed(1)}"`
        + ` y="${at(a, r + 12)[1].toFixed(1)}" text-anchor="${Math.sin(th) > 0.25 ? "start"
          : Math.sin(th) < -0.25 ? "end" : "middle"}">${Math.round(deg)}°</text>`);
      captions.push(caption(text, key));
      return `<g class="swell${lead ? " lead" : ""}" data-pick="${key}" tabindex="0" role="button"`
        + ` aria-label="${svgText(said)}">`
        + `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}"/>`
        + `<polygon points="${head}"/></g>`;
    }).join("");

  const said = wins.map((win) => `${Math.round(win.from)} to ${Math.round(win.to)} degrees`).join(", ");
  const heard = (c.trains || []).filter((t) => !t.local && isFinite(t.from_deg))
    .map((t) => headings(t).map(Math.round).join(" and ")).join(", ");
  const summary = `Swell windows facing ${compass(c.normal)}: ${said}.`
    + (heard ? ` Swell arriving from ${heard} degrees.` : "")
    + " Select a window, a shadow or an arrow for its detail.";
  // Swell aimed behind the beach is not blocked by anything -- nothing is in
  // the way, it is pointed elsewhere -- so it is no shadow. It belongs to the
  // sand behind the chord, and a tap there says how much of it there is.
  const away = taken(AWAY);
  if (away) {
    captions.push(caption(`${shareText(away.share)} of this swell is ${AWAY}; `
      + `nothing blocks it`, "away"));
  }
  const geo = svgText(JSON.stringify({cx, cy, r: outer, sections, trains, away: !!away}));

  return `<svg class="aperture" viewBox="0 0 ${w} ${h}" role="group" aria-label="${svgText(summary)}"
    data-break="${c.id}" data-geo="${geo}"${aged}>
    <path class="sea" d="${wedge(-90, 90)}"/>
    ${windowPaths}${shading}${rays}${labels.join("")}${arrows}${nears.join("")}
    <line class="chord" x1="${cx - r}" y1="${cy}" x2="${cx + r}" y2="${cy}"/>
    <circle class="spot" cx="${cx}" cy="${cy}" r="3"/>
    ${captions.join("")}
  </svg>`;
}

// Which section of each break's drawing is picked, by break. Kept across the
// re-renders a refresh or the hour picker causes; lost with the page.
const PICKED = {};

// Which keys a pick lights. A section or one arrow is its own key; a train
// picked from the list ("T2") is every arrow it has, one per direction it
// arrives from ("t2", "t2-1").
const pickMatch = (key) => (key && /^T\d+$/.test(key)
  ? (k) => k === `t${key.slice(1)}` || k.startsWith(`t${key.slice(1)}-`)
  : (k) => k === key);
const pickDrawn = (svg, key) => !!key
  && [...svg.querySelectorAll("[data-pick]")].some((el) => pickMatch(key)(el.getAttribute("data-pick")));

// Show one section's state -- or the default drawing for none.
function showPick(svg, key) {
  const hit = pickMatch(key);
  svg.classList.toggle("picked", !!key);
  // The row of the train lit, whether picked from the list or by its arrow,
  // reads as pressed, as a Buoys tab row does over its rose.
  const pane = svg.closest(".pane");
  if (pane) {
    pane.querySelectorAll(".train[data-train]").forEach((row) => {
      const n = row.getAttribute("data-train");
      row.setAttribute("aria-pressed", String(!!key
        && (key === `T${n}` || key === `t${n}` || key.startsWith(`t${n}-`))));
    });
  }
  svg.querySelectorAll("[data-pick]").forEach((el) =>
    el.classList.toggle("on", !!key && hit(el.getAttribute("data-pick"))));
  // Every arrow's bearing, but one caption: a train's arrows share its text.
  let captioned = false;
  svg.querySelectorAll("[data-show]").forEach((el) => {
    const show = el.getAttribute("data-show");
    let on = key ? hit(show) : show === "default";
    if (on && el.classList.contains("faces")) { on = !captioned; captioned = true; }
    if (on) el.removeAttribute("hidden"); else el.setAttribute("hidden", "");
  });
}

// What is under a point on the drawing. Arrows first, by distance to their
// leg; then sections by angle. The island shadows are 2-5 degrees wide beside
// a 6-degree channel, too thin to hit and too close to pad without covering
// each other, so a tap within 2.5 degrees of a section under 5 degrees wide
// takes it rather than its wide neighbour. Below the chord is the sand: "".
function pickAt(svg, clientX, clientY) {
  const ctm = svg.getScreenCTM();
  if (!ctm) return null;
  const pt = new DOMPoint(clientX, clientY).matrixTransform(ctm.inverse());
  const geo = JSON.parse(svg.getAttribute("data-geo"));
  const dx = pt.x - geo.cx, dy = geo.cy - pt.y;
  // Behind the chord is the sand: the swell aimed away from the beach, if
  // any of it is, and otherwise the way back to the default drawing.
  if (dy < 0) return geo.away ? "away" : "";
  if (Math.hypot(dx, dy) > geo.r + 14) return null;
  for (const arrow of geo.trains) {
    const vx = arrow.x1 - arrow.x0, vy = arrow.y1 - arrow.y0;
    const k = Math.max(0, Math.min(1,
      ((pt.x - arrow.x0) * vx + (pt.y - arrow.y0) * vy) / (vx * vx + vy * vy)));
    if (Math.hypot(pt.x - (arrow.x0 + k * vx), pt.y - (arrow.y0 + k * vy)) < 9) return arrow.key;
  }
  const a = Math.atan2(dx, dy) * 180 / Math.PI;
  const off = (s) => (a < s.a0 ? s.a0 - a : a > s.a1 ? a - s.a1 : 0);
  const thin = geo.sections.filter((s) => s.a1 - s.a0 < 5 && off(s) <= 2.5)
    .sort((p, q) => off(p) - off(q));
  if (thin.length) return thin[0].key;
  const hit = geo.sections.find((s) => off(s) === 0);
  return hit ? hit.key : null;
}

// A tap picks; the same tap again, or the sand, returns to the default.
function togglePick(svg, key) {
  const id = svg.getAttribute("data-break");
  PICKED[id] = key && PICKED[id] !== key ? key : null;
  showPick(svg, PICKED[id]);
}

function restorePicks() {
  document.querySelectorAll("svg.aperture[data-break]").forEach((svg) => {
    const key = PICKED[svg.getAttribute("data-break")];
    showPick(svg, pickDrawn(svg, key) ? key : null);
  });
}

// Delegated once, like the tabs, because the cards are rebuilt on every render.
function wireDrawings() {
  const strip = $("conditions");
  // A train in the list and the drawing in the same tab: the row picks its
  // arrows as a tap on them does, and a mouse over it previews them.
  const rowOf = (e) => {
    const row = e.target.closest(".train[data-train]");
    const pane = row && row.closest(".pane");
    const svg = pane && pane.querySelector("svg.aperture");
    const key = row && `T${row.getAttribute("data-train")}`;
    return svg && pickDrawn(svg, key) ? {row, svg, key} : null;
  };
  const settle = (svg) => showPick(svg, PICKED[svg.getAttribute("data-break")] || null);
  strip.addEventListener("click", (e) => {
    const got = rowOf(e);
    if (got) togglePick(got.svg, got.key);
  });
  strip.addEventListener("pointerover", (e) => {
    const got = e.pointerType === "mouse" && rowOf(e);
    if (got) showPick(got.svg, got.key);
  });
  strip.addEventListener("pointerout", (e) => {
    const got = e.pointerType === "mouse" && rowOf(e);
    if (got && !got.row.contains(e.relatedTarget)) settle(got.svg);
  });
  strip.addEventListener("keydown", (e) => {
    const got = (e.key === "Enter" || e.key === " ") && rowOf(e);
    if (!got) return;
    e.preventDefault();
    togglePick(got.svg, got.key);
  });
  strip.addEventListener("click", (e) => {
    const svg = e.target.closest("svg.aperture");
    if (!svg) return;
    // A click with no pointer behind it (a screen reader activating a
    // section) has no coordinates to test; it names its section itself.
    const own = e.target.closest("[data-pick]");
    const key = e.detail === 0 && own ? own.getAttribute("data-pick")
      : pickAt(svg, e.clientX, e.clientY);
    if (key !== null) togglePick(svg, key);
  });
  // A mouse previews what a tap would pick, and leaving puts the pick back.
  strip.addEventListener("pointermove", (e) => {
    const svg = e.target.closest("svg.aperture");
    if (!svg || e.pointerType !== "mouse") return;
    const key = pickAt(svg, e.clientX, e.clientY);
    showPick(svg, key || PICKED[svg.getAttribute("data-break")] || null);
  });
  strip.addEventListener("pointerout", (e) => {
    const svg = e.target.closest("svg.aperture");
    if (svg && !svg.contains(e.relatedTarget)) showPick(svg, PICKED[svg.getAttribute("data-break")] || null);
  });
  strip.addEventListener("keydown", (e) => {
    const el = e.target.closest("svg.aperture [data-pick]");
    if (!el || (e.key !== "Enter" && e.key !== " ")) return;
    e.preventDefault();
    togglePick(el.closest("svg"), el.getAttribute("data-pick"));
  });
}

// The buoy's tab ("Buoys" since 2026-10-06): the offshore spectrum itself,
// before any aperture.
//
// On the LIVE tab it also carries the context buoys from buoys.json (owner's
// request, 2026-10-06): since 2026-10-12 46086, San Clemente Basin, then
// 46047, Tanner Banks, the least shadowed buoy in the array -- buoys.json's
// order (owner's call, 2026-10-12) -- each built the same
// way -- combined height and maximum-entropy trains -- under its own name,
// its own observed time and its own countdown, because their spectra are
// stamped at :20 and :50 and land on their own measured lags
// (forecast.buoys). Each is not carried to any break (BRIEFING §3a), and its
// block says so in its own words (`note`): 46047 is outside every break's
// windows, 46086 inside South's. Each block is named in its
// provenance, never over its height: the headline is the height alone, as a
// break's is (owner's call, 2026-10-11).
//
// Each buoy's provenance follows its own measurements, all beneath 46232
// (owner's call, 2026-10-06): 46232's reading here, then the card's own
// provenance lines, which are 46232's, then each context buoy's block after
// them (`swellCard`'s `after`), its provenance in the same style.
function buoyPanel(buoy, measured = null, station = null, rose = "", aged = "") {
  const line = measuredLine(measured, (m) => m.buoy);
  const id = station && station.id;
  // The sentence under the rose, LIVE only as the rose is: on Forecast the
  // buoy's numbers are a model run, not its spectrum.
  const note = rose ? buoyAbout(id) : "";
  if (!buoy || buoy.hs_m == null) {
    return valLine('<span class="val"><span class="unit">no spectrum</span></span>') + rose + note + line;
  }
  return buoyReading(buoy, id, {roseFor: rose ? id : null, rose, note, aged}) + line;
}

// One sentence under each buoy's rose (owner's wording, 2026-10-12): the
// station, linked to its public page, how far offshore it is and its bearing
// from Center break, then what is read from it and its role here
// (forecast.buoys.ABOUT). The distance and bearing are forecast.siting's,
// in km and degrees, converted here as every number is; a buoy siting cannot
// place says neither. No buoys.json, no sentence.
function buoyAbout(station) {
  const a = BUOYS && BUOYS.about && BUOYS.about[station];
  if (!a || !a.says) return "";
  const where = a.range_km != null && a.bearing_deg != null
    ? `, ${dual(`${Math.round(a.range_km * MI_PER_KM)} mi`, `${Math.round(a.range_km)} km`)}`
      + ` offshore at ${Math.round(a.bearing_deg)}&deg; ${point(a.bearing_deg)} from Center break`
    : "";
  return `<p class="quiet buoy-note"><a href="${a.url}" rel="noopener">${a.place} (${a.feed})</a>`
    + `${where}: ${a.says}</p>`;
}

// In a break headline's row, so the buoys' line sits where a break's does;
// never `.val-row`, whose tap folds a break's calculation.
const valLine = (val) => `<div class="val-line">${val}</div>`;

// A buoy's headline folds out like a break's (owner's request, 2026-10-11),
// but what it folds is everything between it and the provenance: the
// trains, the rose and the words under them. Closed until opened, each buoy
// its own, kept across a refresh. Nothing to fold, no caret. Under a past
// Forecast hour the observed line stays outside it, as on a break's tab.
function buoyReading(buoy, id, {roseFor = null, rose = "", note = "", aged = ""} = {}) {
  const trains = buoy.trains && buoy.trains.length ? trainList(buoy.trains, {rose: roseFor, aged})
    : buoy.period_s ? `<div class="quiet"${aged}>peak <b>${buoy.period_s.toFixed(1)} s</b>`
      + ` from <b>${compass(buoy.from_deg)}</b></div>` : "";
  const value = `<span class="val"${aged}>${height(buoy.hs_m)} <span class="unit">combined</span></span>`;
  const body = trains + rose + note;
  if (!id || !body) return valLine(value) + body;
  const open = !!BUOY_OPEN[id];
  return `<div class="val-line fold-row" data-buoy-head="${id}">${value}${buoyToggle(id, open)}</div>`
    + `<div class="buoy-fold" id="buoy-fold-${id}"${open ? "" : " hidden"}>${body}</div>`;
}

// Which buoys' headlines are open, by station. Both are on screen at once,
// so each has its own caret and its own state.
let BUOY_OPEN = {};
function buoyToggle(id, open) {
  return `<button type="button" class="calc-toggle" data-buoy-toggle="${id}"
    aria-controls="buoy-fold-${id}" aria-expanded="${open}"
    aria-label="This buoy's trains and rose"><svg viewBox="0 0 16 16" aria-hidden="true">`
    + `<path d="M3.5 10 8 5.5 12.5 10"/></svg></button>`;
}
// Flipped in place, as the calculation is. Opening one shows its rose, so
// the roses are paused on the newest spectrum (`roseShown`).
function setBuoyOpen(id, open) {
  BUOY_OPEN[id] = open;
  remember(KEEP.buoyOpen, Object.keys(BUOY_OPEN).filter((k) => BUOY_OPEN[k]).join(","));
  document.querySelectorAll(`[data-buoy-toggle="${id}"]`).forEach((btn) => {
    btn.setAttribute("aria-expanded", String(open));
    const fold = $(btn.getAttribute("aria-controls"));
    if (fold) fold.hidden = !open;
  });
  if (open) roseShown();
}

// Joined pills, each after the first growing out of the one before it
// (`.pill-tail`). An empty part is left out -- never an empty pill.
function pills(...parts) {
  const [head, ...tails] = parts.filter(Boolean);
  if (!head) return "";
  return `<span class="pills"><span class="pill">${head}</span>`
    + tails.map((tail) => `<span class="pill-tail">${tail}</span>`).join("") + "</span>";
}
const pillLine = (...parts) => {
  const html = pills(...parts);
  return html ? {html} : "";
};

// A LIVE card's provenance is two lines of pills (owner's request,
// 2026-10-12, from three the day before), and one since later that day. The first: where the measurement
// was made, then when, the time alone with no "Observed" or "Measured".
// The second (`feedPills`): the station that sent it with a dot on its own
// countdown, how long ago -- aged by `ageSpan` as every other measurement
// line is -- and the countdown. A buoy's place is its name alone, never its
// id, which the station pill carries.
//
// The first line is built but not shown (owner's call, 2026-10-12: one line
// is enough). `SHOW_PLACE_WHEN` brings it back on every LIVE card at once.
const SHOW_PLACE_WHEN = false;
const buoyPlace = (name, station) => (name && name !== station ? name : "");
const placeWhen = (place, iso) => (SHOW_PLACE_WHEN ? pillLine(place || "", iso ? when(iso) : "") : "");

// The station: "CDIP <n>" for 46232, which CDIP runs, its number from the
// registry (owner's call, 2026-10-12, shortened from "CDIP <n> via NDBC");
// "NDBC <id>" for a buoy NDBC runs; "METAR KNZY" for the wind and "NOAA
// 9410170" for the tide. Its dot runs on that source's own two instants,
// the countdown beside it on the same two, so the two change together. No
// observation, no age; no countdown, no last pill.
function feedPills(label, observedIso, iso, lateIso, {forceOver = false} = {}) {
  if (!label) return "";
  return pills(label + statusDot(iso, lateIso, {forceOver}), ageSpan(observedIso),
               dueSpan(iso, lateIso, {forceOver, bare: true}));
}
const anchorFeed = (now, due, late) => (now && now.station
  ? feedPills(now.station_cdip ? `CDIP ${now.station_cdip}` : `NDBC ${now.station}`, now.observed_utc,
             due, late, {forceOver: nowIsStale()}) : "");

// The dot is filled by `tickDue` with the countdown it sits beside: the same
// instants with this page's refresh leg added, and the same three states.
function statusDot(iso, lateIso, {forceOver = false} = {}) {
  const when = dueInstants(iso, lateIso);
  if (!when) {
    return forceOver ? '<i class="status over" role="img" aria-label="Overdue" title="Overdue"></i>' : "";
  }
  return `<i class="status" role="img" data-status-due="${when.due}" data-status-late="${when.late}"`
    + (forceOver ? ' data-status-force="1"' : "") + "></i>";
}

// One context buoy's block: its reading, its trains and rose and the
// sentence under it (`buoyAbout`), all folded under its headline; then its
// provenance -- where it is and when, then its station, age and countdown,
// red past its measured worst or past the build's three hours, in pills as
// 46232's.
function contextBuoy(b) {
  const old = b.observed_utc && (b.stale || (ageHours(b.observed_utc) || 0) > (b.stale_hours || 3));
  // Its pills, as 46232's, are its own countdown line.
  const feed = feedPills(`NDBC ${b.station}`, b.observed_utc, b.observed_utc ? b.next_expected : null,
                         b.overdue_after, {forceOver: !!old || !b.observed_utc});
  // What it is, said under its rose and above its provenance with space
  // between (owner's call, 2026-10-11): a description, not a provenance line.
  const note = buoyAbout(b.station);
  const reading = b.hs_m != null ? buoyReading(b, b.station, {roseFor: b.station, rose: roseBlock(b.station), note,
                                                             aged: agedAttr(b.observed_utc, !!b.stale)})
    : valLine('<span class="val"><span class="unit">no spectrum</span></span>') + roseBlock(b.station) + note;
  return `<hr>${reading}`
    + srcLines([placeWhen(buoyPlace(b.station_name, b.station), b.observed_utc)], feed);
}

// THE ROSES, under each buoy's reading on the LIVE tab's Buoys tab (owner's
// request, 2026-10-06; forecast.rose, in buoys.json). One rose per spectrum:
// that spectrum's energy summed into the sixteen compass sectors, petals
// pointing where the energy comes FROM. Two views on one switch -- Height,
// each sector's energy as a height (they combine in energy, so they do not
// add up to the combined height), and Period, each sector's share of the
// energy split into five period bands, longest in ink -- and every spectrum
// of the last six hours looped.
//
// ONE clock drives both buoys, so the two roses always show the same moment:
// the loop runs from the first moment every buoy has a frame to the newest
// across both, then holds
// on the newest. A rose shows the newest spectrum stamped at or before that
// moment, until its successor was due (its own stamp spacing, in the file);
// past that it is a gap and says so, never the frame beside it. Its newest
// frame stays until a newer one lands: a stamp not out yet is not a gap. Each
// buoy has its own scale per view (owner's request, 2026-10-06): its
// outermost ring is the largest petal in its own loop rounded up to a whole
// foot (or percent), so the petals are as large as they can be and none
// passes the last ring; the rings say what each scale is. Every time a rose
// comes into view -- the page opening, the LIVE tab, the Buoys tab, a buoy's
// headline unfolding -- it is paused on the newest spectrum, the one the
// headline reads (owner's request, 2026-10-11); play runs the loop.
// Height and Period, switched by their units at the right end of the
// timeline row (owner's request, 2026-10-08: a row of its own cost 28 px a
// rose): "ft" and "s", the units the line under the rose reads in. The
// label is what a screen reader says.
const ROSE_MODES = [{id: "height", label: "Height", symbol: "ft"}, {id: "period", label: "Period", symbol: "s"}];
// A petal's height in the scale's unit: feet, or metres on metric, whose
// rings step in metres (`roseScale`).
const roseHt = (m) => (UNITS === "metric" ? m : m * FT_PER_M);
const roseSymbol = (m) => (m.id === "height" && UNITS === "metric" ? "m" : m.symbol);
let ROSE_MODE = recall(KEEP.roseMode) === "period" ? "period" : "height";
const ROSE_PLAY_MS = 9000;
const ROSE_HOLD_MS = 2500;
let ROSE_PLAYING = false;
let ROSE_PHASE = ROSE_PLAY_MS;
let ROSE_LAST = performance.now();
const ROSE_POINTS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
// forecast.rose.PERIOD_EDGES_S, as the legend names them.
const ROSE_BANDS = ["under 8 s", "8–11 s", "11–14 s", "14–17 s", "17 s +"];
// The legend's own, on one row: the unit once, at the end.
const ROSE_BAND_KEYS = ["<8", "8–11", "11–14", "14–17", "17+ s"];
// The outer ring is the drawing's edge, N, E, S and W just inside it (owner's
// choice, 2026-10-08): no band of empty card around the circle.
const ROSE = {c: 120, r: 119};
// The train row tapped on each buoy's reading, by index into the newest
// spectrum's trains (owner's request, 2026-10-08), or none. Its period range
// is lit on that buoy's rose in every frame: the same range, not the same
// swell, since nothing follows a train from one spectrum to the next.
let ROSE_TRAIN = {};

const roseOf = (station) => (BUOYS && BUOYS.roses && BUOYS.roses[station]) || null;

// A row can light the rose only when the rose's trains were split from the
// very spectrum the reading above it lists.
function roseTrainOK(station, i) {
  const rose = roseOf(station);
  if (!rose || !rose.trains || !rose.trains[i]) return false;
  const observed = NOW && station === NOW.station ? NOW.observed_utc
    : (((BUOYS && BUOYS.buoys) || []).find((b) => b.station === station) || {}).observed_utc;
  return !!observed && observed === rose.trains_from_utc;
}
const rosePick = (station) => (Number.isInteger(ROSE_TRAIN[station])
  && roseTrainOK(station, ROSE_TRAIN[station]) ? ROSE_TRAIN[station] : null);
// A train divided from a band of two directions (BRIEFING §40) shares its
// period range with its twin, so its headings are part of the range.
function roseRange(station, i) {
  const t = roseOf(station).trains[i];
  return `${t.period_lo_s.toFixed(1)}\u2013${t.period_hi_s.toFixed(1)} s`
    + (t.from_lo_deg != null ? ` from ${t.from_lo_deg}\u2013${t.from_hi_deg}&deg;` : "");
}
const roseTime = (f) => new Date(f.time_utc).getTime();

// The loop's span: the oldest frame to the newest, over every buoy.
// The loop's span: from the first moment EVERY buoy has a spectrum to the
// newest frame over all of them. Starting at the oldest frame overall put the
// loop on 46047's :50 stamp, ten minutes before 46232's first on the hour,
// and 46232 opened every loop on "No spectrum yet" for a moment it did have
// one, just outside the six hours (owner's report, 2026-10-07). The earlier
// buoy loses nothing: its first frame is the one in force at the start.
function roseSpan() {
  const firsts = [], times = [];
  Object.values((BUOYS && BUOYS.roses) || {}).forEach((r) => {
    const own = (r.frames || []).map(roseTime);
    if (!own.length) return;
    firsts.push(Math.min(...own));
    times.push(...own);
  });
  if (!times.length) return null;
  return {t0: Math.max(...firsts), t1: Math.max(...times)};
}

function roseMoment(span) {
  return ROSE_PHASE >= ROSE_PLAY_MS ? span.t1
    : span.t0 + (span.t1 - span.t0) * ROSE_PHASE / ROSE_PLAY_MS;
}

// One scale per view for every frame of ONE buoy's loop: feet for Height, a
// share for Period. The rings are evenly spaced, at most five, and the
// outermost is the edge: the loop's largest petal rounded UP to the next ring,
// so no petal passes it. A step of 1 ft makes that the next whole foot; past
// 5 ft the step widens to 2 ft, so the rings stay even rather than one of them
// falling short (owner's report, 2026-10-07: 2, 4 and 5 ft read as uneven).
// Fixed across the loop, so a petal that grows between frames really grew.
function roseScale(mode, station) {
  const frames = (roseOf(station) || {}).frames || [];
  const top = Math.max(0, ...frames.flatMap((f) => mode === "height"
    ? f.sector_hs_m.map(roseHt)
    : f.period_share.map((row) => row.reduce((a, b) => a + b, 0))));
  const steps = mode !== "height" ? [0.05, 0.1, 0.2, 0.25]
    : UNITS === "metric" ? [0.25, 0.5, 1, 2, 5] : [1, 2, 5, 10, 20];
  // The tolerance is far under the 0.1 ft shown, and keeps a petal of exactly
  // 6 ft (1.8288 m, 6.000002 ft through the converter) on the 6 ft ring.
  const count = (st) => Math.max(1, Math.ceil(top / st - 1e-4));
  const step = steps.find((st) => count(st) <= 5) || steps[steps.length - 1];
  const rings = [];
  for (let k = 1; k <= count(step); k++) rings.push(+(k * step).toFixed(4));
  return {max: rings[rings.length - 1], step, rings};
}

// The scale in words, one line under the rose (owner's request, 2026-10-07),
// rather than a figure on the plot, where any spot is a bearing.
function roseScaleLine(mode, station) {
  const sc = roseScale(mode, station);
  return mode === "height"
    ? `Rings every ${UNITS === "metric" ? `${sc.step} m` : dualText(`${sc.step} ft`, `${(sc.step / FT_PER_M).toFixed(2)} m`)}`
    : `Rings every ${rosePct(sc.step)}`;
}

// What a buoy's rose shows at a moment: a frame, a gap, or a stamp not in yet.
function roseAt(rose, t) {
  const frames = rose.frames || [];
  let k = -1;
  frames.forEach((f, i) => { if (roseTime(f) <= t + 1000) k = i; });
  const every = (rose.interval_min || 60) * 60000;
  if (k < 0) {
    return {key: "none", note: "No spectrum yet at " + clock(new Date(t).toISOString())};
  }
  // The newest is shown until a newer one lands, under its own time: a stamp
  // not published yet is not a gap, and a paused rose rests on the newest.
  const due = roseTime(frames[k]) + every;
  if (k === frames.length - 1 || t + 1000 < due) return {key: String(k), frame: frames[k], k};
  return {key: "gap" + k, note: `No spectrum at ${clock(new Date(due).toISOString())}`};
}

const rosePt = (r, deg) => {
  const a = deg * Math.PI / 180;
  return `${(ROSE.c + r * Math.sin(a)).toFixed(2)},${(ROSE.c - r * Math.cos(a)).toFixed(2)}`;
};

// A petal from r0 to r1 across one sector, a degree short of each edge so
// neighbours never touch.
function rosePetal(i, r0, r1) {
  const a0 = i * 22.5 - 10.25, a1 = i * 22.5 + 10.25;
  if (r0 <= 0.01) {
    return `M${ROSE.c},${ROSE.c}L${rosePt(r1, a0)}A${r1.toFixed(2)},${r1.toFixed(2)} 0 0 1 ${rosePt(r1, a1)}Z`;
  }
  return `M${rosePt(r0, a0)}L${rosePt(r1, a0)}A${r1.toFixed(2)},${r1.toFixed(2)} 0 0 1 ${rosePt(r1, a1)}`
    + `L${rosePt(r0, a1)}A${r0.toFixed(2)},${r0.toFixed(2)} 0 0 0 ${rosePt(r0, a0)}Z`;
}

const rosePct = (s) => `${Math.round(s * 100)}%`;

// A frame greys only if it was itself the stale reading: more than the
// cards' three hours went by before the next frame's stamp, or, for the
// newest, before now (owner's calls, 2026-10-25). A frame replaced in time
// stays in ink however old it grows in the loop, so a stale buoy greys its
// newest frame alone, and a gap leaves the frame before it grey. Its petals
// and the line under it; never the rings or N / E / S / W.
const roseAged = (rose, state) => {
  const frames = (rose && rose.frames) || [];
  if (!state || !state.frame || !Number.isInteger(state.k)) return false;
  const until = state.k + 1 < frames.length ? roseTime(frames[state.k + 1]) : Date.now();
  return until - roseTime(frames[state.k]) > staleLimitH() * 3600000;
};

function rosePlot(state, mode, station) {
  const {c, r: R} = ROSE;
  const scale = roseScale(mode, station);
  const rings = scale.rings;
  const grid = rings.map((v) => `<circle class="ring" cx="${c}" cy="${c}" r="${(R * v / scale.max).toFixed(2)}"/>`).join("")
    + `<line class="ring" x1="${c}" y1="${c - R}" x2="${c}" y2="${c + R}"/>`
    + `<line class="ring" x1="${c - R}" y1="${c}" x2="${c + R}" y2="${c}"/>`;
  const marks = [["N", 0], ["E", 90], ["S", 180], ["W", 270]].map(([p, deg]) => {
    const [x, y] = rosePt(R - 9, deg).split(",");
    return `<text class="pt" x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central">${p}</text>`;
  }).join("");

  let petals = "";
  let said = "";
  const pick = rosePick(station);
  if (state.frame) {
    const f = state.frame;
    if (mode === "height") {
      petals = f.sector_hs_m.map((m, i) => (roseHt(m) < scale.max * 0.004 ? ""
        : `<path class="rp" d="${rosePetal(i, 0, R * roseHt(m) / scale.max)}">`
          + `<title>${ROSE_POINTS[i]}: ${heightText(m)}</title></path>`)).join("");
      const top = f.sector_hs_m.map((m, i) => [m, i]).sort((a, b) => b[0] - a[0]).slice(0, 3);
      said = `largest from ${top.map(([m, i]) => `${ROSE_POINTS[i]} ${heightText(m)}`).join(", ")}`;
    } else {
      petals = f.period_share.map((row, i) => {
        let cum = 0;
        return row.map((s, b) => {
          const r0 = R * cum / scale.max;
          cum += s;
          if (s < 0.0005) return "";
          return `<path class="rb rb${b}" d="${rosePetal(i, r0, R * cum / scale.max)}">`
            + `<title>${ROSE_POINTS[i]}, ${ROSE_BANDS[b]}: ${rosePct(s)} of the energy</title></path>`;
        }).join("");
      }).join("");
      const sums = f.period_share.map((row, i) => [row.reduce((a, b) => a + b, 0), i])
        .sort((a, b) => b[0] - a[0]).slice(0, 3);
      said = `largest shares from ${sums.map(([s, i]) => `${ROSE_POINTS[i]} ${rosePct(s)}`).join(", ")}`;
    }
    // A picked row's period range over the whole rose, dimmed beneath it.
    const share = pick != null && f.train_share && f.train_share[pick];
    if (share) {
      const range = roseRange(station, pick);
      const lit = share.map((s, i) => {
        const v = mode === "height" ? roseHt(f.hs_m * Math.sqrt(s)) : s;
        if (v < scale.max * 0.004) return "";
        const what = mode === "height" ? heightText(f.hs_m * Math.sqrt(s)) : `${rosePct(s)} of the energy`;
        return `<path class="rt" d="${rosePetal(i, 0, R * v / scale.max)}">`
          + `<title>${ROSE_POINTS[i]}, ${range}: ${what}</title></path>`;
      }).join("");
      petals = `<g class="dim">${petals}</g>${lit}`;
      said += `; ${range} lit`;
    }
  }
  const when = state.frame ? clock(state.frame.time_utc) : "";
  const aria = state.frame ? `${mode === "height" ? "Height" : "Period"} rose at ${when}: ${said}`
    : state.note;
  return `<svg class="rose-svg${pick != null ? " picked" : ""}${roseAged(roseOf(station), state) ? " aged" : ""}" viewBox="0 0 240 240" role="img" aria-label="${aria}">`
    + grid + petals + marks + `</svg>`;
}

// The one line under the rose (owner's request, 2026-10-08): its ring
// spacing, then the frame's time and what it holds -- "Rings every 1 ft
// (0.30 m) · 11:00 AM · 4.6 ft (1.39 m) combined". Each part keeps to
// itself, so a narrow phone breaks the line only at a "·". With a row
// picked it names the period range, never "the train": in an older frame
// that range may hold another swell.
function roseReadout(state, station) {
  const seg = (html, cls = "") => `<span class="rs${cls}">${html}</span>`;
  const sep = " \u00b7 ";
  const scale = seg(roseScaleLine(ROSE_MODE, station));
  if (!state.frame) return scale + sep + seg(state.note);
  const f = state.frame;
  const when = seg(clock(f.time_utc), " v");
  const k = rosePick(station);
  const share = k != null && f.train_share && f.train_share[k];
  if (share) {
    const sum = share.reduce((a, b) => a + b, 0);
    return scale + sep + when + sep + seg(`${roseRange(station, k)}: `
      + (ROSE_MODE === "height" ? height(f.hs_m * Math.sqrt(sum))
        : `${rosePct(sum)} <span class="unit">of the energy</span>`), " v");
  }
  return scale + sep + when + sep
    + seg(`${height(f.hs_m)} <span class="unit">combined</span>`, " v");
}

// The six hours under the rose: a tick for every spectrum this buoy sent, so
// a missing one is a missing tick; the moment shown, and a tap to go to one.
function roseLine(rose, span, t, state) {
  // A frame stamped before the loop starts (the earlier buoy's first) sits at
  // the line's left end: it is the one shown there.
  const x = (ms) => (8 + 224 * (span.t1 > span.t0
    ? Math.max(0, Math.min(1, (ms - span.t0) / (span.t1 - span.t0))) : 1)).toFixed(1);
  const ticks = (rose.frames || []).map((f, i) =>
    `<line class="tk${state.k === i ? " on" : ""}" x1="${x(roseTime(f))}" y1="4" x2="${x(roseTime(f))}" y2="14"/>`).join("");
  const ends = `<text class="tt" x="8" y="25">${clock(new Date(span.t0).toISOString())}</text>`
    + `<text class="tt" x="232" y="25" text-anchor="end">${clock(new Date(span.t1).toISOString())}</text>`;
  return `<line class="base" x1="8" y1="14" x2="232" y2="14"/>${ticks}`
    + `<line class="head" x1="${x(t)}" y1="1" x2="${x(t)}" y2="16"/>${ends}`;
}

// The Period legend's row is kept on Height too, laid out and unseen, so
// switching views never moves the page under the reader (owner's request,
// 2026-10-08).
function roseLegend(mode) {
  const off = mode !== "period";
  return `<div class="legend${off ? " off" : ""}"${off ? ' aria-hidden="true"' : ' aria-label="Periods, shortest palest"'}>`
    + `${ROSE_BAND_KEYS.map((b, i) =>
      `<span title="${ROSE_BANDS[i]}"><i class="sw rb rb${i}"></i>${b}</span>`).join("")}</div>`;
}

function roseView(station) {
  const rose = roseOf(station);
  const span = roseSpan();
  if (!rose || !span) return null;
  const t = roseMoment(span);
  const state = roseAt(rose, t);
  return {key: `${ROSE_MODE}:${state.key}:${span.t0}:${span.t1}:${rosePick(station)}:${roseAged(rose, state) ? "aged" : ""}`,
    rose, span, t, state, station};
}

const rosePercent = (v) => (v.span.t1 > v.span.t0
  ? Math.round(100 * (v.t - v.span.t0) / (v.span.t1 - v.span.t0)) : 100);

// One buoy's rose block, under its reading. Its moving parts are marked
// `data-rose-live`, so a refresh never flashes the card for a frame that was
// only ever going to change.
function roseBlock(station) {
  const rose = roseOf(station);
  if (!rose) return "";
  const v = roseView(station);
  if (!v || !(rose.frames || []).length) {
    return `<p class="quiet buoy-note rose-none">No spectrum from ${buoyFeed(station)} in the last six hours.</p>`;
  }
  const modes = ROSE_MODES.map((m) => `<button type="button" data-rose-mode="${m.id}"`
    + ` aria-pressed="${m.id === ROSE_MODE}" aria-label="${m.label}" title="${m.label}">${roseSymbol(m)}</button>`).join("");
  return `<div class="rose" data-rose="${station}" data-k="${v.key}">
    <div class="rose-plot" data-rose-live>${rosePlot(v.state, ROSE_MODE, station)}</div>

// Redraw a rose in place: the petals only when the frame or view changed,

function roseTick() {

// Play and pause as symbols, left of the six hours (owner's request,

// A tap or an arrow key on the six hours goes to that moment and pauses.

// Tap a row again, or another, to clear or move the light.

function wireRoses() {
  const strip = $("conditions");
  strip.addEventListener("keydown", (e) => {
    const row = (e.key === "Enter" || e.key === " ") && e.target.closest("[data-rose-train]");
    if (!row) return;
    e.preventDefault();
    toggleRoseTrain(row);
  });
  strip.addEventListener("click", (e) => {
    const row = e.target.closest("[data-rose-train]");
    if (row) { toggleRoseTrain(row); return; }
    const mode = e.target.closest("[data-rose-mode]");
    if (mode) {
      ROSE_MODE = mode.getAttribute("data-rose-mode");
      remember(KEEP.roseMode, ROSE_MODE);
      document.querySelectorAll("[data-rose-mode]").forEach((b) =>
        b.setAttribute("aria-pressed", String(b.getAttribute("data-rose-mode") === ROSE_MODE)));
      document.querySelectorAll("[data-rose]").forEach((el) => {
        const legend = el.querySelector(".legend");
        if (legend) legend.remove();
        el.insertAdjacentHTML("beforeend", roseLegend(ROSE_MODE));
        roseUpdate(el);
      });
      return;
    }
    if (e.target.closest("[data-rose-play]")) {
      if (!ROSE_PLAYING && ROSE_PHASE >= ROSE_PLAY_MS) ROSE_PHASE = 0;
      setRosePlaying(!ROSE_PLAYING);
      return;
    }
    const line = e.target.closest("[data-rose-scrub]");
    if (line) {
      const box = line.getBoundingClientRect();
      const x = (e.clientX - box.left) / box.width * 240;
      roseSeek((x - 8) / 224 * ROSE_PLAY_MS);
    }
  });
  strip.addEventListener("keydown", (e) => {
    if (!e.target.closest("[data-rose-scrub]")) return;
    const span = roseSpan();
    if (!span || span.t1 <= span.t0) return;
    // Half an hour a key: the context buoys' stamp spacing, the finest.
    const half = ROSE_PLAY_MS * 1800000 / (span.t1 - span.t0);
    const step = e.key === "ArrowRight" ? half : e.key === "ArrowLeft" ? -half : null;
    if (step == null) return;
    e.preventDefault();
    roseSeek(Math.min(ROSE_PHASE, ROSE_PLAY_MS) + step);
  });
}

// way in, and zooms out to everything the file reaches: 48 h back to +168 h.
const FC_DEFAULT_H = 72;
const FC_RANGES = [

  ? Date.parse(steps[1].valid_utc) - Date.parse(steps[0].valid_utc) : HOUR_MS);

// A height with its sign, for the north-less-south line.
const signedHeight = (m) => {
  if (m == null) return "—";

// conversion is the page's one constant. The top (and, for a signed axis, the
// bottom) is rounded up to a whole tick, so the frame is always a gridline --
// the edges of the plot are drawn on every chart, whatever the heights in
// view -- and the furthest line never touches it. At most four steps from
// zero to the top, or three either side of zero when the axis is signed.
// On metric the same axis in metres, its steps metric ones.
function feetAxis(reach, {floor = 0.3, signed = false} = {}) {
  const metric = UNITS === "metric", per = metric ? 1 : FT_PER_M, unit = metric ? "m" : "ft";
  const ft = Math.max(floor, reach) * per;
  const most = signed ? 3 : 4;
  const step = (metric ? [0.1, 0.2, 0.25, 0.5, 1, 2, 5, 10, 20] : [0.5, 1, 2, 5, 10, 20, 50])
    .find((f) => Math.ceil(ft / f + 0.05) <= most) || 100;
  const n = Math.ceil(ft / step + 0.05);
  const ticks = [];
  for (let k = signed ? -n : 0; k <= n; k++) {
    const v = Number((k * step).toFixed(2));
    const text = v === 0 ? "0" : `${v < 0 ? "−" : signed ? "+" : ""}${Math.abs(v)} ${unit}`;
    ticks.push({at: v / per, text});

// Every hour the chart can show, oldest first: the archive's hours before the
// week, then the week. Hours that fall between the two are "not rebuilt yet"
// -- never a gap, because nothing says their spectrum is missing, and never
// filled. Without the archive (not asked for, not loaded, or withheld because
// it no longer matches today's chain) it is the week alone.
let MERGED = null, MERGED_KEY = "";

  if (isWT(id)) return wtSteps(id);

function nowSteps() {
  const recent = (SERIES && SERIES.steps) || [];
  const A = SERIES_ALL;
  if (!A || !A.available || !A.hours || !recent.length) return recent;
  const key = `${SERIES.generated_utc}|${A.start_utc}|${A.hours}`;
  if (key === MERGED_KEY) return MERGED;
  const start = Date.parse(A.start_utc), first = Date.parse(recent[0].valid_utc);
  const held = Math.max(0, Math.min(A.hours, Math.round((first - start) / HOUR_MS)));
  const gaps = new Set(A.gaps || []);
  const col = (arr, i, per = 1) => (arr && arr[i] != null ? arr[i] / per : null);
  const older = [];
  for (let i = 0; i < held; i++) {
    const valid_utc = isoHour(start + i * HOUR_MS);
    if (gaps.has(i)) { older.push({valid_utc, gap: true}); continue; }
    const breaks = {};
    (A.breaks || []).forEach((b) => {

const ORIGIN_KM = [480, 24000];
const logMi = (km) => Math.log10(km * MI_PER_KM);
function originsSpec(id, steps) {
  const legend = [{cls: "dot", label: "Storm named, at NHC's position"},
                  {cls: "og", label: "Read off the swell, no storm named"}];
  const t0 = Date.parse(steps[0].valid_utc), per = stepMs(steps);
  const idx = (iso) => (Date.parse(iso) - t0) / per;
  const site = id;
  const segs = [], dots = [], points = [], labels = [];
  const arrivals = ((ORIGINS && ORIGINS.arrivals) || [])
    .filter((a) => (a.sites || []).includes(site) && !(a.named || {})[site]);
  arrivals.forEach((a) => {
    const i0 = idx(a.first_utc), i1 = idx(a.last_utc), v = logMi(a.distance_km);
    segs.push({i0, i1, v, cls: "og"});
    if (a.bearing_deg != null) {
      for (let i = Math.ceil(i0); i <= i1; i++) points.push({i, v: a.bearing_deg, cls: "dir og"});
    }
  });
  const named = ((ORIGINS && ORIGINS.named) || []).filter((n) => n.sites && n.sites[site])
    .map((n) => ({...n, at: n.sites[site], i: idx(n.time_utc)}));
  const byStorm = new Map();
  named.forEach((n) => {
    const v = logMi(n.at.distance_km);
    dots.push({i: n.i, v, r: 3, cls: "hn"});
    points.push({i: Math.round(n.i), v: n.at.bearing_deg, cls: "dir"});
    if (!byStorm.has(n.storm)) {
      byStorm.set(n.storm, {text: n.name, points: []});
      labels.push(byStorm.get(n.storm));
    }
    byStorm.get(n.storm).points.push({i: n.i, v});
  });
  // What the card said at hour i: for each storm, its newest named moment at
  // or before i, and only while no later moment has been asked (one step).
  // Never the moment after i, which had not happened yet, and never two of
  // one storm: an hour half-way between two moments read both, once each.
  const step = ((ORIGINS && ORIGINS.step_h) || 6) * HOUR_MS;
  const near = (i) => {
    const latest = new Map();
    named.forEach((n) => {
      if (n.i <= i && (i - n.i) * per < step
          && (!latest.has(n.storm) || n.i > latest.get(n.storm).i)) latest.set(n.storm, n);
    });
    return [...latest.values()];
  };
  const value = (text) => `<span class="v">${text}</span>`;
  return {
    scale: "distance", lines: [], segs, dots, labels, legend,
    lane: {points, arcs: []},
    says: `Where the swell arriving ${id === BUOY_TAB ? "at the buoy" : `at ${SHORT[id] || id}`} `
      + "came from, over time: a dot every six hours for a hurricane or tropical storm named "
      + "from NHC's track at the position that sent the train, and a grey bar over the hours "
      + "an arrival read off the swell itself was arriving, at its distance, with no storm "
      + "named. Distance on a log scale; under it, the bearing each came from, as seen from "
      + "the buoy",
    read: (i) => {
      const t = Date.parse(steps[i].valid_utc);
      // Named as the Origin fold names them (owner's call, 2026-10-10): a
