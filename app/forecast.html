      $("conditions").innerHTML = rows.join("");
      restorePicks();
      tickDue();
      return;
    }

    // Today's KNZY reading stands in for a run without model wind -- but never
    // under a past hour, where it would be a reading from the wrong time.
    const fallback = past ? {note: "not kept for earlier runs"} : wind;
    const local = localWindBlock(hour, cards, stampWhen, past);
    rows.push(`<div class="cond" data-card="wind">
      <span class="lbl">Wind</span>
      <span class="val">${modelled
        ? `${compass(hour.wind_from_deg)} <span class="unit">at</span> ${speed(hour.wind_kt || 0)}`
        : windHeard(fallback)
          ? windVal(fallback.from_deg, fallback.speed_kt)
          : `<span class="unit">${past ? fallback.note : "not collected yet"}</span>`}</span>
      ${seenWind}
      ${modelled
        ? srcLines([`Forecast for ${stampWhen}`,
                    `GFS-Wave wind, ${DATA.station_name} (NDBC ${DATA.station})`,
                    run])
        : windHeard(fallback)
          ? srcLines([`Observed ${observedAt(fallback.observed_utc)}`,
                      `METAR, ${fallback.station_name} (${fallback.station})`])
          : srcLines(past ? "" : fallback.note)}
      ${local}
      ${cardChart("wind")}
    </div>`);
    rows.push(`<div class="cond" data-card="tide">
      <span class="lbl">Tide</span>
      <span class="val">${tide.height_m != null
        ? height(tide.height_m)
        : '<span class="unit">not collected for this hour</span>'}</span>
      ${stamp && stamp.valid_utc
        ? turnLine(DATA.tide_turns || [], step.valid_utc)
        : ""}
      ${seenTide}
      ${srcLines([`Harmonic tide for ${stampWhen}`, departureLine(tide), tideSource(DATA)])}
      ${cardChart("tide")}
    </div>`);
  }

  $("conditions").innerHTML = rows.join("");
  restorePicks();
  // Fill the countdowns now rather than leaving them blank until the first
  // second's tick lands.
  tickDue();
}

function renderBreaks(step) {
  const cards = MODE === "now" ? cardsForNow() : cardsForForecast(step);
  renderConditions(step, cards);
}

function show() {
  // Never rebuild the cards under a finger: a chart gesture redraws its own
  // chart, and the card is rebuilt once when it ends.
  if (GESTURE) return;
  const forecasting = MODE === "forecast";
  $("seek").hidden = !forecasting;
  $("tab-now").setAttribute("aria-selected", String(!forecasting));
  $("tab-forecast").setAttribute("aria-selected", String(forecasting));

  if (forecasting) {
    const step = STEPS[CURSOR];
    $("when-label").textContent = when(step.valid_utc);
    $("when").value = String(CURSOR);
    $("earlier").disabled = CURSOR === 0;
    $("later").disabled = CURSOR === STEPS.length - 1;
    renderBreaks(step);
    // Only reachable by default when every hour in the file has gone by —
    // the forecast chain has stopped — and that must not read as upcoming.
    const last = STEPS[STEPS.length - 1];
    const spent = new Date(last.valid_utc).getTime() < Date.now();
    $("stale").hidden = !spent;
    if (spent) {
      $("stale").innerHTML = `<b>Every hour in this forecast has passed.</b> `
        + `The newest cycle has not arrived; nothing here is upcoming.`;
    }
    return;
  }

  // Now. If there is nothing usable, say why and point at the other chain
  // rather than rendering something that looks current and is not.
  if (!NOW || !NOW.breaks || !NOW.breaks.length) {
    $("conditions").innerHTML = "";
    $("stale").hidden = false;
    $("stale").innerHTML = `<b>No current observation.</b> `
      + ((NOW && NOW.warnings && NOW.warnings.join(" ")) ||
         "now.json could not be loaded.")
      + ` Switch to <b>Forecast</b> for the modelled view.`;
    return;
  }

  renderBreaks(null);

  // No banner over the cards. It spoke for all three at once while naming only
  // the spectrum, so a fresh wind reading sat under a banner calling it not
  // current, and a dead wind station sat under nothing at all. The same judgement now renders
  // on the card whose own source is late, in red, beside the reading it
  // qualifies -- see `dueSpan` and `nowIsStale`, which is where the floor the
  // build set is still applied.
  //
  // The banner element stays for the case below, where there is no reading to
  // put a card under at all.
  $("stale").hidden = true;
}

function setMode(mode) {
  MODE = mode;
  if (mode === "forecast") advancePastDefault();
  remember(KEEP.mode, mode);
  show();
}

// What each card currently reads, keyed by `data-card`.
//
// Keyed rather than positional because the swell tabs re-rank by energy and a
// card can move in the strip without its contents changing.
// Everything on the page that is derived from the reader's clock rather than
// from the payload. These change on their own schedule, so comparing them
// would flash cards that had not changed.
//
// Measured: without this, the wind card flashed alongside the tide on a
// refresh that only moved the tide. `show()` re-runs `tickDue`, so a snapshot
// and a render either side of a second boundary disagree on the countdown --
// and at a minute boundary, on the age. Both are marked in the DOM rather than
// stripped by pattern, so the rule stays true as the wording changes.
const VOLATILE = "[data-due], .age, [data-rose-live]";

function cardText() {
  const out = new Map();
  document.querySelectorAll("[data-card]").forEach((el) => {
    const copy = el.cloneNode(true);
    copy.querySelectorAll(VOLATILE).forEach((v) => v.remove());
    out.set(el.getAttribute("data-card"),
            copy.textContent.replace(/\s+/g, " ").trim());
  });
  return out;
}

// Flash the cards whose rendered text changed across a refresh.
//
// The snapshot and the comparison sit either side of the SAME re-render,
// milliseconds apart, which is what makes this work: the clock-derived parts --
// "4 min ago", "Update in 4:59" -- read identically across that gap, so only
// real new data differs. Comparing across any longer interval would flash every
// card every time, because those two strings are always changing.
//
// It follows that navigation never flashes. Stepping the forecast to +48 h
// re-renders without a refresh, and nothing here runs.
function flashChanged(before) {
  const after = cardText();
  document.querySelectorAll("[data-card]").forEach((el) => {
    const key = el.getAttribute("data-card");
    const was = before.get(key), now = after.get(key);
    if (was === undefined || was === now) return;
    el.classList.remove("fresh");
    void el.offsetWidth;   // reflow, so a flash still mid-flight restarts
    el.classList.add("fresh");
  });
}

// Re-render and flash whatever that changed, as one move.
function showAndFlash() {
  const before = cardText();
  show();
  flashChanged(before);
}

// REFRESH.
//
// The page fetched both payloads once, at load, and never again. The minute
// tick re-rendered from memory, so on a tab left open the age climbed and the
// countdown ran -- truthfully, about a payload that had stopped moving. With
// collection every ten minutes the repository was six times fresher than any
// open tab, and every improvement upstream stopped at the browser.
//
// The two chains are refetched on their own cadences because they move on
// their own cadences. now.json is ~6 KB and changes every collection;
// forecast.json is ~128 KB and changes four times a day, so refetching it as
// often would be twenty times the bytes for nothing.
//
// The two intervals themselves are declared far above, beside the countdown
// that has to add NOW_REFRESH_MS to what now.json publishes.

// A unique URL per fetch, because `no-store` alone is not enough against a
// shared cache.
//
// GitHub Pages serves every file through Fastly with **`Cache-Control:
// max-age=600`**, and Pages gives you no way to change it -- there is no
// header configuration, so this cannot be fixed on the publishing side.
// Measured on the live bundle 2026-09-25T15:48:58Z:
//
//     Cache-Control: max-age=600
//     Age: 0            x-cache: MISS      x-cache-hits: 0
//     Last-Modified: Fri, 25 Sep 2026 15:45:44 GMT
//     Via: 1.1 varnish  x-served-by: cache-bur-kbur8200041-BUR
//
// Ten minutes of permitted staleness against a ten-minute collection cadence:
// a cache HIT inside that window can serve a reader a now.json one whole
// collection behind, and its own age line would then be honest about a reading
// that was already superseded.
//
// That sample was a MISS with Age 0, so it came from origin and was NOT stale
// -- `cache: "no-store"` reached the CDN as `Cache-Control: no-cache` and was
// honoured. The mechanism is measured; that instance is not an instance of it.
// The reason to fix it anyway is that honouring a client `no-cache` is Fastly
// CONFIGURATION, not a guarantee, and it says nothing about what some other
// edge node has already cached for the next reader. A distinct URL cannot be
// answered from any cache by definition, which turns a policy we do not
// control into arithmetic we do.
//
// `no-store` stays alongside it: the query parameter defeats shared caches,
// `no-store` defeats this browser's own. They are different caches.
//
// Cost: every fetch is a guaranteed origin miss. now.json is 1.5 KB gzipped on
// a five-minute refresh, so this is a rounding error against the bandwidth of
// the page that fetches it.
function fresh(url) {
  return url + (url.includes("?") ? "&" : "?") + "v=" + Date.now();
}

// Both keep what is on screen when a fetch fails or returns something
// unusable. Blanking the page because one request lost would be worse than
// showing a reading whose own age line already says how old it is -- and on a
// phone at the beach, a lost request is the normal case, not the exception.
function refreshNow() {
  fetch(fresh(NOW_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .then((observed) => {
      if (!observed || !observed.generated_utc) return;
      if (NOW && observed.generated_utc === NOW.generated_utc) return;
      NOW = observed;
      if (MODE === "now") showAndFlash();
    })
    .catch(() => {});
}

// Rebuilt with every collection, so a past hour's measurement lands on the
// page within one refresh of the spectrum being collected.
function refreshMeasured() {
  fetch(fresh(MEASURED_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .then((got) => {
      if (!got || !got.generated_utc || !got.steps) return;
      if (MEASURED && got.generated_utc === MEASURED.generated_utc) return;
      MEASURED = got;
      if (MODE === "forecast") showAndFlash();
    })
    .catch(() => {});
}

// Rebuilt with every collection, like measured.json. Redrawn without the
// flash: a new hour on the chart is not a change in the reading above it.
function refreshSeries() {
  fetch(fresh(SERIES_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .then((got) => {
      if (!got || !got.generated_utc || !got.steps) return;
      if (SERIES && got.generated_utc === SERIES.generated_utc) return;
      SERIES = got;
      if (MODE === "now") show();
    })
    .catch(() => {});
}

// Rebuilt with every collection, like series.json, and drawn on both tabs:
// the measured hours under the Now cards and beside the forecast's.
function refreshWindTide() {
  fetch(fresh(WINDTIDE_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .then((got) => {
      if (!got || !got.generated_utc || !got.hours) return;
      if (WT && got.generated_utc === WT.generated_utc) return;
      WT = got;
      show();
    })
    .catch(() => {});
}

// Rebuilt with every collection from the daily archive and the newest
// spectra; drawn only by the Origins view, so redrawn without the flash.
function refreshOrigins() {
  fetch(fresh(ORIGINS_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .then((got) => {
      if (!got || !got.generated_utc || !got.arrivals) return;
      if (ORIGINS && got.generated_utc === ORIGINS.generated_utc) return;
      ORIGINS = got;
      if (MODE === "now") show();
    })
    .catch(() => {});
}

// Rebuilt with every collection, like now.json; a new reading at 46047 is a
// change in a card's numbers, so it flashes like one. The first fetch, at
// load, is not an update: it fills the tab without the flash.
function refreshBuoys() {
  fetch(fresh(BUOYS_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .then((got) => {
      if (!got || !got.generated_utc || !got.buoys) return;
      if (BUOYS && got.generated_utc === BUOYS.generated_utc) return;
      const first = !BUOYS;
      // New spectra mean new trains: a remembered row would light another.
      const was = BUOYS && BUOYS.roses;
      Object.keys(ROSE_TRAIN).forEach((st) => {
        if (!was || !was[st] || !got.roses || !got.roses[st]
            || was[st].trains_from_utc !== got.roses[st].trains_from_utc) ROSE_TRAIN[st] = null;
      });
      BUOYS = got;
      if (MODE === "now") (first ? show() : showAndFlash());
    })
    .catch(() => {});
}

// The archive changes once a day; refetched hourly, and only once it has
// been asked for.
function refreshSeriesAll() {
  if (ALL_STATE !== "loaded") return;
  fetch(fresh(SERIES_ALL_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .then((got) => {
      if (!got) return;
      if (SERIES_ALL && got.available === SERIES_ALL.available && got.hours === SERIES_ALL.hours
          && got.start_utc === SERIES_ALL.start_utc) return;
      SERIES_ALL = got;
      if (MODE === "now") show();
    })
    .catch(() => {});
}

function refreshForecast() {
  fetch(fresh(SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .then((data) => {
      if (!data || !data.breaks || !data.generated_utc) return;
      if (DATA && data.generated_utc === DATA.generated_utc) return;
      if (!adoptForecast(data, currentHour())) return;
      if (MODE === "forecast") showAndFlash();
    })
    .catch(() => {});
}

// The valid_utc the picker is sitting on, or null. Read before adopting a new
// cycle so the reader can be put back on the hour they chose.
function currentHour() {
  const step = STEPS[CURSOR];
  return step ? step.valid_utc : null;
}

// Everything on the page derived from forecast.json. Called at boot and again
// whenever a NEWER cycle arrives, because a new cycle changes which hours
// exist: the picker has to be rebuilt against them or it offers indices into
// an array that no longer has that shape.
//
// `keep` is the valid_utc the reader was looking at. If the new cycle still
// carries that hour they stay on it; a refresh that yanked someone from +48 h
// back to now would be a worse bug than the staleness it fixed.
function adoptForecast(data, keep) {
  DATA = data;

  const notes = (data.warnings && data.warnings.length) ? data.warnings : null;
  $("warnings").hidden = !notes;
  if (notes) $("warnings").textContent = notes.join("  ·  ");

  TIDE_BY_TIME = Object.fromEntries((data.tide || []).map((t) => [t.valid_utc, t]));

  const first = (data.breaks[0] || {}).hours || [];
  if (!first.length) {
    STEPS = [];
    $("conditions").innerHTML = '<p class="warn">No forecast hours in this file.</p>';
    return false;
  }
  // Keyed on lead_h and carrying the real array index, so the same page works
  // against the hourly file in the repository and the 3-hourly file published
  // to the web. Filtering by array position and then multiplying the index by
  // three assumed hourly data, and would have silently shown the wrong hour.
  const cycle = first.map((h, i) => ({h, i})).filter(({h}) => h.lead_h % 3 === 0)
    .map(({h, i}) => ({valid_utc: h.valid_utc, from: "cycle", index: i, lead_h: h.lead_h}));
  // Before this run was published, an earlier run was on screen, and the log
  // kept what it said (`past`, 48 h). This run's own first hours were already
  // gone when it appeared, so for any hour the log covers, the log's entry is
  // what a reader had in front of them; the run's own figure for
  // that hour is used only where the log has nothing.
  const generated = data.generated_utc || "";
  const past = (data.past || []).filter((p) => p.valid_utc < generated)
    .map((p) => ({valid_utc: p.valid_utc, from: "past", entry: p, lead_h: p.lead_h}));
  const logged = new Set(past.map((p) => p.valid_utc));
  STEPS = past.concat(cycle.filter((c) => c.valid_utc >= generated || !logged.has(c.valid_utc)))
    .sort((a, b) => (a.valid_utc < b.valid_utc ? -1 : a.valid_utc > b.valid_utc ? 1 : 0));

  $("when").innerHTML = STEPS
    .map((step, n) => `<option value="${n}">${when(step.valid_utc)}</option>`)
    .join("");

  // Only an hour the reader stepped to is kept. The default hour is not a
  // choice, so it is re-derived: kept verbatim it would sit on 11 p.m. long
  // after 11 p.m. had passed.
  const kept = keep == null || keep !== CHOSEN
    ? -1 : STEPS.findIndex((step) => step.valid_utc === keep);
  if (kept >= 0) {
    CURSOR = kept;
    return true;
  }
  CHOSEN = null;
  CURSOR = firstUpcoming();
  return true;
}

// Open on the first hour that has NOT YET HAPPENED, never on one that has. A
// GFS-Wave cycle publishes about five hours after its nominal time, so hour
// zero is already in the past when anyone loads the page — it opened on
// 5 a.m. for a reader standing on the sand at 2 p.m. Picking the hour nearest
// now fixed that and kept half the bug: at 0:20 on Saturday the 3-hourly steps
// are Friday 11 p.m. and Saturday 2 a.m., and nearest chose 11 p.m. — a
// forecast for a time already gone, opened by default.
//
// If every hour in the file has passed, the last one is the least stale thing
// there is; `show` says so rather than presenting it as upcoming.
function firstUpcoming() {
  const now = Date.now();
  const n = STEPS.findIndex((step) => new Date(step.valid_utc).getTime() >= now);
  return n >= 0 ? n : Math.max(0, STEPS.length - 1);
}

// Move a default cursor off an hour that has since passed. The page can sit
// open for hours — on either tab — and the hour it opened on goes by; showing
// it then would be opening on the past, one step removed. An hour the reader
// stepped to is theirs, past or not, and is left alone. True if it moved.
function advancePastDefault() {
  const hour = currentHour();
  if (hour == null || hour === CHOSEN) return false;
  if (new Date(hour).getTime() >= Date.now()) return false;
  const next = firstUpcoming();
  if (next === CURSOR) return false;
  CURSOR = next;
  return true;
}

// The reader stepped the picker: that hour is now theirs.
function choose(cursor) {
  CURSOR = cursor;
  CHOSEN = currentHour();
  show();
}

function boot(data, observed, measured, series, windtide) {
  NOW = observed;
  MEASURED = measured;
  SERIES = series;
  WT = windtide && windtide.hours ? windtide : null;
  $("tab-now").onclick = () => setMode("now");
  $("tab-forecast").onclick = () => setMode("forecast");
  wireSwellTabs();
  wireRoses();
  wireDrawings();
  wireCharts();

  if (!adoptForecast(data, null)) return;
  refreshOrigins();
  refreshBuoys();

  $("when").onchange = (e) => {
    choose(Math.max(0, Math.min(STEPS.length - 1, Number(e.target.value))));
  };
  $("earlier").onclick = () => { if (CURSOR > 0) choose(CURSOR - 1); };
  $("later").onclick = () => { if (CURSOR < STEPS.length - 1) choose(CURSOR + 1); };

  // `adoptForecast` has already put CURSOR on the first hour not yet passed.
  //
  // Opens on Now: it is what someone standing on the sand wants, and if the
  // observed chain is broken the tab says so rather than hiding it behind a
  // silent fallback to the model. A refresh puts the reader back on the tab
  // THEY chose, which is not a fallback; anything unrecognised in storage
  // opens on Now. The swell tab is restored by id, and one that no longer
  // exists falls through to the leader, as an unmade choice does.
  SWELL_TAB = recall(KEEP.swell);
  // The calculation table opens as the reader left it; anything else, closed.
  CALC_OPEN = recall(KEEP.calc) === "open";
  // The chart's view likewise; anything unrecognised is the heights.
  const view = recall(KEEP.chart);
  CHART_MODE = CHART_MODES.some((m) => m.id === view) ? view : "height";
  const fcView = recall(KEEP.fcChart);
  FC_MODE0 = FC_MODES.some((m) => m.id === fcView) ? fcView : FC_MODES[0].id;
  // Folded away until the reader opens it, as the calculation is.
  CHART_OPEN = recall(KEEP.chartOpen) === "open";
  ORIGIN_OPEN = recall(KEEP.originOpen) === "open";
  CARD_CHART_OPEN.wind = recall(KEEP.windChart) === "open";
  CARD_CHART_OPEN.tide = recall(KEEP.tideChart) === "open";
  for (const chain of ["now", "fc"]) {
    for (const id of ["wind", "tide"]) WT_MODE[chain][id] = recall(`${KEEP.wtView}.${chain}.${id}`) || WT_MODE[chain][id];
  }
  setMode(recall(KEEP.mode) === "forecast" ? "forecast" : "now");

  // The observed age moves whether or not anything else does, so the observed
  // tab is redrawn on the minute rather than only on load or a tab change.
  setInterval(() => { if (MODE === "now") show(); }, 60000);

  // The forecast tab is redrawn only when its default hour has just passed.
  setInterval(() => { if (MODE === "forecast" && advancePastDefault()) show(); }, 60000);

  // A second's tick for the countdowns alone. The minute tick above re-renders
  // the whole page, which is the right cadence for "2 h ago" and far too heavy
  // for a clock that has to move every second.
  setInterval(tickDue, 1000);
  // The roses' one clock (both buoys on it), ten times a second.
  setInterval(roseTick, 100);

  // And the payloads themselves, which used to be fetched once and never
  // again. See REFRESH above.
  setInterval(refreshNow, NOW_REFRESH_MS);
  setInterval(refreshMeasured, NOW_REFRESH_MS);
  setInterval(refreshSeries, NOW_REFRESH_MS);
  setInterval(refreshWindTide, NOW_REFRESH_MS);
  setInterval(refreshOrigins, NOW_REFRESH_MS);
  setInterval(refreshBuoys, NOW_REFRESH_MS);
  setInterval(refreshSeriesAll, FORECAST_REFRESH_MS);
  setInterval(refreshForecast, FORECAST_REFRESH_MS);
}

Promise.all([
  fetch(fresh(SOURCE), {cache: "no-store"})
    .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }),
  // now.json may legitimately be absent -- it is published by a different job
  // on a different schedule. Absent is handled; wrong is not.
  fetch(fresh(NOW_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .catch(() => null),
  // measured.json likewise: without it, past hours say no reading is loaded.
  fetch(fresh(MEASURED_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .catch(() => null),
  // series.json likewise: without it, the chart says it is not loaded.
  fetch(fresh(SERIES_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .catch(() => null),
  // windtide.json likewise: without it, the Wind and Tide charts draw only
  // the forecast, or say they are not loaded.
  fetch(fresh(WINDTIDE_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .catch(() => null),
])
  .then(([forecast, observed, measured, series, windtide]) =>
    boot(forecast, observed, measured, series, windtide))
  .catch((err) => {
    $("warnings").hidden = false;
    $("warnings").textContent =
      "Could not load " + SOURCE + " (" + err.message + "). Run "
      + "`python -m forecast.live` to write it, and open this page over HTTP "
      + "rather than from the filesystem.";
  });
</script>
