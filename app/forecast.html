<script>
// Data comes from data/live/forecast.json, written by `python -m forecast.live`
// and committed by the collector workflow. ?data= overrides for local testing.
const PARAM = new URLSearchParams(location.search);
const SOURCE = PARAM.get("data") || "../data/live/forecast.json";
const NOW_SOURCE = PARAM.get("now") || "../data/live/now.json";
// The observed chain rebuilt for each of the last 48 h (forecast.measured),
// shown in blue under every forecast hour that has gone by.
const MEASURED_SOURCE = PARAM.get("measured") || "../data/live/measured.json";
// The same chain every hour for the last week (forecast.series), drawn under
// each card on the Now tab.
const SERIES_SOURCE = PARAM.get("series") || "../data/live/series.json";
// Every archived hour, for zooming out past the week -- fetched only then.
const SERIES_ALL_SOURCE = PARAM.get("series_all") || "../data/live/series_all.json";
// The measured wind and tide each hour, and the next day's predicted tide
// (forecast.windtide), drawn under the Wind and Tide cards on both tabs.
const WINDTIDE_SOURCE = PARAM.get("windtide") || "../data/live/windtide.json";
// Every readable arrival, and every hurricane the card would have named, over
// the archive (forecast.originhistory), for the Origins chart on the LIVE tab.
const ORIGINS_SOURCE = PARAM.get("origins") || "../data/live/origins.json";
// The context buoys shown under 46232 on the LIVE tab's Buoys tab
// (forecast.buoys): what each measured at the buoy, not carried to any break.
const BUOYS_SOURCE = PARAM.get("buoys") || "../data/live/buoys.json";
// NWS's coast and ocean alerts (forecast.alerts), above the Forecast tab's
// Swell card over the hours each covers.
const ALERTS_SOURCE = PARAM.get("alerts") || "../data/live/alerts.json";
// The LIVE tab's Briefing (forecast.briefing), above the cards.
const BRIEFING_SOURCE = PARAM.get("briefing") || "../data/live/briefing.json";
// Their heights at every archived stamp, for the Buoys tab's Height chart past
// the week (forecast.buoys); fetched with series_all.json, only when asked for.
const BUOYS_ALL_SOURCE = PARAM.get("buoys_all") || "../data/live/buoys_all.json";

// North to south along the sand: the west edge of the window is the bearing
// to the Point Loma tip and it sweeps as you walk. This is the scope and the
// tie-break; the swell card's tabs are ranked by window energy (`rankByEnergy`).
const ORDER = ["coronado_north", "coronado_center", "coronado_south"];
const SHORT = {coronado_north: "North", coronado_center: "Center", coronado_south: "South"};
// A buoy's NDBC name without its state: "Tanner Banks, CA" is "Tanner Banks".
const bareName = (name) => name.replace(/, [A-Z]{2}$/, "");

// Matches forecast.transform.SEAWARD_CLIP. Not a blocker: this is the share of
// the swell travelling towards a part of the compass the beach does not face,
// so none of it arrives no matter what is or is not in the way.
const AWAY = "pointed away from this beach";

const $ = (id) => document.getElementById(id);
// Imperial leads, metric in parentheses. Everything upstream of the page --
// the JSON, the transform, the collectors -- stays SI, because that is what
// NDBC and WAVEWATCH III publish and converting in the data model would put a
// unit change between the source and every cross-check. These convert at the
// point of display and nowhere else.
const FT_PER_M = 3.28084;
const MPH_PER_KT = 1.15078;
const MI_PER_KM = 0.621371;
// The Briefing's weather (owner's request, 2026-10-17): METAR's °C and its
// precipitation in inches, as published.
const MM_PER_IN = 25.4;
// Its pressure (owner's request, 2026-10-23): METAR's altimeter in inHg.
const HPA_PER_INHG = 33.8639;
const fahrenheit = (c) => c * 9 / 5 + 32;
// The reader's Units setting (owner's call, 2026-10-28), at the foot of the
// page: "both", imperial first and metric in parentheses, the default; or
// "imperial" or "metric" alone. Every number on screen goes through `dual`
// (HTML) or `dualText` (an SVG caption, a spoken label), so one setting
// reaches each; a metric-only value is the "both" form's bracket, never a
// second rounding. `lead` styles the value that leads (the Briefing's ink).
// Read from this device at start-up (`UNITS_KEY`); the conversions above stay
// the only ones.
let UNITS = "both";
const dual = (imp, met, lead = (x) => x) => (UNITS === "imperial" ? lead(imp)
  : UNITS === "metric" ? lead(met) : `${lead(imp)} <span class="unit">(${met})</span>`);
const dualText = (imp, met) => (UNITS === "imperial" ? imp : UNITS === "metric" ? met : `${imp} (${met})`);
// A gust beside its wind, one unit as it always was: mph, or knots on metric.
const gustSpeed = (kt) => (UNITS === "metric" ? `${Math.round(kt)} kt` : `${Math.round(kt * MPH_PER_KT)} mph`);

const height = (m) => (m == null ? "\u2014" : dual(`${(m * FT_PER_M).toFixed(1)} ft`, `${m.toFixed(2)} m`));
const speed = (kt) => (kt == null ? "\u2014" : dual(`${Math.round(kt * MPH_PER_KT)} mph`, `${Math.round(kt)} kt`));

// Display-only shortenings for the card's window rows. A full blocker name is
// the truth and stays in the JSON, the "taking the swell" list and the
// standing-on block; three of them in a 13-degree row would wrap twice. Any
// name not listed falls through unchanged, so adding a blocker to spots.json
// can make this table ugly but never wrong.
const BLOCKER_SHORT = {
  "Point Loma peninsula": "Point Loma",
  "Coronado Islands (South group)": "Islands S",
  "Coronado Islands (North group)": "Islands N",
  "Baja peninsula": "Baja",
};
const shortBlocker = (name) => BLOCKER_SHORT[name] || name || "\u2014";

// The compass point alone, without the degrees the row already prints.
function point(deg) {
  if (deg == null) return "";
  const points = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  return points[Math.round(deg / 22.5) % 16];
}

// The middle of an arc, wrap-safe. Every window in this file sits well away
// from north, but a mid-point that broke at 350-010 would be a bug nobody saw
// until a spot was added somewhere else.
function midBearing(from, to) {
  const span = ((to - from) % 360 + 360) % 360;
  return (from + span / 2) % 360;
}

// The windows, widest-first BAR but listed in bearing order so the row order
// matches the compass. Each row says what land forms each edge, because the
// only honest name for a window is what is either side of it -- a page that
// hardcoded "south / channel / west" would keep saying it after the geometry
// moved, and this geometry moved twice in a day.
function windowList(windows) {
  // A window whose bearings are not numbers is not drawn as NaN. The bundle
  // publishes index.html and forecast.json in one commit so they cannot drift,
  // but now.json is optional and the publish script keeps the previous one
  // when a build fails — so the page can meet an older payload shape, and a
  // card reading "NaN-NaN deg" is worse than a card saying nothing.
  const given = windows || [];
  const ok = given.filter((w) => w && isFinite(w.from) && isFinite(w.to));
  if (!ok.length) {
    // Two different failures, and only one of them is about the coast. An
    // empty list is the geometry saying there is nowhere to arrive from; a
    // list this page cannot read is the page saying so. Printing the
    // geometric claim for both would put a false statement about the beach on
    // screen every time a payload went stale -- which is exactly when nobody
    // is watching.
    return given.length
      ? '<div class="quiet">windows not readable from this file &mdash; '
        + 'it is older than the page</div>'
      : '<div class="quiet">no open window &mdash; land on every bearing '
        + 'this beach faces</div>';
  }
  windows = ok;
  const spans = windows.map((w) => ((w.to - w.from) % 360 + 360) % 360);
  const widest = Math.max(...spans, 1);
  return `<div class="wins">` + windows.map((w, i) => {
    const soft = w.confidence && w.confidence !== "high";
    return `<div class="win${soft ? " soft" : ""}">
      <span class="deg">${Math.round(w.from)}\u2013${Math.round(w.to)}\u00b0</span>
      <span class="pt">${point(midBearing(w.from, w.to))} &middot; ${Math.round(spans[i])}\u00b0 wide</span>
      <span class="edge">${shortBlocker(w.opened_by)} \u2192 ${shortBlocker(w.closed_by)}${
        soft ? ' <span class="est">one edge estimated</span>' : ""}</span>
      <span class="bar" style="width:${Math.max(3, 100 * spans[i] / widest)}%"></span>
    </div>`;
  }).join("") + `</div>`;
}

function compass(deg) {
  if (deg == null) return "—";
  const points = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  return points[Math.round(deg / 22.5) % 16] + " " + Math.round(deg) + "°";
}

// The headings a train comes FROM. A train fed by two sources carries both
// (`lobes`, each holding a fifth of it or more): its mean heading sits between
// them, where little of it comes from -- on 46% of South's trains and 23% of
// the buoy's, measured (BRIEFING §38). One source, one heading, the mean.
// A payload built before 2026-10-05 has no lobes and reads as one heading.
function headings(t) {
  return t && t.lobes && t.lobes.length >= 2 ? t.lobes.map((l) => l[0]) : [t ? t.from_deg : null];
}
function fromText(t) {
  return headings(t).map(compass).join(" & ");
}
// The forms a train row's heading may take, longest first; `fitTrains` shows
// the first that fits (owner's calls, 2026-10-06 and -07). Degrees whenever
// there is room -- "WNW 282° & WSW 248°", "SSW 197°" -- except a TAGGED row
// with two directions, which names them by point at most ("WNW & WSW") beside
// its tag. Then points, then one point: the larger direction's (lobes come
// largest first), the last resort on a narrow phone.
function trainForms(t, tagged = false) {
  const h = headings(t);
  const one = point(h[0]);
  if (h.length < 2) return tagged ? [compass(h[0]), one] : [compass(h[0])];
  const points = h.map(point).join(" & ");
  return tagged ? [points, one] : [fromText(t), points, one];
}
function pointsText(t) {
  return headings(t).map(point).join(" and ");
}
// Where a break's train arrives from in 5 m of water, one per heading
// `headings` gives, in its order; null where the payload has none.
function nearHeadings(t) {
  const fin = (d) => (typeof d === "number" && isFinite(d) ? d : null);
  if (t && t.lobes && t.lobes.length >= 2) {
    return t.lobes.map((_, j) => fin((t.near_lobes || [])[j]));
  }
  return [fin(t ? t.near_from_deg : null)];
}

function when(iso) {
  return new Date(iso).toLocaleString(undefined, {
    weekday: "long", month: "short", day: "numeric",
    hour: "numeric", minute: "2-digit",
  });
}
// The hour line's own setting of the same moment: the day and the time in
// ink, the date between them in the count's grey, as the Briefing line sets
// "Briefing updated 7:16 AM".
function whenLine(iso) {
  const d = new Date(iso);
  const day = (weekday) => d.toLocaleString(undefined, {weekday});
  const date = d.toLocaleString(undefined, {month: "short", day: "numeric"});
  const time = d.toLocaleString(undefined, {hour: "numeric", minute: "2-digit"});
  return `<span class="wd-long">${day("long")}</span><span class="wd-short">${day("short")}</span>`
    + ` <span class="count">${date}, <b class="when-time">${time}</b></span>`;
}

// The build stamps an age into now.json and that number freezes the instant
// the file is written — a page left open kept reporting the age it had at
// load, and the file itself is only rebuilt once an hour. The timestamp is
// the fact. The age is derived from it here, against the reader's own clock,
// every time the card is drawn.
function ageHours(iso) {
  if (!iso) return null;
  const ms = Date.now() - new Date(iso).getTime();
  return isFinite(ms) ? ms / 3600000 : null;
}

function ago(hours) {
  if (hours == null) return "";
  const mins = Math.round(hours * 60);
  if (mins < 1) return "just now";
  const h = Math.floor(mins / 60), m = mins % 60;
  if (!h) return `${m} min ago`;
  // Past a day, days and hours with no minutes: "31 h 31 min ago" pushed a
  // long outage's countdown pill onto a row of its own (owner's call,
  // 2026-10-21), and the countdown beside it carries the seconds.
  if (h >= 24) {
    const d = Math.floor(h / 24), hh = h % 24;
    return hh ? `${d} d ${hh} h ago` : `${d} d ago`;
  }
  return m ? `${h} h ${m} min ago` : `${h} h ago`;
}

// Every provenance line ends in a full stop, including the collector's own
// notes, which do not all carry one.
const period = (s) => (!s ? "" : /[.!?]\s*$/.test(s) ? s : s + ".");

// A card's provenance, one line per claim. On Now that is three (owner's
// layout, 2026-09-27): when it was measured, what was measured and where, and
// when the next one is due -- the countdown on its own line so it is never
// wrapped into the middle of a station name. A forecast card passes one line
// and no countdown, and renders as it always has.
//
// Wrapped in one block so the lines sit as close together on the swell card
// as on the others, whose own gap between rows is narrower. A line of pills
// (`pillLine`) is passed as `{html}` and takes no full stop, as the
// countdown's pill does not.
function srcLines(lines, due = "") {
  const body = [].concat(lines || []).filter(Boolean)
    .map((line) => `<span class="src">${line.html || period(line)}</span>`).join("")
    + (due ? `<span class="src">${due}</span>` : "");
  return body ? `<div class="srcs">${body}</div>` : "";
}

const clock = (iso) => new Date(iso).toLocaleString(undefined, {
  hour: "numeric", minute: "2-digit",
});

// A turn six days out is not "at 11:42 AM". The weekday appears only when the
// turn falls on a different local day from the moment being asked about, so
// the common case -- the next turn today -- stays short.
function turnClock(iso, fromIso) {
  const at = new Date(iso);
  const from = new Date(fromIso);
  const sameDay = at.toDateString() === from.toDateString();
  return sameDay ? clock(iso)
    : at.toLocaleString(undefined, {weekday: "short"}) + " " + clock(iso);
}

// When a measurement was taken, and how long ago that is. The age is derived
// here rather than read from the file for BRIEFING §18's reason, and it is the
// same reason for all three: now.json carries `age_hours` and `tide.age_minutes`
// frozen at build time, and the file is rebuilt once an hour.
//
// Only lines naming a MEASUREMENT get this. A modelled wind or a harmonic tide
// is a forecast FOR a moment, not a reading taken AT one, and "23 h ago" under
// a prediction for next Tuesday would be nonsense.
//
// The age is wrapped because it is derived from the READER's clock rather
// than from the payload, which makes it volatile between two renders that
// straddle a minute. `cardText` strips everything so marked before comparing,
// so a card is never flashed for a string that was only ever going to change.
// The LIVE cards' provenance pills (`feedPills`) take the same span.
function ageSpan(iso) {
  const age = iso ? ago(ageHours(iso)) : "";
  return age ? `<span class="age">${age}</span>` : "";
}

// The build's flag is a floor, never a ceiling: an open page can age a reading
// into staleness, but it cannot un-stale one the build already refused to call
// current. Extracted so the CARDS can ask, because they are built before the
// answer used to be worked out.
function nowIsStale() {
  if (!NOW) return false;
  const observedAge = ageHours(NOW.observed_utc);
  const limit = NOW.stale_hours != null ? NOW.stale_hours : 3;
  return NOW.stale || (observedAge != null && observedAge > limit);
}

// A LIVE card's numbers turn grey (`--faint`) once the reading they are
// calculated from is past the build's stale limit, three hours, and return
// when a newer one lands (owner's call, 2026-10-25). Each card its own
// source: the swell card's break tabs and 46232's reading by 46232's
// spectrum, 46047 and 46086 by their own, Wind by KNZY, Tide by the gauge.
// The calculation table, Origin, the provenance and the tide's predicted
// turn keep their colours: each was right for the reading it was made from,
// or is not that reading. `tickDue` flips the class on the reader's clock,
// so an open page greys on the minute; `force` is the build's own `stale`,
// a floor as in `nowIsStale`.
const staleLimitH = () => (NOW && NOW.stale_hours != null ? NOW.stale_hours : 3);
function agedAttr(iso, force = false) {
  const at = iso ? new Date(iso).getTime() + staleLimitH() * 3600000 : NaN;
  if (!Number.isFinite(at) && !force) return "";
  return ` data-aged-at="${Number.isFinite(at) ? new Date(at).toISOString() : ""}"`
    + (force ? ' data-aged-force="1"' : "");
}

const pad2 = (n) => String(n).padStart(2, "0");

// Elapsed time with the leading units dropped while they are zero. A card read
// at a glance should not spend three characters saying "0:", so 59 minutes is
// "59:07" rather than "0:59:07", and 42 seconds is "0:42".
//
// Days appear only past 24 h. Hours used to run on without wrapping, so that
// an outage read as one number -- but the number it produced for 46232's
// sixteen dark days was "389:00:00", which nobody reads as a fortnight.
// "16 d 5:00:00" says the same thing and says it immediately, spaced as the
// age beside it is ("1 d 7 h ago").
function hms(ms) {
  const total = Math.floor(Math.abs(ms) / 1000);
  const s = total % 60;
  const m = Math.floor(total / 60) % 60;
  const h = Math.floor(total / 3600) % 24;
  const d = Math.floor(total / 86400);
  if (d) return `${d} d ${h}:${pad2(m)}:${pad2(s)}`;
  if (h) return `${h}:${pad2(m)}:${pad2(s)}`;
  return `${m}:${pad2(s)}`;
}

// How often the page refetches each payload.
//
// Declared here rather than beside the refresh functions because `dueSpan`,
// just below, adds NOW_REFRESH_MS to every countdown -- a `const` used before
// its own line is a ReferenceError waiting for the first caller that moves.
//
// now.json is ~6 KB and changes every collection; forecast.json is ~128 KB and
// changes four times a day, so refetching them together would be twenty times
// the bytes for nothing, on a phone at the beach.
//
// NOW_REFRESH_MS must not be slower than collection or the page becomes the
// bottleneck rather than the trigger. A test pins it against
// COLLECT_INTERVAL_MIN.
const NOW_REFRESH_MS = 5 * 60 * 1000;
const FORECAST_REFRESH_MS = 60 * 60 * 1000;

// How long a collection's new file takes to reach this page's host, charged
// to the RED instant only (owner's call, 2026-10-23, BRIEFING §46). Both
// instants from now.json are collection MARKS, but the run publishes ~2.1 min
// after its mark (median of 100 runs on 23 Oct; p95 2.5, worst 8.1) and Pages
// then deploys the bundle, which nothing here has timed. Without this leg the
// card reddened at mark + refresh while the file was still on its way: the
// tide, which meets a deadline every six minutes, was red 5-9% of the time on
// samples that were not late. Replayed over 9-23 Oct, 5 minutes keeps it near
// 0.1% for any deploy up to ~3 min. The countdown is NOT moved: "Update due"
// is the honest word while the file is publishing, and red still says a
// reading is late, a few minutes later than it did.
const PUBLISH_LEG_MS = 5 * 60 * 1000;

// "Update in m:ss", and "Overdue m:ss" once the update has not come (no
// "by": owner's call, 2026-10-21, so a long outage's pill stays on its row).
//
// The instant comes from now.json's `next_expected`, one per card, and the
// duration is derived HERE rather than published -- the same reason the ages
// beside it are (BRIEFING §18): a duration frozen into a file rebuilt once an
// hour is wrong for most of the hour it spends on screen.
//
// It flips to overdue and turns red rather than rolling silently to the next
// slot. A countdown that always looked healthy is the fault this project has
// already met twice -- the staleness alert that never visibly fired through
// 46232's 16.2 dark days, and the archive job that read a 404 as "no cycle
// this hour" for three days. Monitoring that only shows the failure it expects
// is not monitoring.
//
// Rendered empty and filled by `tickDue`, so one second's tick rewrites three
// short strings instead of re-rendering every card.
//
// It counts to DISPLAYED, not to collected. `next_expected` in now.json is
// when a newer reading should be in the FILE -- it is computed from the
// source's own cadence and the collector's, and it cannot know about this
// page. The reader sees nothing until the page refetches, so the last leg is
// added here, where it is known.
//
//     next_expected  (source + collection, from now.py)
//   + NOW_REFRESH_MS (this page's own leg)
//   = when the reader should be looking at something newer
//
// Without that last term the countdown reached zero while the file was
// already fresh and the screen simply had not caught up -- reporting the
// page's own latency as the source being late.
//
// TWO instants, not one, because a publication delay is a distribution and one
// deadline cannot both promise and accuse. `next_expected` is when the update
// should land; `overdue_after` is when its absence is a fault. The swell is why:
// its spectra usually appear by H+15 but one measured hour took H+35, so a
// single number was either red on that hour or quoting H+27 to everyone else --
// and it quoted H+27, promising 100 minutes from stamp to screen on an hourly
// source when 80 was honest. See PUBLISH_LAG_MIN in forecast/now.py.
//
// Both get this page's refresh leg added, for the same reason: the reader sees
// nothing until the page refetches. The late one also gets PUBLISH_LEG_MS, the
// time a collection's file takes to reach the page's host.
function dueInstants(iso, lateIso) {
  if (!iso) return null;
  const at = new Date(iso).getTime();
  if (!Number.isFinite(at)) return null;
  const plusRefresh = (ms) =>
    new Date(ms + NOW_REFRESH_MS).toISOString().replace(/\.\d+Z$/, "Z");
  const lateAt = lateIso ? new Date(lateIso).getTime() : NaN;
  // Falling back to `at` keeps a payload without `overdue_after` behaving
  // exactly as it did before the two split, rather than never going red.
  // PUBLISH_LEG_MS on the late instant alone: see its declaration.
  return {due: plusRefresh(at),
          late: plusRefresh((Number.isFinite(lateAt) ? Math.max(lateAt, at) : at) + PUBLISH_LEG_MS)};
}

// `bare`: inside a pill, with no leading space and no closing full stop.
function dueSpan(iso, lateIso, {forceOver = false, bare = false} = {}) {
  const when = dueInstants(iso, lateIso);
  if (!when) return "";
  return `${bare ? "" : " "}<span class="due" data-due="${when.due}" data-late="${when.late}"`
    + (forceOver ? ' data-force-over="1"' : "") + (bare ? ' data-bare="1"' : "") + "></span>";
}

function tickDue() {
  const now = Date.now();
  document.querySelectorAll("[data-due]").forEach((el) => {
    const due = new Date(el.getAttribute("data-due")).getTime();
    if (!Number.isFinite(due)) { el.textContent = ""; return; }
    const parsedLate = new Date(el.getAttribute("data-late")).getTime();
    const late = Number.isFinite(parsedLate) ? Math.max(parsedLate, due) : due;
    const forced = el.getAttribute("data-force-over") === "1";
    // Three states. Red is reserved for the last one: between `due` and `late`
    // the update is expected and nothing has gone wrong, and saying so in the
    // resting colour is what stops the card crying wolf on every cycle that
    // runs at the slow end of its measured range.
    el.classList.toggle("over", now >= late || forced);
    // Only a genuinely elapsed deadline gets a figure. `forceOver` without one
    // means the build refused the reading for a reason that is not its age,
    // and "overdue -0:04:11" would be worse than saying nothing.
    const stop = el.getAttribute("data-bare") === "1" ? "" : ".";
    el.textContent = (now >= late ? `Overdue ${hms(now - late)}`
      : forced ? "Overdue"
      : now >= due ? "Update due"
      : `Update in ${hms(due - now)}`) + stop;
  });
  document.querySelectorAll("[data-status-due]").forEach((el) => {
    const due = new Date(el.getAttribute("data-status-due")).getTime();
    const parsedLate = new Date(el.getAttribute("data-status-late")).getTime();
    const late = Number.isFinite(parsedLate) ? Math.max(parsedLate, due) : due;
    const over = el.getAttribute("data-status-force") === "1" || now >= late;
    const isDue = !over && now >= due;
    el.classList.toggle("over", over);
    el.classList.toggle("due", isDue);
    const said = over ? "Overdue" : isDue ? "Update due" : "Receiving normally";
    el.setAttribute("aria-label", said);
    el.setAttribute("title", said);
  });
  document.querySelectorAll("[data-aged-at]").forEach((el) => {
    const at = new Date(el.getAttribute("data-aged-at")).getTime();
    el.classList.toggle("aged", el.getAttribute("data-aged-force") === "1"
      || (Number.isFinite(at) && now >= at));
  });
}

// The forecast's tide is the harmonic prediction plus the gauge's measured
// departure from it over the last three days, carried forward -- the level
// the breaking was computed at. The prediction alone ran ~9 in under the
// water in Sept 2026 (BRIEFING §32). An hour that carries no departure (none
// was measured, or it was logged before the card added one) is the bare
// prediction and says so (owner's request, 2026-10-15), so the card never
// claims an offset it lacks; an hour with no tide at all says neither.
function departurePill(tide) {
  if (!tide || tide.height_m == null) return "";
  const d = tide.departure_m;
  if (d == null) return "No departure";
  // "Departure", not "Gauge departure": measured, the three pills need 321 px
  // against 358, and the card has 330 at a 390 px phone. Plain text: a pill
  // lays its content out as flex items, which would drop the space before
  // `height`'s metric span.
  return `Departure ${d < 0 ? "\u2212" : "+"}${heightText(Math.abs(d))}`;
}

// The tide's next turning point, and which way it is running into it.
//
// The direction is read off the TURN, never differenced from the water level.
// Measured on the 6-minute measured series: differencing the two newest
// samples reads the direction backwards on 19.5% of readings, and a 45-minute
// regression is still wrong 3.3% of the time. Both fail near slack water --
// exactly when a reader looks -- and a measured "falling" beside a predicted
// high water would be a card contradicting itself.
function nextTurn(turns, afterIso) {
  if (!turns || !turns.length || !afterIso) return null;
  return turns.find((t) => t.valid_utc > afterIso) || null;
}

// `tagged` marks the line as a prediction, which is needed on the observed tab
// and not on the forecast tab, where the whole card is already a model and its
// provenance says so.
function turnLine(turns, afterIso, {tagged = false} = {}) {
  const turn = nextTurn(turns, afterIso);
  if (!turn || !turn.direction || turn.height_m == null) return "";
  return `<span class="turn"><b>${turn.direction}</b> to ${height(turn.height_m)}`

// THE TIDE PHASE (owner's request, 2026-10-11; forecast.tidephase, BRIEFING
// §41): where the tide is in its spring-neap and declination cycles, as a
// fold on the Tide card on both tabs. Its line is a fixed title, "Phase"
// (owner's request, 2026-10-11, replacing the phase itself); open, three
// paragraphs -- the day, the next spring or neap, the one after -- each a
// bold heading ("Today", "Around 17 Oct", "Late October") over a body that
// is a fixed run of slots (docs/tide_phase_wording.md): a slot with no value
// drops with its joining words. Each paragraph is set as an Origin entry is,
// its heading at the value size over a grey body, the paragraphs apart by a
// centred dot; nothing under them (owner's call, 2026-10-14: what they stand
// on -- NOAA's constants, the computed Moon, CO-OPS's turns -- is said on

const COAST_TZ = "America/Los_Angeles";

}
// "Late October": the After paragraph's when (owner's call, 2026-10-11).
function monthPart(iso) {
  const d = dayParts(coastDay(Date.parse(iso)));

}
const listJoin = (xs) => (xs.length < 2 ? xs.join("") : `${xs.slice(0, -1).join(", ")} and ${xs[xs.length - 1]}`);

const PHASE_TODAY_SO = {

  away: "so the day's two tides are growing unequal",
  toward: "so the day's two tides are evening out",

function phaseNextSo(kind, state) {
  if (kind === "neap") {

      : state === "equator" ? "small swings, the day's two tides alike" : "small swings";
  }
  return state === "far" ? "the biggest swings, one tide of the day much bigger than the other"
    : state === "equator" ? "big swings, the day's two tides alike" : "big swings";
}

  return d.state === "equator" ? "near the equator" : d.state === "far" ? `far ${d.side}`

}

function tidePhaseText(block, s, isToday) {
  const out = [];

    const felt = `as the tide feels it ${Math.round(block.diurnal_age_h)} h late`;
    const moonSaid = td.moon
      ? `${capFirst(moonName(td.moon.name))} ${coastDay(Date.parse(td.moon.utc)) < s.day ? "was" : "is"} ${dayOfUtc(td.moon.utc)} and the Moon`
      : "The Moon";

    if (td.pair) {
      p += `: ${td.pair.event}s of ${height(td.pair.heights_m[0])} and ${height(td.pair.heights_m[1])} `
        + (isToday ? "today" : "that day");

      + (n.coincide && n.coincide.length ? `, coinciding with ${listJoin(n.coincide)}` : "")

function phaseFold(payload, key, {tagged = false} = {}) {

      aria-expanded="${PHASE_OPEN}" aria-label="The tide's phase: ${PHASE_TITLE[s.phase]}"><svg viewBox="0 0 16 16"

// THE SUN (owner's request, 2026-10-16; forecast.sunset, BRIEFING §42): the
// sunset each break sees. For most of the year the sun goes behind
// the Point Loma peninsula minutes before the sea-horizon time every table
// gives; through the winter it sets in the sea, left of the point, for as long
// as the break's own view of the tip allows -- a season that differs by break,
// as the window does. Each tab its own headline and lines, following the open
// swell tab as the Wind card's verdict does; the Buoys tab has no beach, so it
// reads the sea horizon. Computed, never measured: tagged so on LIVE, as the
// tide's turn is. Sunrise is the sea-level time (no land east of the breaks

  const s = (sun.seasons || {})[b];

    return `Never clears the point here: closest ${dayText(s.closest.day)}, `
      + `${s.closest.early_min.toFixed(0)} min early`;
  }
  const runs = s.runs || [];
  const at = runs.findIndex((r) => r.from <= key && key <= r.to);
  if (at < 0) return "";
  const open = (i) => i === runs.length - 1;
  if (runs[at].kind === "sea") return open(at) ? "" : `until ${dayText(runs[at].to)}`;
  const next = runs.slice(at + 1).findIndex((r) => r.kind === "sea");
  if (next < 0) return "";
  const r = runs[at + 1 + next];
  return open(at + 1 + next) ? `In the sea, left of the point, from ${dayText(r.from)}`
    : `In the sea, left of the point, ${daySpan(r.from, r.to)}`;
}
// The card for the coast day `key`, or nothing when the payload has none.
// `live`: the reader's clock picks each time instead -- a tab's sunset is
// today's until it has passed, then tomorrow's, and the sunrise likewise, each
// saying "tomorrow" when it is (the owner's question, 2026-10-16: a bare time
// after sunset read as either day's). Per tab, because the Point Loma sunset
// comes minutes before the sea's.
function sunCard(payload, key, {tagged = false, live = false} = {}) {
  const sun = payload && payload.sun;

  const nextKey = Object.keys(sun.days).find((k) => k > key);
  const tomorrow = nextKey && sun.days[nextKey];
  // [the day's entry, its key, the words after the time] for an event read by `at`.
  const pick = (at) => (live && tomorrow && Date.now() > Date.parse(at(today))
    ? [tomorrow, nextKey, " tomorrow"] : [today, key, ""]);
  const shown = (id) => (id === SWELL_TAB ? "" : " hidden");
  const heads = [], lines = [];
  for (const b of SUN_TABS(payload)) {
    if (!(today.breaks || {})[b]) continue;
    const [day, dayKey, when] = pick((d) => ((d.breaks || {})[b] || {}).seen_utc);
    const s = (day.breaks || {})[b];
    if (!s) continue;
    heads.push(`<span class="val" data-sun-for="${b}"${shown(b)}>${clock(s.seen_utc)} <span class="unit">sunset${when}</span></span>`);
    const season = sunSeason(sun, b, dayKey);
    if (s.kind === "sea") {
      lines.push(`<span class="turn" data-sun-for="${b}"${shown(b)}><b>in the sea</b>, left of the point`
        + (season ? `, ${season}` : "") + `</span>`);
    } else {
      // The minutes are the two clocks' own difference, so they never
      // disagree with the times they compare.
      lines.push(`<span class="turn" data-sun-for="${b}"${shown(b)}><b>behind Point Loma</b>, `
        + `${Math.round((Date.parse(day.sunset_utc) - Date.parse(s.seen_utc)) / 60000)} min early</span>`);

  lines.push(`<span class="turn" data-sun-for="${BUOY_TAB}"${shown(BUOY_TAB)}>at the sea horizon</span>`);

      <span class="lbl">Sun</span>

// Off on LIVE for now (owner's request, 2026-10-20): the Tide card's phase

const SHOW_LIVE_PHASE = false;

// THE BRIEFING (owner's requests, 2026-10-16, -17 and -22; forecast.briefing,

// (owner's call, 2026-10-24), then the swell, the day's tide as a curve, then the

// wording, 2026-10-23 and -24).

// sending two arcs. Drawn pointing north and turned to the swell's direction

const briefSignal = (fromDeg) => `<svg class="brief-signal" viewBox="-7 -5.5 14 14" aria-hidden="true">`
  + `<g transform="rotate(${(fromDeg + 180) % 360} 0 1.5)"><circle cx="0" cy="4.5" r="1.6"/>`
  + `<path d="M-3.06 1.93A4 4 0 0 1 3.06 1.93M-5.75 -0.32A7.5 7.5 0 0 1 5.75 -0.32"/></g></svg>`;
const BRIEF_SEEN = "nado-waves.brief-seen";

const briefNum = (s) => `<b class="brief-num">${s}</b>`;

const briefAt = (iso, B) => (coastDay(Date.parse(iso)) === coastDay(Date.parse(B.built_utc))

  dual(`${Math.round(fahrenheit(c))} °F`, `${tenths ? c.toFixed(1) : Math.round(c)} °C`, briefNum);

const briefMinus = (x) => x.replace(/-/g, "−");

// NWS's coast and ocean alerts (owner's request and calls, 2026-10-24;

// The log-first gate (owner's call, 2026-10-16). "Wave observer" is this

// At or under this, a wind has no side worth naming (owner's report,
// 2026-10-02): Beaufort force 1, light air, 1-3 kt -- "direction shown by
// smoke drift but not by wind vanes", in the scale's own words. The NWS grid
// gives every hour a direction however light, and its 2-5 kt northerly every
// night made the Forecast tab's Shore direction read 100% offshore from 11 PM
// to 10 AM, where KNZY over the same hours (158 reports, 18 Sep - 1 Oct) was
// calm or variable 29% of the time and 3 kt or under 44%.
const LIGHT_KT = 3;

// The card's verdict, and the Shore direction charts': offshore, cross-shore
// or onshore against the break's normal, "light offshore" (and so on) when
// the wind is too light for its side to matter much, and calm at 0 kt.
// The card names a light wind's side (owner's request, 2026-10-07); the
// charts still count every light or calm hour as one kind (`shoreKind`).
// A calm METAR is 00000KT, which the archive holds as 0° at 0 kt: that is
// no wind, not a due-north one. `kt` left out keeps the old reading.
function sense(offshore, kt) {
  if (kt === 0) return "calm";
  if (offshore == null) return null;
  const side = offshore > 0.3 ? "offshore" : offshore < -0.3 ? "onshore" : "cross-shore";
  return kt != null && kt <= LIGHT_KT ? `light ${side}` : side;
}

// A measured or local wind as the card shows it: Calm at 0 kt, never "N 0°",
// and a METAR's VRB, which has a speed and no direction, "Variable at" --
// capitalised as a compass point is (owner's request, 2026-10-15).
const windVal = (from, kt) => (kt === 0 ? "Calm"
  : `${from == null ? "Variable" : compass(from)} <span class="unit">at</span> ${speed(kt || 0)}`);
// Was a wind reported at all? A variable one has a speed and no direction.
const windHeard = (w) => !!w && (w.from_deg != null || w.speed_kt != null);

// Both chains describe the same three breaks, so they are normalised to one
// shape here and the card renderer stays single-branched. What differs is not
// the shape but what the numbers are standing on, and that is said elsewhere
// — loudly — rather than smuggled into the card.
function cardsForNow() {
  return (NOW.breaks || []).map((b) => ({
    id: b.id, name: b.name,
    // The nearshore figure when the payload has it; an older now.json (the
    // publish script keeps the previous one when a build fails) still shows
    // its window energy rather than nothing.
    hsWindow: b.hs_nearshore_m != null ? b.hs_nearshore_m : b.hs_in_window_m,
    hsOffshore: NOW.buoy && NOW.buoy.hs_m,

    fraction: b.fraction,

    swellWindow: b.swell_window || [],

    trains: b.trains || [],
    takenBy: b.taken_by || [],
    windOffshore: b.wind_offshore, windNote: b.wind_note,
    windKt: NOW.wind ? NOW.wind.speed_kt : null,
    windVariable: !!NOW.wind && NOW.wind.from_deg == null && NOW.wind.speed_kt > 0,
    origin: originFor(b.id),
    // Every break's numbers are 46232's spectrum, so they grey on its age.

// A logged headline's depth, in the nearshore block's shape so `depthLabel`
// words it exactly as it words the full card's.
function pastNearshore(e) {
  if (!e) return {};
  if (e.hs_basis === "breaking") return {breaking: {depth_m: e.depth_m}, depth_m: e.depth_m};
  if (e.hs_basis === "5m") return {depth_m: e.depth_m};
  return {};
}

function cardsForForecast(step) {
  const measured = measuredAt(step.valid_utc);
  return ORDER.map((id) => DATA.breaks.find((b) => b.id === id)).filter(Boolean)
    .map((b) => {
      // An earlier run's hour is drawn from the hour its own build showed,
      // kept in full (forecast.forecastlog, `46232_shown/`), through exactly
      // the card a current hour gets: drawing, trains, calculation table.
      const detail = step.from === "past" && step.entry.detail;
      const kept = detail && (detail.breaks || {})[b.id];
      if (step.from === "past" && !kept) {
        const e = ((step.entry || {}).breaks || {})[b.id] || {};
        return {
          id: b.id, name: b.name, past: true, measured,
          hsWindow: e.hs_m, nearshore: pastNearshore(e),
          period: e.period_s, direction: e.from_deg,
          swellWindow: b.swell_window || [], trains: [], takenBy: [],
          windOffshore: null, windNote: b.wind_note,
          chart: true,

      return {
        id: b.id, name: b.name, measured,
        hsWindow: h.hs_nearshore_m != null ? h.hs_nearshore_m : h.hs_window_m,
        hsOffshore: h.hs_offshore_m,
        nearshore: h.nearshore || {},
        fraction: h.fraction,
        period: h.dominant_period_s, direction: h.dominant_from_deg,
        swellWindow: b.swell_window || [],
        normal: b.shore_normal_deg, normalGuess: b.normal_is_a_guess,

        takenBy: h.taken_by || [],

// Trains, largest first, the leader emphasised. Height leads the line because
// it is what a reader compares between trains; period and heading say which
// wave it is.
// `drawn(i)` says whether the break's drawing has an arrow for train i; a
// row that has one picks it there, as a tap on the arrow does (owner's
// request, 2026-10-05). Local chop and swell aimed behind the beach have no
// arrow, so their rows pick nothing.
//
// One line per train, always (owner's calls, 2026-10-06 and -07). The row

// `fitTrains` steps down to the first that fits the row once it is laid out.
function trainList(trains, {limit = 4, drawn = () => false, rose = null, aged = ""} = {}) {
  if (!trains || !trains.length) return "";
  return `<div class="trains"${aged}>` + trains.slice(0, limit).map((t, i) => {
    const tag = t.local ? "chop" : t.wind_sea ? "ws" : "";
    const forms = trainForms(t, !!tag);
    // On the Buoys tab a row lights its period range on the rose below.
    const onRose = rose && roseTrainOK(rose, i);
    return `
    <div class="train${i === 0 ? " lead" : ""}"${drawn(i)
      ? ` data-train="${i}" tabindex="0" role="button" aria-pressed="false" aria-label="Show this train on the drawing"`
      : onRose ? ` data-rose-train="${i}" data-rose-for="${rose}" tabindex="0" role="button"`
        + ` aria-pressed="${ROSE_TRAIN[rose] === i}" aria-label="Show this period range on the rose"` : ""}>
      <span class="ht">${height(t.hs_m)}</span>
      <span class="tp">${t.period_s.toFixed(1)} s</span>
      <span class="dr">${forms.map((f, k) => `<span${k ? " hidden" : ""}>${f}</span>`).join("")}</span>
      ${tag === "chop" ? '<span class="tag">local chop</span>'
        : tag === "ws" ? '<span class="tag">wind sea</span>' : ""}
    </div>`;
  }).join("") + `</div>`;
}

// Show each row's longest heading that fits beside its height, period and
// tag. Measured, not thresholded: a cell whose text runs past its width
// (`scrollWidth > clientWidth`, the cell shrinking with an ellipsis) steps
// to the next form; when the last form still does not fit, the row goes

// left for the ResizeObserver to fit when its tab opens.

  if (!forms.length) return;

    forms.forEach((f, j) => { f.hidden = j !== k; });

const TRAIN_WIDTH = new WeakMap();

    TRAIN_WIDTH.set(target, width);
    target.querySelectorAll(".train").forEach(fitRow);
  }));

      list.querySelectorAll(".train").forEach(fitRow);
    }

// not, a pill that wraps to start a row stands as a pill of its own
// (`.wrapped`), never a cut edge hugging nothing. A line in a hidden pane
// has no width and is fitted when its pane's lines resize.

  if (!pair.clientWidth) return;
  const tails = [...pair.querySelectorAll(".pill-tail")];
  tails.forEach((tail) => tail.classList.remove("wrapped"));
  // Read every row before writing any: a wrapped pill takes the joined one's
  // footprint, so marking one never moves the next.
  const starts = tails.map((tail) => tail.offsetTop > tail.previousElementSibling.offsetTop + 1);
  tails.forEach((tail, i) => tail.classList.toggle("wrapped", starts[i]));

    if (pillResize) pillResize.observe(lines);
    if (lines.clientWidth) lines.querySelectorAll(".pills").forEach(fitPill);

    .observe(document.getElementById("conditions"), {childList: true, subtree: true});

    .observe(document.getElementById("conditions"), {childList: true, subtree: true});

// Breaks, most window energy first. That ordering IS the claim the page makes
// -- which break holds more of the swell -- so the tab row states it before a
// number is read. A break with no number is not ranked above one with a
// number, and ties fall back to north-to-south rather than to file order.
function rankByEnergy(cards) {
  const energy = (c) => (c.hsWindow != null && isFinite(c.hsWindow) ? c.hsWindow : -Infinity);
  const place = (c) => { const i = ORDER.indexOf(c.id); return i < 0 ? ORDER.length : i; };
  return cards.slice().sort((a, b) => (energy(b) - energy(a)) || (place(a) - place(b)));
}

// One break's tab. What used to be its own card, less the title, which is on
// the tab now.
// What 46232 measured at a step's hour, or why there is nothing to show.
// Nothing at all for an hour still ahead: the line is only ever a comparison
// with something that has already happened.
function measuredAt(validUtc) {
  const at = (state, more = {}) => ({state, valid_utc: validUtc, ...more});
  if (!validUtc || new Date(validUtc).getTime() > Date.now()) return at("future");
  const hit = ((MEASURED && MEASURED.steps) || []).find((m) => m.valid_utc === validUtc);
  if (hit) {
    return hit.gap ? at("gap") : hit.pending ? at("pending") : at("value", {entry: hit});
  }
  const built = MEASURED && MEASURED.generated_utc;
  return at(built && validUtc > built ? "pending" : "none");
}

// The measured line. Its label is on every line, never once per page, because
// it sits inside a forecast card and must not be read as part of the forecast.
// It names the hour it was observed ("Observed at 8:00 AM", owner's wording
// 2026-09-27); where it came from -- 46232, carried in by the same chain --
// is said on docs.html.
// Both numbers go through the same windows, seabed and surf zone, so the
// difference between them is the model's error AT THE BUOY carried in -- not
// a check at the beach, which nothing measures. Hence no difference or
// percentage between them on screen: a number like that is a claim about
// the forecast, and would need its verification series named beside it.
function measuredLine(m, pick) {
  if (!m || m.state === "future") return "";
  const station = (MEASURED && MEASURED.station) || (DATA && DATA.station) || "the buoy";
  const label = `Observed at ${clock(m.valid_utc)}`;
  if (m.state === "value") {
    const v = pick(m.entry);
    if (!v || v.hs_m == null) return "";
    const basis = v.hs_basis === "buoy" ? "combined" : depthLabel({nearshore: pastNearshore(v)});
    return `<div class="measured"><span class="lbl">${label}</span>
      <span class="mval">${height(v.hs_m)} <span class="unit">${basis}</span></span>
      ${v.period_s ? `<span class="mpeak">peak ${v.period_s.toFixed(1)} s from ${compass(v.from_deg)}</span>` : ""}
    </div>`;
  }
  const why = m.state === "gap" ? `No ${buoyFeed(station)} spectrum for this hour &mdash; left as a gap, not filled`
    : m.state === "pending" ? `${label}: not in yet`
    : `${label}: no reading loaded for this hour`;
  return `<div class="measured none">${why}</div>`;
