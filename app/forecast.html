    const row = rows[new Date(s.valid_utc).getHours()];
    row[kind] += 1; row.n += 1;
    total[kind] += 1; total.n += 1;
  });
  return {id: card.id, name: SHORT[card.id] || card.name, rows, total};
}

// "6 AM" on the reader's clock, as every other time on the page is.
const hourName = (h) => new Date(2026, 0, 1, h).toLocaleTimeString(undefined, {hour: "numeric"});

function shoreRead(p, at) {
  const r = at == null ? p.total : p.rows[at];
  const when = at == null ? "all hours" : `${hourName(at)}, over ${r.n} day${r.n === 1 ? "" : "s"}`;
  if (!r.n) return `<b>${p.name}, ${at == null ? "all hours" : hourName(at)}</b> &middot; nothing to count`;
  const pc = (k) => `${Math.round(100 * r[k] / r.n)}%`;
  return `<b>${p.name}, ${when}</b> &middot; <span class="v">offshore ${pc("off")}</span>`
    + ` &middot; cross-shore ${pc("cross")} &middot; onshore ${pc("on")}`
    + (r.still ? ` &middot; light or variable ${pc("still")}` : "");
}

function shorePlot(p, at) {
  const {w, h, l, r, t, b} = SHORE;
  const plotW = w - l - r, bottom = h - b;
  const slot = plotW / 24;
  const Y = (share) => bottom - (bottom - t) * share;
  const f = (v) => v.toFixed(1);
  let out = "", labels = "";
  // Gridlines under the bars, their labels over them (haloed like every
  // other chart's), so a full bar never hides its own scale.
  [0, 0.5, 1].forEach((v) => {
    out += `<line class="grid" x1="${l}" x2="${w - r}" y1="${f(Y(v))}" y2="${f(Y(v))}"/>`;
    labels += `<text class="tick ytick" x="${l + 2}" y="${f(Y(v) - 3)}">${v ? `${v * 100}%` : "0"}</text>`;
  });
  p.rows.forEach((row, k) => {
    const x = l + k * slot + 1, bw = Math.max(1, slot - 2);
    if (k % 6 === 0) {
      out += `<line class="day" x1="${f(l + k * slot)}" x2="${f(l + k * slot)}" y1="${t}" y2="${bottom}"/>`
        + `<text class="tick" x="${f(l + k * slot + 3)}" y="${h - 6}">${hourName(k)}</text>`;
    }
    if (!row.n) return;
    let base = 0;
    SHORE_KINDS.forEach((kind) => {
      const share = row[kind.id] / row.n;
      if (!share) return;
      // A 2 px surface gap between stacked segments, as between bars.
      const y0 = Y(base + share), y1 = Y(base);
      out += `<rect class="${kind.cls}" x="${f(x)}" y="${f(y0 + 1)}" width="${f(bw)}" height="${f(Math.max(0.5, y1 - y0 - 1))}" rx="1"/>`;
      base += share;
    });
    if (k === at) {
      out += `<rect class="sh-on-hour" x="${f(x - 1)}" y="${t - 2}" width="${f(bw + 2)}" height="${f(bottom - t + 3)}" rx="2"/>`;
    }
  });
  return `<svg class="series shore" viewBox="0 0 ${w} ${h}" role="img"`
    + ` aria-label="${svgText(`How often the wind at ${p.name} has been offshore, cross-shore or onshore, by hour of day.`)}">`
    + out + labels + `</svg>`;
}

function shoreBody(steps) {
  const menu = wtMenu("wind", "shore");
  const p = steps && steps.length ? shoreProfile(steps) : null;
  const body = !SWELL_TAB || SWELL_TAB === BUOY_TAB
    ? `<span class="src">Open a break's tab: the buoy has no shore, so no offshore or onshore.</span>`
    : !p ? `<span class="src">${period(CHAIN === "fc" ? "No local forecast hours to count" : "The wind's hours are not loaded")}</span>`
    : `<div class="readout" aria-live="polite"><div>${shoreRead(p, null)}</div></div>
       <div class="plot profile" data-kind="shore">${shorePlot(p, null)}</div>
       <div class="legend">${SHORE_KINDS.map((k) => `<span><i class="sw ${k.cls}"></i>${k.label}</span>`).join("")}</div>`;
  return `<div class="chart-body" data-chart="wind">${menu}${body}</div>`;
}

// The hour under a pointer, read out and outlined; none puts the totals back.
function shoreHover(plot, clientX) {
  const p = shoreProfile(chartSteps("wind"));
  if (!p) return;
  let at = null;
  if (clientX != null) {
    const x = plotX(plot, clientX);
    at = Math.max(0, Math.min(23, Math.floor((x - SHORE.l) / ((SHORE.w - SHORE.l - SHORE.r) / 24))));
  }
  const body = plot.closest("[data-chart]");
  body.querySelector(".readout").innerHTML = `<div>${shoreRead(p, at)}</div>`;
  plot.innerHTML = shorePlot(p, at);
}

// A grid or bar view's readout and outline follow the pointer; off the plot
// they go back to the summary.
function staticHover(plot, clientX, clientY) {
  const kind = plot.getAttribute("data-kind");
  if (kind === "shore") { shoreHover(plot, clientX); return; }
  const view = kind === "week" ? weekData() : rangeData();
  if (!view) return;
  const at = clientX == null ? null : (kind === "week" ? weekAt : rangeAt)(plot, view, clientX, clientY);
  plot.closest("[data-chart]").querySelector(".readout").innerHTML =
    `<div>${(kind === "week" ? weekRead : rangeRead)(view, at)}</div>`;
  plot.innerHTML = (kind === "week" ? weekPlot : rangePlot)(view, at);
}
// One hour's kind on the Shore direction charts: the card's own verdict, so
// the two never disagree; calm, light and variable share the last.
const shoreKind = (w, normal) => {
  if (!w || w.kt == null) return null;
  if (w.from == null) return "still";
  const s = sense(-Math.cos((w.from - normal) * Math.PI / 180), w.kt);
  return s === "calm" || s.startsWith("light ") ? "still"
    : {offshore: "off", "cross-shore": "cross", onshore: "on"}[s];
};
const dayKey = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; };
// "Sat 3": the weekday first, whatever order the locale would put them in.
const dayName = (ms) => `${new Date(ms).toLocaleDateString(undefined, {weekday: "short"})} ${new Date(ms).getDate()}`;

// SHORE DIRECTION ON THE FORECAST TAB (owner's request, 2026-10-02): the
// local forecast's verdict at the open break hour by hour through the run,
// one row a day and one column an hour of the reader's clock, so "offshore
// Tuesday 5-9 AM" reads straight off it. The card's own verdict on the NWS
// hours the Local reading uses; an hour the forecast does not cover is an
// empty cell, never the hour beside it.
const WEEK = {w: 320, l: 40, r: 6, t: 4, row: 15, b: 18};
function weekData() {
  if (CHAIN !== "fc" || !SWELL_TAB || SWELL_TAB === BUOY_TAB) return null;
  const card = ((DATA && DATA.breaks) || []).find((b) => b.id === SWELL_TAB);
  if (!card || card.shore_normal_deg == null) return null;
  const rows = [], byDay = new Map();
  chartSteps("wind").forEach((s) => {
    const kind = shoreKind(s.fc, card.shore_normal_deg);
    if (!kind) return;
    const ms = Date.parse(s.valid_utc), key = dayKey(ms);
    if (!byDay.has(key)) { byDay.set(key, {ms, cells: Array(24).fill(null)}); rows.push(byDay.get(key)); }
    byDay.get(key).cells[new Date(ms).getHours()] = {kind, w: s.fc, valid_utc: s.valid_utc};
  });
  return rows.length ? {name: SHORT[card.id] || card.name, rows} : null;
}
function weekAt(plot, v, clientX, clientY) {
  const box = plot.getBoundingClientRect();
  const x = plotX(plot, clientX), y = (clientY - box.top) / box.width * WEEK.w;
  const col = Math.floor((x - WEEK.l) / ((WEEK.w - WEEK.l - WEEK.r) / 24));
  const row = Math.floor((y - WEEK.t) / WEEK.row);
  return row >= 0 && row < v.rows.length && col >= 0 && col < 24 ? {row, col} : null;
}
function weekRead(v, at) {
  if (!at) {
    const n = {off: 0, cross: 0, on: 0, still: 0};
    v.rows.forEach((r) => r.cells.forEach((c) => { if (c) n[c.kind] += 1; }));
    return `<b>${v.name}, through the run</b> &middot; <span class="v">offshore ${n.off} h</span>`
      + ` &middot; cross-shore ${n.cross} h &middot; onshore ${n.on} h`
      + (n.still ? ` &middot; light or variable ${n.still} h` : "");
  }
  const c = v.rows[at.row].cells[at.col];
  const when = `${dayName(v.rows[at.row].ms)}, ${hourName(at.col)}`;
  if (!c) return `<b>${v.name}, ${when}</b> &middot; no local forecast for this hour`;
  const label = SHORE_KINDS.find((k) => k.id === c.kind).label.toLowerCase();
  return `<b>${v.name}, ${when}</b> &middot; <span class="v">${label}</span> &middot; ${windWords(c.w)}`;
}
function weekPlot(v, at) {
  const {w, l, r, t, row, b} = WEEK;
  const h = t + v.rows.length * row + b, cw = (w - l - r) / 24;
  const f = (x) => x.toFixed(1);
  let out = "";
  [0, 6, 12, 18].forEach((k) => {
    out += `<line class="day" x1="${f(l + k * cw)}" x2="${f(l + k * cw)}" y1="${t}" y2="${t + v.rows.length * row}"/>`
      + `<text class="tick" x="${f(l + k * cw + 2)}" y="${h - 5}">${hourName(k)}</text>`;
  });
  v.rows.forEach((d, i) => {
    const y = t + i * row;
    out += `<text class="tick" x="0" y="${f(y + row - 4)}">${dayName(d.ms)}</text>`;
    d.cells.forEach((c, k) => {
      if (!c) return;
      const cls = SHORE_KINDS.find((x) => x.id === c.kind).cls;
      out += `<rect class="${cls}" x="${f(l + k * cw + 0.5)}" y="${f(y + 1)}" width="${f(cw - 1)}" height="${row - 2}" rx="1"/>`;
    });
    if (at && at.row === i) {
      out += `<rect class="sh-on-hour" x="${f(l + at.col * cw - 0.5)}" y="${f(y)}" width="${f(cw + 1)}" height="${row}" rx="2"/>`;
    }
  });
  return `<svg class="series week" viewBox="0 0 ${w} ${h}" role="img"`
    + ` aria-label="${svgText(`The local forecast's wind at ${v.name}, offshore, cross-shore or onshore, hour by hour through the run.`)}">`
    + out + `</svg>`;
}
function weekBody() {
  const v = weekData();
  const body = !SWELL_TAB || SWELL_TAB === BUOY_TAB
    ? `<span class="src">Open a break's tab: the buoy has no shore, so no offshore or onshore.</span>`
    : !v ? `<span class="src">No local forecast hours came with this run.</span>`
    : `<div class="readout" aria-live="polite"><div>${weekRead(v, null)}</div></div>
       <div class="plot profile" data-kind="week">${weekPlot(v, null)}</div>
       <div class="legend">${SHORE_KINDS.map((k) => `<span><i class="sw ${k.cls}"></i>${k.label}</span>`).join("")}</div>`;
  return `<div class="chart-body" data-chart="wind">${wtMenu("wind", "week")}${body}</div>`;
}

// DAILY RANGE (owner's request, 2026-10-02): each day of the run as one bar,
// its biggest swing -- the largest rise or fall between two consecutive
// turns that starts that day -- from the harmonic turns the card's own
// "rising to ..." line uses (CO-OPS's hilo, carried to the open coast with
// the measured departure), never found in the hourly curve. Consecutive
// turns, not the calendar day's highest high and lowest low: this coast's
// lower low drifts ~50 min a day and crosses midnight every few days, and a
// calendar day that lost it read as a neap that was not there. Long bars
// are spring tides, short ones neaps. A day with no swing starting in it
// inside the run is left out, not guessed.
const RANGE = {w: 320, h: 150, l: 30, r: 6, t: 10, b: 20};
function rangeData() {
  if (CHAIN !== "fc" || !DATA) return null;
  const turns = (DATA.tide_turns || []).slice()
    .sort((a, b) => (a.valid_utc < b.valid_utc ? -1 : 1));
  const days = [], byDay = new Map();
  for (let i = 0; i + 1 < turns.length; i++) {
    const a = turns[i], b = turns[i + 1];
    if (a.event === b.event) continue;
    const hi = a.event === "high" ? a : b, lo = a.event === "high" ? b : a;
    const ms = Date.parse(a.valid_utc), key = dayKey(ms);
    const span = hi.height_m - lo.height_m;
    if (!byDay.has(key)) { byDay.set(key, {ms, hi, lo, falling: a === hi}); days.push(byDay.get(key)); }
    const d = byDay.get(key);
    if (span > d.hi.height_m - d.lo.height_m) Object.assign(d, {hi, lo, falling: a === hi});
  }
  return days.length ? {days} : null;
}
function rangeAt(plot, v, clientX) {
  const x = plotX(plot, clientX);
  const k = Math.floor((x - RANGE.l) / ((RANGE.w - RANGE.l - RANGE.r) / v.days.length));
  return k >= 0 && k < v.days.length ? k : null;
}
// The day the forecast's picked hour falls in, so the bars open on it.
function rangeDefault(v) {
  const hour = STEPS[CURSOR];
  const key = hour ? dayKey(Date.parse(hour.valid_utc)) : null;
  const k = v.days.findIndex((d) => dayKey(d.ms) === key);
  return k >= 0 ? k : null;
}
function rangeRead(v, at) {
  const k = at == null ? rangeDefault(v) : at;
  if (k == null) return "<b>Each day's tide</b>";
  const d = v.days[k];
  const t = (iso) => clock(iso);
  const span = d.hi.height_m - d.lo.height_m;
  const [first, second] = d.falling ? [["high", d.hi], ["low", d.lo]] : [["low", d.lo], ["high", d.hi]];
  return `<b>${dayName(d.ms)}</b> &middot; <span class="v">range ${height(span)}</span>`
    + ` &middot; ${first[0]} ${height(first[1].height_m)} at ${t(first[1].valid_utc)}`
    + ` to ${second[0]} ${height(second[1].height_m)} at ${t(second[1].valid_utc)}`;
}
function rangePlot(v, at) {
  const {w, h, l, r, t, b} = RANGE;
  const k0 = at == null ? rangeDefault(v) : at;
  const lo = Math.min(...v.days.map((d) => d.lo.height_m)), hi = Math.max(...v.days.map((d) => d.hi.height_m));
  const {domain, ticks} = tideAxis(lo, hi);
  const bottom = h - b, Y = (m) => t + (bottom - t) * (domain[1] - m) / (domain[1] - domain[0]);
  const slot = (w - l - r) / v.days.length, bw = Math.min(18, slot - 4);
  const f = (x) => x.toFixed(1);
  let grid = "", labels = "", bars = "";
  ticks.forEach((tk) => {
    grid += `<line class="grid" x1="${l}" x2="${w - r}" y1="${f(Y(tk.at))}" y2="${f(Y(tk.at))}"/>`;
    // Left of the bars, in their own margin, so no bar sits on its scale.
    labels += `<text class="tick ytick" x="0" y="${f(Y(tk.at) + 3)}">${tk.text}</text>`;
  });
  v.days.forEach((d, k) => {
    const cx = l + (k + 0.5) * slot, y0 = Y(d.hi.height_m), y1 = Y(d.lo.height_m);
    bars += `<rect class="rangebar${k === k0 ? " on" : ""}" x="${f(cx - bw / 2)}" y="${f(y0)}" width="${f(bw)}" height="${f(Math.max(1, y1 - y0))}" rx="${f(Math.min(4, bw / 2))}"/>`;
    labels += `<text class="tick" x="${f(cx)}" y="${h - 6}" text-anchor="middle">${new Date(d.ms).toLocaleDateString(undefined, {weekday: "narrow"})}</text>`;
  });
  return `<svg class="series range" viewBox="0 0 ${w} ${h}" role="img"`
    + ` aria-label="${svgText("Each day's lowest predicted low and highest predicted high at the open coast, through the run.")}">`
    + grid + bars + labels + `</svg>`;
}
function rangeBody() {
  const v = rangeData();
  const body = !v ? `<span class="src">No predicted turns came with this run.</span>`
    : `<div class="readout" aria-live="polite"><div>${rangeRead(v, null)}</div></div>
       <div class="plot profile" data-kind="range">${rangePlot(v, null)}</div>`;
  return `<div class="chart-body" data-chart="tide">${wtMenu("tide", "range")}${body}</div>`;
}

// The fold under the Wind and Tide cards: its own caret and its own open
// state, kept across a refresh like the swell's.
const CARD_CHART_OPEN = {wind: false, tide: false};
function setCardChartOpen(id, open) {
  CARD_CHART_OPEN[id] = open;
  remember(id === "wind" ? KEEP.windChart : KEEP.tideChart, open ? "open" : "closed");
  document.querySelectorAll(`[data-card-chart-toggle="${id}"]`).forEach((btn) => {
    btn.setAttribute("aria-expanded", String(open));
    const fold = $(btn.getAttribute("aria-controls"));
    if (fold) fold.hidden = !open;
  });
}
function cardChart(id) {
  const open = !!CARD_CHART_OPEN[id];
  return `<div class="chart">
    <div class="chart-head"><span>Charts</span><button type="button" class="calc-toggle"
      data-card-chart-toggle="${id}" aria-controls="chart-fold-${id}" aria-expanded="${open}"
      aria-label="Charts"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 10 8 5.5 12.5 10"/></svg></button></div>
    <div class="chart-fold" id="chart-fold-${id}"${open ? "" : " hidden"}>${chartBody(id)}</div>
  </div>`;
}

// The swell card, for either chain. Same shape, different provenance: an
// observed spectrum on one tab and a modelled one on the other.
//
// One tab per break, ranked by window energy, and the buoy ALWAYS last: it is
// the input the three are derived from, not a fourth break to rank against
// them. Its title comes from the file, never typed.
//
// The provenance sits under the tabs rather than inside the buoy's,
// because every tab is that one spectrum, through an aperture or not -- and a
// stale reading has to be marked whichever tab is open. Tucked into the
// buoy's tab, an overdue spectrum would sit behind three tabs of window
// energy derived from it with no mark on any of them.
function swellCard({label, buoy, station, stationName = null, others = [], cards, source,
                    due = "", measured = null, chart = false, origin = null, buoyRose = "", buoyAged = ""}) {
  const tabs = rankByEnergy(cards || []).map((c) => ({
    id: c.id, title: SHORT[c.id] || c.name, body: breakPanel(c), chart: !!c.chart,
    origin: c.origin || null,
  }));
  // "Buoys" on both chains (owner's request, 2026-10-06), though only the
  // LIVE tab carries a second one: GFS-Wave's run is at 46232 alone. The id
  // stays "buoy", so a reader's remembered tab and chart still find it.
  // The context buoys render AFTER the provenance lines below, so 46232's
  // provenance stays under 46232's reading and each context buoy's under its
  // own; shown and hidden with the tab like its pane.
  tabs.push({id: BUOY_TAB, title: "Buoys",
             body: buoyPanel(buoy, measured, {id: station, name: stationName}, buoyRose, buoyAged),
             after: others.map(contextBuoy).join(""), chart, origin});
  const chosen = tabs.some((tab) => tab.id === SWELL_TAB) ? SWELL_TAB : tabs[0].id;
  // The Wind card, built after this one, shows the line for the open tab.
  SWELL_TAB = chosen;

  return `<div class="cond swell" data-card="swell">
    <span class="lbl">${label}</span>
    <div class="subtabs" role="tablist" aria-label="${label} at each break, then at the buoys">
      ${tabs.map((tab) => `<button type="button" role="tab" id="swell-tab-${tab.id}"
        data-swell-tab="${tab.id}" aria-controls="swell-pane-${tab.id}"
        aria-selected="${tab.id === chosen}" tabindex="${tab.id === chosen ? 0 : -1}"
        >${tab.title}</button>`).join("")}
    </div>
    ${tabs.map((tab) => `<div class="pane" role="tabpanel" id="swell-pane-${tab.id}"
      aria-labelledby="swell-tab-${tab.id}"${tab.id === chosen ? "" : " hidden"}>${tab.body}</div>`).join("")}
    ${srcLines(source, due)}
    ${tabs.filter((tab) => tab.after).map((tab) => `<div class="pane after" data-after-tab="${tab.id}"`
      + `${tab.id === chosen ? "" : " hidden"}>${tab.after}</div>`).join("")}
    ${tabs.map((tab) => originFold(tab.id, tab.origin, tab.id !== chosen)).join("")}
    ${tabs.filter((tab) => tab.chart).map((tab) => seriesChart(tab.id, tab.id !== chosen)).join("")}
  </div>`;
}

// What the measured wind means at each break, on the Wind card, one line per
// break and only the one whose swell tab is open. The measurement is hoisted;
// the interpretation is not, because it is made against each break's own
// shore normal and those span 27° -- the same wind reads cross-shore at north
// and onshore at south. So the line names its break ("at this break") and
// changes with the tab; on the buoy's tab there is no shore and no line.
//
// Now tab only (owner's decision, 2026-09-26). The forecast's wind is
// GFS-Wave's at the buoy, 29 km offshore, which is not the wind KNZY measures
// at the beach, and a verdict against the shore normal needs the local one.
function windAtBreaks(cards, aged = "") {
  return (cards || []).map((c) => {
    // A calm or a variable wind has no side at any break. The line says why
    // rather than leaving the line out, or repeating the headline's Calm or
    // Variable under it (owner's wording, 2026-10-15).
    const why = c.windKt === 0 ? "no wind" : c.windVariable ? "no direction" : null;
    const s = why ? null : sense(c.windOffshore, c.windKt);
    if (!why && !s) return "";
    return `<span class="turn" data-wind-for="${c.id}"${c.id === SWELL_TAB ? "" : " hidden"}${aged}>`
      + (why ? `<b>${why}</b>, so no side set`
        : `<b>${s}</b> at this break`
          + (c.windNote ? ` <span class="tag">${c.windNote}</span>` : ""))
      + `</span>`;
  }).join("");
}

// Switching tabs flips attributes rather than re-rendering, so focus stays on
// the tab the reader is on and the countdowns keep their place.
function selectSwellTab(id, {focus = false} = {}) {
  if (id === BUOY_TAB && SWELL_TAB !== BUOY_TAB) {
    roseShown();
    // Selecting the Buoys tab opens the anchor buoy's headline, 46232's, the
    // one every break's numbers are read from (owner's request, 2026-10-13);
    // the context buoys below it stay as the reader left them.
    const anchor = CHAIN === "fc" ? DATA && DATA.station : NOW && NOW.station;
    if (anchor && !BUOY_OPEN[anchor]) setBuoyOpen(anchor, true);
  }
  SWELL_TAB = id;
  remember(KEEP.swell, id);
  const shore = $("chart-fold-wind");
  if (shore && ["shore", "week"].includes(chartModeFor("wind"))) shore.innerHTML = chartBody("wind");
  document.querySelectorAll("[data-wind-for]").forEach((line) => {
    line.hidden = line.getAttribute("data-wind-for") !== id;
  });
  document.querySelectorAll("[data-sun-for]").forEach((line) => {
    line.hidden = line.getAttribute("data-sun-for") !== id;
  });
  document.querySelectorAll("[data-chart-tab]").forEach((chart) => {
    chart.hidden = chart.getAttribute("data-chart-tab") !== id;
  });
  document.querySelectorAll("[data-origin-tab]").forEach((fold) => {
    fold.hidden = fold.getAttribute("data-origin-tab") !== id;
  });
  document.querySelectorAll("[data-after-tab]").forEach((block) => {
    block.hidden = block.getAttribute("data-after-tab") !== id;
  });
  document.querySelectorAll("[data-swell-tab]").forEach((btn) => {
    const on = btn.getAttribute("data-swell-tab") === id;
    btn.setAttribute("aria-selected", String(on));
    btn.tabIndex = on ? 0 : -1;
    const pane = $(btn.getAttribute("aria-controls"));
    if (pane) pane.hidden = !on;
    if (on && focus) btn.focus();
  });
}

// Delegated once, on the strip, because the card is rebuilt on every render.
// Arrow keys move along the row the way a tablist is expected to.
function wireSwellTabs() {
  const strip = $("conditions");
  strip.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-swell-tab]");
    if (btn) selectSwellTab(btn.getAttribute("data-swell-tab"));
    // The caret, or anywhere else on the headline's line.
    if (e.target.closest("[data-calc-toggle]") || e.target.closest(".val-row")) setCalcOpen(!CALC_OPEN);
    // A buoy's, likewise.
    const buoyHead = e.target.closest("[data-buoy-head]");
    if (buoyHead) {
      const id = buoyHead.getAttribute("data-buoy-head");
      setBuoyOpen(id, !BUOY_OPEN[id]);
    }
    // Origin's caret, or anywhere else on its line.
    if (e.target.closest("[data-origin-head]")) setOriginOpen(!ORIGIN_OPEN);
    // The tide phase's caret, or anywhere else on its line.
    if (e.target.closest("[data-phase-head]")) setPhaseOpen(!PHASE_OPEN);
  });
  strip.addEventListener("keydown", (e) => {
    const btn = e.target.closest("[data-swell-tab]");
    if (!btn) return;
    const all = [...strip.querySelectorAll("[data-swell-tab]")];
    const at = all.indexOf(btn);
    const to = e.key === "ArrowRight" ? (at + 1) % all.length
      : e.key === "ArrowLeft" ? (at - 1 + all.length) % all.length
      : e.key === "Home" ? 0
      : e.key === "End" ? all.length - 1
      : null;
    if (to == null) return;
    e.preventDefault();
    selectSwellTab(all[to].getAttribute("data-swell-tab"), {focus: true});
  });
}

// The Wind card's first reading on the Forecast tab: the forecast wind on the
// sand (the NWS forecast grid at Coronado, `collector.localwind`), above the
// model's wind under "At the buoy" (owner's request, 2026-10-20, swapping
// them). This one says whether it is offshore at a break, per break, as the
// Now tab's measured KNZY wind does; the buoy's says how much wind sea the
// model is making offshore. A past hour whose build kept no local wind says
// so, and borrows no reason from today's build.
// Under a passed hour, KNZY's observed wind follows this reading (owner's
// call, 2026-10-09): both are the wind on the sand, where GFS-Wave's below is
// the model's at the buoy. Nothing stands in for an hour without one: KNZY is
// an observation, not a forecast (owner's call, 2026-10-15).
//
// `updated` is when the NWS grid the hour's own build read was last updated:
// this build's for an upcoming hour, the logged build's for a past one
// (owner's request, 2026-10-15), and no pill when that build kept none.
function localWindBlock(hour, cards, past, seen = "", updated = null) {
  const L = (DATA && DATA.local_wind) || {};
  if (hour && hour.local_wind_from_deg != null) {
    const gust = hour.local_gust_kt ? ` <span class="unit">gusting ${gustSpeed(hour.local_gust_kt)}</span>` : "";
    // In pills, as the model's (owner's request, 2026-10-15): the service,
    // its grid cell at Coronado, and when the grid was last updated.
    const grid = L.office ? `Grid ${L.office} ${L.grid_x},${L.grid_y}` : "Grid";
    const issued = updated ? `Updated ${pillWhen(updated)}` : "";
    return `<span class="val">${windVal(hour.local_wind_from_deg, hour.local_wind_kt)}${gust}</span>
      ${windAtBreaks(cards)}
      ${seen}
      ${srcLines([], pills("NWS", grid, issued))}`;
  }
  const why = past ? "" : L.available === false && L.why ? L.why : "no local forecast for this hour";
  return `<span class="val"><span class="unit">no local forecast</span></span>
    ${seen}
    ${srcLines(why)}`;
}

function renderConditions(step, cards) {
  const rows = [];
  useChain(MODE === "now" ? "now" : "fc");

  if (MODE === "now") {
    const wind = (NOW && NOW.wind) || {};
    const tide = (NOW && NOW.tide) || {};
    const buoy = (NOW && NOW.buoy) || {};

    // Each card is titled for the quantity alone. Which chain it belongs to
    // is the tab, and when it was taken is the first provenance line
    // beneath it, so repeating either in the title tells the reader nothing
    // they cannot already see. The card carries what the buoy saw AND where
    // it was seen, which is why the separate provenance line below the cards
    // is gone: the measurement and its source belong together.
    // The swell card is the one that can be forced overdue by the build: the
    // countdown only knows the hour it expected, and `stale` knows the reasons
    // it cannot see.
    const due = (NOW && NOW.next_expected) || {};
    const late = (NOW && NOW.overdue_after) || {};
    rows.push(swellCard({
      label: "Swell",
      buoy,
      station: NOW && NOW.station,
      stationName: NOW && NOW.station_name,
      others: (BUOYS && BUOYS.buoys) || [],
      buoyRose: roseBlock(NOW && NOW.station),
      buoyAged: NOW ? agedAttr(NOW.observed_utc, nowIsStale()) : "",
      cards,
      // In pills (owner's request, 2026-10-11): where and what, then when.
      source: [
        NOW && placeWhen(buoyPlace(NOW.station_name, NOW.station), NOW.observed_utc),
      ],
      // The feed's pill starts the countdown line, under every swell tab:
      // each one's numbers come from this one buoy (owner's call, 2026-10-11).
      due: anchorFeed(NOW, due.swell, late.swell),
      chart: true,
      origin: originFor("buoy"),
    }));

    // Wind and Tide grey on their own readings' ages (`agedAttr`); the
    // tide's predicted turn never does.
    const windAged = windHeard(wind) ? agedAttr(wind.observed_utc) : "";
    rows.push(`<div class="cond" data-card="wind">
      <span class="lbl">Wind</span>
      <span class="val"${windAged}>${windHeard(wind)
        ? windVal(wind.from_deg, wind.speed_kt)
          + (wind.gust_kt ? ` <span class="unit">gusting ${gustSpeed(wind.gust_kt)}</span>` : "")
        : '<span class="unit">not collected</span>'}</span>
      ${windHeard(wind) ? windAtBreaks(cards, windAged) : ""}
      ${windHeard(wind)
        // In pills, as the swell card's (owner's request, 2026-10-11).
        ? srcLines([placeWhen(wind.station_name, wind.observed_utc)],
                   feedPills(`METAR ${wind.station}`, wind.observed_utc, due.wind, late.wind))
        : srcLines(wind.note)}
      ${cardChart("wind")}
    </div>`);
    // The turn is asked for against the READER's clock, not the build's, so
    // it keeps being the next turn as turns pass beneath an open page.
    rows.push(`<div class="cond" data-card="tide">
      <span class="lbl">Tide</span>
      <span class="val"${tide.height_m != null ? agedAttr(tide.observed_utc) : ""}>${tide.height_m != null
        ? height(tide.height_m)
        : '<span class="unit">not collected</span>'}</span>
      ${turnLine((NOW && NOW.tide_turns) || [], new Date().toISOString(), {tagged: true})}
      ${tide.height_m != null
        // In pills, as the swell card's (owner's request, 2026-10-11): the
        // place the numbers are carried to, then the gauge in the feed pill.
        ? srcLines([placeWhen(NOW.tide_place || NOW.tide_site, tide.observed_utc)],
                   feedPills(`NOAA ${NOW.tide_station}`, tide.observed_utc, due.tide, late.tide))
        : srcLines(tide.note)}
      ${SHOW_LIVE_PHASE ? phaseFold(NOW, coastDay(Date.now()), {tagged: true}) : ""}
      ${cardChart("tide")}
    </div>`);
    if (SHOW_LIVE_SUN) rows.push(sunNow());
  } else {
    const past = step.from === "past";
    // An earlier run's hour in full, when its build kept it: the model's wind
    // is on each break's hour, the buoy and the tide beside them.
    const detail = past ? step.entry.detail : null;
    const stamp = past
      ? (detail ? Object.values(detail.breaks || {})[0] || null : null)
      : ((DATA.breaks[0] || {}).hours || [])[step.index];
    const tide = (detail && detail.tide) || TIDE_BY_TIME[step.valid_utc] || {};
    const hour = stamp || {};
    // The provenance is LIVE's line of joined pills (owner's request,
    // 2026-10-15) without its dot or countdown: a run is not a feed on a
    // clock. The buoy the model is read at, the model, then the run.
    const run = runPill(step);
    const anchor = feedName(DATA.station, DATA.station_cdip);
    const modelled = hour.wind_from_deg != null;
    const measured = measuredAt(step.valid_utc);
    const got = measured.state === "value" ? measured.entry : null;

    // Same card as the observed tab, so a reader comparing the two is
    // comparing like with like rather than two different presentations.
    const buoy = past ? ((detail && detail.buoy) || step.entry.buoy)
      : (DATA.buoy || []).find((b) => b.valid_utc === step.valid_utc);
    rows.push(swellCard({
      label: "Swell",
      buoy,
      station: DATA.station,
      cards,
      measured,
      source: buoy ? [] : [`The spectral product was unavailable for this cycle, so there are no trains`],
      due: pills(anchor, "GFS-Wave", run),
      chart: true,
    }));

    // Wind and tide under an earlier run's hour: the log kept neither, so
    // those cards carry only the measurement, in the same blue and saying so.
    const seenWind = got && got.wind_kt != null
      ? `<div class="measured"><span class="lbl">Observed at ${clock(step.valid_utc)}</span>`
        + `<span class="mval">${windVal(got.wind_from_deg, got.wind_kt)}</span></div>` : "";
    const seenTide = got && got.tide_m != null
      ? `<div class="measured"><span class="lbl">Measured at ${clock(step.valid_utc)}</span>`
        + `<span class="mval">${height(got.tide_m)}</span></div>` : "";
    if (past && !detail) {
      rows.push(`<div class="cond" data-card="wind">
        <span class="lbl">Wind</span>
        <span class="val"><span class="unit">not kept for earlier runs</span></span>
        ${seenWind}
        ${cardChart("wind")}
      </div>`);
      rows.push(`<div class="cond" data-card="tide">
        <span class="lbl">Tide</span>
        <span class="val"><span class="unit">not kept for earlier runs</span></span>
        ${seenTide}
        ${cardChart("tide")}
      </div>`);
      rows.push(sunCard(DATA, coastDay(Date.parse(step.valid_utc))));
      $("conditions").innerHTML = rows.join("");
      restorePicks();
      tickDue();
      return;
    }

    // The local forecast first, KNZY's observed wind under it, then the
    // model's wind at the buoy (owner's request, 2026-10-20). Nothing stands
    // in for either forecast wind: KNZY is an observation, and this is the
    // model's chain (owner's call, 2026-10-15).
    const updated = past ? detail.local_wind_updated_utc : (DATA.local_wind || {}).updated_utc;
    const local = localWindBlock(hour, cards, past, seenWind, updated);
    rows.push(`<div class="cond" data-card="wind">
      <span class="lbl">Wind</span>
      ${local}
      <div class="subcond" data-wind="buoy">
        <span class="sublbl">At the buoy</span>
        <span class="val">${modelled
          ? `${compass(hour.wind_from_deg)} <span class="unit">at</span> ${speed(hour.wind_kt || 0)}`
          : `<span class="unit">${past ? "no model wind for this hour" : "not collected yet"}</span>`}</span>
        ${modelled ? srcLines([], pills(anchor, "GFS-Wave", run)) : ""}
      </div>
      ${cardChart("wind")}
    </div>`);
    rows.push(`<div class="cond" data-card="tide">
      <span class="lbl">Tide</span>
      <span class="val">${tide.height_m != null
        ? height(tide.height_m)
        : '<span class="unit">not collected for this hour</span>'}</span>
      ${stamp && stamp.valid_utc
        ? turnLine(DATA.tide_turns || [], step.valid_utc)
        : ""}
      ${seenTide}
      ${srcLines([], pills(`NOAA ${DATA.tide_station}`, "Harmonic", departurePill(tide)))}
      ${past ? "" : phaseFold(DATA, coastDay(Date.parse(step.valid_utc)))}
      ${cardChart("tide")}
    </div>`);
    rows.push(sunCard(DATA, coastDay(Date.parse(step.valid_utc))));
  }

  $("conditions").innerHTML = rows.join("");
  restorePicks();
  // Fill the countdowns now rather than leaving them blank until the first
  // second's tick lands.
  tickDue();
}

function renderBreaks(step) {
  const cards = MODE === "now" ? cardsForNow() : cardsForForecast(step);
  renderConditions(step, cards);
}

function show() {
  // Never rebuild the cards under a finger: a chart gesture redraws its own
  // chart, and the card is rebuilt once when it ends.
  if (GESTURE) return;
  const shut = gated();
  $("gate").hidden = !shut;
  $("panel").hidden = shut;
  document.querySelector("nav.tabs").hidden = shut;
  if (shut) {
    for (const id of ["seek", "briefing", "fc-alerts", "stale", "warnings"]) $(id).hidden = true;
    return;
  }
  const forecasting = MODE === "forecast";
  note();
  $("seek").hidden = !forecasting;
  const brief = forecasting ? "" : briefingFold(BRIEFING);
  $("briefing").hidden = !brief;
  $("briefing").innerHTML = brief;
  fitBriefTide();
  // A redraw keeps the reader's place in the open fold (owner's request,
  // 2026-10-24: every refresh put it back at its top).
  const briefBody = $("brief-body");
  if (briefBody && BRIEF_SCROLL > 0) briefBody.scrollTop = BRIEF_SCROLL;
  // An update drawn into an open fold has been read.
  if (brief && BRIEF_OPEN) briefSeen();
  $("tab-now").setAttribute("aria-selected", String(!forecasting));
  $("tab-forecast").setAttribute("aria-selected", String(forecasting));

  const alertsHere = forecasting ? fcAlerts(STEPS[CURSOR]) : "";
  $("fc-alerts").hidden = !alertsHere;
  $("fc-alerts").innerHTML = alertsHere;

  if (forecasting) {
    const step = STEPS[CURSOR];
    $("when-label").innerHTML = whenLine(step.valid_utc);
    $("when").value = String(CURSOR);
    $("earlier").disabled = CURSOR === 0;
    $("later").disabled = CURSOR === STEPS.length - 1;
    renderBreaks(step);
    // Only reachable by default when every hour in the file has gone by —
    // the forecast chain has stopped — and that must not read as upcoming.
    const last = STEPS[STEPS.length - 1];
    const spent = new Date(last.valid_utc).getTime() < Date.now();
    $("stale").hidden = !spent;
    if (spent) {
      $("stale").innerHTML = `<b>Every hour in this forecast has passed.</b> `
        + `The newest cycle has not arrived; nothing here is upcoming.`;
    }
    return;
  }

  // Now. If there is nothing usable, say why and point at the other chain
  // rather than rendering something that looks current and is not.
  if (!NOW || !NOW.breaks || !NOW.breaks.length) {
    $("conditions").innerHTML = "";
    $("stale").hidden = false;
    $("stale").innerHTML = `<b>No current observation.</b> `
      + ((NOW && NOW.warnings && NOW.warnings.join(" ")) ||
         "now.json could not be loaded.")
      + ` Switch to <b>Forecast</b> for the modelled view.`;
    return;
  }

  renderBreaks(null);

  // No banner over the cards. It spoke for all three at once while naming only
  // the spectrum, so a fresh wind reading sat under a banner calling it not
  // current, and a dead wind station sat under nothing at all. The same judgement now renders
  // on the card whose own source is late, in red, beside the reading it
  // qualifies -- see `dueSpan` and `nowIsStale`, which is where the floor the
  // build set is still applied.
  //
  // The banner element stays for the case below, where there is no reading to
  // put a card under at all.
  $("stale").hidden = true;
}

// NWS's coast and ocean alerts over the hour shown (owner's call,
// 2026-10-24): every version in force at some moment from the hour to the
// next one the picker offers, a line an event -- the version ending last,
// said "from" only when the event had not started by the hour.
function fcAlerts(step) {
  if (!ALERTS || !step) return "";
  const t = Date.parse(step.valid_utc), span = ((DATA && DATA.hour_step_h) || 3) * 3600000;
  const byEvent = new Map();
  for (const a of ALERTS.alerts || []) {
    const start = Date.parse(a.start_utc), stop = a.stop_utc ? Date.parse(a.stop_utc) : Infinity;
    if (!a.event || start >= t + span || stop <= t) continue;
    const have = byEvent.get(a.event);
    byEvent.set(a.event, !have ? {...a, stop}
      : {...(stop >= have.stop ? {...a, stop} : have),
         start_utc: start < Date.parse(have.start_utc) ? a.start_utc : have.start_utc});
  }
  const rows = [...byEvent.values()].sort((x, y) => Date.parse(x.start_utc) - Date.parse(y.start_utc));
  return rows.map((a) => alertRow(a, step.valid_utc)).join("");
}
// A tapped alert shows NWS's headline under it, or hides it; its link goes
// to NWS's page.
function toggleAlert(e) {
  const row = e.target.closest("[data-alert]");
  if (!row || e.target.closest("a")) return;
  const id = row.dataset.alert, open = !ALERT_OPEN.has(id);
  if (open) ALERT_OPEN.add(id); else ALERT_OPEN.delete(id);
  const btn = row.querySelector("[data-alert-toggle]");
  if (btn) btn.setAttribute("aria-expanded", String(open));
  const head = row.nextElementSibling;
  if (head && head.classList.contains("alert-head")) head.hidden = !open;
}

// The banner: forecast.json's notes on the Forecast tab alone -- on LIVE a
// model build's note sat over a chain built from measurements (2026-10-22).
function note() {
  const shown = Boolean(NOTE) && (MODE === "forecast" || NOTE.live);
  $("warnings").hidden = !shown;
  if (shown) $("warnings-text").textContent = NOTE.text;
}

function setMode(mode) {
  if (mode === "now" && MODE !== "now") roseShown();
  MODE = mode;
  if (mode === "forecast") advancePastDefault();
  remember(KEEP.mode, mode);
  show();
}

// What each card currently reads, keyed by `data-card`.
//
// Keyed rather than positional because the swell tabs re-rank by energy and a
// card can move in the strip without its contents changing.
// Everything on the page that is derived from the reader's clock rather than
// from the payload. These change on their own schedule, so comparing them
// would flash cards that had not changed.
//
// Measured: without this, the wind card flashed alongside the tide on a
// refresh that only moved the tide. `show()` re-runs `tickDue`, so a snapshot
// and a render either side of a second boundary disagree on the countdown --
// and at a minute boundary, on the age. Both are marked in the DOM rather than
// stripped by pattern, so the rule stays true as the wording changes.
const VOLATILE = "[data-due], .age, [data-rose-live]";

function cardText() {
  const out = new Map();
  document.querySelectorAll("[data-card]").forEach((el) => {
    const copy = el.cloneNode(true);
    copy.querySelectorAll(VOLATILE).forEach((v) => v.remove());
    out.set(el.getAttribute("data-card"),
            copy.textContent.replace(/\s+/g, " ").trim());
  });
  return out;
}

// Flash the cards whose rendered text changed across a refresh.
//
// The snapshot and the comparison sit either side of the SAME re-render,
// milliseconds apart, which is what makes this work: the clock-derived parts --
// "4 min ago", "Update in 4:59" -- read identically across that gap, so only
// real new data differs. Comparing across any longer interval would flash every
// card every time, because those two strings are always changing.
//
// It follows that navigation never flashes. Stepping the forecast to +48 h
// re-renders without a refresh, and nothing here runs.
function flashChanged(before) {
  const after = cardText();
  document.querySelectorAll("[data-card]").forEach((el) => {
    const key = el.getAttribute("data-card");
    const was = before.get(key), now = after.get(key);
    if (was === undefined || was === now) return;
    el.classList.remove("fresh");
    void el.offsetWidth;   // reflow, so a flash still mid-flight restarts
    el.classList.add("fresh");
  });
}

// Re-render and flash whatever that changed, as one move.
function showAndFlash() {
  const before = cardText();
  show();
  flashChanged(before);
}

// REFRESH.
//
// The page fetched both payloads once, at load, and never again. The minute
// tick re-rendered from memory, so on a tab left open the age climbed and the
// countdown ran -- truthfully, about a payload that had stopped moving. With
// collection every ten minutes the repository was six times fresher than any
// open tab, and every improvement upstream stopped at the browser.
//
// The two chains are refetched on their own cadences because they move on
// their own cadences. now.json is ~6 KB and changes every collection;
// forecast.json is ~128 KB and changes four times a day, so refetching it as
// often would be twenty times the bytes for nothing.
//
// The two intervals themselves are declared far above, beside the countdown
// that has to add NOW_REFRESH_MS to what now.json publishes.

// A unique URL per fetch, because `no-store` alone is not enough against a
// shared cache.
//
// GitHub Pages serves every file through Fastly with **`Cache-Control:
// max-age=600`**, and Pages gives you no way to change it -- there is no
// header configuration, so this cannot be fixed on the publishing side.
// Measured on the live bundle 2026-09-25T15:48:58Z:
//
//     Cache-Control: max-age=600
//     Age: 0            x-cache: MISS      x-cache-hits: 0
//     Last-Modified: Fri, 25 Sep 2026 15:45:44 GMT
//     Via: 1.1 varnish  x-served-by: cache-bur-kbur8200041-BUR
//
// Ten minutes of permitted staleness against a ten-minute collection cadence:
// a cache HIT inside that window can serve a reader a now.json one whole
// collection behind, and its own age line would then be honest about a reading
// that was already superseded.
//
// That sample was a MISS with Age 0, so it came from origin and was NOT stale
// -- `cache: "no-store"` reached the CDN as `Cache-Control: no-cache` and was
// honoured. The mechanism is measured; that instance is not an instance of it.
// The reason to fix it anyway is that honouring a client `no-cache` is Fastly
// CONFIGURATION, not a guarantee, and it says nothing about what some other
// edge node has already cached for the next reader. A distinct URL cannot be
// answered from any cache by definition, which turns a policy we do not
// control into arithmetic we do.
//
// `no-store` stays alongside it: the query parameter defeats shared caches,
// `no-store` defeats this browser's own. They are different caches.
//
// Cost: every fetch is a guaranteed origin miss. now.json is 1.5 KB gzipped on
// a five-minute refresh, so this is a rounding error against the bandwidth of
// the page that fetches it.
function fresh(url) {
  return url + (url.includes("?") ? "&" : "?") + "v=" + Date.now();
}

// Both keep what is on screen when a fetch fails or returns something
// unusable. Blanking the page because one request lost would be worse than
// showing a reading whose own age line already says how old it is -- and on a
// phone at the beach, a lost request is the normal case, not the exception.
function refreshNow() {
  fetch(fresh(NOW_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .then((observed) => {
      if (!observed || !observed.generated_utc) return;
      if (NOW && observed.generated_utc === NOW.generated_utc) return;
      NOW = observed;
      if (MODE === "now") showAndFlash();
    })
    .catch(() => {});
}

// Rebuilt with every collection, so a past hour's measurement lands on the
// page within one refresh of the spectrum being collected.
function refreshMeasured() {
  fetch(fresh(MEASURED_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .then((got) => {
      if (!got || !got.generated_utc || !got.steps) return;
      if (MEASURED && got.generated_utc === MEASURED.generated_utc) return;
      MEASURED = got;
      if (MODE === "forecast") showAndFlash();
    })
    .catch(() => {});
}

// Rebuilt with every collection, like measured.json. Redrawn without the
// flash: a new hour on the chart is not a change in the reading above it.
function refreshSeries() {
  fetch(fresh(SERIES_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .then((got) => {
      if (!got || !got.generated_utc || !got.steps) return;
      if (SERIES && got.generated_utc === SERIES.generated_utc) return;
      SERIES = got;
      if (MODE === "now") show();
    })
    .catch(() => {});
}

// Rebuilt with every collection, like series.json, and drawn on both tabs:
// the measured hours under the Now cards and beside the forecast's.
function refreshWindTide() {
  fetch(fresh(WINDTIDE_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .then((got) => {
      if (!got || !got.generated_utc || !got.hours) return;
      if (WT && got.generated_utc === WT.generated_utc) return;
      WT = got;
      show();
    })
    .catch(() => {});
}

// Rebuilt every collection (its conditions refresh); updated only when its
// swell or tide words change. Redrawn on either without the flash, as a
// fold under nobody's finger.
function refreshBriefing() {
  fetch(fresh(BRIEFING_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .then((got) => {
      if (!got || !got.key) return;
      if (BRIEFING && got.built_utc === BRIEFING.built_utc && got.key === BRIEFING.key) return;
      BRIEFING = got;
      if (MODE === "now") show();
    })
    .catch(() => {});
}

// Rebuilt with every collection from the alerts it archives; drawn on the
// Forecast tab alone, without the flash, as a line above the cards.
function refreshAlerts() {
  fetch(fresh(ALERTS_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .then((got) => {
      if (!got || !got.generated_utc || !got.alerts) return;
      if (ALERTS && got.generated_utc === ALERTS.generated_utc) return;
      ALERTS = got;
      if (MODE === "forecast") show();
    })
    .catch(() => {});
}

// Rebuilt with every collection from the daily archive and the newest
// spectra; drawn only by the Origins view, so redrawn without the flash.
function refreshOrigins() {
  fetch(fresh(ORIGINS_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .then((got) => {
      if (!got || !got.generated_utc || !got.arrivals) return;
      if (ORIGINS && got.generated_utc === ORIGINS.generated_utc) return;
      ORIGINS = got;
      if (MODE === "now") show();
    })
    .catch(() => {});
}

// Rebuilt with every collection, like now.json; a new reading at 46047 is a
// change in a card's numbers, so it flashes like one. The first fetch, at
// load, is not an update: it fills the tab without the flash.
function refreshBuoys() {
  fetch(fresh(BUOYS_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .then((got) => {
      if (!got || !got.generated_utc || !got.buoys) return;
      if (BUOYS && got.generated_utc === BUOYS.generated_utc) return;
      const first = !BUOYS;
      // New spectra mean new trains: a remembered row would light another.
      const was = BUOYS && BUOYS.roses;
      Object.keys(ROSE_TRAIN).forEach((st) => {
        if (!was || !was[st] || !got.roses || !got.roses[st]
            || was[st].trains_from_utc !== got.roses[st].trains_from_utc) ROSE_TRAIN[st] = null;
      });
      BUOYS = got;
      if (MODE === "now") (first ? show() : showAndFlash());
    })
    .catch(() => {});
}

// The archive changes once a day; refetched hourly, and only once it has
// been asked for.
function refreshSeriesAll() {
  if (ALL_STATE !== "loaded") return;
  fetch(fresh(SERIES_ALL_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .then((got) => {
      if (!got) return;
      if (SERIES_ALL && got.available === SERIES_ALL.available && got.hours === SERIES_ALL.hours
          && got.start_utc === SERIES_ALL.start_utc) return;
      SERIES_ALL = got;
      if (MODE === "now") show();
    })
    .catch(() => {});
}

function refreshForecast() {
  fetch(fresh(SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .then((data) => {
      if (!data || !data.breaks || !data.generated_utc) return;
      if (DATA && data.generated_utc === DATA.generated_utc) return;
      if (!adoptForecast(data, currentHour())) return;
      if (MODE === "forecast") showAndFlash();
    })
    .catch(() => {});
}

// The valid_utc the picker is sitting on, or null. Read before adopting a new
// cycle so the reader can be put back on the hour they chose.
function currentHour() {
  const step = STEPS[CURSOR];
  return step ? step.valid_utc : null;
}

// Everything on the page derived from forecast.json. Called at boot and again
// whenever a NEWER cycle arrives, because a new cycle changes which hours
// exist: the picker has to be rebuilt against them or it offers indices into
// an array that no longer has that shape.
//
// `keep` is the valid_utc the reader was looking at. If the new cycle still
// carries that hour they stay on it; a refresh that yanked someone from +48 h
// back to now would be a worse bug than the staleness it fixed.
function adoptForecast(data, keep) {
  DATA = data;

  const notes = (data.warnings && data.warnings.length) ? data.warnings : null;
  NOTE = notes ? {text: notes.join("  ·  "), live: false} : null;
  note();

  TIDE_BY_TIME = Object.fromEntries((data.tide || []).map((t) => [t.valid_utc, t]));

  const first = (data.breaks[0] || {}).hours || [];
  if (!first.length) {
    STEPS = [];
    $("conditions").innerHTML = '<p class="warn">No forecast hours in this file.</p>';
    return false;
  }
  // Keyed on lead_h and carrying the real array index, so the same page works
  // against the hourly file in the repository and the 3-hourly file published
  // to the web. Filtering by array position and then multiplying the index by
  // three assumed hourly data, and would have silently shown the wrong hour.
  const cycle = first.map((h, i) => ({h, i})).filter(({h}) => h.lead_h % 3 === 0)
    .map(({h, i}) => ({valid_utc: h.valid_utc, from: "cycle", index: i, lead_h: h.lead_h}));
  // Before this run was published, an earlier run was on screen, and the log
  // kept what it said (`past`, 48 h). This run's own first hours were already
  // gone when it appeared, so for any hour the log covers, the log's entry is
  // what a reader had in front of them; the run's own figure for
  // that hour is used only where the log has nothing.
  const generated = data.generated_utc || "";
  const past = (data.past || []).filter((p) => p.valid_utc < generated)
    .map((p) => ({valid_utc: p.valid_utc, from: "past", entry: p, lead_h: p.lead_h}));
  const logged = new Set(past.map((p) => p.valid_utc));
  STEPS = past.concat(cycle.filter((c) => c.valid_utc >= generated || !logged.has(c.valid_utc)))
    .sort((a, b) => (a.valid_utc < b.valid_utc ? -1 : a.valid_utc > b.valid_utc ? 1 : 0));

  $("when").innerHTML = STEPS
    .map((step, n) => `<option value="${n}">${when(step.valid_utc)}</option>`)
    .join("");

  // Only an hour the reader stepped to is kept. The default hour is not a
  // choice, so it is re-derived: kept verbatim it would sit on 11 p.m. long
  // after 11 p.m. had passed.
  const kept = keep == null || keep !== CHOSEN
    ? -1 : STEPS.findIndex((step) => step.valid_utc === keep);
  if (kept >= 0) {
    CURSOR = kept;
    return true;
  }
  CHOSEN = null;
  CURSOR = firstUpcoming();
  return true;
}

// Open on the first hour that has NOT YET HAPPENED, never on one that has. A
// GFS-Wave cycle publishes about five hours after its nominal time, so hour
// zero is already in the past when anyone loads the page — it opened on
// 5 a.m. for a reader standing on the sand at 2 p.m. Picking the hour nearest
// now fixed that and kept half the bug: at 0:20 on Saturday the 3-hourly steps
// are Friday 11 p.m. and Saturday 2 a.m., and nearest chose 11 p.m. — a
// forecast for a time already gone, opened by default.
//
// If every hour in the file has passed, the last one is the least stale thing
// there is; `show` says so rather than presenting it as upcoming.
function firstUpcoming() {
  const now = Date.now();
  const n = STEPS.findIndex((step) => new Date(step.valid_utc).getTime() >= now);
  return n >= 0 ? n : Math.max(0, STEPS.length - 1);
}

// Move a default cursor off an hour that has since passed. The page can sit
// open for hours — on either tab — and the hour it opened on goes by; showing
// it then would be opening on the past, one step removed. An hour the reader
// stepped to is theirs, past or not, and is left alone. True if it moved.
function advancePastDefault() {
  const hour = currentHour();
  if (hour == null || hour === CHOSEN) return false;
  if (new Date(hour).getTime() >= Date.now()) return false;
  const next = firstUpcoming();
  if (next === CURSOR) return false;
  CURSOR = next;
  return true;
}

// The reader stepped the picker: that hour is now theirs.
function choose(cursor) {
  CURSOR = cursor;
  CHOSEN = currentHour();
  show();
}

function boot(data, observed, measured, series, windtide) {
  NOW = observed;
  MEASURED = measured;
  SERIES = series;
  WT = windtide && windtide.hours ? windtide : null;
  $("tab-now").onclick = () => setMode("now");
  $("tab-forecast").onclick = () => setMode("forecast");
  wireSwellTabs();
  wireRoses();
  wireDrawings();
  wireCharts();

  wireGate();
  // The place a redraw returns the open Briefing to (`BRIEF_SCROLL`).
  // Scroll does not bubble, so the listener captures.
  $("briefing").addEventListener("scroll", (e) => {
    if (e.target.id === "brief-body") BRIEF_SCROLL = e.target.scrollTop;
  }, {capture: true, passive: true});
  $("fc-alerts").addEventListener("click", toggleAlert);
  $("briefing").addEventListener("click", (e) => {
    if (e.target.closest("[data-brief-head]") && !e.target.closest("a")) setBriefOpen(!BRIEF_OPEN);
    toggleAlert(e);
    const row = e.target.closest("[data-brief-row]");
    if (row) {
      const open = row.getAttribute("aria-expanded") !== "true";
      row.setAttribute("aria-expanded", String(open));
      row.nextElementSibling.hidden = !open;
      if (open) BRIEF_ROWS.add(row.dataset.briefRow); else BRIEF_ROWS.delete(row.dataset.briefRow);
    }
  });

  if (!adoptForecast(data, null)) return;
  refreshOrigins();
  refreshBuoys();
  refreshBriefing();
  refreshAlerts();

  $("when").onchange = (e) => {
    choose(Math.max(0, Math.min(STEPS.length - 1, Number(e.target.value))));
  };
  $("earlier").onclick = () => { if (CURSOR > 0) choose(CURSOR - 1); };
  $("later").onclick = () => { if (CURSOR < STEPS.length - 1) choose(CURSOR + 1); };

  // `adoptForecast` has already put CURSOR on the first hour not yet passed.
  //
  // Opens on Now: it is what someone standing on the sand wants, and if the
  // observed chain is broken the tab says so rather than hiding it behind a
  // silent fallback to the model. A refresh puts the reader back on the tab
  // THEY chose, which is not a fallback; anything unrecognised in storage
  // opens on Now. The swell tab is restored by id, and one that no longer
  // exists falls through to the leader, as an unmade choice does.
  SWELL_TAB = recall(KEEP.swell);
  // The calculation table opens as the reader left it; anything else, closed.
  CALC_OPEN = recall(KEEP.calc) === "open";
  // Each buoy's headline likewise, by station.
  BUOY_OPEN = Object.fromEntries((recall(KEEP.buoyOpen) || "").split(",").filter(Boolean)
    .map((id) => [id, true]));
  // The chart's view likewise; anything unrecognised is the heights.
  const view = recall(KEEP.chart);
  CHART_MODE = CHART_MODES.some((m) => m.id === view) ? view : "height";
  const fcView = recall(KEEP.fcChart);
  FC_MODE0 = FC_MODES.some((m) => m.id === fcView) ? fcView : FC_MODES[0].id;
  // Folded away until the reader opens it, as the calculation is.
  CHART_OPEN = recall(KEEP.chartOpen) === "open";
  ORIGIN_OPEN = recall(KEEP.originOpen) === "open";
  PHASE_OPEN = recall(KEEP.phaseOpen) === "open";
  BRIEF_OPEN = recall(KEEP.briefOpen) === "open";
  CARD_CHART_OPEN.wind = recall(KEEP.windChart) === "open";
  CARD_CHART_OPEN.tide = recall(KEEP.tideChart) === "open";
  for (const chain of ["now", "fc"]) {
    for (const id of ["wind", "tide"]) WT_MODE[chain][id] = recall(`${KEEP.wtView}.${chain}.${id}`) || WT_MODE[chain][id];
  }
  setMode(recall(KEEP.mode) === "forecast" ? "forecast" : "now");

  // The observed age moves whether or not anything else does, so the observed
  // tab is redrawn on the minute rather than only on load or a tab change.
  setInterval(() => { if (MODE === "now") show(); }, 60000);

  // The forecast tab is redrawn only when its default hour has just passed.
  setInterval(() => { if (MODE === "forecast" && advancePastDefault()) show(); }, 60000);

  // A second's tick for the countdowns alone. The minute tick above re-renders
  // the whole page, which is the right cadence for "2 h ago" and far too heavy
  // for a clock that has to move every second.
  setInterval(tickDue, 1000);
  // The roses' one clock (both buoys on it), ten times a second.
  setInterval(roseTick, 100);

  // And the payloads themselves, which used to be fetched once and never
  // again. See REFRESH above.
  setInterval(refreshNow, NOW_REFRESH_MS);
  setInterval(refreshMeasured, NOW_REFRESH_MS);
  setInterval(refreshSeries, NOW_REFRESH_MS);
  setInterval(refreshWindTide, NOW_REFRESH_MS);
  setInterval(refreshOrigins, NOW_REFRESH_MS);
  setInterval(refreshBuoys, NOW_REFRESH_MS);
  setInterval(refreshBriefing, NOW_REFRESH_MS);
  setInterval(refreshAlerts, NOW_REFRESH_MS);
  setInterval(refreshSeriesAll, FORECAST_REFRESH_MS);
  setInterval(refreshForecast, FORECAST_REFRESH_MS);
}

// Before the data: the foot of the page works whether or not it loads, and
// the Units setting is read before the first number is drawn.
wireSettings();

Promise.all([
  fetch(fresh(SOURCE), {cache: "no-store"})
    .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }),
  // now.json may legitimately be absent -- it is published by a different job
  // on a different schedule. Absent is handled; wrong is not.
  fetch(fresh(NOW_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .catch(() => null),
  // measured.json likewise: without it, past hours say no reading is loaded.
  fetch(fresh(MEASURED_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .catch(() => null),
  // series.json likewise: without it, the chart says it is not loaded.
  fetch(fresh(SERIES_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .catch(() => null),
  // windtide.json likewise: without it, the Wind and Tide charts draw only
  // the forecast, or say they are not loaded.
  fetch(fresh(WINDTIDE_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .catch(() => null),
])
  .then(([forecast, observed, measured, series, windtide]) =>
    boot(forecast, observed, measured, series, windtide))
  .catch((err) => {
    NOTE = {live: true, text:
      "Could not load " + SOURCE + " (" + err.message + "). Run "
      + "`python -m forecast.live` to write it, and open this page over HTTP "
      + "rather than from the filesystem."};
    note();
  });
</script>
