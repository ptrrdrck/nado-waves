<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nado Waves — Coronado</title>
<meta name="description" content="Physically derived swell aperture for Coronado's three breaks. Not a verified forecast.">
<script>
// The reader's theme, set before the first paint so a dark choice never
// flashes light (owner's call, 2026-10-28; the glyph at the foot of the page,
// `wireSettings`). Absent, the page follows the phone. Read here and only
// here outside the page's storage helpers, because they load too late.
try {
  const t = localStorage.getItem("nado-waves.theme");
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
} catch (e) { /* follows the phone */ }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  --paper:#EAEEEC; --card:#F6F8F7; --ink:#16232B; --soft:#53656E; --faint:#7C8C93;
  --line:#CBD5D1; --line-strong:#AFBDB8;
  --surf:#1565C0; --surf-ink:#FFFFFF; --surf-wash:#DCE7F7;
  --sand:#D9C9A8; --sand-deep:#B9A47C;
  --signal:#C62828; --signal-wash:#F9DEDE;
  --ok:#2F7D4F;
  /* The status dot is dark mode's green and red on both themes (owner's call,
     2026-10-09). */
  --dot-ok:#5FBF86; --dot-over:#FF6B6B;
  /* Measured, under a forecast: the blue of the selected tab above it,
     light and dark (owner's call, 2026-10-09, after red from 2026-10-02 and
     sea green before that). Set from --surf, so the two cannot drift apart:
     5.5:1 on the light card, 6.6:1 on the dark. */
  --measured:var(--surf);
  --shadow:0 1px 2px rgba(22,35,43,.08), 0 4px 14px rgba(22,35,43,.06);
  --r:10px;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --paper:#0E1A20; --card:#152630; --ink:#E4ECE9; --soft:#9DB0B7; --faint:#7A8D95;
    --line:#283C46; --line-strong:#3A525E;
    --surf:#6FB3F7; --surf-ink:#08203A; --surf-wash:#12283D;
    --sand:#8C7A55; --sand-deep:#A8935F;
    --signal:#FF6B6B; --signal-wash:#3A1C1C;
    --ok:#5FBF86;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
/* A chosen theme carries the native controls with it: the bundle's meta says
   "light dark", which follows the phone. */
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0E1A20; --card:#152630; --ink:#E4ECE9; --soft:#9DB0B7; --faint:#7A8D95;
  --line:#283C46; --line-strong:#3A525E;
  --surf:#6FB3F7; --surf-ink:#08203A; --surf-wash:#12283D;
  --sand:#8C7A55; --sand-deep:#A8935F;
  --signal:#FF6B6B; --signal-wash:#3A1C1C;
  --ok:#5FBF86;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
}
/* No double-tap zoom anywhere (owner's request, 2026-10-25): a page this
   dense in taps zoomed on two quick ones and left the layout off-screen.
   manipulation keeps pinch zoom and scrolling; set on every element, not
   the root alone, because the Briefing scrolls inside itself: a scroller
   ends the ancestors' say. Zero specificity, so the charts' pan-y stands. */
*{box-sizing:border-box;touch-action:manipulation}
[hidden]{display:none!important}
body{
  background:var(--paper); color:var(--ink);
  font:400 17px/1.5 Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-text-size-adjust:100%; padding:0 16px 48px; margin:0;
}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:18px 0}
h1{font-family:"Barlow Condensed",Archivo,sans-serif;font-weight:700;font-size:34px;
   line-height:1.02;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-family:"Barlow Condensed",Archivo,sans-serif;font-weight:700;font-size:21px;
   letter-spacing:.01em;margin:0}
.lbl{font-family:"Barlow Condensed",Archivo,sans-serif;font-weight:600;text-transform:uppercase;
     letter-spacing:.09em;font-size:14px;color:var(--soft)}
header{display:flex;flex-direction:column;gap:9px;border-bottom:1px solid var(--line);padding-bottom:14px}
.head-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* The two chains. A segmented control rather than a dropdown: there are
   exactly two and the choice is the first thing a reader makes. */
.tabs{display:flex;gap:0;background:var(--card);border:1px solid var(--line);
      border-radius:var(--r);padding:3px;box-shadow:var(--shadow)}
.tabs button{flex:1;font:inherit;font-family:"Barlow Condensed",Archivo,sans-serif;
             font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:15px;
             padding:9px 6px;border:0;border-radius:calc(var(--r) - 3px);cursor:pointer;
             background:transparent;color:var(--soft)}
.tabs button[aria-selected="true"]{background:var(--surf);color:var(--surf-ink)}
.tabs button:focus-visible{outline:2px solid var(--surf);outline-offset:2px}

/* A card whose contents just changed on a refresh.
   The border and a wash carry the card; the value and the provenance line
   brighten with them, so the eye lands on what moved rather than on the box.
   Both settle back to the resting colour rather than to a literal, so the
   animation is correct in either theme without being written twice. */
@keyframes freshen {
  from { border-color: var(--surf); background: var(--surf-wash); }
}
@keyframes freshen-ink {
  from { color: var(--surf); }
}
.cond.fresh { animation: freshen 1.8s ease-out; }
.cond.fresh .val, .cond.fresh .src { animation: freshen-ink 1.8s ease-out; }

/* An update is worth noticing, not worth enduring. */
@media (prefers-reduced-motion: reduce) {
  .cond.fresh, .cond.fresh .val, .cond.fresh .src { animation: none; }
}

/* "Update in m:ss", the last provenance line on a Now card. Muted
   while it counts down; the signal colour once the update it promised has not
   arrived, beside the reading it qualifies rather than in a banner over all
   three. `nowrap` because a clock broken across two lines is unreadable. */
.due{white-space:nowrap}
/* Normal weight: the colour carries this on its own. The status dot's red on
   every card and both themes, so the words and the dot read as one signal
   (owner's call, 2026-10-09; it replaced --signal, 5.3:1 on the light card,
   where this red is about 2.6:1). */
.due.over{color:var(--dot-over)}

/* A stale observation is not "now". Loud, above everything it qualifies. */
.stale{background:var(--signal-wash);border:1px solid var(--signal);color:var(--ink);
       border-radius:var(--r);padding:10px 12px;font-size:13.5px;margin:0}
.stale b{color:var(--signal)}

/* Conditions strip: one fact per line, its source under it. */
.conditions{display:flex;flex-direction:column;gap:10px}
.cond{display:flex;flex-direction:column;gap:2px;padding:11px 13px;background:var(--card);
      border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.cond .lbl{font-size:12.5px}
.cond .val{font-size:19px;font-weight:600;line-height:1.25}
.cond .val .unit{font-size:15px}
/* Metric, in parentheses after the imperial value it restates. */
.unit{font-weight:400;color:var(--soft)}
.cond .src{font-size:12px;color:var(--faint)}
/* Space, not a rule, above the provenance lines on every card, both tabs
   (owner's call, 2026-10-02, retiring 2026-09-27's rule): 14 px, the same as
   between a break's headline and its trains (the pane's 11 px gap + the
   trains' 3). The card's gap is 2 px and the swell card's 8, so each takes
   the margin that lands it there. */
.cond .srcs{display:flex;flex-direction:column;gap:2px;margin-top:12px}
.cond.swell .srcs{margin-top:6px}
/* A second reading inside a card, under its own small label: the Forecast
   tab's model wind "At the buoy" under the local forecast wind. */
.cond .subcond{display:flex;flex-direction:column;gap:2px;margin-top:12px}
/* Each arrival under ORIGIN: its sea, the line under it, its provenance.
   The tide's phase paragraphs are set the same way (owner's request,
   2026-10-14): a heading at the card's value size over a body in the
   supporting line's grey. */
.cond .origin,.cond .phase-entry{display:flex;flex-direction:column;gap:2px}
.cond .origin + .origin,.cond .phase-entry + .phase-entry{margin-top:10px;padding-top:12px;position:relative}
/* Entries inside Origin, and the phase's paragraphs, are set apart by a
   centred dot, never a rule: a full-width rule is what opens a section on
   this card (owner's call, 2026-10-14). */
.cond .origin + .origin::before,.cond .phase-entry + .phase-entry::before{content:"";position:absolute;
                                top:-2px;left:calc(50% - 2px);
                                width:4px;height:4px;border-radius:50%;background:var(--soft)}
.cond .origin > .val > .unit{white-space:nowrap}
/* THE BRIEFING (owner's requests, 2026-10-16, -17 and -22) sits on the
   page's backdrop above the LIVE cards, in a fold of its own -- not a card:
   no border, no fill, its line the Charts line's weight with the same caret
   and, while an update is unread, the provenance pills' green dot. Open,
   three blocks in a 15 px grey -- the swell, the day's tide, then the
   conditions -- apart by the cards' fold rule
   (owner's call, 2026-10-23, replacing Origin's dot). Its numbers are ink
   and heavier than the words round them, the metric in brackets left grey
   (same day). */
.briefing{display:flex;flex-direction:column;gap:6px;padding:0 13px}
/* Open, it is at most half the reader's screen (owner's call, 2026-10-16):
   shorter, it is its own height; longer, it scrolls inside itself and the
   rest is cut off at the cards' edge, so the cards never move down past
   half a screen. dvh where the browser has it, so a phone's collapsing
   toolbar does not leave it a bar too tall. At either end its scroll
   carries on to the page (owner's requests, 2026-10-23 and -24): a swipe
   down at its top reaches the page, so pull-to-refresh works from inside
   it, and a swipe up at its bottom scrolls on down the page. */
.briefing .fold-body{display:flex;flex-direction:column;gap:2px;padding-top:2px;
                     max-height:50vh;max-height:50dvh;overflow-y:auto;overscroll-behavior-y:auto}
.brief-block{display:flex;flex-direction:column;gap:2px;font-size:15px;color:var(--soft)}
.brief-block .unit{color:inherit}
/* The swell's sentences a line each, a little apart (owner's request,
   2026-10-23). The beach's range is a headline (owner's choices, same day),
   its last 24 h a sparkline beside it, and each train a line under it.
   Tanner Banks' lines are plain words, each opening on its point, with a
   grey signal mark hung in the margin turned the way the swell travels
   (owner's choice, 2026-10-24). */
.brief-block.brief-swell{gap:6px}
.brief-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brief-big{font-size:27px;line-height:1.1;letter-spacing:-.01em;min-width:0}
.brief-big .unit{font-size:15px;letter-spacing:0;white-space:nowrap}
.brief-sub{margin-top:-3px}
.brief-sep{color:var(--faint);margin:0 6px}
.brief-head .brief-trend{flex:none}
.brief-sub + .brief-hang{margin-top:4px}
.brief-hang{display:grid;grid-template-columns:16px minmax(0,1fr);column-gap:8px;align-items:start;
            font-size:14.5px}
.brief-signal{display:block;width:16px;height:16px;margin-top:3px;overflow:visible}
.brief-signal circle{fill:var(--faint)}
.brief-signal path{fill:none;stroke:var(--faint);stroke-width:1.3;stroke-linecap:round}
.brief-block + .brief-block{border-top:1px solid var(--line);padding-top:9px;margin-top:8px}
.brief-num{color:var(--ink);font-weight:600}
/* The conditions as a ledger (owner's calls, 2026-10-23): name in the
   page's small caps, an ink arrowhead, the value, a sparkline and its
   window, each row a button that shows when it was read. */
.brief-block.brief-cond{gap:6px}
.brief-row{display:grid;grid-template-columns:62px 9px minmax(0,1fr) auto;column-gap:6px;align-items:center;
           width:100%;padding:0;margin:0;border:0;background:none;font:inherit;color:inherit;
           text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.brief-key{font-family:"Barlow Condensed",Archivo,sans-serif;font-weight:600;font-size:12.5px;
           letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.brief-arrow{display:block;width:9px;height:9px;fill:var(--ink)}
.brief-val{min-width:0;line-height:1.35}
.brief-val .unit{white-space:nowrap}
.brief-trend{display:flex;align-items:center;justify-content:flex-end;gap:5px}
.brief-spark{display:block;width:64px;height:18px;overflow:visible;fill:none;stroke:var(--faint);
             stroke-width:1.2;stroke-linejoin:round}
.brief-spark circle{fill:var(--ink);stroke:none}
@media (max-width:360px){.brief-spark{width:44px}}
.brief-bars rect{fill:var(--faint);stroke:none}
.brief-bars rect.base{fill:var(--line)}
.brief-bars rect.now{fill:var(--ink)}
.brief-window{font-size:10.5px;color:var(--faint);letter-spacing:.04em;min-width:22px}
.brief-window:empty{display:none}
.brief-when{font-size:12px;color:var(--faint);padding-left:83px;margin-top:-3px}
/* The day's tide as a curve (owner's choice, 2026-10-23): greys and ink,
   the hours gone grey, nights shaded as the Tide card's charts are. */
.brief-tide{display:block;width:100%;height:151px;padding:0;margin:0;border:0;background:none;font:inherit;
            color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.brief-tide svg{display:block;overflow:visible}
.brief-tide path{fill:none;stroke-linejoin:round}
.brief-tide path.gone{stroke:var(--faint);stroke-width:1.4}
.brief-tide path.ahead{stroke:var(--ink);stroke-width:1.8}
.brief-tide .night{fill:var(--ink);opacity:.04}
.brief-tide svg.sun{overflow:visible;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;
                    stroke-linejoin:round}
.brief-tide svg.sun.gone{stroke:var(--faint)}
.brief-tide .now-dot{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}
/* The now ring (owner's choices, 2026-10-25): from the dot's own size to
   3x while it fades, easing out like a ripple, then a rest (`ringNow`);
   its line stays the dot's width as it grows. Unseen until animated, and
   none under reduced motion. */
.brief-tide .now-ring{fill:none;stroke:var(--ink);stroke-width:1.6;vector-effect:non-scaling-stroke;
                      transform-box:fill-box;transform-origin:center;opacity:0}
@media (prefers-reduced-motion: reduce){ .brief-tide .now-ring{display:none} }
.brief-tide circle.turn{fill:var(--ink)}
.brief-tide circle.turn.gone{fill:var(--faint)}
.brief-tide text{font-family:inherit;text-anchor:middle}
.brief-tide .level{font-size:12px}
.brief-tide .level .ft{font-weight:600;fill:var(--ink)}
.brief-tide .level.gone .ft{fill:var(--faint)}
.brief-tide .level .m{fill:var(--faint)}
.brief-tide .time{font-size:11.5px;font-weight:600;fill:var(--ink)}
.brief-tide .time.gone{font-weight:400;fill:var(--faint)}
.brief-when.brief-when-tide{padding-left:0;margin-top:2px}
/* NWS's coast and ocean alerts (owner's calls, 2026-10-24): a line each,
   the triangle in ink, the event a link, an NWS tag; tapped, NWS's own
   headline in grey under it. The Briefing's top block, and on the Forecast
   tab a line above the Swell card on the backdrop. */
.alerts{display:flex;flex-direction:column;gap:6px;padding:0 13px}
.alert{display:grid;grid-template-columns:16px minmax(0,1fr);column-gap:8px;align-items:start;
       font-size:15px;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
.alert-tri{display:block;width:16px;height:16px;margin-top:2px;color:var(--ink)}
.alert-line a{font-weight:600}
.alert-when{white-space:nowrap}
.alert .tag{font:inherit;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;
            margin-left:3px;padding:0;border:0;background:none;cursor:pointer;white-space:nowrap}
.alert-head{font-size:13px;color:var(--soft);padding-left:24px;overflow-wrap:anywhere}
.brief-block.brief-alerts{gap:6px}
/* The log-first gate (owner's call, 2026-10-16): on a device whose reader
   logs the beach, the page opens on this and nothing else until today's
   log is done or declined, so an observer reaches the log before any
   forecast. Quiet: the backdrop, no signal colour. */
.gate{display:flex;flex-direction:column;gap:10px;padding:18px 13px}
.gate .gate-q{font-size:19px;font-weight:600;margin:0}
.gate .gate-why{font-size:15px;color:var(--soft);margin:0}
.gate .gate-acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gate button,.gate .gate-log{font:inherit;font-size:15px;padding:7px 12px;border-radius:8px;
                             border:1px solid var(--line-strong);background:var(--card);color:var(--ink);
                             cursor:pointer;text-decoration:none}
.links .logger{display:inline-flex;align-items:center;gap:6px;color:var(--soft)}
/* Origin's and the phase's paragraphs read at 15 px in the supporting grey,
   as each buoy's sentence does -- the size of "combined" beside a height --
   and the dot between them takes that grey too, a step more contrast than
   the rule colour it had (owner's request, 2026-10-14). */
.cond .origin > .turn,.cond .phase-entry > .turn{font-size:15px}
/* A tab's last readable arrival (owner's request, 2026-10-12): a line saying
   nothing readable is arriving at the tab, then the entry, its lines at the
   size the grey "last readable arrival" tag had beside the head. */
.cond .origin.last > .turn{font-size:15px}
/* A blank line between that opening line and the entry it introduces
   (owner's request, 2026-10-13): one line of its own 15 px text. */
.cond .origin.last > .turn:first-child{margin-bottom:1.2em}
/* A named storm's symbol after its name: the meteorological tropical cyclone
   symbol, two arms around the eye as a Northern Hemisphere storm turns, the
   eye open for a tropical storm and filled for a hurricane. */
.cond .origin .storm-sym{width:1em;height:1em;margin-left:.3em;vertical-align:-.14em;
                         fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.cond .origin .storm-sym .eye{fill:var(--card)}
.cond .origin .storm-sym[data-kind="hurricane"] .eye{fill:currentColor}
/* ORIGIN folds out like the charts, from its own line with the same caret,
   right above "Charts" and under a rule of its own (owner's call,
   2026-10-02): the swell card's one other rule. Closed until opened. */
.cond > .origin-fold{display:flex;flex-direction:column;gap:6px;
                     border-top:1px solid var(--line);padding-top:9px;margin-top:2px}
.origin-fold .fold-body{display:flex;flex-direction:column;gap:2px}
.cond .sublbl{font-family:"Barlow Condensed",Archivo,sans-serif;font-weight:600;text-transform:uppercase;
              letter-spacing:.06em;font-size:11.5px;color:var(--soft)}
/* A number inside a provenance line ("of 3.8 ft (1.15 m) at the buoy") stays
   in that line's grey; the darker metric would lift it out of the footnote. */
.cond .src .unit{color:inherit}

/* The swell card holds the three breaks and the buoy as tabs. Quieter than
   the Now/Forecast control above it, so the two levels of choice never read
   as the same control: a raised chip on a sunken track rather than a solid
   fill. `nowrap` because a buoy's name split over two lines at phone width
   reads as two tabs. */
.cond.swell{gap:8px}
.subtabs{display:flex;gap:3px;background:var(--paper);border:1px solid var(--line);
         border-radius:8px;padding:3px}
.subtabs button{flex:1 1 auto;font:inherit;font-family:"Barlow Condensed",Archivo,sans-serif;
                font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:14px;
                padding:6px 4px;border:0;border-radius:6px;cursor:pointer;white-space:nowrap;
                background:transparent;color:var(--soft)}
.subtabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.subtabs button:focus-visible{outline:2px solid var(--surf);outline-offset:1px}
.pane{display:flex;flex-direction:column;gap:11px;padding-top:4px}
/* Where the tide is going next. Dim like any other supporting line, with the
   direction itself at full ink because that is the word being read. */
/* Inline, not flex: the height carries its own metric span and flex would
   make that a separate item with a gap in front of it, splitting "3.8 ft"
   from "(1.16 m)" that every other number on the page keeps together. */
.cond .turn{font-size:13.5px;color:var(--soft)}
.cond .turn b{color:var(--ink);font-weight:600}
/* Tags in the supporting grey, the colour of a secondary train's heading
   (owner's call, 2026-10-28: --faint read too dim, in dark mode most). */
.cond .turn .tag{font-size:11px;color:var(--soft);text-transform:uppercase;
                 letter-spacing:.06em;margin-left:5px;white-space:nowrap}
/* THE TIDE PHASE folds out like Origin, from its own line under a rule of
   its own, right above "Charts" (owner's request, 2026-10-11): the line is
   a fixed title, the fold paragraphs set as Origin's entries are, never
   bullets, and no provenance under them (owner's call, 2026-10-14: it is on
   docs.html). */
.cond > .phase-fold{display:flex;flex-direction:column;gap:6px;
                    border-top:1px solid var(--line);padding-top:9px;margin-top:8px}
.phase-fold .chart-head .tag{font-size:11px;color:var(--soft);text-transform:uppercase;font-weight:400;
                            letter-spacing:.06em;margin-left:6px;white-space:nowrap}
.phase-fold .chart-head:hover .calc-toggle{color:var(--ink)}
.phase-fold .fold-body{display:flex;flex-direction:column;gap:2px}
.phase-fold .phase-entry{margin:0}

/* Wave trains. A spectrum is two or three swells plus a wind sea, and which
   one leads at a break need not be the one leading at the buoy — so they are
   listed rather than collapsed into a single "dominant". */
.trains{display:flex;flex-direction:column;gap:3px;margin-top:3px}
.train{display:flex;align-items:baseline;gap:8px;font-size:14px;
       font-variant-numeric:tabular-nums}
.train .ht{font-weight:600;min-width:112px}
.train .tp{color:var(--soft);min-width:48px}
.train .dr{color:var(--soft);flex:1;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
/* "wind sea" and "local chop" in the heading's own grey (owner's call,
   2026-10-28): on a secondary row the two are one colour under its fade. */
.train .tag{font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em;
            white-space:nowrap;flex:none}
/* One line per train (owner's calls, 2026-10-06 and -07). Each row carries
   its heading in every form it may take, longest first, and `fitTrains`
   shows the first that fits the row as it is -- so a row with room keeps its
   degrees and none is cut to a worst-case width. Only when even one compass
   point cannot sit beside its tag (a 320 px phone) does the row go `tight`
   and the tag wrap. The cell shrinks with an ellipsis until the fit has run,
   never past the card. */
.train .dr > [hidden]{display:none}
.train.tight .tag{white-space:normal;flex:0 1 auto}
.train.tight .dr{min-width:auto;overflow:visible}
.train.lead .ht,.train.lead .dr{color:var(--ink)}
.train:not(.lead){opacity:.72}
/* A train with an arrow on the drawing picks it there (owner's request,
   2026-10-05). */
.train[data-train]{cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:4px}
.train[data-train]:focus-visible{outline:2px solid var(--surf);outline-offset:1px}
/* On the Buoys tab a row lights its period range on the rose (owner's
   request, 2026-10-08); the lit row reads as pressed. */
.train[data-rose-train]{cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:4px}
.train[data-rose-train]:focus-visible{outline:2px solid var(--surf);outline-offset:1px}
/* A picked row reads as pressed, on the Buoys tab and on a break's alike
   (owner's request, 2026-10-09). */
.train[data-rose-train][aria-pressed="true"],.train[data-train][aria-pressed="true"]{background:var(--paper);opacity:1}
/* Each LIVE card's provenance is two lines of joined pills (owner's
   requests, 2026-10-09 to -12): where and when; then the station, "CDIP
   <n>", "NDBC <id>", "METAR KNZY" or "NOAA 9410170", with a dot on that
   source's own countdown -- green while it arrives, green fading in and out
   once one is due, red once overdue -- how long ago, and the countdown.
   In ink at the provenance's size on the picked row's background, with
   4 px corners (owner's call, 2026-10-11). The Forecast tab's cards carry
   the same line with no dot and no countdown (owner's request, 2026-10-15):
   the source, the model, then the run or the update. */
.pill,.pill-tail{display:inline-flex;align-items:center;height:18px;box-sizing:border-box;
  background:var(--paper);color:var(--ink);font-size:12px;font-weight:400;line-height:1;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{gap:5px;padding:0 7px;border-radius:4px}
/* The second pill grows out of the first (owner's design, 2026-10-11): it
   starts under the first pill's right end, at its corners' centre, 4 px in,
   and that end grown by a 2 px seam is cut from its left -- the 10 px of
   straight edge between the corners as a 6 x 10 px block, each corner as a
   circle of 6 px, 5 px above and below the middle -- so its left edge hugs
   the first pill's end with a 2 px seam; its right end is the first pill's.
   The cut is the whole pill less those three (`subtract` over `add`). A
   third grows out of the second the same way (owner's request, 2026-10-12:
   station, age, countdown). Kept on one line while they fit; where they do
   not (a 320 px phone), `fitPills` lets a pill wrap to start the next row
   as a pill of its own. */
.pills{display:inline-flex;flex-wrap:wrap;align-items:center;row-gap:2px;vertical-align:top;max-width:100%}
.pill-tail{margin-left:-4px;padding:0 7px 0 13px;border-radius:0 4px 4px 0;
  -webkit-mask:linear-gradient(#000 0 0),
    radial-gradient(circle at 0 calc(50% - 5px),#000 6px,transparent 6.5px),
    radial-gradient(circle at 0 calc(50% + 5px),#000 6px,transparent 6.5px),
    linear-gradient(#000 0 0) 0 50%/6px 10px no-repeat;
  -webkit-mask-composite:source-out,source-over,source-over;
  mask:linear-gradient(#000 0 0),
    radial-gradient(circle at 0 calc(50% - 5px),#000 6px,transparent 6.5px),
    radial-gradient(circle at 0 calc(50% + 5px),#000 6px,transparent 6.5px),
    linear-gradient(#000 0 0) 0 50%/6px 10px no-repeat;
  mask-composite:subtract,add,add}
/* A pill that wraps to start a row stands on its own, in the joined one's
   footprint (-4 + 13 + 7 = 8 + 8), so marking it never moves the next. */
.pill-tail.wrapped{margin-left:0;padding:0 8px;border-radius:4px;-webkit-mask:none;mask:none}
.status{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dot-ok)}
.status.due{animation:status-due 2s ease-in-out infinite} .status.over{background:var(--dot-over)}
@keyframes status-due{0%,100%{opacity:1}50%{opacity:.2}}
/* Without motion, due is the green held half-faded: still not the resting dot. */
@media (prefers-reduced-motion: reduce){ .status.due{animation:none;opacity:.45} }
/* The break card's headline with its caret at the right end. The caret
   points up while the calculation is folded away and down once it is open
   beneath the line (owner's design, 2026-09-26). */
/* The whole breaking-height line folds the calculation out, not only its
   caret (owner's call, 2026-10-01), as the "Charts" line does its charts. */
.val-row{cursor:pointer;-webkit-user-select:none;user-select:none}
/* The buoys' combined height sits in the same row as a break's breaking
   height (owner's request, 2026-10-09: it sat about 1 px higher): centred in
   at least the caret's footprint, 32 px less its -4 px margins, so the two
   land alike whatever a browser's line box comes to. `.val-line` is that
   row without the calculation's toggle. */
.val-row,.val-line{display:flex;align-items:center;justify-content:space-between;gap:10px;
                   min-height:24px}
.val-row:hover .calc-toggle{color:var(--ink)}
/* A buoy's headline folds out its trains, rose and words (owner's request,
   2026-10-11), the whole line as on a break's; spaced as the pane is. */
.fold-row{cursor:pointer;-webkit-user-select:none;user-select:none}
.fold-row:hover .calc-toggle{color:var(--ink)}
.buoy-fold{display:flex;flex-direction:column;gap:11px}
/* Each buoy's sentence sits 3 px further under its rose than the pane's
   gap, and the provenance follows it with the pane's space. */
.buoy-note{margin:0}
.buoy-fold .rose + .buoy-note{margin-top:3px}
/* Each buoy's sentence at the size of "combined" in the headline above it
   (`.cond .val .unit`; owner's request, 2026-10-14), and a buoy with no
   rose says so in the same words' size and colour, as far from the trains
   above it as from the sentence below. */
.cond .buoy-note{font-size:15px}
.buoy-note .unit{white-space:nowrap}
.buoy-fold .rose-none{margin:8px 0 4px}
.calc-toggle{flex:none;display:grid;place-items:center;width:32px;height:32px;margin:-4px -6px -4px 0;
             padding:0;border:0;border-radius:6px;background:transparent;color:var(--soft);cursor:pointer}
.calc-toggle:hover{color:var(--ink)}
.calc-toggle:focus-visible{outline:2px solid var(--surf);outline-offset:1px}
.calc-toggle svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;
                 stroke-linecap:round;stroke-linejoin:round;transition:transform .15s ease-out}
.calc-toggle[aria-expanded="true"] svg{transform:rotate(180deg)}
@media (prefers-reduced-motion: reduce){ .calc-toggle svg{transition:none} }
/* The calculation, one effect per row. Heights in the leading train's ink and
   weight, the metric under the imperial so four columns fit a phone. */
.calc-fold{display:flex;flex-direction:column;gap:6px}
.calc-table th[scope="row"]{font-weight:400;color:var(--soft);font-size:13px;vertical-align:top}
.calc-table th[scope="row"] .unit{display:block;font-size:11.5px;color:var(--faint)}
.calc-table td{color:var(--ink);font-weight:600;vertical-align:top}
.calc-table td .unit{display:block;font-size:11.5px}
.calc-table tbody tr:last-child td{border-bottom:0}
.calc-table tbody tr:last-child th{border-bottom:0}

/* The measured reading under a past forecast hour: 46232's own spectrum at
   that hour, carried in by the same chain (docs.html says so). Blue (sea green until 2026-10-02, red until 2026-10-09), in
   a 1 px outline at the card's radius (owner's style, 2026-09-27), so it can
   never be read as part of the forecast above it; its label names the hour
   it was observed on every line, not once per page. */
.measured{display:flex;flex-direction:column;gap:1px;padding:6px 10px;
          background:transparent;border:1px solid var(--measured);
          border-radius:var(--r);color:var(--measured);font-variant-numeric:tabular-nums}
.measured .lbl{font-size:12px;color:var(--measured)}
.measured .mval{font-size:17px;font-weight:600;line-height:1.25}
.measured .mval .unit,.measured .mpeak{color:var(--measured);font-size:13.5px;font-weight:400}
.measured.none{font-size:13px}
/* On the wind and tide cards the box sits straight under the value, in the
   card's 2 px gap; the swell card's pane gives its box 11 px. */
.cond > .measured,.cond .subcond > .measured{margin-top:8px}

/* The Forecast tab's hour line, set as LIVE's Briefing line is (owner's
   choice, 2026-10-23): on the backdrop with no box, the day in ink and the
   rest of the hour in the count's grey, a small caret saying the hour opens
   a list, and earlier / later as the fold carets' chevrons at the right end
   where the Briefing's caret sits. The same 24 px row, so the cards start
   at the same height under the tabs on both, and switching does not move
   them. */
.seek{display:flex;align-items:center;gap:4px;min-height:24px;padding:0 13px;
      font-size:14.5px;font-weight:600;color:var(--ink)}
.seek button{flex:none;display:grid;place-items:center;width:32px;height:32px;margin:-4px 0;
             padding:0;border:0;border-radius:6px;background:transparent;color:var(--soft);cursor:pointer}
.seek #later{margin-right:-6px}
.seek button:hover:not(:disabled){color:var(--ink)}
.seek button:disabled{opacity:.38;cursor:default}
.seek button:focus-visible{outline:2px solid var(--surf);outline-offset:1px}
.seek button svg,.seek-when svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;
                                stroke-linecap:round;stroke-linejoin:round}
.seek-when{position:relative;flex:1;min-width:0;display:flex;align-items:center;gap:4px;
           border-radius:6px;cursor:pointer}
.seek-when .count{color:var(--soft);font-weight:400}
/* The time in ink and weight, as the weekday is (owner's request, 2026-10-24). */
.seek-when .when-time{color:var(--ink);font-weight:600}
/* One line at every width, or the row grows and the cards move: the
   longest hour, "Wednesday Sep 30, 12:00 PM", is 197 px and a 320 px phone
   leaves it 179, so under 340 px the weekday is the short one. */
#when-label{white-space:nowrap}
.seek-when .wd-short{display:none}
@media (max-width:340px){.seek-when .wd-long{display:none}.seek-when .wd-short{display:inline}}
.seek-when svg{flex:none;width:13px;height:13px;color:var(--soft)}
/* The real control, invisible but on top, so a tap opens the native list. */
.seek-when select{position:absolute;inset:0;width:100%;height:100%;opacity:0;
                  border:0;padding:0;cursor:pointer;font:inherit}
.seek-when:focus-within{outline:2px solid var(--surf);outline-offset:2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
      padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:11px}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.quiet{font-size:13.5px;color:var(--soft)}
.quiet b{color:var(--ink);font-weight:600}
.rows{display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.row{display:flex;align-items:flex-start;gap:8px}
.row .who{flex:1;min-width:0}
.row .amt{font-variant-numeric:tabular-nums;color:var(--soft);padding-top:1px}
.seg{display:block;margin-top:7px;height:8px;border-radius:999px;background:var(--sand-deep);width:44px;flex:none}
/* An estimated coordinate is hatched, never just a lighter shade: after
   BRIEFING s10 the islands are a small energy share rather than a switch, so
   the mark has to read as "this edge is a guess", not "this break is worse". */
.seg.guess{background:repeating-linear-gradient(45deg,var(--sand-deep),var(--sand-deep) 3px,transparent 3px,transparent 6px);
           outline:1px dashed var(--line-strong)}
/* The seaward clip is not land. It is the half of the compass a beach cannot
   face, and showing it in the same colour as a headland invites the reader to
   go looking for an island that is not there. */
.seg.horizon{background:var(--line-strong);opacity:.65}
.est{color:var(--faint);font-size:12px}

/* The windows lead the card, so they get the only tabular block in it. The
   BAR is the point: the three arcs are 23, 6 and 42 degrees wide, and three
   identical rows of numbers would read as three equivalent openings. Width is
   proportional to span within the card, never across cards -- a reader
   compares this break's arcs to each other here, and compares breaks by the
   numbers. */
.wins{display:flex;flex-direction:column;gap:9px}
.win{display:grid;grid-template-columns:auto 1fr;align-items:baseline;
     gap:2px 9px;font-size:13.5px}
.win .deg{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);
          white-space:nowrap}
.win .pt{font-family:"Barlow Condensed",Archivo,sans-serif;font-weight:600;
         letter-spacing:.05em;color:var(--soft);font-size:12.5px}
.win .edge{grid-column:1/-1;font-size:12px;color:var(--faint)}
/* The bar comes LAST in the row and underlines it. Sitting between the
   degrees and the edge label it read as a divider, and the edge label then
   looked like it belonged to the window below. */
.win .bar{grid-column:1/-1;height:5px;border-radius:999px;margin-top:3px;
          background:var(--sand-deep);min-width:3px}
/* A window with a guessed coordinate on either edge is hatched, for the same
   reason the blocker segments are: the reader has to be able to see WHICH
   claim is soft, not just that the break scores worse. */
.win.soft .bar{background:repeating-linear-gradient(45deg,var(--sand-deep),
               var(--sand-deep) 3px,transparent 3px,transparent 6px);
               outline:1px dashed var(--line-strong)}
/* Between what the swell is doing at a break and the fixed geometry that
   shapes it: everything above the rule changes with the reading, everything
   below it (bar the shares) is the same on every reading. */
.pane hr{border:0;border-top:1px solid var(--line);margin:0;width:100%}

/* The break's windows, drawn facing the way the break faces. The shadows are
   grey, not sand: they are where a blocker casts shadow, not the land itself.
   Greys and ink only, as the Buoys tab's rose is (owner's call, 2026-10-09,
   replacing the site blue): the chord, the break on it and the swell in ink
   -- the things in the drawing that are not geometry-as-obstacle -- and a
   picked window washed in grey. */
.aperture{display:block;width:100%;max-width:420px;height:auto;margin:0 auto;overflow:visible;
  cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.aperture [data-pick]{outline:none}
.aperture .win{fill:var(--soft);fill-opacity:0;stroke:none}
.aperture .win.on{fill-opacity:.3}
.aperture .shadow.on{fill:var(--soft);fill-opacity:.6}
.aperture.picked .shadow:not(.on){fill-opacity:.2}
.aperture.picked .swell:not(.on){opacity:.15}
.aperture .swell.on{opacity:1}
.aperture .swell.on line{stroke-width:3}
.aperture .ray,.aperture .deg,.aperture .faces,.aperture .chord,.aperture .spot{pointer-events:none}
.aperture .sea{fill:none;stroke:var(--line-strong);stroke-width:1} /* = DRAW.rim */
.aperture .shadow{fill:var(--faint);fill-opacity:.38;stroke:none}
.aperture .ray{stroke:var(--soft);stroke-width:1}
.aperture .deg{font-size:11px;font-weight:600;fill:var(--ink);
               font-variant-numeric:tabular-nums;dominant-baseline:middle}
/* The shoreline at the weight of the leading train's shaft, and the break's
   dot scaled with it, twice its width across (owner's request, 2026-10-13:
   4 and r 4 before). */
.aperture .chord{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.aperture .spot{fill:var(--ink)}
.aperture .faces{font-size:11px;font-weight:600;fill:var(--ink);text-anchor:middle}
/* Opacity on the group, so the leg and head fade as one shape rather than
   darkening where they overlap. */
.aperture .swell{opacity:.45}
.aperture .swell line{stroke:var(--ink);stroke-width:1.75;stroke-linecap:round}
.aperture .swell polygon{fill:var(--ink)}
.aperture .swell.lead{opacity:1}
.aperture .swell.lead line{stroke-width:3}
/* The picked train's heading in 5 m of water: an arrowhead alone, in ink,
   at the break, so the turn from the offshore arrow is the refraction. */
.aperture .near{pointer-events:none;fill:var(--ink)}

/* The week under each Now card (forecast.series): the tab's own line only,
   in ink. One axis, thin lines, hairline grid; an hour without a spectrum is a pale band with no
   line through it, so a gap reads as a gap rather than as a dip. */
/* Folded away under a "Charts" line with the calculation's caret
   (owner's design, 2026-09-27): up while closed, down once open. */
.chart{display:flex;flex-direction:column;gap:6px}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
            font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;
            -webkit-user-select:none;user-select:none}
/* The whole line folds the charts out, not only its caret (owner's call,
   2026-09-30); the caret still lights with it. */
.chart-head:hover .calc-toggle{color:var(--ink)}
.origin-fold .chart-head:hover .calc-toggle{color:var(--ink)}
.chart-head .count{margin-left:2px;color:var(--soft);font-weight:400;font-variant-numeric:tabular-nums}
/* The "Charts" line is the last thing on every card, below the provenance,
   under a rule (owner's call, 2026-10-02): 8 px of margin on the card's 2 px
   gap above it, 9 px below. The swell card's gap is wider, so it takes less
   margin to match. The only rule on the card, but for the swell card's Origin
   line on LIVE, which takes one of its own just above. */
.cond > .chart{border-top:1px solid var(--line);padding-top:9px;margin-top:8px}
.cond.swell > .chart{margin-top:2px}
.chart-fold,.chart-body{display:flex;flex-direction:column;gap:6px}
/* Which chart, as a menu (owner's design, 2026-09-27): four views in a row
   of tabs crowded a phone and read as a second set of break tabs. */
/* The menu draws its own up/down carets, pinned to its right edge: the
   native arrow sat wherever each browser put it, on iOS well inside the box. */
.chart .pick-wrap{position:relative;align-self:flex-start;display:inline-flex}
.chart .pick{-webkit-appearance:none;appearance:none;font-weight:600;min-width:168px;
             padding:6px 32px 6px 10px}
.chart .pick:focus-visible{outline:2px solid var(--surf);outline-offset:1px}
.chart .pick-wrap::before,.chart .pick-wrap::after{content:"";position:absolute;right:13px;
  width:5px;height:5px;border:solid var(--soft);border-width:0 1.5px 1.5px 0;pointer-events:none}
.chart .pick-wrap::before{top:calc(50% - 6px);transform:rotate(-135deg)}
.chart .pick-wrap::after{top:calc(50% + 0px);transform:rotate(45deg)}
/* The plot takes sideways swipes and pinches for itself; a vertical swipe
   still scrolls the page. */
.chart .plot{touch-action:pan-y;-webkit-user-select:none;user-select:none}
.chart .under{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.chart .ranges{display:flex;gap:2px}
.chart .ranges button{font:inherit;font-size:12px;font-weight:600;padding:2px 9px;border:0;
                      border-radius:6px;cursor:pointer;background:transparent;color:var(--soft)}
.chart .ranges button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.chart .ranges button:focus-visible{outline:2px solid var(--surf);outline-offset:1px}
.chart .chart-note{font-size:12px;color:var(--faint);align-self:stretch}
.series{display:block;width:100%;height:auto;overflow:visible;cursor:crosshair;
        touch-action:pan-y;-webkit-tap-highlight-color:transparent}
.series:focus-visible{outline:2px solid var(--surf);outline-offset:2px;border-radius:4px}
.series .grid{stroke:var(--line);stroke-width:1}
.series .zero{stroke:var(--line-strong);stroke-width:1}
.series .day{stroke:var(--line);stroke-width:1}
.series .tick{font-size:10px;fill:var(--faint);font-variant-numeric:tabular-nums}
/* The y axis labels sit inside the plot, just above their gridlines, so the
   plot runs to the card's left edge instead of leaving a margin for them. */
.series .ytick{paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
/* Haloed in the card colour, because a line can run through the label. */
.series .side{font-size:10px;fill:var(--soft);paint-order:stroke;stroke:var(--card);
              stroke-width:3px;stroke-linejoin:round}
.series .gapband{fill:var(--line);opacity:.55}
.series .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
/* The tab's own line in ink like every other chart (owner's call,
   2026-09-28). Height alone draws the other two breaks under it, lighter and
   thinner, the more southern of the two dashed (owner's request, 2026-10-05). */
.series .ln{stroke:var(--ink)} .series .pt,.series .hot{fill:var(--ink)}
.series .ln.other{stroke:var(--faint);stroke-width:1.25} .series .pt.other,.series .hot.other{fill:var(--faint)}
.series .ln.other.alt{stroke-dasharray:4 3}
.series .ln.slow{stroke:var(--soft);stroke-width:1}
.series .pt.slow{fill:var(--soft)}
.series .cross{stroke:var(--soft);stroke-width:1}
.series .hot{stroke:var(--card);stroke-width:2}
/* The Window chart's direction strip: the break's open windows shaded, and a
   dot where the buoy's peak came from each hour. */
.series .winband{fill:var(--surf);opacity:.18}
/* The Forecast tab's charts: 46232's own spectrum carried in, in the sea
   blue every measured line under a forecast wears; earlier runs thin and
   soft under this run's ink; the present as a dotted rule; the trains as
   dots, hollow for wind sea, the picked hour's ringed. */
.series .ln.obs{stroke:var(--measured);stroke-width:1.5} .series .pt.obs,.series .hot.obs{fill:var(--measured)}
.series .ln.run{stroke:var(--soft);stroke-width:1;opacity:.6} .series .pt.run{fill:var(--soft);opacity:.6}
.series .nowline{stroke:var(--soft);stroke-width:1;stroke-dasharray:2 3}
.series .nowtick{fill:var(--soft);paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
/* The ensemble: its mean in grey, dashed, over its spread shaded in the same
   grey -- one family, apart from the single run's ink. Grey since 2026-10-09,
   when the measured line beside it took the site blue. */
.series .ln.ens{stroke:var(--soft);stroke-width:1.5;stroke-dasharray:5 3} .series .pt.ens,.series .hot.ens{fill:var(--soft)}
.series .ensband{fill:var(--soft);opacity:.2}
.series .tr{fill:var(--ink);opacity:.75}
.series .tr.ws{fill:var(--card);stroke:var(--ink);stroke-width:1;opacity:.75}
.series .tr.on{opacity:1;stroke:var(--card);stroke-width:1.5}
.series .tr.ws.on{stroke:var(--ink)}
.series .dir{fill:var(--ink)}
.series .og{stroke:var(--soft);stroke-width:3;stroke-linecap:round;opacity:.7}
.series .dir.og{fill:var(--soft);stroke:none;opacity:.7}
.series .hn{fill:var(--ink)} .series .hn.on{stroke:var(--card);stroke-width:1.5}
.series .oglabel{fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
.chart .legend .sw.og{height:3px;color:var(--soft);opacity:.7}
/* The roses under each buoy's reading on the Buoys tab: petals in ink for
   Height; for Period, five greys ordered from the faintest rule (shortest
   periods) to ink (longest), the Shore direction chart's scale with two
   steps between. A hairline of the card's colour parts every segment. */
/* Spaced as a break tab's drawing is (owner's request, 2026-10-09): 31 px of
   card from the trains to the first ink above it, and 28 px from the
   timeline to the provenance on Height, measured in painted pixels at 320,
   360 and 390 px. The Period legend lives inside that lower space -- its row
   kept, unseen, on Height, so the switch never moves the page -- and so sits
   closer to the provenance than the timeline does. A context buoy's
   provenance follows the rose inside its pane, a gap 3 px wider than
   46232's, whose provenance follows the card; its 6 px margin is 3 here. */
.rose{display:flex;flex-direction:column;gap:6px;margin-top:20px;margin-bottom:-11px}
.pane .rose + .srcs{margin-top:3px}
.rose .ranges{display:flex;gap:2px}
.rose .rose-modes{flex:none}
.rose .ranges button{font:inherit;font-size:12px;font-weight:600;height:22px;padding:0 9px;border:0;
  border-radius:6px;cursor:pointer;background:transparent;color:var(--soft)}
/* Under the rose: play / pause, the six hours, then the ft / s switch, all
   three buttons one height (22 px). */
/* One line under the rose: the ring spacing, then the frame's time and what
   it holds. Room is kept for two lines, so a frame whose line wraps on a
   narrow phone never moves the timeline under it while the loop plays. */
.rose .rose-scale{font-size:12px;line-height:1.4;min-height:2.8em;color:var(--soft);text-align:center;
  font-variant-numeric:tabular-nums}
.rose .rose-scale .rs{white-space:nowrap}
.rose .rose-scale .v{color:var(--ink)} .rose .rose-scale .v .unit{color:var(--soft)}
.rose .rose-time{display:flex;align-items:center;gap:6px;width:100%;max-width:340px;margin:0 auto}
.rose .rose-play{flex:none;display:inline-flex;align-items:center;justify-content:center;width:28px;height:22px;
  padding:0;border:0;border-radius:6px;cursor:pointer;background:var(--paper);color:var(--ink)}
.rose .rose-play svg{width:12px;height:12px;fill:currentColor}
.rose .ranges button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.rose button:focus-visible,.rose .rose-line:focus-visible{outline:2px solid var(--surf);outline-offset:1px}
/* A tap focuses the timeline too, and the browser rings an SVG on any focus;
   only the keyboard's focus is ringed, in the page's blue. */
.rose .rose-line:focus:not(:focus-visible){outline:none}
/* 260 px across: the circle 21% wider than when the compass points sat
   outside it, the block 20 px shorter (owner's choice C, 2026-10-08). */
.rose-svg{display:block;width:100%;max-width:260px;height:auto;margin:0 auto;overflow:visible}
/* Rings and axes in the break drawing's semicircle grey (.aperture .sea), and
   N / E / S / W in its headings' ink and weight (owner's request, 2026-10-15). */
.rose-svg .ring{fill:none;stroke:var(--line-strong);stroke-width:1}
/* A halo in the card's colour, so a ring, an axis or a petal under a point
   never hides it. */
.rose-svg .pt{font-size:10px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:3px;
  stroke-linejoin:round}
.rose-svg .rp{fill:var(--ink);opacity:.85;stroke:var(--card);stroke-width:.75}
.rose-svg .rb{stroke:var(--card);stroke-width:.75}
/* A lit period range in ink over the whole rose, dimmed beneath it. */
.rose-svg .dim{opacity:.3}
.rose-svg .rt{fill:var(--ink);stroke:var(--card);stroke-width:.75}
.rose-svg .rb0,.rose .legend .sw.rb0{fill:var(--line-strong);background:var(--line-strong)}
.rose-svg .rb1,.rose .legend .sw.rb1{fill:var(--faint);background:var(--faint)}
.rose-svg .rb2,.rose .legend .sw.rb2{fill:var(--soft);background:var(--soft)}
.rose-svg .rb3,.rose .legend .sw.rb3{fill:color-mix(in srgb,var(--soft),var(--ink));
  background:color-mix(in srgb,var(--soft),var(--ink))}
.rose-svg .rb4,.rose .legend .sw.rb4{fill:var(--ink);background:var(--ink)}
.rose-line{display:block;flex:1;min-width:0;height:auto;cursor:pointer;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.rose-line .base{stroke:var(--line-strong);stroke-width:1}
.rose-line .tk{stroke:var(--faint);stroke-width:1.5}
.rose-line .tk.on{stroke:var(--ink);stroke-width:2.5}
.rose-line .head{stroke:var(--soft);stroke-width:1;stroke-dasharray:2 2}
.rose-line .tt{font-size:9px;fill:var(--faint);font-variant-numeric:tabular-nums}
.rose .legend{display:flex;flex-wrap:wrap;justify-content:center;gap:3px 10px;font-size:12px;color:var(--soft);
  font-variant-numeric:tabular-nums}
.rose .legend span{white-space:nowrap}
.rose .legend.off{visibility:hidden}
.rose .legend .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 4px 0 0}

/* A reading past the three-hour stale limit greys its numbers (owner's call,
   2026-10-25; `agedAttr`): every text in one shade, --faint, which is a
   secondary train's heading within a few steps on both themes, so the
   secondary rows lose their fade. Weights are kept. On the drawing only the
   leading train's arrow greys. The id outranks every card rule it replaces. */
#conditions [data-aged-at].aged,#conditions [data-aged-at].aged *{color:var(--faint)}
#conditions .trains.aged .train{opacity:1}
#conditions .aperture.aged .swell.lead line{stroke:var(--faint)}
#conditions .aperture.aged .swell.lead polygon{fill:var(--faint)}
/* A rose frame that went past it unreplaced (`roseAged`): its petals and
   the line under them, never the rings or the points. Period's five bands keep their order, from
   the faintest rule up to --faint where they ran up to ink. */
.rose-svg.aged .rp,.rose-svg.aged .rt,.rose-svg.aged .rb4{fill:var(--faint)}
.rose-svg.aged .rb1{fill:color-mix(in srgb,var(--line-strong) 75%,var(--faint))}
.rose-svg.aged .rb2{fill:color-mix(in srgb,var(--line-strong),var(--faint))}
.rose-svg.aged .rb3{fill:color-mix(in srgb,var(--line-strong) 25%,var(--faint))}
.rose .rose-scale.aged,.rose .rose-scale.aged .v,.rose .rose-scale.aged .v .unit{color:var(--faint)}
/* The Wind and Tide cards' charts: gusts as dots, the measured direction in
   the measured blue, and the Now tab's predicted tide dashed and soft -- the
   one modelled line on that tab. */
.series .gust{fill:var(--ink);opacity:.55} .series .gust.obs{fill:var(--measured);opacity:.8}
.series .dir.obs{fill:var(--measured)}
/* Shore direction, in greys only (owner's call, 2026-10-01): an ordered
   scale from the page's ink for offshore down to the faintest rule for
   onshore, and light or variable -- no side worth naming -- an empty
   outline rather than a fourth shade. */
.series .sh-off,.chart .legend .sw.sh-off{fill:var(--ink);background:var(--ink)}
.series .sh-cross,.chart .legend .sw.sh-cross{fill:var(--soft);background:var(--soft)}
.series .sh-on,.chart .legend .sw.sh-on{fill:var(--line-strong);background:var(--line-strong)}
.series .sh-still{fill:none;stroke:var(--line-strong);stroke-width:1}
.chart .legend .sw.sh-still{background:none;border:1px solid var(--line-strong)}
.chart .legend .sw.sh-off,.chart .legend .sw.sh-cross,.chart .legend .sw.sh-on,.chart .legend .sw.sh-still{
  height:9px;width:9px;border-radius:2px;margin:0 6px 0 3px}
.series .sh-on-hour{fill:none;stroke:var(--ink);stroke-width:1.25}
/* Daily range: one bar a day from its low to its high, in the page's soft
   grey, the forecast's picked day (or the one under the pointer) in ink. */
.series .rangebar{fill:var(--soft);opacity:.55} .series .rangebar.on{fill:var(--ink);opacity:1}
/* Night behind the Tide chart (forecast.daylight): the faintest wash, so a
   low tide in the dark reads apart from one at dawn without hiding the line. */
.series .nightband{fill:var(--ink);opacity:.07}
.chart .legend .sw.nightband{height:9px;width:14px;border-radius:2px;background:var(--ink);opacity:.18}
/* GFS-Wave's own wind on the Forecast tab's wind chart: the model's, at the
   buoy, drawn under the local forecast in the page's soft grey. */
.series .ln.model{stroke:var(--soft);stroke-width:1.5} .series .pt.model,.series .hot.model{fill:var(--soft)}
.series .dir.model{fill:var(--soft);opacity:.7}
.chart .legend .sw.model{color:var(--soft);height:1.5px}
.series .ln.pred{stroke:var(--soft);stroke-width:1.5;stroke-dasharray:4 3} .series .pt.pred{fill:var(--soft)}
.series .lane{stroke:var(--line-strong);stroke-width:1}
.chart .legend{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:12px;color:var(--soft)}
.chart .legend .sw{display:inline-block;width:16px;height:2px;border-radius:1px;
                   vertical-align:middle;margin-right:6px;background:var(--surf)}
.chart .legend .sw.main{color:var(--ink)} .chart .legend .sw.slow{color:var(--soft);height:1.5px}
.chart .legend .sw.other{color:var(--faint);height:1.5px}
.chart .legend .sw.other.alt{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px)}
.chart .legend .sw{background:currentColor}
.chart .legend .sw.winband{height:9px;border-radius:2px;color:var(--surf);opacity:.18}
.chart .legend .sw.obs{color:var(--measured)} .chart .legend .sw.run{color:var(--soft);height:1px;opacity:.8}
.chart .legend .sw.ens{height:1.5px;color:var(--soft);
                       background:repeating-linear-gradient(90deg,currentColor 0 5px,transparent 5px 8px)}
.chart .legend .sw.ensband{height:9px;border-radius:2px;color:var(--soft);opacity:.3}
.chart .legend .sw.dot{width:7px;height:7px;border-radius:50%;margin:0 8px 0 5px;color:var(--ink)}
.chart .legend .sw.ring{width:7px;height:7px;border-radius:50%;margin:0 8px 0 5px;background:transparent;
                        border:1px solid var(--ink)}
.chart .legend .sw.dir{width:6px;height:6px;border-radius:50%;margin:0 8px 0 5px;color:var(--ink)}
.chart .legend .sw.gdot{width:5px;height:5px;border-radius:50%;margin:0 8px 0 5px;color:var(--ink);opacity:.55}
.chart .legend .sw.pred{height:1.5px;color:var(--soft);
                        background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px)}
/* Above the plot, and tall enough for three lines -- its longest reading at
   phone width -- so the plot never jumps under a finger as a reading grows
   onto a third line while scrubbing (owner's call, 2026-09-30). */
.chart .readout{font-size:13px;line-height:1.45;color:var(--soft);font-variant-numeric:tabular-nums;
                min-height:calc(3 * 1.45em);display:flex;flex-direction:column;justify-content:flex-end}
/* The text sits at the foot of that room, against the plot, and a longer
   reading grows upward toward the menu (owner's design, 2026-09-28). */
.chart .readout b{color:var(--ink);font-weight:600}
.chart .readout .v{color:var(--ink);font-weight:600}
.chart .readout .v.obs{color:var(--measured)}
.chart .readout .v .unit{color:inherit;font-weight:400}

table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:4px 5px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--soft);font-weight:600;font-size:12px}


/* The build's notes: greys on the backdrop, a warning triangle the one mark
   (owner's call, 2026-10-22, replacing a red wash and dashed border).
   overflow-wrap: a note once carried a URL with no break in it, and it ran
   past the card on a phone (2026-10-22). */
.warn{font-size:13px;color:var(--soft);border:1px solid var(--line-strong);
      border-radius:var(--r);padding:9px 11px;margin:0;overflow-wrap:anywhere}
#warnings:not([hidden]){display:flex;align-items:flex-start;gap:8px}
#warnings svg{flex:none;width:16px;height:16px;margin-top:.5px;color:var(--faint)}
a{color:var(--surf)}
/* The foot of the page (owner's design, 2026-10-28): ONE line, Docs |
   Observer | Units | the theme glyph at its right end, short bars between,
   spread over the Briefing line's own width (owner's call, 2026-10-29):
   Docs under its words, the glyph's ink under its caret's (the glyph's
   right margin 3 px short of its left to land there), on the backdrop with
   no rule above, as the Briefing's line has none. Docs in ink at the
   line's weight, the page's one link. In that 13 px inset the barred line
   needs 370 px of phone, so below it the bars go and the gaps close, which
   keeps it one line at 320. Line height 1, so its words centre on their
   boxes as the chip's word does: at the page's 1.5 they read 1.25 px
   above it. */
.links{margin:0;font-size:13px;line-height:1;color:var(--soft);display:flex;justify-content:space-between;align-items:center;
       gap:12px;flex-wrap:nowrap;white-space:nowrap;padding:0 13px}
.links a{color:var(--ink);text-decoration:none}
.links a:focus-visible,.links button:focus-visible{outline:2px solid var(--surf);outline-offset:2px;border-radius:4px}
.links .bar{width:1px;height:14px;background:var(--line-strong);flex:none}
@media (max-width:369px){ .links{gap:8px} .links .bar{display:none} }
/* Observer: a real checkbox, drawn as a small switch. */
.links .logger{position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
.links .logger input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.links .logger .sw{position:relative;width:28px;height:16px;border-radius:8px;background:var(--line-strong);
                   transition:background-color .2s;flex:none}
.links .logger .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;
                          background:var(--card);transition:transform .2s}
.links .logger input:checked + .sw{background:var(--ink)}
.links .logger input:checked + .sw::after{transform:translateX(12px)}
.links .logger input:focus-visible + .sw{outline:2px solid var(--surf);outline-offset:2px}
/* Units: a chip that shows the setting, a tap moving on. All three words in
   one grid cell, the two unset unseen, so it is always as wide as
   "Imperial" and a tap never moves the centred line. The cell centres its
   word on a line box of the text alone, and a 0.3 px drop centres cap
   height to baseline in the chip: without it the word sat ~0.4 px high
   (measured at 4x, 2026-10-28). A transform, because padding snaps to the
   pixel. */
.links .units{display:inline-flex;align-items:center;gap:6px}
.links .units button{display:inline-grid;place-items:center;height:22px;padding:0 7px;margin:0;
                     border:1px solid var(--line-strong);border-radius:5px;background:transparent;
                     font:inherit;font-size:12.5px;line-height:1;color:var(--ink);cursor:pointer;
                     -webkit-tap-highlight-color:transparent}
.links .units button > span{grid-area:1/1;transform:translateY(.3px)}
.links .units button > span:not(.on){visibility:hidden}
/* Theme: one glyph, a half-lit disc, its lit half turned to the theme a
   tap gives. 18 px drawn in a 32 px target. */
.links .theme{display:grid;place-items:center;width:32px;height:32px;margin:-7px -4px -7px -7px;padding:0;border:0;
              background:none;color:var(--soft);cursor:pointer;-webkit-tap-highlight-color:transparent}
.links .theme:hover{color:var(--ink)}
.links .theme svg{display:block;width:18px;height:18px;transition:transform .35s ease}
:root[data-theme="dark"] .links .theme svg{transform:rotate(180deg)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .links .theme svg{transform:rotate(180deg)} }
@media (prefers-reduced-motion: reduce){
  .links .theme svg,.links .logger .sw,.links .logger .sw::after{transition:none}
}
select{font:inherit;font-size:14px;padding:5px 8px;border-radius:8px;border:1px solid var(--line-strong);
       background:var(--card);color:var(--ink)}
@media(max-width:380px){
  h1{font-size:29px}
  /* Four tabs in 290 px, and the fallback font is wider than Barlow. */
  .subtabs button{font-size:13px;letter-spacing:.02em;padding:6px 2px}
}

<div class="wrap">

       measurements; Forecast is built only from a model. They share the

  <nav class="tabs" role="tablist" aria-label="Live or forecast">

     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path
