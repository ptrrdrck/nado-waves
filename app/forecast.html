<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nado Waves — Coronado</title>
<meta name="description" content="Physically derived swell aperture for Coronado's three breaks. Not a verified forecast.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  --paper:#EAEEEC; --card:#F6F8F7; --ink:#16232B; --soft:#53656E; --faint:#7C8C93;
  --line:#CBD5D1; --line-strong:#AFBDB8;
  --surf:#1565C0; --surf-ink:#FFFFFF; --surf-wash:#DCE7F7;
  --sand:#D9C9A8; --sand-deep:#B9A47C;
  --signal:#C62828; --signal-wash:#F9DEDE;
  --ok:#2F7D4F;
  --measured:#0A7A56;
  --shadow:0 1px 2px rgba(22,35,43,.08), 0 4px 14px rgba(22,35,43,.06);
  --r:10px;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --paper:#0E1A20; --card:#152630; --ink:#E4ECE9; --soft:#9DB0B7; --faint:#7A8D95;
    --line:#283C46; --line-strong:#3A525E;
    --surf:#6FB3F7; --surf-ink:#08203A; --surf-wash:#12283D;
    --sand:#8C7A55; --sand-deep:#A8935F;
    --signal:#FF6B6B; --signal-wash:#3A1C1C;
    --ok:#5FBF86;
    --measured:#3EDB9E;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1A20; --card:#152630; --ink:#E4ECE9; --soft:#9DB0B7; --faint:#7A8D95;
  --line:#283C46; --line-strong:#3A525E;
  --surf:#6FB3F7; --surf-ink:#08203A; --surf-wash:#12283D;
  --sand:#8C7A55; --sand-deep:#A8935F;
  --signal:#FF6B6B; --signal-wash:#3A1C1C;
  --ok:#5FBF86;
  --measured:#3EDB9E;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--paper); color:var(--ink);
  font:400 17px/1.5 Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-text-size-adjust:100%; padding:0 16px 48px; margin:0;
}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:18px 0}
h1{font-family:"Barlow Condensed",Archivo,sans-serif;font-weight:700;font-size:34px;
   line-height:1.02;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-family:"Barlow Condensed",Archivo,sans-serif;font-weight:700;font-size:21px;
   letter-spacing:.01em;margin:0}
.lbl{font-family:"Barlow Condensed",Archivo,sans-serif;font-weight:600;text-transform:uppercase;
     letter-spacing:.09em;font-size:14px;color:var(--soft)}
header{display:flex;flex-direction:column;gap:9px;border-bottom:1px solid var(--line);padding-bottom:14px}
.head-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* The two chains. A segmented control rather than a dropdown: there are
   exactly two and the choice is the first thing a reader makes. */
.tabs{display:flex;gap:0;background:var(--card);border:1px solid var(--line);
      border-radius:var(--r);padding:3px;box-shadow:var(--shadow)}
.tabs button{flex:1;font:inherit;font-family:"Barlow Condensed",Archivo,sans-serif;
             font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:15px;
             padding:9px 6px;border:0;border-radius:calc(var(--r) - 3px);cursor:pointer;
             background:transparent;color:var(--soft)}
.tabs button[aria-selected="true"]{background:var(--surf);color:var(--surf-ink)}
.tabs button:focus-visible{outline:2px solid var(--surf);outline-offset:2px}

/* A card whose contents just changed on a refresh.
   The border and a wash carry the card; the value and the provenance line
   brighten with them, so the eye lands on what moved rather than on the box.
   Both settle back to the resting colour rather than to a literal, so the
   animation is correct in either theme without being written twice. */
@keyframes freshen {
  from { border-color: var(--surf); background: var(--surf-wash); }
}
@keyframes freshen-ink {
  from { color: var(--surf); }
}
.cond.fresh { animation: freshen 1.8s ease-out; }
.cond.fresh .val, .cond.fresh .src { animation: freshen-ink 1.8s ease-out; }

/* An update is worth noticing, not worth enduring. */
@media (prefers-reduced-motion: reduce) {
  .cond.fresh, .cond.fresh .val, .cond.fresh .src { animation: none; }
}

/* "Update in m:ss", the last provenance line on a Now card. Muted
   while it counts down; the signal colour once the update it promised has not
   arrived, beside the reading it qualifies rather than in a banner over all
   three. `nowrap` because a clock broken across two lines is unreadable. */
.due{white-space:nowrap}
/* Normal weight: the colour carries this on its own. --signal is picked for
   contrast rather than heat (5.3:1 on the card in light, 5.6:1 in dark), which
   matters more without the bolding to lean on. */
.due.over{color:var(--signal)}

/* A stale observation is not "now". Loud, above everything it qualifies. */
.stale{background:var(--signal-wash);border:1px solid var(--signal);color:var(--ink);
       border-radius:var(--r);padding:10px 12px;font-size:13.5px;margin:0}
.stale b{color:var(--signal)}

/* Conditions strip: one fact per line, its source under it. */
.conditions{display:flex;flex-direction:column;gap:10px}
.cond{display:flex;flex-direction:column;gap:2px;padding:11px 13px;background:var(--card);
      border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.cond .lbl{font-size:12.5px}
.cond .val{font-size:19px;font-weight:600;line-height:1.25}
.cond .val .unit{font-size:15px}
/* Metric, in parentheses after the imperial value it restates. */
.unit{font-weight:400;color:var(--soft)}
.cond .src{font-size:12px;color:var(--faint)}
/* A rule above the provenance lines on every card, both tabs (owner's
   design, 2026-09-27): what the card says above it, where it came from below
   -- which matters most under a past hour, where a green measured box would
   otherwise run straight into the forecast's provenance. The swell card's
   own gap is wider, so it takes less margin to land in the same place. */
.cond .srcs{display:flex;flex-direction:column;gap:2px;
            border-top:1px solid var(--line);padding-top:9px;margin-top:8px}
.cond.swell .srcs{margin-top:2px}
/* A number inside a provenance line ("of 3.8 ft (1.15 m) at the buoy") stays
   in that line's grey; the darker metric would lift it out of the footnote. */
.cond .src .unit{color:inherit}

/* The swell card holds the three breaks and the buoy as tabs. Quieter than
   the Now/Forecast control above it, so the two levels of choice never read
   as the same control: a raised chip on a sunken track rather than a solid
   fill. `nowrap` because a buoy's name split over two lines at phone width
   reads as two tabs. */
.cond.swell{gap:8px}
.subtabs{display:flex;gap:3px;background:var(--paper);border:1px solid var(--line);
         border-radius:8px;padding:3px}
.subtabs button{flex:1 1 auto;font:inherit;font-family:"Barlow Condensed",Archivo,sans-serif;
                font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:14px;
                padding:6px 4px;border:0;border-radius:6px;cursor:pointer;white-space:nowrap;
                background:transparent;color:var(--soft)}
.subtabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.subtabs button:focus-visible{outline:2px solid var(--surf);outline-offset:1px}
.pane{display:flex;flex-direction:column;gap:11px;padding-top:4px}
/* Where the tide is going next. Dim like any other supporting line, with the
   direction itself at full ink because that is the word being read. */
/* Inline, not flex: the height carries its own metric span and flex would
   make that a separate item with a gap in front of it, splitting "3.8 ft"
   from "(1.16 m)" that every other number on the page keeps together. */
.cond .turn{font-size:13.5px;color:var(--soft)}
.cond .turn b{color:var(--ink);font-weight:600}
.cond .turn .tag{font-size:11px;color:var(--faint);text-transform:uppercase;
                 letter-spacing:.06em;margin-left:5px;white-space:nowrap}

/* Wave trains. A spectrum is two or three swells plus a wind sea, and which
   one leads at a break need not be the one leading at the buoy — so they are
   listed rather than collapsed into a single "dominant". */
.trains{display:flex;flex-direction:column;gap:3px;margin-top:3px}
.train{display:flex;align-items:baseline;gap:8px;font-size:14px;
       font-variant-numeric:tabular-nums}
.train .ht{font-weight:600;min-width:112px}
.train .tp{color:var(--soft);min-width:48px}
.train .dr{color:var(--soft);flex:1;white-space:nowrap}
.train .tag{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.train.lead .ht,.train.lead .dr{color:var(--ink)}
.train:not(.lead){opacity:.72}
/* The break card's headline with its caret at the right end. The caret
   points up while the calculation is folded away and down once it is open
   beneath the line (owner's design, 2026-09-26). */
.val-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.calc-toggle{flex:none;display:grid;place-items:center;width:32px;height:32px;margin:-4px -6px -4px 0;
             padding:0;border:0;border-radius:6px;background:transparent;color:var(--soft);cursor:pointer}
.calc-toggle:hover{color:var(--ink)}
.calc-toggle:focus-visible{outline:2px solid var(--surf);outline-offset:1px}
.calc-toggle svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;
                 stroke-linecap:round;stroke-linejoin:round;transition:transform .15s ease-out}
.calc-toggle[aria-expanded="true"] svg{transform:rotate(180deg)}
@media (prefers-reduced-motion: reduce){ .calc-toggle svg{transition:none} }
/* The calculation, one effect per row. Heights in the leading train's ink and
   weight, the metric under the imperial so four columns fit a phone. */
.calc-fold{display:flex;flex-direction:column;gap:6px}
.calc-table th[scope="row"]{font-weight:400;color:var(--soft);font-size:13px;vertical-align:top}
.calc-table th[scope="row"] .unit{display:block;font-size:11.5px;color:var(--faint)}
.calc-table td{color:var(--ink);font-weight:600;vertical-align:top}
.calc-table td .unit{display:block;font-size:11.5px}
.calc-table tbody tr:last-child td{border-bottom:0}
.calc-table tbody tr:last-child th{border-bottom:0}

/* The measured reading under a past forecast hour: 46232's own spectrum at
   that hour, carried in by the same chain (info.html says so). Sea green, in
   a 1 px outline at the card's radius (owner's style, 2026-09-27), so it can
   never be read as part of the forecast above it; its label names the hour
   it was observed on every line, not once per page. */
.measured{display:flex;flex-direction:column;gap:1px;padding:6px 10px;
          background:transparent;border:1px solid var(--measured);
          border-radius:var(--r);color:var(--measured);font-variant-numeric:tabular-nums}
.measured .lbl{font-size:12px;color:var(--measured)}
.measured .mval{font-size:17px;font-weight:600;line-height:1.25}
.measured .mval .unit,.measured .mpeak{color:var(--measured);font-size:13.5px;font-weight:400}
.measured.none{font-size:13px}
/* On the wind and tide cards the box sits straight under the value, in the
   card's 2 px gap; the swell card's pane gives its box 11 px. */
.cond > .measured{margin-top:8px}

/* Earlier / later seek bar. */
.seek{display:flex;align-items:stretch;gap:8px}
.seek button{flex:none;width:46px;font:inherit;font-size:19px;line-height:1;cursor:pointer;
             background:var(--card);color:var(--ink);border:1px solid var(--line-strong);
             border-radius:var(--r);box-shadow:var(--shadow)}
.seek button:hover:not(:disabled){border-color:var(--surf);color:var(--surf)}
.seek button:disabled{opacity:.38;cursor:default}
.seek-when{position:relative;flex:1;display:flex;align-items:center;justify-content:center;
           text-align:center;background:var(--card);border:1px solid var(--line);
           border-radius:var(--r);box-shadow:var(--shadow);padding:9px 6px;
           font-family:"Barlow Condensed",Archivo,sans-serif;font-weight:600;
           font-size:18px;letter-spacing:.01em}
/* The real control, invisible but on top, so a tap opens the native list. */
.seek-when select{position:absolute;inset:0;width:100%;height:100%;opacity:0;
                  border:0;padding:0;cursor:pointer;font:inherit}
.seek-when:focus-within{outline:2px solid var(--surf);outline-offset:2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
      padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:11px}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.quiet{font-size:13.5px;color:var(--soft)}
.quiet b{color:var(--ink);font-weight:600}
.rows{display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.row{display:flex;align-items:flex-start;gap:8px}
.row .who{flex:1;min-width:0}
.row .amt{font-variant-numeric:tabular-nums;color:var(--soft);padding-top:1px}
.seg{display:block;margin-top:7px;height:8px;border-radius:999px;background:var(--sand-deep);width:44px;flex:none}
/* An estimated coordinate is hatched, never just a lighter shade: after
   BRIEFING s10 the islands are a small energy share rather than a switch, so
   the mark has to read as "this edge is a guess", not "this break is worse". */
.seg.guess{background:repeating-linear-gradient(45deg,var(--sand-deep),var(--sand-deep) 3px,transparent 3px,transparent 6px);
           outline:1px dashed var(--line-strong)}
/* The seaward clip is not land. It is the half of the compass a beach cannot
   face, and showing it in the same colour as a headland invites the reader to
   go looking for an island that is not there. */
.seg.horizon{background:var(--line-strong);opacity:.65}
.est{color:var(--faint);font-size:12px}

/* The windows lead the card, so they get the only tabular block in it. The
   BAR is the point: the three arcs are 23, 6 and 42 degrees wide, and three
   identical rows of numbers would read as three equivalent openings. Width is
   proportional to span within the card, never across cards -- a reader
   compares this break's arcs to each other here, and compares breaks by the
   numbers. */
.wins{display:flex;flex-direction:column;gap:9px}
.win{display:grid;grid-template-columns:auto 1fr;align-items:baseline;
     gap:2px 9px;font-size:13.5px}
.win .deg{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);
          white-space:nowrap}
.win .pt{font-family:"Barlow Condensed",Archivo,sans-serif;font-weight:600;
         letter-spacing:.05em;color:var(--soft);font-size:12.5px}
.win .edge{grid-column:1/-1;font-size:12px;color:var(--faint)}
/* The bar comes LAST in the row and underlines it. Sitting between the
   degrees and the edge label it read as a divider, and the edge label then
   looked like it belonged to the window below. */
.win .bar{grid-column:1/-1;height:5px;border-radius:999px;margin-top:3px;
          background:var(--sand-deep);min-width:3px}
/* A window with a guessed coordinate on either edge is hatched, for the same
   reason the blocker segments are: the reader has to be able to see WHICH
   claim is soft, not just that the break scores worse. */
.win.soft .bar{background:repeating-linear-gradient(45deg,var(--sand-deep),
               var(--sand-deep) 3px,transparent 3px,transparent 6px);
               outline:1px dashed var(--line-strong)}
/* Between what the swell is doing at a break and the fixed geometry that
   shapes it: everything above the rule changes with the reading, everything
   below it (bar the shares) is the same on every reading. */
.pane hr{border:0;border-top:1px solid var(--line);margin:0;width:100%}

/* The break's windows, drawn facing the way the break faces. The shadows are
   grey, not sand: they are where a blocker casts shadow, not the land itself.
   The chord and the break on it are the site blue, and so is the swell --
   the two things in the drawing that are not geometry-as-obstacle. */
.aperture{display:block;width:100%;max-width:420px;height:auto;margin:0 auto;overflow:visible;
  cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.aperture [data-pick]{outline:none}
.aperture .win{fill:var(--surf);fill-opacity:0;stroke:none}
.aperture .win.on{fill-opacity:.16}
.aperture .shadow.on{fill:var(--soft);fill-opacity:.6}
.aperture.picked .shadow:not(.on){fill-opacity:.2}
.aperture.picked .swell:not(.on){opacity:.15}
.aperture .swell.on{opacity:1}
.aperture .swell.on line{stroke-width:3}
.aperture .ray,.aperture .deg,.aperture .faces,.aperture .chord,.aperture .spot{pointer-events:none}
.aperture .sea{fill:none;stroke:var(--line-strong);stroke-width:1} /* = DRAW.rim */
.aperture .shadow{fill:var(--faint);fill-opacity:.38;stroke:none}
.aperture .ray{stroke:var(--soft);stroke-width:1}
.aperture .deg{font-size:11px;font-weight:600;fill:var(--ink);
               font-variant-numeric:tabular-nums;dominant-baseline:middle}
.aperture .chord{stroke:var(--surf);stroke-width:4;stroke-linecap:round}
.aperture .spot{fill:var(--surf)}
.aperture .faces{font-size:11px;font-weight:600;fill:var(--ink);text-anchor:middle}
/* Opacity on the group, so the leg and head fade as one shape rather than
   darkening where they overlap. */
.aperture .swell{opacity:.45}
.aperture .swell line{stroke:var(--surf);stroke-width:1.75;stroke-linecap:round}
.aperture .swell polygon{fill:var(--surf)}
.aperture .swell.lead{opacity:1}
.aperture .swell.lead line{stroke-width:3}

/* The week under each Now card (forecast.series): the tab's own line only,
   in ink. One axis, thin lines, hairline grid; an hour without a spectrum is a pale band with no
   line through it, so a gap reads as a gap rather than as a dip. */
/* Folded away under a "Charts" line with the calculation's caret
   (owner's design, 2026-09-27): up while closed, down once open. */
.chart{display:flex;flex-direction:column;gap:6px}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
            font-size:14.5px;font-weight:600;color:var(--ink)}
.chart-fold,.chart-body{display:flex;flex-direction:column;gap:6px}
/* Which chart, as a menu (owner's design, 2026-09-27): four views in a row
   of tabs crowded a phone and read as a second set of break tabs. */
/* The menu draws its own up/down carets, pinned to its right edge: the
   native arrow sat wherever each browser put it, on iOS well inside the box. */
.chart .pick-wrap{position:relative;align-self:flex-start;display:inline-flex}
.chart .pick{-webkit-appearance:none;appearance:none;font-weight:600;min-width:168px;
             padding:6px 32px 6px 10px}
.chart .pick:focus-visible{outline:2px solid var(--surf);outline-offset:1px}
.chart .pick-wrap::before,.chart .pick-wrap::after{content:"";position:absolute;right:13px;
  width:5px;height:5px;border:solid var(--soft);border-width:0 1.5px 1.5px 0;pointer-events:none}
.chart .pick-wrap::before{top:calc(50% - 6px);transform:rotate(-135deg)}
.chart .pick-wrap::after{top:calc(50% + 0px);transform:rotate(45deg)}
/* The plot takes sideways swipes and pinches for itself; a vertical swipe
   still scrolls the page. */
.chart .plot{touch-action:pan-y;-webkit-user-select:none;user-select:none}
.chart .under{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.chart .ranges{display:flex;gap:2px}
.chart .ranges button{font:inherit;font-size:12px;font-weight:600;padding:2px 9px;border:0;
                      border-radius:6px;cursor:pointer;background:transparent;color:var(--soft)}
.chart .ranges button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.chart .ranges button:focus-visible{outline:2px solid var(--surf);outline-offset:1px}
.chart .chart-note{font-size:12px;color:var(--faint);align-self:stretch}
.series{display:block;width:100%;height:auto;overflow:visible;cursor:crosshair;
        touch-action:pan-y;-webkit-tap-highlight-color:transparent}
.series:focus-visible{outline:2px solid var(--surf);outline-offset:2px;border-radius:4px}
.series .grid{stroke:var(--line);stroke-width:1}
.series .zero{stroke:var(--line-strong);stroke-width:1}
.series .day{stroke:var(--line);stroke-width:1}
.series .tick{font-size:10px;fill:var(--faint);font-variant-numeric:tabular-nums}
/* The y axis labels sit inside the plot, just above their gridlines, so the
   plot runs to the card's left edge instead of leaving a margin for them. */
.series .ytick{paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
/* Haloed in the card colour, because a line can run through the label. */
.series .side{font-size:10px;fill:var(--soft);paint-order:stroke;stroke:var(--card);
              stroke-width:3px;stroke-linejoin:round}
.series .gapband{fill:var(--line);opacity:.55}
.series .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
/* One line, the tab's own, in ink like every other chart (owner's call,
   2026-09-28): comparing breaks is for another part of the page. */
.series .ln{stroke:var(--ink)} .series .pt,.series .hot{fill:var(--ink)}
.series .ln.slow{stroke:var(--soft);stroke-width:1}
.series .pt.slow{fill:var(--soft)}
.series .cross{stroke:var(--soft);stroke-width:1}
.series .hot{stroke:var(--card);stroke-width:2}
/* The Window chart's direction strip: the break's open windows shaded, and a
   dot where the buoy's peak came from each hour. */
.series .winband{fill:var(--surf);opacity:.18}
.series .dir{fill:var(--ink)}
.series .lane{stroke:var(--line-strong);stroke-width:1}
.chart .legend{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:12px;color:var(--soft)}
.chart .legend .sw{display:inline-block;width:16px;height:2px;border-radius:1px;
                   vertical-align:middle;margin-right:6px;background:var(--surf)}
.chart .legend .sw.main{color:var(--ink)} .chart .legend .sw.slow{color:var(--soft);height:1.5px}
.chart .legend .sw{background:currentColor}
.chart .legend .sw.winband{height:9px;border-radius:2px;color:var(--surf);opacity:.18}
.chart .legend .sw.dir{width:6px;height:6px;border-radius:50%;margin:0 8px 0 5px;color:var(--ink)}
/* Above the plot, and tall enough for its longest reading, so the plot never
   jumps under a finger as the values change. */
.chart .readout{font-size:13px;line-height:1.45;color:var(--soft);font-variant-numeric:tabular-nums;
                min-height:calc(2 * 1.45em);display:flex;flex-direction:column;justify-content:flex-end}
/* The text sits at the foot of that room, against the plot, and a longer

.chart .readout b{color:var(--ink);font-weight:600}

</style>

<div class="wrap">
  <!-- Two evidence chains, not two views of one. Now is built only from
       measurements; Forecast is built only from a model. They share the
       geometry and nothing else, which is why each carries its own
       "standing on" block on info.html. -->
  <nav class="tabs" role="tablist" aria-label="Now or forecast">
    <button type="button" id="tab-now" role="tab" aria-selected="true"
            aria-controls="panel">Now</button>
    <button type="button" id="tab-forecast" role="tab" aria-selected="false"
            aria-controls="panel">Forecast</button>
  </nav>

  <p class="warn" id="warnings" hidden></p>
  <p class="stale" id="stale" hidden></p>

  <!-- Earlier / later, with the hour between them. The full list is still a
       real <select>, laid transparently over the label, so the native picker
       opens on tap and the control stays keyboard-reachable. -->
  <nav class="seek" id="seek" aria-label="Forecast hour" hidden>
    <button type="button" id="earlier" aria-label="Earlier">&#8592;</button>
    <span class="seek-when">
      <span id="when-label">&hellip;</span>
      <select id="when" aria-label="Choose forecast hour"></select>
    </span>
    <button type="button" id="later" aria-label="Later">&#8594;</button>
  </nav>

  <!-- One Swell card with a tab per break and the buoy last, then wind and
       tide. Wind and tide are cards of their own, never repeated inside a
       break's tab, because one station feeds all three. Only the
       offshore/onshore reading is per-break, and that stays in each break's
       tab: the three shore normals span 27 degrees. -->
  <section id="panel" role="tabpanel">
    <div class="conditions" id="conditions"></div>
  </section>

  <!-- The caveat, the cycle line, each chain's standing-on block and its
       footnote live on info.html. geometry.html is built by forecast.publish
       from spots.json; both ship beside this page in the bundle. -->
  <nav class="links" aria-label="More">
    <a href="geometry.html">Geometry</a>
    <a href="info.html">Info</a>
  </nav>
</div>

<script>
// Data comes from data/live/forecast.json, written by `python -m forecast.live`
// and committed by the collector workflow. ?data= overrides for local testing.
const PARAM = new URLSearchParams(location.search);
const SOURCE = PARAM.get("data") || "../data/live/forecast.json";
const NOW_SOURCE = PARAM.get("now") || "../data/live/now.json";
// The observed chain rebuilt for each of the last 48 h (forecast.measured),
// shown in sea green under every forecast hour that has gone by.
const MEASURED_SOURCE = PARAM.get("measured") || "../data/live/measured.json";
// The same chain every hour for the last week (forecast.series), drawn under
// each card on the Now tab.
const SERIES_SOURCE = PARAM.get("series") || "../data/live/series.json";
// Every archived hour, for zooming out past the week -- fetched only then.
const SERIES_ALL_SOURCE = PARAM.get("series_all") || "../data/live/series_all.json";

// North to south along the sand: the west edge of the window is the bearing
// to the Point Loma tip and it sweeps as you walk. This is the scope and the
// tie-break; the swell card's tabs are ranked by window energy (`rankByEnergy`).
const ORDER = ["coronado_north", "coronado_center", "coronado_south"];
const SHORT = {coronado_north: "North", coronado_center: "Center", coronado_south: "South"};

// Matches forecast.transform.SEAWARD_CLIP. Not a blocker: this is the share of
// the swell travelling towards a part of the compass the beach does not face,
// so none of it arrives no matter what is or is not in the way.
const AWAY = "pointed away from this beach";

const $ = (id) => document.getElementById(id);
// Imperial leads, metric in parentheses. Everything upstream of the page --
// the JSON, the transform, the collectors -- stays SI, because that is what
// NDBC and WAVEWATCH III publish and converting in the data model would put a
// unit change between the source and every cross-check. These convert at the
// point of display and nowhere else.
const FT_PER_M = 3.28084;
const MPH_PER_KT = 1.15078;

const height = (m) => (m == null ? "\u2014"
  : `${(m * FT_PER_M).toFixed(1)} ft <span class="unit">(${m.toFixed(2)} m)</span>`);
const speed = (kt) => (kt == null ? "\u2014"
  : `${Math.round(kt * MPH_PER_KT)} mph <span class="unit">(${Math.round(kt)} kt)</span>`);

// Display-only shortenings for the card's window rows. A full blocker name is
// the truth and stays in the JSON, the "taking the swell" list and the
// standing-on block; three of them in a 13-degree row would wrap twice. Any
// name not listed falls through unchanged, so adding a blocker to spots.json
// can make this table ugly but never wrong.
const BLOCKER_SHORT = {
  "Point Loma peninsula": "Point Loma",
  "Coronado Islands (South group)": "Islands S",
  "Coronado Islands (North group)": "Islands N",
  "Baja peninsula": "Baja",
};
const shortBlocker = (name) => BLOCKER_SHORT[name] || name || "\u2014";

// The compass point alone, without the degrees the row already prints.
function point(deg) {
  if (deg == null) return "";
  const points = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  return points[Math.round(deg / 22.5) % 16];
}

// The middle of an arc, wrap-safe. Every window in this file sits well away
// from north, but a mid-point that broke at 350-010 would be a bug nobody saw
// until a spot was added somewhere else.
function midBearing(from, to) {
  const span = ((to - from) % 360 + 360) % 360;
  return (from + span / 2) % 360;
}

// The windows, widest-first BAR but listed in bearing order so the row order
// matches the compass. Each row says what land forms each edge, because the
// only honest name for a window is what is either side of it -- a page that
// hardcoded "south / channel / west" would keep saying it after the geometry
// moved, and this geometry moved twice in a day.
function windowList(windows) {
  // A window whose bearings are not numbers is not drawn as NaN. The bundle
  // publishes index.html and forecast.json in one commit so they cannot drift,
  // but now.json is optional and the publish script keeps the previous one
  // when a build fails — so the page can meet an older payload shape, and a
  // card reading "NaN-NaN deg" is worse than a card saying nothing.
  const given = windows || [];
  const ok = given.filter((w) => w && isFinite(w.from) && isFinite(w.to));
  if (!ok.length) {
    // Two different failures, and only one of them is about the coast. An
    // empty list is the geometry saying there is nowhere to arrive from; a
    // list this page cannot read is the page saying so. Printing the
    // geometric claim for both would put a false statement about the beach on
    // screen every time a payload went stale -- which is exactly when nobody
    // is watching.
    return given.length
      ? '<div class="quiet">windows not readable from this file &mdash; '
        + 'it is older than the page</div>'
      : '<div class="quiet">no open window &mdash; land on every bearing '
        + 'this beach faces</div>';
  }
  windows = ok;
  const spans = windows.map((w) => ((w.to - w.from) % 360 + 360) % 360);
  const widest = Math.max(...spans, 1);
  return `<div class="wins">` + windows.map((w, i) => {
    const soft = w.confidence && w.confidence !== "high";
    return `<div class="win${soft ? " soft" : ""}">
      <span class="deg">${Math.round(w.from)}\u2013${Math.round(w.to)}\u00b0</span>
      <span class="pt">${point(midBearing(w.from, w.to))} &middot; ${Math.round(spans[i])}\u00b0 wide</span>
      <span class="edge">${shortBlocker(w.opened_by)} \u2192 ${shortBlocker(w.closed_by)}${
        soft ? ' <span class="est">one edge estimated</span>' : ""}</span>
      <span class="bar" style="width:${Math.max(3, 100 * spans[i] / widest)}%"></span>
    </div>`;
  }).join("") + `</div>`;
}

function compass(deg) {
  if (deg == null) return "—";
  const points = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  return points[Math.round(deg / 22.5) % 16] + " " + Math.round(deg) + "°";
}

function when(iso) {
  return new Date(iso).toLocaleString(undefined, {
    weekday: "long", month: "short", day: "numeric",
    hour: "numeric", minute: "2-digit",
  });
}

// The build stamps an age into now.json and that number freezes the instant
// the file is written — a page left open kept reporting the age it had at
// load, and the file itself is only rebuilt once an hour. The timestamp is
// the fact. The age is derived from it here, against the reader's own clock,
// every time the card is drawn.
function ageHours(iso) {
  if (!iso) return null;
  const ms = Date.now() - new Date(iso).getTime();
  return isFinite(ms) ? ms / 3600000 : null;
}

function ago(hours) {
  if (hours == null) return "";
  const mins = Math.round(hours * 60);
  if (mins < 1) return "just now";
  const h = Math.floor(mins / 60), m = mins % 60;
  if (!h) return `${m} min ago`;
  return m ? `${h} h ${m} min ago` : `${h} h ago`;
}

// Every provenance line ends in a full stop, including the collector's own
// notes, which do not all carry one.
const period = (s) => (!s ? "" : /[.!?]\s*$/.test(s) ? s : s + ".");

// A card's provenance, one line per claim. On Now that is three (owner's
// layout, 2026-09-27): when it was measured, what was measured and where, and
// when the next one is due -- the countdown on its own line so it is never
// wrapped into the middle of a station name. A forecast card passes one line
// and no countdown, and renders as it always has.
//
// Wrapped in one block so the lines sit as close together on the swell card
// as on the others, whose own gap between rows is narrower.
function srcLines(lines, due = "") {
  const body = [].concat(lines || []).filter(Boolean)
    .map((line) => `<span class="src">${period(line)}</span>`).join("")
    + (due ? `<span class="src">${due}</span>` : "");
  return body ? `<div class="srcs">${body}</div>` : "";
}

const clock = (iso) => new Date(iso).toLocaleString(undefined, {
  hour: "numeric", minute: "2-digit",
});

// A turn six days out is not "at 11:42 AM". The weekday appears only when the
// turn falls on a different local day from the moment being asked about, so
// the common case -- the next turn today -- stays short.
function turnClock(iso, fromIso) {
  const at = new Date(iso);
  const from = new Date(fromIso);
  const sameDay = at.toDateString() === from.toDateString();
  return sameDay ? clock(iso)
    : at.toLocaleString(undefined, {weekday: "short"}) + " " + clock(iso);
}

// When a measurement was taken, and how long ago that is. The age is derived
// here rather than read from the file for BRIEFING §18's reason, and it is the
// same reason for all three: now.json carries `age_hours` and `tide.age_minutes`
// frozen at build time, and the file is rebuilt once an hour.
//
// Only lines naming a MEASUREMENT get this. A modelled wind or a harmonic tide
// is a forecast FOR a moment, not a reading taken AT one, and "23 h ago" under
// a prediction for next Tuesday would be nonsense.
function observedAt(iso) {
  if (!iso) return "";
  const age = ago(ageHours(iso));
  // The age is wrapped because it is derived from the READER's clock rather
  // than from the payload, which makes it volatile between two renders that
  // straddle a minute. `cardText` strips everything so marked before comparing,
  // so a card is never flashed for a string that was only ever going to change.
  return when(iso) + (age ? `, <span class="age">${age}</span>` : "");
}

// The build's flag is a floor, never a ceiling: an open page can age a reading
// into staleness, but it cannot un-stale one the build already refused to call
// current. Extracted so the CARDS can ask, because they are built before the
// answer used to be worked out.
function nowIsStale() {
  if (!NOW) return false;
  const observedAge = ageHours(NOW.observed_utc);
  const limit = NOW.stale_hours != null ? NOW.stale_hours : 3;
  return NOW.stale || (observedAge != null && observedAge > limit);
}

const pad2 = (n) => String(n).padStart(2, "0");

// Elapsed time with the leading units dropped while they are zero. A card read
// at a glance should not spend three characters saying "0:", so 59 minutes is
// "59:07" rather than "0:59:07", and 42 seconds is "0:42".
//
// Days appear only past 24 h. Hours used to run on without wrapping, so that
// an outage read as one number -- but the number it produced for 46232's
// sixteen dark days was "389:00:00", which nobody reads as a fortnight.
// "16d 5:00:00" says the same thing and says it immediately.
function hms(ms) {
  const total = Math.floor(Math.abs(ms) / 1000);
  const s = total % 60;
  const m = Math.floor(total / 60) % 60;
  const h = Math.floor(total / 3600) % 24;
  const d = Math.floor(total / 86400);
  if (d) return `${d}d ${h}:${pad2(m)}:${pad2(s)}`;
  if (h) return `${h}:${pad2(m)}:${pad2(s)}`;
  return `${m}:${pad2(s)}`;
}

// How often the page refetches each payload.
//
// Declared here rather than beside the refresh functions because `dueSpan`,
// just below, adds NOW_REFRESH_MS to every countdown -- a `const` used before
// its own line is a ReferenceError waiting for the first caller that moves.
//
// now.json is ~6 KB and changes every collection; forecast.json is ~128 KB and
// changes four times a day, so refetching them together would be twenty times
// the bytes for nothing, on a phone at the beach.
//
// NOW_REFRESH_MS must not be slower than collection or the page becomes the
// bottleneck rather than the trigger. A test pins it against
// COLLECT_INTERVAL_MIN.
const NOW_REFRESH_MS = 5 * 60 * 1000;
const FORECAST_REFRESH_MS = 60 * 60 * 1000;

// "Update in m:ss", and "Overdue by m:ss" once the update has not come.
//
// The instant comes from now.json's `next_expected`, one per card, and the
// duration is derived HERE rather than published -- the same reason the ages
// beside it are (BRIEFING §18): a duration frozen into a file rebuilt once an
// hour is wrong for most of the hour it spends on screen.
//
// It flips to overdue and turns red rather than rolling silently to the next
// slot. A countdown that always looked healthy is the fault this project has
// already met twice -- the staleness alert that never visibly fired through
// 46232's 16.2 dark days, and the archive job that read a 404 as "no cycle
// this hour" for three days. Monitoring that only shows the failure it expects
// is not monitoring.
//
// Rendered empty and filled by `tickDue`, so one second's tick rewrites three
// short strings instead of re-rendering every card.
//
// It counts to DISPLAYED, not to collected. `next_expected` in now.json is
// when a newer reading should be in the FILE -- it is computed from the
// source's own cadence and the collector's, and it cannot know about this
// page. The reader sees nothing until the page refetches, so the last leg is
// added here, where it is known.
//
//     next_expected  (source + collection, from now.py)
//   + NOW_REFRESH_MS (this page's own leg)
//   = when the reader should be looking at something newer
//
// Without that last term the countdown reached zero while the file was
// already fresh and the screen simply had not caught up -- reporting the
// page's own latency as the source being late.
//
// TWO instants, not one, because a publication delay is a distribution and one
// deadline cannot both promise and accuse. `next_expected` is when the update
// should land; `overdue_after` is when its absence is a fault. The swell is why:
// its spectra usually appear by H+15 but one measured hour took H+35, so a
// single number was either red on that hour or quoting H+27 to everyone else --
// and it quoted H+27, promising 100 minutes from stamp to screen on an hourly
// source when 80 was honest. See PUBLISH_LAG_MIN in forecast/now.py.
//
// Both get this page's refresh leg added, for the same reason: the reader sees
// nothing until the page refetches.
function dueSpan(iso, lateIso, {forceOver = false} = {}) {
  if (!iso) return "";
  const at = new Date(iso).getTime();
  if (!Number.isFinite(at)) return "";
  const plusRefresh = (ms) =>
    new Date(ms + NOW_REFRESH_MS).toISOString().replace(/\.\d+Z$/, "Z");
  const lateAt = lateIso ? new Date(lateIso).getTime() : NaN;
  // Falling back to `at` keeps a payload without `overdue_after` behaving
  // exactly as it did before the two split, rather than never going red.
  const late = plusRefresh(Number.isFinite(lateAt) ? Math.max(lateAt, at) : at);
  return ` <span class="due" data-due="${plusRefresh(at)}" data-late="${late}"`
    + (forceOver ? ' data-force-over="1"' : "") + "></span>";
}

function tickDue() {
  const now = Date.now();
  document.querySelectorAll("[data-due]").forEach((el) => {
    const due = new Date(el.getAttribute("data-due")).getTime();
    if (!Number.isFinite(due)) { el.textContent = ""; return; }
    const parsedLate = new Date(el.getAttribute("data-late")).getTime();
    const late = Number.isFinite(parsedLate) ? Math.max(parsedLate, due) : due;
    const forced = el.getAttribute("data-force-over") === "1";
    // Three states. Red is reserved for the last one: between `due` and `late`
    // the update is expected and nothing has gone wrong, and saying so in the
    // resting colour is what stops the card crying wolf on every cycle that
    // runs at the slow end of its measured range.
    el.classList.toggle("over", now >= late || forced);
    // Only a genuinely elapsed deadline gets a figure. `forceOver` without one
    // means the build refused the reading for a reason that is not its age,
    // and "overdue by -0:04:11" would be worse than saying nothing.
    el.textContent = now >= late ? `Overdue by ${hms(now - late)}.`
      : forced ? "Overdue."
      : now >= due ? "Update due."
      : `Update in ${hms(due - now)}.`;
  });
}

// Where the Tide card's numbers are. The gauge is inside San Diego Bay and
// the card is about the beach, so a payload that carries `tide_site` has
// already moved the numbers to the open coast (forecast.tidesite) and says
// both places; an older one is the gauge's own reading and says only that.
function tideSource(payload) {
  const gauge = `${payload.tide_station_name} (${payload.tide_station})`;
  return payload.tide_site ? `${payload.tide_site}, carried from ${gauge}` : gauge;
}

// The forecast's tide is the harmonic prediction plus the gauge's measured
// departure from it over the last three days, carried forward -- the level
// the breaking was computed at. The prediction alone ran ~9 in under the
// water in Sept 2026 (BRIEFING §32). An hour that carries no departure (none
// was measured, or it was logged before the card added one) is the bare
// prediction and gets no line, so the card never claims an offset it lacks.
function departureLine(tide) {
  const d = tide && tide.departure_m;
  if (d == null) return "";
  return `Gauge departure correction (last 3 days): ${d < 0 ? "\u2212" : "+"}${height(Math.abs(d))}`;
}

// The tide's next turning point, and which way it is running into it.
//
// The direction is read off the TURN, never differenced from the water level.
// Measured on the 6-minute measured series: differencing the two newest
// samples reads the direction backwards on 19.5% of readings, and a 45-minute
// regression is still wrong 3.3% of the time. Both fail near slack water --
// exactly when a reader looks -- and a measured "falling" beside a predicted
// high water would be a card contradicting itself.
function nextTurn(turns, afterIso) {
  if (!turns || !turns.length || !afterIso) return null;
  return turns.find((t) => t.valid_utc > afterIso) || null;
}

// `tagged` marks the line as a prediction, which is needed on the observed tab
// and not on the forecast tab, where the whole card is already a model and its
// provenance says so.
function turnLine(turns, afterIso, {tagged = false} = {}) {
  const turn = nextTurn(turns, afterIso);
  if (!turn || !turn.direction || turn.height_m == null) return "";
  return `<span class="turn"><b>${turn.direction}</b> to ${height(turn.height_m)}`
    + ` at ${turnClock(turn.valid_utc, afterIso)}`
    + (tagged ? ` <span class="tag">predicted</span>` : "")
    + `</span>`;
}

let DATA = null;      // forecast.json — the modelled chain
let NOW = null;       // now.json     — the observed chain
let MODE = "now";     // which chain is on screen
let TIDE_BY_TIME = {};
let MEASURED = null;  // measured.json — the observed chain, past hours only
let SERIES = null;    // series.json   — the observed chain, every hour for a week
let SERIES_ALL = null; // series_all.json — every archived hour, once asked for
// The hours the picker offers, oldest first: {valid_utc, from, lead_h} plus
// `index` into each break's hours for the current run ("cycle"), or `entry`
// from forecast.json's `past` for an hour an earlier run was on screen for.
let STEPS = [];
let CURSOR = 0;      // position within STEPS
let CHOSEN = null;   // valid_utc the reader stepped to themselves, or null
// The swell tab the reader chose, by id, so it survives a re-render, an hour
// change and a re-ranking. null until they choose: the card then opens on
// whichever break holds the most energy at the moment on screen.
let SWELL_TAB = null;
const BUOY_TAB = "buoy";

// Both tab choices survive a refresh. sessionStorage rather than localStorage:
// a reload, or a trip to info.html and back, keeps the reader where they were,
// while a fresh visit still opens on Now -- see `boot`. Every access is
// guarded, because private modes and blocked site data throw on the accessor
// itself, and a page that cannot remember a tab must still render.
const KEEP = {mode: "nado-waves.mode", swell: "nado-waves.swell-tab",
              calc: "nado-waves.calc", chart: "nado-waves.chart",
              chartOpen: "nado-waves.chart-open"};
function recall(key) {
  try { return sessionStorage.getItem(key); } catch (e) { return null; }
}
function remember(key, value) {
  try { sessionStorage.setItem(key, value); } catch (e) { /* not remembered */ }
}

function sense(offshore) {
  if (offshore == null) return null;
  return offshore > 0.3 ? "offshore" : offshore < -0.3 ? "onshore" : "cross-shore";
}

// Both chains describe the same three breaks, so they are normalised to one
// shape here and the card renderer stays single-branched. What differs is not
// the shape but what the numbers are standing on, and that is said elsewhere
// — loudly — rather than smuggled into the card.
function cardsForNow() {
  return (NOW.breaks || []).map((b) => ({
    id: b.id, name: b.name,
    // The nearshore figure when the payload has it; an older now.json (the
    // publish script keeps the previous one when a build fails) still shows
    // its window energy rather than nothing.
    hsWindow: b.hs_nearshore_m != null ? b.hs_nearshore_m : b.hs_in_window_m,
    hsOffshore: NOW.buoy && NOW.buoy.hs_m,
    nearshore: b.nearshore || {},
    fraction: b.fraction,
    period: b.peak_period_s, direction: b.peak_direction_deg,
    swellWindow: b.swell_window || [],
    normal: b.shore_normal_deg, normalGuess: b.normal_is_a_guess,
    trains: b.trains || [],
    takenBy: b.taken_by || [],
    windOffshore: b.wind_offshore, windNote: b.wind_note,
    // The week's chart goes under the drawing on this tab only: it is the
    // observed chain, and the Forecast tab is the other one.
    chart: true,
  }));
}

// A logged headline's depth, in the nearshore block's shape so `depthLabel`
// words it exactly as it words the full card's.
function pastNearshore(e) {
  if (!e) return {};
  if (e.hs_basis === "breaking") return {breaking: {depth_m: e.depth_m}, depth_m: e.depth_m};
  if (e.hs_basis === "5m") return {depth_m: e.depth_m};
  return {};
}

function cardsForForecast(step) {
  const measured = measuredAt(step.valid_utc);
  return ORDER.map((id) => DATA.breaks.find((b) => b.id === id)).filter(Boolean)
    .map((b) => {
      // An earlier run's hour is drawn from the hour its own build showed,
      // kept in full (forecast.forecastlog, `46232_shown/`), through exactly
      // the card a current hour gets: drawing, trains, calculation table.
      const detail = step.from === "past" && step.entry.detail;
      const kept = detail && (detail.breaks || {})[b.id];
      if (step.from === "past" && !kept) {
        const e = ((step.entry || {}).breaks || {})[b.id] || {};
        return {
          id: b.id, name: b.name, past: true, measured,
          hsWindow: e.hs_m, nearshore: pastNearshore(e),
          period: e.period_s, direction: e.from_deg,
          swellWindow: b.swell_window || [], trains: [], takenBy: [],
          windOffshore: b.wind_offshore, windNote: b.wind_note,
        };
      }
      const h = kept || b.hours[step.index] || {};
      return {
        id: b.id, name: b.name, measured,
        hsWindow: h.hs_nearshore_m != null ? h.hs_nearshore_m : h.hs_window_m,
        hsOffshore: h.hs_offshore_m,
        nearshore: h.nearshore || {},
        fraction: h.fraction,
        period: h.dominant_period_s, direction: h.dominant_from_deg,
        swellWindow: b.swell_window || [],
        normal: b.shore_normal_deg, normalGuess: b.normal_is_a_guess,
        trains: h.trains || [],
        takenBy: h.taken_by || [],
        windOffshore: b.wind_offshore, windNote: b.wind_note,
      };
    });
}

// Trains, largest first, the leader emphasised. Height leads the line because
// it is what a reader compares between trains; period and heading say which
// wave it is.
function trainList(trains, {limit = 4} = {}) {
  if (!trains || !trains.length) return "";
  return `<div class="trains">` + trains.slice(0, limit).map((t, i) => `
    <div class="train${i === 0 ? " lead" : ""}">
      <span class="ht">${height(t.hs_m)}</span>
      <span class="tp">${t.period_s.toFixed(1)} s</span>
      <span class="dr">${compass(t.from_deg)}</span>
      ${t.local ? '<span class="tag">local chop</span>'
        : t.wind_sea ? '<span class="tag">wind sea</span>' : ""}
    </div>`).join("") + `</div>`;
}

// Breaks, most window energy first. That ordering IS the claim the page makes
// -- which break holds more of the swell -- so the tab row states it before a
// number is read. A break with no number is not ranked above one with a
// number, and ties fall back to north-to-south rather than to file order.
function rankByEnergy(cards) {
  const energy = (c) => (c.hsWindow != null && isFinite(c.hsWindow) ? c.hsWindow : -Infinity);
  const place = (c) => { const i = ORDER.indexOf(c.id); return i < 0 ? ORDER.length : i; };
  return cards.slice().sort((a, b) => (energy(b) - energy(a)) || (place(a) - place(b)));
}

// One break's tab. What used to be its own card, less the title, which is on
// the tab now.
// What 46232 measured at a step's hour, or why there is nothing to show.
// Nothing at all for an hour still ahead: the line is only ever a comparison
// with something that has already happened.
function measuredAt(validUtc) {
  const at = (state, more = {}) => ({state, valid_utc: validUtc, ...more});
  if (!validUtc || new Date(validUtc).getTime() > Date.now()) return at("future");
  const hit = ((MEASURED && MEASURED.steps) || []).find((m) => m.valid_utc === validUtc);
  if (hit) {
    return hit.gap ? at("gap") : hit.pending ? at("pending") : at("value", {entry: hit});
  }
  const built = MEASURED && MEASURED.generated_utc;
  return at(built && validUtc > built ? "pending" : "none");
}

// The measured line. Its label is on every line, never once per page, because
// it sits inside a forecast card and must not be read as part of the forecast.
// It names the hour it was observed ("Observed at 8:00 AM", owner's wording
// 2026-09-27); where it came from -- 46232, carried in by the same chain --
// is said on info.html.
// Both numbers go through the same windows, seabed and surf zone, so the
// difference between them is the model's error AT THE BUOY carried in -- not
// a check at the beach, which nothing measures. Hence no difference or
// percentage between them on screen: a number like that is a claim about
// the forecast, and would need its verification series named beside it.
function measuredLine(m, pick) {
  if (!m || m.state === "future") return "";
  const station = (MEASURED && MEASURED.station) || (DATA && DATA.station) || "the buoy";
  const label = `Observed at ${clock(m.valid_utc)}`;
  if (m.state === "value") {
    const v = pick(m.entry);
    if (!v || v.hs_m == null) return "";
    const basis = v.hs_basis === "buoy" ? "combined" : depthLabel({nearshore: pastNearshore(v)});
    return `<div class="measured"><span class="lbl">${label}</span>
      <span class="mval">${height(v.hs_m)} <span class="unit">${basis}</span></span>
      ${v.period_s ? `<span class="mpeak">peak ${v.period_s.toFixed(1)} s from ${compass(v.from_deg)}</span>` : ""}
    </div>`;
  }
  const why = m.state === "gap" ? `No ${station} spectrum for this hour &mdash; left as a gap, not filled`
    : m.state === "pending" ? `${label}: not in yet`
    : `${label}: no reading loaded for this hour`;
  return `<div class="measured none">${why}</div>`;
}

// Which run a past hour's number came from, and how far ahead it was made.
function runLine(step) {
  const run = step.from === "past" ? step.entry.cycle_utc : DATA.cycle_utc;
  if (!run) return "";
  const lead = step.lead_h != null ? `, ${step.lead_h} h ahead` : "";
  return `From the ${when(run)} model run${lead}`;
}

function breakPanel(c) {
  // The energy through the window LEADS, untitled, in the buoy tab's own
  // shape: the value line there says "combined", here "in window", and the
  // trains beneath it are listed the same way, so flipping between a break and
  // the buoy compares like with like. The buoy's figure sits under the value
  // in the provenance style because that is what it is -- where the number
  // above came from -- and it is the same spectrum on either chain: the
  // forecast's is GFS-Wave AT 46232.
  //
  // The drawing carries the windows and what takes the swell (owner's design,
  // 2026-09-26), in place of the two lists that followed a rule here. When it
  // cannot be drawn, the list's own sentence says why. The windows' chart
  // provenance is on geometry.html, vertex by vertex, one tap away.
  const value = `<span class="val">${c.hsWindow != null
      ? `${height(c.hsWindow)} <span class="unit">${depthLabel(c)}</span>`
      : '<span class="unit">no spectrum</span>'}</span>`;
  const measured = measuredLine(c.measured, (m) => (m.breaks || {})[c.id]);

  // An earlier run's hour whose build kept only its headline: logged before
  // full hours were (2026-09-26) and not filled from what was published. The
  // card says so rather than borrowing this run's detail for an hour this run
  // never forecast.
  if (c.past) {
    return `${value}
    <div class="quiet">
      peak <b>${c.period ? c.period.toFixed(1) + " s" : "—"}</b>
      from <b>${compass(c.direction)}</b>
    </div>
    ${measured}
    ${windowList(c.swellWindow)}
    <div class="src">The calculation for this hour was not kept.</div>`;
  }

  const drawing = windowDrawing(c);
  // How the headline was made folds out beneath it, from a caret at the end
  // of the line (owner's layout, 2026-09-26). Without the effects to tabulate
  // there is no caret, and the buoy's figure stays as a provenance line.
  const table = calculationTable(c);
  const head = table
    ? `<div class="val-row">${value}${calcToggle(c.id)}</div>
    <div class="calc-fold" id="calc-${c.id}"${CALC_OPEN ? "" : " hidden"}>${table}</div>`
    : value;
  const offshore = !table && c.hsOffshore != null
    ? `<div class="src">${period(`of ${height(c.hsOffshore)} at the buoy`)}</div>` : "";
  // The forecast's own numbers first, then the measurement under them, then
  // the geometry: the measured line never sits between two forecast lines.
  return `
    ${head}

    ${c.trains && c.trains.length ? trainList(c.trains) : `
    <div class="quiet">
      peak <b>${c.period ? c.period.toFixed(1) + " s" : "—"}</b>
      from <b>${compass(c.direction)}</b>
    </div>`}

    ${measured}

    ${drawing || windowList(c.swellWindow)}

    ${c.chart ? seriesChart(c.id) : ""}

    ${offshore}`;
}

// A depth for a label: whole feet, metres to one decimal below ten.
function depthText(m) {
  return `${Math.round(m * FT_PER_M)} ft (${m < 10 ? m.toFixed(1) : Math.round(m)} m)`;
}

// What the headline number is. Where it breaks, when the payload carries the
// surf zone; otherwise a height at the depth the rays start from (no current
// tide); and an older payload without the nearshore block still says "in
// window", because that is what its number is.
function depthLabel(c) {
  const n = c.nearshore || {};
  const b = n.breaking;
  if (b && b.depth_m != null) {
    return b.outside_start ? `breaking at ${depthText(n.depth_m)} depth or deeper`
      : `breaking at ${depthText(b.depth_m)} depth`;
  }
  const d = n.depth_m;
  return d != null && isFinite(d)
    ? `at ${Math.round(d * FT_PER_M)} ft (${Math.round(d)} m) depth` : "in window";
}

// A step's change as a signed percentage of the step before it; one decimal
// under 1%, so a small effect reads as small rather than as zero.
function pct(to, from) {
  if (!(from > 0) || to == null) return "";
  const p = 100 * (to / from - 1);
  const v = Math.abs(p) < 1 ? p.toFixed(1) : String(Math.round(p));
  return `${p > 0 ? "+" : p < 0 ? "\u2212" : ""}${v.replace("-", "")}%`;
}

// How the headline was made from the buoy's reading, one effect per row:
// what it changes the height by, that change as a share of the step before,
// and the height it leaves. Folds out under the headline from the caret at
// its end (owner's layout, 2026-09-26). Composed from the payload's
// `nearshore.effects`, never from constants; null when a payload carries no
// effects, and the card then keeps its one provenance line instead.
//
// The islands are a hard shadow in the window figure and in the refraction
// step alike, so refraction is the seabed alone, and the diffraction step is
// only what diffraction changes about the edges (forecast.nearshore.summarise).
function calculationTable(c) {
  const n = c.nearshore || {};
  const e = n.effects;
  if (!e || e.window_hs_m == null || e.shoaled_hs_m == null) return null;
  // The seabed, then diffraction at every window edge (the Coronado Islands,
  // the Point Loma tip, the Baja tangent), both on the bent rays and both as
  // a signed change: refraction against the straight-line window,
  // diffraction against the hard-edged refraction (forecast.nearshore).
  // `seabed_hs_m` is the older payload's name for the diffracted figure.
  const diffracted = e.diffracted_hs_m != null ? e.diffracted_hs_m : e.seabed_hs_m;
  const refracted = e.refracted_hs_m != null ? e.refracted_hs_m : diffracted;
  const change = (to, from) => {
    const d = to - from;
    return `${d < 0 ? "\u2212" : "+"}${height(Math.abs(d))}`;
  };
  const rows = [];
  const row = (calc, to, from, {note = "", bound = false} = {}) => rows.push(
    `<tr><th scope="row">${calc}${note ? ` <span class="unit">${note}</span>` : ""}</th>`
    + `<td>${from == null ? "\u2014" : change(to, from)}</td>`
    + `<td>${from == null ? "\u2014" : pct(to, from)}</td>`
    + `<td>${bound ? "\u2264 " : ""}${height(to)}</td></tr>`);
  row("Buoy", e.buoy_hs_m, null);
  row("Windows", e.window_hs_m, e.buoy_hs_m);
  row("Refraction", refracted, e.window_hs_m);
  row("Diffraction", diffracted, refracted);
  // Bottom friction along the rays' paths over the shelf, before shoaling
  // divides back in (forecast.raytrace.friction_rate). Absent from a payload
  // built before it was modelled.
  let before = diffracted;
  if (e.friction_hs_m != null) {
    row("Bottom friction", e.friction_hs_m, diffracted);
    before = e.friction_hs_m;
  }
  const start = n.depth_m != null ? `to ${depthText(n.depth_m)}` : "";
  row("Shoaling", e.shoaled_hs_m, before, {note: start});
  // Swell and chop together at the start depth; an older payload's `hs_m` is
  // that figure, a newer one's is the breaking height. Not a step the swell
  // takes, but without its row the column would not arrive at the headline.
  const withChop = e.with_chop_hs_m != null ? e.with_chop_hs_m : n.hs_m;
  if (e.local && withChop != null) {
    row("Local chop", withChop, e.shoaled_hs_m, {note: `${e.local.tp_s.toFixed(1)} s`});
  }
  // Then in to where it breaks, at this tide (forecast.surfzone). Already
  // breaking at the start depth means the break is further out, and the
  // figure is an upper bound rather than a break point found.
  const b = n.breaking;
  let foot = "";
  if (b && b.hs_m != null && withChop != null) {
    row("Wave break", b.hs_m, withChop, {bound: !!b.outside_start});
    if (b.outside_start) {
      const depth = n.depth_m != null ? depthText(n.depth_m) : "shallow";
      foot = `<div class="quiet">At this tide it is already breaking in ${depth}`
        + ` of water, so the break is further out and the last height is an upper bound.</div>`;
    }
  }
  return `<table class="calc-table">
      <thead><tr><th scope="col">Calc</th><th scope="col">Change</th>`
    + `<th scope="col">%</th><th scope="col">Hs</th></tr></thead>
      <tbody>${rows.join("")}</tbody>
    </table>${foot}`;
}

// The caret at the end of the headline. One state for every break, so
// flipping between breaks keeps the table open, and kept across a refresh
// the way the tab choices are.
let CALC_OPEN = false;
function calcToggle(id) {
  return `<button type="button" class="calc-toggle" data-calc-toggle
    aria-controls="calc-${id}" aria-expanded="${CALC_OPEN}"
    aria-label="How this height was calculated"><svg viewBox="0 0 16 16" aria-hidden="true">`
    + `<path d="M3.5 10 8 5.5 12.5 10"/></svg></button>`;
}

// Flips every caret and table in place rather than re-rendering, so the
// countdowns and the drawing's picks keep their place.
function setCalcOpen(open) {
  CALC_OPEN = open;
  remember(KEEP.calc, open ? "open" : "closed");
  document.querySelectorAll("[data-calc-toggle]").forEach((btn) => {
    btn.setAttribute("aria-expanded", String(open));
    const fold = $(btn.getAttribute("aria-controls"));
    if (fold) fold.hidden = !open;
  });
}

// Larger than the first version (r 124 -> 140 in the same 320 box): the
// drawing is read AND tapped now, and a phone has room either side of it.
const DRAW = {w: 320, h: 200, cx: 160, cy: 162, r: 140, rim: 1};

// Plain text for SVG captions, which cannot hold the HTML `height()` returns.
// Same one conversion constant, so the rule that a factor appears once holds.
const heightText = (m) => `${(m * FT_PER_M).toFixed(1)} ft (${m.toFixed(2)} m)`;
const svgText = (v) => String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;")
  .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const shareText = (share) => {
  const p = 100 * share;
  return `${p < 1 ? p.toFixed(1) : Math.round(p)}%`;
};

// One break's windows, drawn facing the way the break faces, and a way into
// what used to be two lists beneath it (owner's design, 2026-09-26). The
// drawing IS the windows and the blockers now: tap a grey shadow for the land
// casting it and the share of this swell it takes; tap a window for the land
// either side and its width; tap an arrow for that train. Each shows only its
// own edge headings and puts its line where "facing" was. Tap it again, or
// the sand below the chord, to return to the default drawing. A mouse
// previews on hover; the keyboard reaches every section with Tab.
function windowDrawing(c) {
  if (c.normal == null || !isFinite(c.normal)) return "";
  const {w, h, cx, cy, r} = DRAW;
  // Bearing -> angle off the normal, -180..180. Negative is the reader's left.
  const rel = (b) => ((b - c.normal) % 360 + 540) % 360 - 180;
  const bearing = (a) => ((c.normal + a) % 360 + 360) % 360;
  const at = (a, rad) => {
    const t = a * Math.PI / 180;
    return [cx + rad * Math.sin(t), cy - rad * Math.cos(t)];
  };
  const xy = (p) => `${p[0].toFixed(1)},${p[1].toFixed(1)}`;
  const wedge = (a0, a1, rad = r) =>
    `M${cx},${cy} L${xy(at(a0, rad))} A${rad},${rad} 0 0 1 ${xy(at(a1, rad))} Z`;
  // The rim is a stroke centred on r, so anything ending AT r stops halfway
  // through it. Shadows and rays run to its outer edge instead.
  const outer = r + DRAW.rim / 2;

  const wins = (c.swellWindow || [])
    .filter((win) => win && isFinite(win.from) && isFinite(win.to))
    .map((win) => ({...win, a0: rel(win.from), a1: rel(win.to)}))
    .filter((win) => win.a0 >= -90 && win.a1 <= 90 && win.a0 < win.a1)
    .sort((p, q) => p.a0 - q.a0);
  if (!wins.length) return "";

  // The shadows are whatever the windows leave, and each is cast by the land
  // that closes the window before it -- the same name the blocker carries in
  // `taken_by`, so its share is looked up, never typed.
  const shadows = [];
  let from = -90;
  wins.forEach((win) => {
    if (win.a0 > from) shadows.push({a0: from, a1: win.a0, blocker: win.opened_by});
    from = win.a1;
  });
  if (from < 90) shadows.push({a0: from, a1: 90, blocker: wins[wins.length - 1].closed_by});
  const taken = (name) => (c.takenBy || []).find((tb) => tb.blocker === name);

  // Degree labels. At a chord end they sit just above it, inside the
  // drawing: below it is the caption's line, and outside the box is the card.
  // `side` is -1 for a section's low edge and +1 for its high edge; a pair
  // closer than 16 degrees is pushed apart, low to the left and high to the
  // right, or the 193° and 199° between the islands print on top of each other.
  const label = (a, show, side = 0, tight = false) => {
    const b = Math.round(bearing(a));
    if (Math.abs(a) >= 89.5) {
      const left = a < 0;
      return `<text class="deg" data-show="${show}" x="${cx + (left ? 6 - r : r - 6)}" y="${cy - 7}"`
        + ` text-anchor="${left ? "start" : "end"}"${show === "default" ? "" : " hidden"}>${b}°</text>`;
    }
    const [x, y] = at(a, r + 12);
    const s = Math.sin(a * Math.PI / 180);
    const anchor = tight ? (side < 0 ? "end" : "start")
      : s > 0.25 ? "start" : s < -0.25 ? "end" : "middle";
    return `<text class="deg" data-show="${show}" x="${x.toFixed(1)}" y="${y.toFixed(1)}"`
      + ` text-anchor="${anchor}"${show === "default" ? "" : " hidden"}>${b}°</text>`;
  };
  // The line where "facing" sits. Two lines when one would run off the box.
  const caption = (text, show) => {
    const parts = text.length > 50 && text.includes(", ")
      ? [text.slice(0, text.indexOf(", ") + 1), text.slice(text.indexOf(", ") + 2)] : [text];
    return `<text class="faces" data-show="${show}" x="${cx}" y="${cy + 20}"`
      + `${show === "default" ? "" : " hidden"}>`
      + parts.map((part, i) => `<tspan x="${cx}" dy="${i ? 13 : 0}">${svgText(part)}</tspan>`).join("")
      + `</text>`;
  };

  const sections = [];      // what the pointer can pick, by angle
  const labels = [label(wins[0].a0, "default"), label(wins[wins.length - 1].a1, "default")];
  const captions = [caption(`facing ${compass(c.normal)}`, "default")];

  const windowPaths = wins.map((win, i) => {
    const key = `w${i}`;
    const soft = win.confidence && win.confidence !== "high";
    const text = `${shortBlocker(win.opened_by)} → ${shortBlocker(win.closed_by)}, `
      + `${point(midBearing(win.from, win.to))}, ${Math.round(win.a1 - win.a0)}° wide`
      + (soft ? ", one edge estimated" : "");
    sections.push({key, a0: win.a0, a1: win.a1});
    const tight = win.a1 - win.a0 < 16;
    labels.push(label(win.a0, key, -1, tight), label(win.a1, key, 1, tight));
    captions.push(caption(text, key));
    return `<path class="win" data-pick="${key}" tabindex="0" role="button"`
      + ` aria-label="${svgText(text)}" d="${wedge(win.a0, win.a1, outer)}"/>`;
  }).join("");

  const shading = shadows.map((sh, i) => {
    const key = `s${i}`;
    const tb = taken(sh.blocker);
    const text = tb
      ? `${sh.blocker}, blocking ${shareText(tb.share)} of this swell`
        + (tb.verified === false ? " (estimated)" : "")
      : `${sh.blocker}, blocking none of this swell`;
    sections.push({key, a0: sh.a0, a1: sh.a1});
    const tight = sh.a1 - sh.a0 < 16;
    labels.push(label(sh.a0, key, -1, tight), label(sh.a1, key, 1, tight));
    captions.push(caption(text, key));
    return `<path class="shadow" data-pick="${key}" tabindex="0" role="button"`
      + ` aria-label="${svgText(text)}" d="${wedge(sh.a0, sh.a1, outer)}"/>`;
  }).join("");

  // Every edge is a ray from the break to the rim.
  const rays = wins.flatMap((win) => [win.a0, win.a1]).map((a) => {
    const [x, y] = at(a, outer);
    return `<line class="ray" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
  }).join("");

  // Arrows come in from the rim along the heading each train arrives from,
  // and stop well short of the break: trains a few degrees apart would
  // otherwise meet in one knot of arrowheads at the centre. Drawn last so a
  // train is never hidden under a shadow it has leaked past. A train from
  // behind the beach is not drawn: it cannot arrive, and an arrow pointing out
  // of the sand would say it could.
  //
  // The head is its own triangle rather than an SVG marker: a marker cannot
  // take its colour from the line it sits on in every browser, and on some
  // the heads came out black and grey. The leg stops inside the head, where
  // the triangle is wider than the stroke, so it never shows either side of
  // the tip.
  // Local chop is made by the wind over the last few kilometres, not
  // carried in from the ocean, so it gets no arrow from the rim.
  const trains = [];
  const arrows = (c.trains || []).map((t, i) => ({t, i, a: rel(t.from_deg)}))
    .filter(({t, a}) => !t.local && isFinite(t.from_deg) && a > -90 && a < 90)
    .reverse()
    .map(({t, i, a}) => {
      const key = `t${i}`;
      const lead = i === 0;
      const len = lead ? 10 : 8, half = lead ? 4.5 : 3.5;
      const tip = r * 0.62;
      const [x0, y0] = at(a, r * 0.95);
      const [x1, y1] = at(a, tip + 0.6 * len);
      const th = a * Math.PI / 180;
      const [bx, by] = at(a, tip + len);
      const [px, py] = [Math.cos(th) * half, Math.sin(th) * half];
      const head = `${xy(at(a, tip))} ${xy([bx + px, by + py])} ${xy([bx - px, by - py])}`;
      const text = `${heightText(t.hs_m)} at ${t.period_s.toFixed(1)} s, ${point(t.from_deg)}`
        + (t.wind_sea ? ", wind sea" : "");
      const [ex, ey] = at(a, tip);
      trains.push({key, x0: +x0.toFixed(1), y0: +y0.toFixed(1), x1: +ex.toFixed(1), y1: +ey.toFixed(1)});
      labels.push(`<text class="deg" data-show="${key}" hidden x="${at(a, r + 12)[0].toFixed(1)}"`
        + ` y="${at(a, r + 12)[1].toFixed(1)}" text-anchor="${Math.sin(th) > 0.25 ? "start"
          : Math.sin(th) < -0.25 ? "end" : "middle"}">${Math.round(t.from_deg)}°</text>`);
      captions.push(caption(text, key));
      return `<g class="swell${lead ? " lead" : ""}" data-pick="${key}" tabindex="0" role="button"`
        + ` aria-label="${svgText(text)}">`
        + `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}"/>`
        + `<polygon points="${head}"/></g>`;
    }).join("");

  const said = wins.map((win) => `${Math.round(win.from)} to ${Math.round(win.to)} degrees`).join(", ");
  const heard = (c.trains || []).filter((t) => !t.local && isFinite(t.from_deg))
    .map((t) => `${Math.round(t.from_deg)}`).join(", ");
  const summary = `Swell windows facing ${compass(c.normal)}: ${said}.`
    + (heard ? ` Swell arriving from ${heard} degrees.` : "")
    + " Select a window, a shadow or an arrow for its detail.";
  // Swell aimed behind the beach is not blocked by anything -- nothing is in
  // the way, it is pointed elsewhere -- so it is no shadow. It belongs to the
  // sand behind the chord, and a tap there says how much of it there is.
  const away = taken(AWAY);
  if (away) {
    captions.push(caption(`${shareText(away.share)} of this swell is ${AWAY}; `
      + `nothing blocks it`, "away"));
  }
  const geo = svgText(JSON.stringify({cx, cy, r: outer, sections, trains, away: !!away}));

  return `<svg class="aperture" viewBox="0 0 ${w} ${h}" role="group" aria-label="${svgText(summary)}"
    data-break="${c.id}" data-geo="${geo}">
    <path class="sea" d="${wedge(-90, 90)}"/>
    ${windowPaths}${shading}${rays}${labels.join("")}${arrows}
    <line class="chord" x1="${cx - r}" y1="${cy}" x2="${cx + r}" y2="${cy}"/>
    <circle class="spot" cx="${cx}" cy="${cy}" r="4"/>
    ${captions.join("")}
  </svg>`;
}

// Which section of each break's drawing is picked, by break. Kept across the
// re-renders a refresh or the hour picker causes; lost with the page.
const PICKED = {};

// Show one section's state -- or the default drawing for none.
function showPick(svg, key) {
  svg.classList.toggle("picked", !!key);
  svg.querySelectorAll("[data-pick]").forEach((el) =>
    el.classList.toggle("on", el.getAttribute("data-pick") === key));
  const want = key || "default";
  svg.querySelectorAll("[data-show]").forEach((el) => {
    const on = el.getAttribute("data-show") === want;
    if (on) el.removeAttribute("hidden"); else el.setAttribute("hidden", "");
  });
}

// What is under a point on the drawing. Arrows first, by distance to their
// leg; then sections by angle. The island shadows are 2-5 degrees wide beside
// a 6-degree channel, too thin to hit and too close to pad without covering
// each other, so a tap within 2.5 degrees of a section under 5 degrees wide
// takes it rather than its wide neighbour. Below the chord is the sand: "".
function pickAt(svg, clientX, clientY) {
  const ctm = svg.getScreenCTM();
  if (!ctm) return null;
  const pt = new DOMPoint(clientX, clientY).matrixTransform(ctm.inverse());
  const geo = JSON.parse(svg.getAttribute("data-geo"));
  const dx = pt.x - geo.cx, dy = geo.cy - pt.y;
  // Behind the chord is the sand: the swell aimed away from the beach, if
  // any of it is, and otherwise the way back to the default drawing.
  if (dy < 0) return geo.away ? "away" : "";
  if (Math.hypot(dx, dy) > geo.r + 14) return null;
  for (const arrow of geo.trains) {
    const vx = arrow.x1 - arrow.x0, vy = arrow.y1 - arrow.y0;
    const k = Math.max(0, Math.min(1,
      ((pt.x - arrow.x0) * vx + (pt.y - arrow.y0) * vy) / (vx * vx + vy * vy)));
    if (Math.hypot(pt.x - (arrow.x0 + k * vx), pt.y - (arrow.y0 + k * vy)) < 9) return arrow.key;
  }
  const a = Math.atan2(dx, dy) * 180 / Math.PI;
  const off = (s) => (a < s.a0 ? s.a0 - a : a > s.a1 ? a - s.a1 : 0);
  const thin = geo.sections.filter((s) => s.a1 - s.a0 < 5 && off(s) <= 2.5)
    .sort((p, q) => off(p) - off(q));
  if (thin.length) return thin[0].key;
  const hit = geo.sections.find((s) => off(s) === 0);
  return hit ? hit.key : null;
}

// A tap picks; the same tap again, or the sand, returns to the default.
function togglePick(svg, key) {
  const id = svg.getAttribute("data-break");
  PICKED[id] = key && PICKED[id] !== key ? key : null;
  showPick(svg, PICKED[id]);
}

function restorePicks() {
  document.querySelectorAll("svg.aperture[data-break]").forEach((svg) => {
    const key = PICKED[svg.getAttribute("data-break")];
    showPick(svg, key && svg.querySelector(`[data-pick="${key}"]`) ? key : null);
  });
}

// Delegated once, like the tabs, because the cards are rebuilt on every render.
function wireDrawings() {
  const strip = $("conditions");
  strip.addEventListener("click", (e) => {
    const svg = e.target.closest("svg.aperture");
    if (!svg) return;
    // A click with no pointer behind it (a screen reader activating a
    // section) has no coordinates to test; it names its section itself.
    const own = e.target.closest("[data-pick]");
    const key = e.detail === 0 && own ? own.getAttribute("data-pick")
      : pickAt(svg, e.clientX, e.clientY);
    if (key !== null) togglePick(svg, key);
  });
  // A mouse previews what a tap would pick, and leaving puts the pick back.
  strip.addEventListener("pointermove", (e) => {
    const svg = e.target.closest("svg.aperture");
    if (!svg || e.pointerType !== "mouse") return;
    const key = pickAt(svg, e.clientX, e.clientY);
    showPick(svg, key || PICKED[svg.getAttribute("data-break")] || null);
  });
  strip.addEventListener("pointerout", (e) => {
    const svg = e.target.closest("svg.aperture");
    if (svg && !svg.contains(e.relatedTarget)) showPick(svg, PICKED[svg.getAttribute("data-break")] || null);
  });
  strip.addEventListener("keydown", (e) => {
    const el = e.target.closest("svg.aperture [data-pick]");
    if (!el || (e.key !== "Enter" && e.key !== " ")) return;
    e.preventDefault();
    togglePick(el.closest("svg"), el.getAttribute("data-pick"));
  });
}

// The buoy's tab: the offshore spectrum itself, before any aperture.
function buoyPanel(buoy, measured = null, chart = false) {
  const line = measuredLine(measured, (m) => m.buoy)
    + (chart ? seriesChart(BUOY_TAB) : "");
  if (!buoy || buoy.hs_m == null) {
    return '<span class="val"><span class="unit">no spectrum</span></span>' + line;
  }
  const trains = buoy.trains && buoy.trains.length ? trainList(buoy.trains)
    : buoy.period_s ? `<div class="quiet">peak <b>${buoy.period_s.toFixed(1)} s</b>`
      + ` from <b>${compass(buoy.from_deg)}</b></div>` : "";
  return `<span class="val">${height(buoy.hs_m)} <span class="unit">combined</span></span>`
    + trains + line;
}

// THE CHARTS, under each card on the Now tab (owner's requests, 2026-09-27).
//
// series.json is the observed chain for every hour of the last seven days,
// rebuilt each collection. series_all.json is every archived hour since
// 46232's spectra begin, rebuilt daily into the committed archive and fetched
// only when the reader zooms or pans out past the week (forecast.series). Both
// are 46232's spectrum at each hour through TODAY's windows, seabed and surf
// zone -- not what this page showed then; info.html says so. The archive is
// withheld, never drawn, when it no longer matches today's chain. Nothing here
// is a forecast and nothing here checks the beach.
//
// An hour with no spectrum is a gap: a pale band, and the line is not joined
// across it -- at every zoom. A single hour between two gaps is a dot.
//
// Four views of the same hours, switched above the plot. The buoy's tab has
// only the heights, because the other three are about a break. Each tab plots
// its own line only, in ink (owner's call, 2026-09-28): comparing the breaks
// on one plot is for another part of the page.
const CHART_MODES = [
  {id: "height", label: "Height"},
  {id: "diff", label: "North vs. South"},
  {id: "window", label: "Window"},
  {id: "range", label: "Range %K"},
];
let CHART_MODE = "height";
// Whether the charts are folded out. One state for every tab, like the
// calculation's, and kept across a refresh the same way.
let CHART_OPEN = false;
function chartToggle(id) {
  return `<button type="button" class="calc-toggle" data-chart-toggle
    aria-controls="chart-fold-${id}" aria-expanded="${CHART_OPEN}"
    aria-label="Charts"><svg viewBox="0 0 16 16" aria-hidden="true">`
    + `<path d="M3.5 10 8 5.5 12.5 10"/></svg></button>`;
}

// Flips every caret and fold in place, so the drawing's picks and the
// countdowns keep their place.
function setChartOpen(open) {
  CHART_OPEN = open;
  remember(KEEP.chartOpen, open ? "open" : "closed");
  document.querySelectorAll("[data-chart-toggle]").forEach((btn) => {
    btn.setAttribute("aria-expanded", String(open));
    const fold = $(btn.getAttribute("aria-controls"));
    if (fold) fold.hidden = !open;
  });
}
// The hour the reader picked, by valid_utc, or null for the newest reading.
// Shared by every break, so flipping tabs keeps the same hour under the line.
let CHART_AT = null;
const CHART = {w: 320, h: 150, l: 4, r: 6, t: 10, b: 20};
const HOUR_MS = 3600000;
// The x axis, in hours: what it opens on, and how far in it zooms.
const CHART_DEFAULT_H = 24;
const CHART_MIN_H = 12;
const CHART_RANGES = [
  {id: "1d", label: "1D", hours: 24},
  {id: "7d", label: "7D", hours: 168},
  {id: "1m", label: "1M", hours: 720},
  {id: "all", label: "All", hours: Infinity},
];
// The window on the x axis, shared by every tab: null for the default (the
// last day, owner's choice 2026-09-27), else its edges in epoch ms and whether the right edge follows
// the newest hour in. Kept as ASKED FOR, not as drawn: zooming out past the
// loaded hours asks for the archive, and the view widens when it lands.
let CHART_VIEW = null;
let ALL_STATE = "idle";  // series_all.json: idle | loading | loaded | failed

const isoHour = (ms) => new Date(ms).toISOString().replace(/\.\d+Z$/, "Z");

// A height with its sign, for the north-less-south line.
const signedHeight = (m) => {
  if (m == null) return "—";
  const sign = m < 0 ? "−" : "+";
  const a = Math.abs(m);
  return `${sign}${(a * FT_PER_M).toFixed(1)} ft <span class="unit">(${sign}${a.toFixed(2)} m)</span>`;
};
