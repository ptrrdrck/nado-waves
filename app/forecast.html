  // through it. Shadows and rays run to its outer edge instead.
  const outer = r + DRAW.rim / 2;

  const wins = (c.swellWindow || [])
    .filter((win) => win && isFinite(win.from) && isFinite(win.to))
    .map((win) => ({...win, a0: rel(win.from), a1: rel(win.to)}))
    .filter((win) => win.a0 >= -90 && win.a1 <= 90 && win.a0 < win.a1)
    .sort((p, q) => p.a0 - q.a0);
  if (!wins.length) return "";

  // The shadows are whatever the windows leave, and each is cast by the land
  // that closes the window before it -- the same name the blocker carries in
  // `taken_by`, so its share is looked up, never typed.
  const shadows = [];
  let from = -90;
  wins.forEach((win) => {
    if (win.a0 > from) shadows.push({a0: from, a1: win.a0, blocker: win.opened_by});
    from = win.a1;
  });
  if (from < 90) shadows.push({a0: from, a1: 90, blocker: wins[wins.length - 1].closed_by});
  const taken = (name) => (c.takenBy || []).find((tb) => tb.blocker === name);

  // Degree labels. At a chord end they sit just above it, inside the
  // drawing: below it is the caption's line, and outside the box is the card.
  // `side` is -1 for a section's low edge and +1 for its high edge; a pair
  // closer than 16 degrees is pushed apart, low to the left and high to the
  // right, or the 193° and 199° between the islands print on top of each other.
  const label = (a, show, side = 0, tight = false) => {
    const b = Math.round(bearing(a));
    if (Math.abs(a) >= 89.5) {
      const left = a < 0;
      return `<text class="deg" data-show="${show}" x="${cx + (left ? 6 - r : r - 6)}" y="${cy - 7}"`
        + ` text-anchor="${left ? "start" : "end"}"${show === "default" ? "" : " hidden"}>${b}°</text>`;
    }
    const [x, y] = at(a, r + 12);
    const s = Math.sin(a * Math.PI / 180);
    const anchor = tight ? (side < 0 ? "end" : "start")
      : s > 0.25 ? "start" : s < -0.25 ? "end" : "middle";
    return `<text class="deg" data-show="${show}" x="${x.toFixed(1)}" y="${y.toFixed(1)}"`
      + ` text-anchor="${anchor}"${show === "default" ? "" : " hidden"}>${b}°</text>`;
  };
  // The line where "facing" sits. Two lines when one would run off the box.
  const caption = (text, show) => {
    const parts = text.length > 50 && text.includes(", ")
      ? [text.slice(0, text.indexOf(", ") + 1), text.slice(text.indexOf(", ") + 2)] : [text];
    return `<text class="faces" data-show="${show}" x="${cx}" y="${cy + 20}"`
      + `${show === "default" ? "" : " hidden"}>`
      + parts.map((part, i) => `<tspan x="${cx}" dy="${i ? 13 : 0}">${svgText(part)}</tspan>`).join("")
      + `</text>`;
  };

  const sections = [];      // what the pointer can pick, by angle
  const labels = [label(wins[0].a0, "default"), label(wins[wins.length - 1].a1, "default")];
  const captions = [caption(`facing ${compass(c.normal)}`, "default")];

  const windowPaths = wins.map((win, i) => {
    const key = `w${i}`;
    const soft = win.confidence && win.confidence !== "high";
    const text = `${shortBlocker(win.opened_by)} → ${shortBlocker(win.closed_by)}, `
      + `${point(midBearing(win.from, win.to))}, ${Math.round(win.a1 - win.a0)}° wide`
      + (soft ? ", one edge estimated" : "");
    sections.push({key, a0: win.a0, a1: win.a1});
    const tight = win.a1 - win.a0 < 16;
    labels.push(label(win.a0, key, -1, tight), label(win.a1, key, 1, tight));
    captions.push(caption(text, key));
    return `<path class="win" data-pick="${key}" tabindex="0" role="button"`
      + ` aria-label="${svgText(text)}" d="${wedge(win.a0, win.a1, outer)}"/>`;
  }).join("");

  const shading = shadows.map((sh, i) => {
    const key = `s${i}`;
    const tb = taken(sh.blocker);
    const text = tb
      ? `${sh.blocker}, blocking ${shareText(tb.share)} of this swell`
        + (tb.verified === false ? " (estimated)" : "")
      : `${sh.blocker}, blocking none of this swell`;
    sections.push({key, a0: sh.a0, a1: sh.a1});
    const tight = sh.a1 - sh.a0 < 16;
    labels.push(label(sh.a0, key, -1, tight), label(sh.a1, key, 1, tight));
    captions.push(caption(text, key));
    return `<path class="shadow" data-pick="${key}" tabindex="0" role="button"`
      + ` aria-label="${svgText(text)}" d="${wedge(sh.a0, sh.a1, outer)}"/>`;
  }).join("");

  // Every edge is a ray from the break to the rim.
  const rays = wins.flatMap((win) => [win.a0, win.a1]).map((a) => {
    const [x, y] = at(a, outer);
    return `<line class="ray" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
  }).join("");

  // Arrows come in from the rim along the heading each train arrives from,
  // and stop well short of the break: trains a few degrees apart would
  // otherwise meet in one knot of arrowheads at the centre. Drawn last so a
  // train is never hidden under a shadow it has leaked past. A train from
  // behind the beach is not drawn: it cannot arrive, and an arrow pointing out
  // of the sand would say it could.
  //
  // The head is its own triangle rather than an SVG marker: a marker cannot
  // take its colour from the line it sits on in every browser, and on some
  // the heads came out black and grey. The leg stops inside the head, where
  // the triangle is wider than the stroke, so it never shows either side of
  // the tip.
  // Local chop is made by the wind over the last few kilometres, not
  // carried in from the ocean, so it gets no arrow from the rim.
  const trains = [];
  // A train from two directions gets an arrow from each (`headings`).
  const arrows = (c.trains || [])
    .flatMap((t, i) => headings(t).map((deg, j) => ({t, i, j, deg, a: rel(deg)})))
    .filter(({t, deg, a}) => !t.local && isFinite(deg) && a > -90 && a < 90)
    .reverse()
    .map(({t, i, j, deg, a}) => {
      const key = j ? `t${i}-${j}` : `t${i}`;
      const lead = i === 0;
      const len = lead ? 10 : 8, half = lead ? 4.5 : 3.5;
      const tip = r * 0.62;
      const [x0, y0] = at(a, r * 0.95);
      const [x1, y1] = at(a, tip + 0.6 * len);
      const th = a * Math.PI / 180;
      const [bx, by] = at(a, tip + len);
      const [px, py] = [Math.cos(th) * half, Math.sin(th) * half];
      const head = `${xy(at(a, tip))} ${xy([bx + px, by + py])} ${xy([bx - px, by - py])}`;
      const text = `${heightText(t.hs_m)} at ${t.period_s.toFixed(1)} s, ${pointsText(t)}`
        + (t.wind_sea ? ", wind sea" : "");
      const [ex, ey] = at(a, tip);
      trains.push({key, x0: +x0.toFixed(1), y0: +y0.toFixed(1), x1: +ex.toFixed(1), y1: +ey.toFixed(1)});
      labels.push(`<text class="deg" data-show="${key}" hidden x="${at(a, r + 12)[0].toFixed(1)}"`
        + ` y="${at(a, r + 12)[1].toFixed(1)}" text-anchor="${Math.sin(th) > 0.25 ? "start"
          : Math.sin(th) < -0.25 ? "end" : "middle"}">${Math.round(deg)}°</text>`);
      captions.push(caption(text, key));
      return `<g class="swell${lead ? " lead" : ""}" data-pick="${key}" tabindex="0" role="button"`
        + ` aria-label="${svgText(text)}">`
        + `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}"/>`
        + `<polygon points="${head}"/></g>`;
    }).join("");

  const said = wins.map((win) => `${Math.round(win.from)} to ${Math.round(win.to)} degrees`).join(", ");
  const heard = (c.trains || []).filter((t) => !t.local && isFinite(t.from_deg))
    .map((t) => headings(t).map(Math.round).join(" and ")).join(", ");
  const summary = `Swell windows facing ${compass(c.normal)}: ${said}.`
    + (heard ? ` Swell arriving from ${heard} degrees.` : "")
    + " Select a window, a shadow or an arrow for its detail.";
  // Swell aimed behind the beach is not blocked by anything -- nothing is in
  // the way, it is pointed elsewhere -- so it is no shadow. It belongs to the
  // sand behind the chord, and a tap there says how much of it there is.
  const away = taken(AWAY);
  if (away) {
    captions.push(caption(`${shareText(away.share)} of this swell is ${AWAY}; `
      + `nothing blocks it`, "away"));
  }
  const geo = svgText(JSON.stringify({cx, cy, r: outer, sections, trains, away: !!away}));

  return `<svg class="aperture" viewBox="0 0 ${w} ${h}" role="group" aria-label="${svgText(summary)}"
    data-break="${c.id}" data-geo="${geo}">
    <path class="sea" d="${wedge(-90, 90)}"/>
    ${windowPaths}${shading}${rays}${labels.join("")}${arrows}
    <line class="chord" x1="${cx - r}" y1="${cy}" x2="${cx + r}" y2="${cy}"/>
    <circle class="spot" cx="${cx}" cy="${cy}" r="4"/>
    ${captions.join("")}
  </svg>`;
}

// Which section of each break's drawing is picked, by break. Kept across the
// re-renders a refresh or the hour picker causes; lost with the page.
const PICKED = {};

// Which keys a pick lights. A section or one arrow is its own key; a train
// picked from the list ("T2") is every arrow it has, one per direction it
// arrives from ("t2", "t2-1").
const pickMatch = (key) => (key && /^T\d+$/.test(key)
  ? (k) => k === `t${key.slice(1)}` || k.startsWith(`t${key.slice(1)}-`)
  : (k) => k === key);
const pickDrawn = (svg, key) => !!key
  && [...svg.querySelectorAll("[data-pick]")].some((el) => pickMatch(key)(el.getAttribute("data-pick")));

// Show one section's state -- or the default drawing for none.
function showPick(svg, key) {
  const hit = pickMatch(key);
  svg.classList.toggle("picked", !!key);
  svg.querySelectorAll("[data-pick]").forEach((el) =>
    el.classList.toggle("on", !!key && hit(el.getAttribute("data-pick"))));
  // Every arrow's bearing, but one caption: a train's arrows share its text.
  let captioned = false;
  svg.querySelectorAll("[data-show]").forEach((el) => {
    const show = el.getAttribute("data-show");
    let on = key ? hit(show) : show === "default";
    if (on && el.classList.contains("faces")) { on = !captioned; captioned = true; }
    if (on) el.removeAttribute("hidden"); else el.setAttribute("hidden", "");
  });
}

// What is under a point on the drawing. Arrows first, by distance to their
// leg; then sections by angle. The island shadows are 2-5 degrees wide beside
// a 6-degree channel, too thin to hit and too close to pad without covering
// each other, so a tap within 2.5 degrees of a section under 5 degrees wide
// takes it rather than its wide neighbour. Below the chord is the sand: "".
function pickAt(svg, clientX, clientY) {
  const ctm = svg.getScreenCTM();
  if (!ctm) return null;
  const pt = new DOMPoint(clientX, clientY).matrixTransform(ctm.inverse());
  const geo = JSON.parse(svg.getAttribute("data-geo"));
  const dx = pt.x - geo.cx, dy = geo.cy - pt.y;
  // Behind the chord is the sand: the swell aimed away from the beach, if
  // any of it is, and otherwise the way back to the default drawing.
  if (dy < 0) return geo.away ? "away" : "";
  if (Math.hypot(dx, dy) > geo.r + 14) return null;
  for (const arrow of geo.trains) {
    const vx = arrow.x1 - arrow.x0, vy = arrow.y1 - arrow.y0;
    const k = Math.max(0, Math.min(1,
      ((pt.x - arrow.x0) * vx + (pt.y - arrow.y0) * vy) / (vx * vx + vy * vy)));
    if (Math.hypot(pt.x - (arrow.x0 + k * vx), pt.y - (arrow.y0 + k * vy)) < 9) return arrow.key;
  }
  const a = Math.atan2(dx, dy) * 180 / Math.PI;
  const off = (s) => (a < s.a0 ? s.a0 - a : a > s.a1 ? a - s.a1 : 0);
  const thin = geo.sections.filter((s) => s.a1 - s.a0 < 5 && off(s) <= 2.5)
    .sort((p, q) => off(p) - off(q));
  if (thin.length) return thin[0].key;
  const hit = geo.sections.find((s) => off(s) === 0);
  return hit ? hit.key : null;
}

// A tap picks; the same tap again, or the sand, returns to the default.
function togglePick(svg, key) {
  const id = svg.getAttribute("data-break");
  PICKED[id] = key && PICKED[id] !== key ? key : null;
  showPick(svg, PICKED[id]);
}

function restorePicks() {
  document.querySelectorAll("svg.aperture[data-break]").forEach((svg) => {
    const key = PICKED[svg.getAttribute("data-break")];
    showPick(svg, pickDrawn(svg, key) ? key : null);
  });
}

// Delegated once, like the tabs, because the cards are rebuilt on every render.
function wireDrawings() {
  const strip = $("conditions");
  // A train in the list and the drawing in the same tab: the row picks its
  // arrows as a tap on them does, and a mouse over it previews them.
  const rowOf = (e) => {
    const row = e.target.closest(".train[data-train]");
    const pane = row && row.closest(".pane");
    const svg = pane && pane.querySelector("svg.aperture");
    const key = row && `T${row.getAttribute("data-train")}`;
    return svg && pickDrawn(svg, key) ? {row, svg, key} : null;
  };
  const settle = (svg) => showPick(svg, PICKED[svg.getAttribute("data-break")] || null);
  strip.addEventListener("click", (e) => {
    const got = rowOf(e);
    if (got) togglePick(got.svg, got.key);
  });
  strip.addEventListener("pointerover", (e) => {
    const got = e.pointerType === "mouse" && rowOf(e);
    if (got) showPick(got.svg, got.key);
  });
  strip.addEventListener("pointerout", (e) => {
    const got = e.pointerType === "mouse" && rowOf(e);
    if (got && !got.row.contains(e.relatedTarget)) settle(got.svg);
  });
  strip.addEventListener("keydown", (e) => {
    const got = (e.key === "Enter" || e.key === " ") && rowOf(e);
    if (!got) return;
    e.preventDefault();
    togglePick(got.svg, got.key);
  });
  strip.addEventListener("click", (e) => {
    const svg = e.target.closest("svg.aperture");
    if (!svg) return;
    // A click with no pointer behind it (a screen reader activating a
    // section) has no coordinates to test; it names its section itself.
    const own = e.target.closest("[data-pick]");
    const key = e.detail === 0 && own ? own.getAttribute("data-pick")
      : pickAt(svg, e.clientX, e.clientY);
    if (key !== null) togglePick(svg, key);
  });
  // A mouse previews what a tap would pick, and leaving puts the pick back.
  strip.addEventListener("pointermove", (e) => {
    const svg = e.target.closest("svg.aperture");
    if (!svg || e.pointerType !== "mouse") return;
    const key = pickAt(svg, e.clientX, e.clientY);
    showPick(svg, key || PICKED[svg.getAttribute("data-break")] || null);
  });
  strip.addEventListener("pointerout", (e) => {
    const svg = e.target.closest("svg.aperture");
    if (svg && !svg.contains(e.relatedTarget)) showPick(svg, PICKED[svg.getAttribute("data-break")] || null);
  });
  strip.addEventListener("keydown", (e) => {
    const el = e.target.closest("svg.aperture [data-pick]");
    if (!el || (e.key !== "Enter" && e.key !== " ")) return;
    e.preventDefault();
    togglePick(el.closest("svg"), el.getAttribute("data-pick"));
  });
}

// The buoy's tab ("Buoys" since 2026-10-06): the offshore spectrum itself,
// before any aperture.
//
// On the LIVE tab it also carries the context buoys from buoys.json (owner's
// request, 2026-10-06): 46047, Tanner Banks, the least shadowed buoy in the
// array, built the same way -- combined height and maximum-entropy trains --
// under its own name, its own observed time and its own countdown, because
// its spectra are stamped at :20 and :50 and land on their own measured lag
// (forecast.buoys). It is outside every break's windows and carried to no
// break (BRIEFING §3a), and its block says so. With a context buoy on the
// tab, each block is named, since the tab then holds two heights.
//
// Each buoy's provenance follows its own measurements, all beneath 46232
// (owner's call, 2026-10-06): 46232's reading here, then the card's own
// provenance lines, which are 46232's, then each context buoy's block after
// them (`swellCard`'s `after`), its provenance in the same style.
function buoyPanel(buoy, measured = null, station = null, named = false, rose = "") {
  const line = measuredLine(measured, (m) => m.buoy);
  const head = named && station
    ? `<span class="sublbl">${buoyLabel(station.name, station.id)}</span>` : "";
  if (!buoy || buoy.hs_m == null) {
    return head + '<span class="val"><span class="unit">no spectrum</span></span>' + rose + line;
  }
  return head + buoyReading(buoy, rose && station ? station.id : null) + rose + line;
}

function buoyReading(buoy, roseFor = null) {
  const trains = buoy.trains && buoy.trains.length ? trainList(buoy.trains, {rose: roseFor})
    : buoy.period_s ? `<div class="quiet">peak <b>${buoy.period_s.toFixed(1)} s</b>`
      + ` from <b>${compass(buoy.from_deg)}</b></div>` : "";
  return `<span class="val">${height(buoy.hs_m)} <span class="unit">combined</span></span>`
    + trains;
}

const buoyLabel = (name, id) => (name && name !== id ? `${name} (${id})` : `NDBC ${id}`);

// One context buoy's block: its name, its reading, and its provenance --
// observed when, from which buoy, carried to no break, and its countdown,
// red past its measured worst or past the build's three hours.
function contextBuoy(b) {
  const old = b.observed_utc && (b.stale || (ageHours(b.observed_utc) || 0) > (b.stale_hours || 3));
  const reading = b.hs_m != null ? buoyReading(b, b.station)
    : '<span class="val"><span class="unit">no spectrum</span></span>';
  return `<hr><span class="sublbl">${buoyLabel(b.station_name, b.station)}</span>${reading}`
    + roseBlock(b.station)
    + srcLines([
      b.observed_utc ? `Observed ${observedAt(b.observed_utc)}` : "",
      b.station_name ? `Spectral wave data, ${b.station_name} (NDBC ${b.station})` : "",
      "Open ocean witness, not carried to any break",
    ], b.observed_utc ? dueSpan(b.next_expected, b.overdue_after, {forceOver: !!old}) : "");
}

// THE ROSES, under each buoy's reading on the LIVE tab's Buoys tab (owner's
// request, 2026-10-06; forecast.rose, in buoys.json). One rose per spectrum:
// that spectrum's energy summed into the sixteen compass sectors, petals
// pointing where the energy comes FROM. Two views on one switch -- Height,
// each sector's energy as a height (they combine in energy, so they do not
// add up to the combined height), and Period, each sector's share of the
// energy split into five period bands, longest in ink -- and every spectrum
// of the last six hours looped.
//
// ONE clock drives both buoys, so the two roses always show the same moment:
// the loop runs from the first moment every buoy has a frame to the newest
// across both, then holds
// on the newest. A rose shows the newest spectrum stamped at or before that
// moment, until its successor was due (its own stamp spacing, in the file);
// past that it is a gap and says so, never the frame beside it. Its newest
// frame stays until a newer one lands: a stamp not out yet is not a gap. Each
// buoy has its own scale per view (owner's request, 2026-10-06): its
// outermost ring is the largest petal in its own loop rounded up to a whole
// foot (or percent), so the petals are as large as they can be and none
// passes the last ring; the rings say what each scale is. A
// reader who asks for less motion gets the newest frame, paused.
// Height and Period, switched by their units at the right end of the
// timeline row (owner's request, 2026-10-08: a row of its own cost 28 px a
// rose): "ft" and "s", the units the line under the rose reads in. The
// label is what a screen reader says.
const ROSE_MODES = [{id: "height", label: "Height", symbol: "ft"}, {id: "period", label: "Period", symbol: "s"}];
let ROSE_MODE = recall(KEEP.roseMode) === "period" ? "period" : "height";
const ROSE_PLAY_MS = 9000;
const ROSE_HOLD_MS = 2500;
const ROSE_STILL = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
let ROSE_PLAYING = !ROSE_STILL;
let ROSE_PHASE = ROSE_PLAYING ? 0 : ROSE_PLAY_MS;
let ROSE_LAST = performance.now();
const ROSE_POINTS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
// forecast.rose.PERIOD_EDGES_S, as the legend names them.
const ROSE_BANDS = ["under 8 s", "8–11 s", "11–14 s", "14–17 s", "17 s +"];
// The legend's own, on one row: the unit once, at the end.
const ROSE_BAND_KEYS = ["<8", "8–11", "11–14", "14–17", "17+ s"];
// The outer ring is the drawing's edge, N, E, S and W just inside it (owner's
// choice, 2026-10-08): no band of empty card around the circle.
const ROSE = {c: 120, r: 119};
// The train row tapped on each buoy's reading, by index into the newest
// spectrum's trains (owner's request, 2026-10-08), or none. Its period range
// is lit on that buoy's rose in every frame: the same range, not the same
// swell, since nothing follows a train from one spectrum to the next.
let ROSE_TRAIN = {};

const roseOf = (station) => (BUOYS && BUOYS.roses && BUOYS.roses[station]) || null;

// A row can light the rose only when the rose's trains were split from the
// very spectrum the reading above it lists.
function roseTrainOK(station, i) {
  const rose = roseOf(station);
  if (!rose || !rose.trains || !rose.trains[i]) return false;
  const observed = NOW && station === NOW.station ? NOW.observed_utc
    : (((BUOYS && BUOYS.buoys) || []).find((b) => b.station === station) || {}).observed_utc;
  return !!observed && observed === rose.trains_from_utc;
}
const rosePick = (station) => (Number.isInteger(ROSE_TRAIN[station])
  && roseTrainOK(station, ROSE_TRAIN[station]) ? ROSE_TRAIN[station] : null);
// A train divided from a band of two directions (BRIEFING §40) shares its
// period range with its twin, so its headings are part of the range.
function roseRange(station, i) {
  const t = roseOf(station).trains[i];
  return `${t.period_lo_s.toFixed(1)}\u2013${t.period_hi_s.toFixed(1)} s`
    + (t.from_lo_deg != null ? ` from ${t.from_lo_deg}\u2013${t.from_hi_deg}&deg;` : "");
}
const roseTime = (f) => new Date(f.time_utc).getTime();

// The loop's span: the oldest frame to the newest, over every buoy.
// The loop's span: from the first moment EVERY buoy has a spectrum to the
// newest frame over all of them. Starting at the oldest frame overall put the
// loop on 46047's :50 stamp, ten minutes before 46232's first on the hour,
// and 46232 opened every loop on "No spectrum yet" for a moment it did have
// one, just outside the six hours (owner's report, 2026-10-07). The earlier
// buoy loses nothing: its first frame is the one in force at the start.
function roseSpan() {
  const firsts = [], times = [];
  Object.values((BUOYS && BUOYS.roses) || {}).forEach((r) => {
    const own = (r.frames || []).map(roseTime);
    if (!own.length) return;
    firsts.push(Math.min(...own));
    times.push(...own);
  });
  if (!times.length) return null;
  return {t0: Math.max(...firsts), t1: Math.max(...times)};
}

function roseMoment(span) {
  return ROSE_PHASE >= ROSE_PLAY_MS ? span.t1
    : span.t0 + (span.t1 - span.t0) * ROSE_PHASE / ROSE_PLAY_MS;
}

// One scale per view for every frame of ONE buoy's loop: feet for Height, a
// share for Period. The rings are evenly spaced, at most five, and the
// outermost is the edge: the loop's largest petal rounded UP to the next ring,
// so no petal passes it. A step of 1 ft makes that the next whole foot; past
// 5 ft the step widens to 2 ft, so the rings stay even rather than one of them
// falling short (owner's report, 2026-10-07: 2, 4 and 5 ft read as uneven).
// Fixed across the loop, so a petal that grows between frames really grew.
function roseScale(mode, station) {
  const frames = (roseOf(station) || {}).frames || [];
  const top = Math.max(0, ...frames.flatMap((f) => mode === "height"
    ? f.sector_hs_m.map((m) => m * FT_PER_M)
    : f.period_share.map((row) => row.reduce((a, b) => a + b, 0))));
  const steps = mode === "height" ? [1, 2, 5, 10, 20] : [0.05, 0.1, 0.2, 0.25];
  // The tolerance is far under the 0.1 ft shown, and keeps a petal of exactly
  // 6 ft (1.8288 m, 6.000002 ft through the converter) on the 6 ft ring.
  const count = (st) => Math.max(1, Math.ceil(top / st - 1e-4));
  const step = steps.find((st) => count(st) <= 5) || steps[steps.length - 1];
  const rings = [];
  for (let k = 1; k <= count(step); k++) rings.push(+(k * step).toFixed(4));
  return {max: rings[rings.length - 1], step, rings};
}

// The scale in words, one line under the rose (owner's request, 2026-10-07),
// rather than a figure on the plot, where any spot is a bearing.
function roseScaleLine(mode, station) {
  const sc = roseScale(mode, station);
  return mode === "height"
    ? `Rings every ${sc.step} ft (${(sc.step / FT_PER_M).toFixed(2)} m)`
    : `Rings every ${rosePct(sc.step)}`;
}

// What a buoy's rose shows at a moment: a frame, a gap, or a stamp not in yet.
function roseAt(rose, t) {
  const frames = rose.frames || [];
  let k = -1;
  frames.forEach((f, i) => { if (roseTime(f) <= t + 1000) k = i; });
  const every = (rose.interval_min || 60) * 60000;
  if (k < 0) {
    return {key: "none", note: "No spectrum yet at " + clock(new Date(t).toISOString())};
  }
  // The newest is shown until a newer one lands, under its own time: a stamp
  // not published yet is not a gap, and a paused rose rests on the newest.
  const due = roseTime(frames[k]) + every;
  if (k === frames.length - 1 || t + 1000 < due) return {key: String(k), frame: frames[k], k};
  return {key: "gap" + k, note: `No spectrum at ${clock(new Date(due).toISOString())}`};
}

const rosePt = (r, deg) => {
  const a = deg * Math.PI / 180;
  return `${(ROSE.c + r * Math.sin(a)).toFixed(2)},${(ROSE.c - r * Math.cos(a)).toFixed(2)}`;
};

// A petal from r0 to r1 across one sector, a degree short of each edge so
// neighbours never touch.
function rosePetal(i, r0, r1) {
  const a0 = i * 22.5 - 10.25, a1 = i * 22.5 + 10.25;
  if (r0 <= 0.01) {
    return `M${ROSE.c},${ROSE.c}L${rosePt(r1, a0)}A${r1.toFixed(2)},${r1.toFixed(2)} 0 0 1 ${rosePt(r1, a1)}Z`;
  }
  return `M${rosePt(r0, a0)}L${rosePt(r1, a0)}A${r1.toFixed(2)},${r1.toFixed(2)} 0 0 1 ${rosePt(r1, a1)}`
    + `L${rosePt(r0, a1)}A${r0.toFixed(2)},${r0.toFixed(2)} 0 0 0 ${rosePt(r0, a0)}Z`;
}

const rosePct = (s) => `${Math.round(s * 100)}%`;

function rosePlot(state, mode, station) {
  const {c, r: R} = ROSE;
  const scale = roseScale(mode, station);
  const rings = scale.rings;
  const grid = rings.map((v) => `<circle class="ring" cx="${c}" cy="${c}" r="${(R * v / scale.max).toFixed(2)}"/>`).join("")
    + `<line class="ring" x1="${c}" y1="${c - R}" x2="${c}" y2="${c + R}"/>`
    + `<line class="ring" x1="${c - R}" y1="${c}" x2="${c + R}" y2="${c}"/>`;
  const marks = [["N", 0], ["E", 90], ["S", 180], ["W", 270]].map(([p, deg]) => {
    const [x, y] = rosePt(R - 9, deg).split(",");
    return `<text class="pt" x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central">${p}</text>`;
  }).join("");

  let petals = "";
  let said = "";
  const pick = rosePick(station);
  if (state.frame) {
    const f = state.frame;
    if (mode === "height") {
      petals = f.sector_hs_m.map((m, i) => (m * FT_PER_M < scale.max * 0.004 ? ""
        : `<path class="rp" d="${rosePetal(i, 0, R * m * FT_PER_M / scale.max)}">`
          + `<title>${ROSE_POINTS[i]}: ${heightText(m)}</title></path>`)).join("");
      const top = f.sector_hs_m.map((m, i) => [m, i]).sort((a, b) => b[0] - a[0]).slice(0, 3);
      said = `largest from ${top.map(([m, i]) => `${ROSE_POINTS[i]} ${heightText(m)}`).join(", ")}`;
    } else {
      petals = f.period_share.map((row, i) => {
        let cum = 0;
        return row.map((s, b) => {
          const r0 = R * cum / scale.max;
          cum += s;
          if (s < 0.0005) return "";
          return `<path class="rb rb${b}" d="${rosePetal(i, r0, R * cum / scale.max)}">`
            + `<title>${ROSE_POINTS[i]}, ${ROSE_BANDS[b]}: ${rosePct(s)} of the energy</title></path>`;
        }).join("");
      }).join("");
      const sums = f.period_share.map((row, i) => [row.reduce((a, b) => a + b, 0), i])
        .sort((a, b) => b[0] - a[0]).slice(0, 3);
      said = `largest shares from ${sums.map(([s, i]) => `${ROSE_POINTS[i]} ${rosePct(s)}`).join(", ")}`;
    }
    // A picked row's period range over the whole rose, dimmed beneath it.
    const share = pick != null && f.train_share && f.train_share[pick];
    if (share) {
      const range = roseRange(station, pick);
      const lit = share.map((s, i) => {
        const v = mode === "height" ? f.hs_m * Math.sqrt(s) * FT_PER_M : s;
        if (v < scale.max * 0.004) return "";
        const what = mode === "height" ? heightText(f.hs_m * Math.sqrt(s)) : `${rosePct(s)} of the energy`;
        return `<path class="rt" d="${rosePetal(i, 0, R * v / scale.max)}">`
          + `<title>${ROSE_POINTS[i]}, ${range}: ${what}</title></path>`;
      }).join("");
      petals = `<g class="dim">${petals}</g>${lit}`;
      said += `; ${range} lit`;
    }
  }
  const when = state.frame ? clock(state.frame.time_utc) : "";
  const aria = state.frame ? `${mode === "height" ? "Height" : "Period"} rose at ${when}: ${said}`
    : state.note;
  return `<svg class="rose-svg${pick != null ? " picked" : ""}" viewBox="0 0 240 240" role="img" aria-label="${aria}">`
    + grid + petals + marks + `</svg>`;
}

// The one line under the rose (owner's request, 2026-10-08): its ring
// spacing, then the frame's time and what it holds -- "Rings every 1 ft
// (0.30 m) · 11:00 AM · 4.6 ft (1.39 m) combined". Each part keeps to
// itself, so a narrow phone breaks the line only at a "·". With a row
// picked it names the period range, never "the train": in an older frame
// that range may hold another swell.
function roseReadout(state, station) {
  const seg = (html, cls = "") => `<span class="rs${cls}">${html}</span>`;
  const sep = " \u00b7 ";
  const scale = seg(roseScaleLine(ROSE_MODE, station));
  if (!state.frame) return scale + sep + seg(state.note);
  const f = state.frame;
  const when = seg(clock(f.time_utc), " v");
  const k = rosePick(station);
  const share = k != null && f.train_share && f.train_share[k];
  if (share) {
    const sum = share.reduce((a, b) => a + b, 0);
    return scale + sep + when + sep + seg(`${roseRange(station, k)}: `
      + (ROSE_MODE === "height" ? height(f.hs_m * Math.sqrt(sum))
        : `${rosePct(sum)} <span class="unit">of the energy</span>`), " v");
  }
  return scale + sep + when + sep
    + seg(`${height(f.hs_m)} <span class="unit">combined</span>`, " v");
}

// The six hours under the rose: a tick for every spectrum this buoy sent, so
// a missing one is a missing tick; the moment shown, and a tap to go to one.
function roseLine(rose, span, t, state) {
  // A frame stamped before the loop starts (the earlier buoy's first) sits at
  // the line's left end: it is the one shown there.
  const x = (ms) => (8 + 224 * (span.t1 > span.t0
    ? Math.max(0, Math.min(1, (ms - span.t0) / (span.t1 - span.t0))) : 1)).toFixed(1);
  const ticks = (rose.frames || []).map((f, i) =>
    `<line class="tk${state.k === i ? " on" : ""}" x1="${x(roseTime(f))}" y1="4" x2="${x(roseTime(f))}" y2="14"/>`).join("");
  const ends = `<text class="tt" x="8" y="25">${clock(new Date(span.t0).toISOString())}</text>`
    + `<text class="tt" x="232" y="25" text-anchor="end">${clock(new Date(span.t1).toISOString())}</text>`;
  return `<line class="base" x1="8" y1="14" x2="232" y2="14"/>${ticks}`
    + `<line class="head" x1="${x(t)}" y1="1" x2="${x(t)}" y2="16"/>${ends}`;
}

// The Period legend's row is kept on Height too, laid out and unseen, so
// switching views never moves the page under the reader (owner's request,
// 2026-10-08).
function roseLegend(mode) {
  const off = mode !== "period";
  return `<div class="legend${off ? " off" : ""}"${off ? ' aria-hidden="true"' : ' aria-label="Periods, shortest palest"'}>`
    + `${ROSE_BAND_KEYS.map((b, i) =>
      `<span title="${ROSE_BANDS[i]}"><i class="sw rb rb${i}"></i>${b}</span>`).join("")}</div>`;
}

function roseView(station) {
  const rose = roseOf(station);
  const span = roseSpan();
  if (!rose || !span) return null;
  const t = roseMoment(span);
  const state = roseAt(rose, t);
  return {key: `${ROSE_MODE}:${state.key}:${span.t0}:${span.t1}:${rosePick(station)}`,
    rose, span, t, state, station};
}

const rosePercent = (v) => (v.span.t1 > v.span.t0
  ? Math.round(100 * (v.t - v.span.t0) / (v.span.t1 - v.span.t0)) : 100);

// One buoy's rose block, under its reading. Its moving parts are marked
// `data-rose-live`, so a refresh never flashes the card for a frame that was
// only ever going to change.
function roseBlock(station) {
  const rose = roseOf(station);
  if (!rose) return "";
  const v = roseView(station);
  if (!v || !(rose.frames || []).length) {
    return `<div class="rose"><span class="src">No spectrum from ${station} in the last six hours.</span></div>`;
  }
  const modes = ROSE_MODES.map((m) => `<button type="button" data-rose-mode="${m.id}"`
    + ` aria-pressed="${m.id === ROSE_MODE}" aria-label="${m.label}" title="${m.label}">${m.symbol}</button>`).join("");
  return `<div class="rose" data-rose="${station}" data-k="${v.key}">
    <div class="rose-plot" data-rose-live>${rosePlot(v.state, ROSE_MODE, station)}</div>
    <div class="rose-scale" data-rose-live aria-live="off">${roseReadout(v.state, station)}</div>
    <div class="rose-time">${rosePlayButton()}
    <svg class="rose-line" data-rose-live data-rose-scrub viewBox="0 0 240 28" role="slider"
      aria-label="Moment shown" tabindex="0" aria-valuemin="0" aria-valuemax="100"
      aria-valuenow="${rosePercent(v)}" aria-valuetext="${v.state.frame ? clock(v.state.frame.time_utc) : v.state.note}">${roseLine(rose, v.span, v.t, v.state)}</svg>
    <span class="ranges rose-modes" role="group" aria-label="Which rose">${modes}</span></div>
    ${roseLegend(ROSE_MODE)}
  </div>`;
}

// Redraw a rose in place: the petals only when the frame or view changed,
// the playhead every tick.
function roseUpdate(el) {
  if (el.offsetParent === null) return;
  const v = roseView(el.getAttribute("data-rose"));
  if (!v) return;
  if (el.getAttribute("data-k") !== v.key) {
    el.setAttribute("data-k", v.key);
    el.querySelector(".rose-plot").innerHTML = rosePlot(v.state, ROSE_MODE, el.getAttribute("data-rose"));
    el.querySelector(".rose-scale").innerHTML = roseReadout(v.state, el.getAttribute("data-rose"));
    el.querySelector(".rose-line").setAttribute("aria-valuenow", rosePercent(v));
    el.querySelector(".rose-line").setAttribute("aria-valuetext",
      v.state.frame ? clock(v.state.frame.time_utc) : v.state.note);
  }
  el.querySelector(".rose-line").innerHTML = roseLine(v.rose, v.span, v.t, v.state);
}

function roseTick() {
  const at = performance.now();
  const dt = Math.min(at - ROSE_LAST, 250);
  ROSE_LAST = at;
  if (MODE !== "now") return;
  if (ROSE_PLAYING) ROSE_PHASE = (ROSE_PHASE + dt) % (ROSE_PLAY_MS + ROSE_HOLD_MS);
  document.querySelectorAll("[data-rose]").forEach(roseUpdate);
}

// Play and pause as symbols, left of the six hours (owner's request,
// 2026-10-07): the button shows what a tap will do, its label says it too.
const ROSE_ICON = {
  play: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5v9l7.5-4.5z"/></svg>',
  pause: '<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="1.5" width="3" height="9" rx=".5"/>'
    + '<rect x="7" y="1.5" width="3" height="9" rx=".5"/></svg>',
};
function rosePlayButton() {
  return `<button type="button" class="rose-play" data-rose-play aria-label="${ROSE_PLAYING ? "Pause" : "Play"}">`
    + `${ROSE_PLAYING ? ROSE_ICON.pause : ROSE_ICON.play}</button>`;
}
function setRosePlaying(on) {
  ROSE_PLAYING = on;
  document.querySelectorAll("[data-rose-play]").forEach((b) => {
    b.setAttribute("aria-label", on ? "Pause" : "Play");
    b.innerHTML = on ? ROSE_ICON.pause : ROSE_ICON.play;
  });
}

// A tap or an arrow key on the six hours goes to that moment and pauses.
function roseSeek(phase) {
  ROSE_PHASE = Math.max(0, Math.min(ROSE_PLAY_MS, phase));
  setRosePlaying(false);
  document.querySelectorAll("[data-rose]").forEach(roseUpdate);
}

// Tap a row again, or another, to clear or move the light.
function toggleRoseTrain(row) {
  const station = row.getAttribute("data-rose-for");
  const i = Number(row.getAttribute("data-rose-train"));
  ROSE_TRAIN[station] = ROSE_TRAIN[station] === i ? null : i;
  document.querySelectorAll(`[data-rose-for="${station}"]`).forEach((r) =>
    r.setAttribute("aria-pressed", String(Number(r.getAttribute("data-rose-train")) === ROSE_TRAIN[station])));
  document.querySelectorAll(`[data-rose="${station}"]`).forEach(roseUpdate);
}

function wireRoses() {
  const strip = $("conditions");
  strip.addEventListener("keydown", (e) => {
    const row = (e.key === "Enter" || e.key === " ") && e.target.closest("[data-rose-train]");
    if (!row) return;
    e.preventDefault();
    toggleRoseTrain(row);
  });
  strip.addEventListener("click", (e) => {
    const row = e.target.closest("[data-rose-train]");
    if (row) { toggleRoseTrain(row); return; }
    const mode = e.target.closest("[data-rose-mode]");
    if (mode) {
      ROSE_MODE = mode.getAttribute("data-rose-mode");
      remember(KEEP.roseMode, ROSE_MODE);
      document.querySelectorAll("[data-rose-mode]").forEach((b) =>
        b.setAttribute("aria-pressed", String(b.getAttribute("data-rose-mode") === ROSE_MODE)));
      document.querySelectorAll("[data-rose]").forEach((el) => {
        const legend = el.querySelector(".legend");
        if (legend) legend.remove();
        el.insertAdjacentHTML("beforeend", roseLegend(ROSE_MODE));
        roseUpdate(el);
      });
      return;
    }
    if (e.target.closest("[data-rose-play]")) {
      if (!ROSE_PLAYING && ROSE_PHASE >= ROSE_PLAY_MS) ROSE_PHASE = 0;
      setRosePlaying(!ROSE_PLAYING);
      return;
    }
    const line = e.target.closest("[data-rose-scrub]");
    if (line) {
      const box = line.getBoundingClientRect();
      const x = (e.clientX - box.left) / box.width * 240;
      roseSeek((x - 8) / 224 * ROSE_PLAY_MS);
    }
  });
  strip.addEventListener("keydown", (e) => {
    if (!e.target.closest("[data-rose-scrub]")) return;
    const span = roseSpan();
    if (!span || span.t1 <= span.t0) return;
    // Half an hour a key: 46047's stamp spacing, the finer of the two.
    const half = ROSE_PLAY_MS * 1800000 / (span.t1 - span.t0);
    const step = e.key === "ArrowRight" ? half : e.key === "ArrowLeft" ? -half : null;
    if (step == null) return;
    e.preventDefault();
    roseSeek(Math.min(ROSE_PHASE, ROSE_PLAY_MS) + step);
  });
}

// THE CHARTS, under each card on the Now tab (owner's requests, 2026-09-27).
//
// series.json is the observed chain for every hour of the last seven days,
// rebuilt each collection. series_all.json is every archived hour since
// 46232's spectra begin, rebuilt daily into the committed archive and fetched
// only when the reader zooms or pans out past the week (forecast.series). Both
// are 46232's spectrum at each hour through TODAY's windows, seabed and surf
// zone -- not what this page showed then; docs.html says so. The archive is
// withheld, never drawn, when it no longer matches today's chain. Nothing here
// is a forecast and nothing here checks the beach.
//
// An hour with no spectrum is a gap: a pale band, and the line is not joined
// across it -- at every zoom. A single hour between two gaps is a dot.
//
// Four views of the same hours, switched above the plot, in the owner's order
// (2026-10-05). The buoy's tab has only the heights and the origins, because
// the other two are about a break. Each tab plots its own line in ink
// (owner's call, 2026-09-28); Height alone draws the other two breaks under it,
// lighter, so the three can be compared at a glance (owner's request,
// 2026-10-05).
//
// The range view (a 24 h %K, buoy less break; `buildSpec`'s "range") is off
// the menu by the owner's call the same day, and kept, with series.py's
// pct_k / pct_d, so it can come back: put {id: "range", label: ...} back in
// this list. A reader whose remembered view was "range" opens on Height.
const CHART_MODES = [
  {id: "height", label: "Height"},
  {id: "window", label: "Window"},
  {id: "origins", label: "Origins"},
  {id: "diff", label: "North vs. South"},
];
let CHART_MODE = "height";
// The Forecast tab's charts (owner's request, 2026-09-29): the same place on
// its Swell card, over the model's 3-hourly hours instead of Now's hourly
// observed ones. Past hours are what the page showed then, with 46232's own
// spectrum carried in beside them in red; nothing here is a band, a
// range the swell will fall in, or a score.
// "Forecast & observed" was folded into the runs view (owner's call,
// 2026-09-30): the newest run, the earlier runs and 46232 on one plot.
const FC_MODES = [
  {id: "runs", label: "Forecast + Observed"},
  {id: "trains", label: "Swell trains"},
  {id: "diff", label: "North vs. South"},
  {id: "ensemble", label: "Ensemble"},
];
let FC_MODE0 = "runs";
// The views a tab's menu offers: on Now's buoy tab, its height and the
// origins; on the Forecast tab's buoy, everything but the two breaks'
// difference, which is about the breaks.
function chartModes(id) {
  if (isWT(id)) return WT_MODES[CHAIN][id];
  // The ensemble is at the buoy only: GEFS-Wave publishes total height, no
  // direction, so it cannot be carried through a break's windows.
  if (CHAIN === "fc") {
    return FC_MODES.filter((m) => (id === BUOY_TAB ? m.id !== "diff" : m.id !== "ensemble"));
  }
  return id === BUOY_TAB ? CHART_MODES.filter((m) => m.id === "height" || m.id === "origins")
    : CHART_MODES;
}
function chartModeFor(id) {
  const modes = chartModes(id);
  const asked = isWT(id) ? WT_MODE[CHAIN][id] : CHART_MODE;
  return modes.some((m) => m.id === asked) ? asked : modes.length ? modes[0].id : "height";
}
// Whether the charts are folded out. One state for every tab, like the
// calculation's, and kept across a refresh the same way.
let CHART_OPEN = false;
function chartToggle(id) {
  return `<button type="button" class="calc-toggle" data-chart-toggle
    aria-controls="chart-fold-${id}" aria-expanded="${CHART_OPEN}"
    aria-label="Charts"><svg viewBox="0 0 16 16" aria-hidden="true">`
    + `<path d="M3.5 10 8 5.5 12.5 10"/></svg></button>`;
}

// Flips every caret and fold in place, so the drawing's picks and the
// countdowns keep their place.
function setChartOpen(open) {
  CHART_OPEN = open;
  remember(KEEP.chartOpen, open ? "open" : "closed");
  document.querySelectorAll("[data-chart-toggle]").forEach((btn) => {
    btn.setAttribute("aria-expanded", String(open));
    const fold = $(btn.getAttribute("aria-controls"));
    if (fold) fold.hidden = !open;
  });
}
// The hour the reader picked, by valid_utc, or null for the newest reading.
// Shared by every break, so flipping tabs keeps the same hour under the line.
let CHART_AT = null;
const CHART = {w: 320, h: 150, l: 4, r: 6, t: 10, b: 20};
const HOUR_MS = 3600000;
// The x axis, in hours: what it opens on, and how far in it zooms.
const CHART_DEFAULT_H = 24;
const CHART_MIN_H = 12;
const CHART_RANGES = [
  {id: "1d", label: "1D", hours: 24},
  {id: "7d", label: "7D", hours: 168},
  {id: "1m", label: "1M", hours: 720},
  {id: "all", label: "All", hours: Infinity},
];
// The window on the x axis, shared by every tab: null for the default (the
// last day, owner's choice 2026-09-27), else its edges in epoch ms and whether the right edge follows
// the newest hour in. Kept as ASKED FOR, not as drawn: zooming out past the
// loaded hours asks for the archive, and the view widens when it lands.
let CHART_VIEW = null;
let ALL_STATE = "idle";  // series_all.json: idle | loading | loaded | failed

// Two chains draw charts under the Swell card: Now's hourly observed series
// and the Forecast tab's 3-hourly model hours. Only one is on screen at a
// time, so the window, the picked hour and the view in the menu are kept per
// chain and swapped in when the tab changes, never shared between them: an
// hour picked on one is not an hour on the other.
let CHAIN = "now";
const CHAIN_KEPT = {now: null, fc: null};
function useChain(chain) {
  if (chain === CHAIN) return;
  CHAIN_KEPT[CHAIN] = {view: CHART_VIEW, at: CHART_AT, mode: CHART_MODE};
  const got = CHAIN_KEPT[chain] || {view: null, at: null, mode: chain === "fc" ? FC_MODE0 : "height"};
  CHART_VIEW = got.view;
  CHART_AT = got.at;
  CHART_MODE = got.mode;
  CHAIN = chain;
}
// Whether the chain on screen has anything to draw from.
const chartLive = (id) => (isWT(id) ? !!WT || (CHAIN === "fc" && !!DATA)
  : CHAIN === "fc" ? !!DATA : !!SERIES);
// The forecast's view opens on three days with the present a quarter of the
// way in, and zooms out to everything the file reaches: 48 h back to +168 h.
const FC_DEFAULT_H = 72;
const FC_RANGES = [
  {id: "1d", label: "1D", hours: 24},
  {id: "3d", label: "3D", hours: 72},
  {id: "7d", label: "7D", hours: 168},
  {id: "all", label: "All", hours: Infinity},
];
const chartRangeList = (steps) => (steps && steps.ranges) || (CHAIN === "fc" ? FC_RANGES : CHART_RANGES);
// The time between two chart hours: one on Now, three on the forecast.
const stepMs = (steps) => (steps.length > 1
  ? Date.parse(steps[1].valid_utc) - Date.parse(steps[0].valid_utc) : HOUR_MS);

const isoHour = (ms) => new Date(ms).toISOString().replace(/\.\d+Z$/, "Z");

// A height with its sign, for the north-less-south line.
const signedHeight = (m) => {
  if (m == null) return "—";
  const sign = m < 0 ? "−" : "+";
  const a = Math.abs(m);
  return `${sign}${(a * FT_PER_M).toFixed(1)} ft <span class="unit">(${sign}${a.toFixed(2)} m)</span>`;
};
const dayClock = (iso) => new Date(iso).toLocaleString(undefined, {
  weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit",
});

// A heights axis in feet, placed in metres: the data stays SI and the
// conversion is the page's one constant. The top (and, for a signed axis, the
// bottom) is rounded up to a whole tick, so the frame is always a gridline --
// the edges of the plot are drawn on every chart, whatever the heights in
// view -- and the furthest line never touches it. At most four steps from
// zero to the top, or three either side of zero when the axis is signed.
function feetAxis(reach, {floor = 0.3, signed = false} = {}) {
  const ft = Math.max(floor, reach) * FT_PER_M;
  const most = signed ? 3 : 4;
  const step = [0.5, 1, 2, 5, 10, 20, 50].find((f) => Math.ceil(ft / f + 0.05) <= most) || 100;
  const n = Math.ceil(ft / step + 0.05);
  const ticks = [];
  for (let k = signed ? -n : 0; k <= n; k++) {
    const v = Number((k * step).toFixed(1));
    const text = v === 0 ? "0" : `${v < 0 ? "−" : signed ? "+" : ""}${Math.abs(v)} ft`;
    ticks.push({at: v / FT_PER_M, text});
  }
  const top = n * step / FT_PER_M;
  return {domain: [signed ? -top : 0, top], ticks};
}

// Every hour the chart can show, oldest first: the archive's hours before the
// week, then the week. Hours that fall between the two are "not rebuilt yet"
// -- never a gap, because nothing says their spectrum is missing, and never
// filled. Without the archive (not asked for, not loaded, or withheld because
// it no longer matches today's chain) it is the week alone.
let MERGED = null, MERGED_KEY = "";
function chartSteps(id) {
  if (isWT(id)) return wtSteps(id);
  return CHAIN === "fc" ? fcSteps() : nowSteps();
}
function nowSteps() {
  const recent = (SERIES && SERIES.steps) || [];
  const A = SERIES_ALL;
  if (!A || !A.available || !A.hours || !recent.length) return recent;
  const key = `${SERIES.generated_utc}|${A.start_utc}|${A.hours}`;
  if (key === MERGED_KEY) return MERGED;
  const start = Date.parse(A.start_utc), first = Date.parse(recent[0].valid_utc);
  const held = Math.max(0, Math.min(A.hours, Math.round((first - start) / HOUR_MS)));
  const gaps = new Set(A.gaps || []);
  const col = (arr, i, per = 1) => (arr && arr[i] != null ? arr[i] / per : null);
  const older = [];
  for (let i = 0; i < held; i++) {
    const valid_utc = isoHour(start + i * HOUR_MS);
    if (gaps.has(i)) { older.push({valid_utc, gap: true}); continue; }
    const breaks = {};
    (A.breaks || []).forEach((b) => {
      breaks[b] = {hs_m: col(A.hs_mm[b], i, 1000), transmission: col(A.tr_pm[b], i, 1000),
                   pct_k: col(A.k[b], i), pct_d: col(A.d[b], i)};
    });
    const south = (breaks.coronado_south || {}).hs_m, north = (breaks.coronado_north || {}).hs_m;
    older.push({
      valid_utc, gap: false, breaks,
      buoy: {hs_m: col(A.hs_mm.buoy, i, 1000), from_deg: col(A.from_deg, i),
             pct_k: col(A.k.buoy, i), pct_d: col(A.d.buoy, i)},
      south_minus_north_m: south != null && north != null ? south - north : null,
    });
  }
  for (let ms = start + held * HOUR_MS; ms < first; ms += HOUR_MS) {
    older.push({valid_utc: isoHour(ms), unbuilt: true});
  }
  MERGED = older.concat(recent);
  MERGED_KEY = key;
  return MERGED;
}

// The window as drawn, in step indices into `steps`: what was asked for,
// clamped to what is loaded. Now follows its newest hour in; the forecast
// keeps the reader's present a quarter of the way in, so it opens on what is
// coming with the last observed hours behind it.
function chartView(steps) {
  const last = steps.length - 1;
  const t0 = Date.parse(steps[0].valid_utc);
  const per = stepMs(steps);
  const fc = CHAIN === "fc";
  const asked = CHART_VIEW ? (CHART_VIEW.to - CHART_VIEW.from) / per
    : (steps.defaultH || (fc ? FC_DEFAULT_H : CHART_DEFAULT_H)) * HOUR_MS / per;
  const least = CHART_MIN_H * HOUR_MS / per;
  const span = Math.max(Math.min(least, last), Math.min(asked, last));
  const follow = !CHART_VIEW || CHART_VIEW.follow;
  // Where the present sits: a quarter of the way in on the forecast, so it
  // opens on what is coming; half way on a chart that runs past it on Now
  // (the tide's next day); at the right edge on anything that ends at it.
  const ahead = steps.ahead != null ? steps.ahead : fc ? 0.75 : null;
  const want = !follow ? (CHART_VIEW.to - t0) / per
    : ahead != null ? (Date.now() - t0) / per + span * ahead : last;
  const end = Math.max(span, Math.min(last, want));
  return {v0: end - span, v1: end, t0, last};
}

// Ask for a window, in step indices. On Now, past the loaded hours on the
// left, or wider than all of them, asks for the archive.
function setChartView(steps, v0, v1) {
  const last = steps.length - 1;
  const t0 = Date.parse(steps[0].valid_utc);
  const per = stepMs(steps);
  const least = CHART_MIN_H * HOUR_MS / per;
  if (v1 - v0 < least) {
    const mid = (v0 + v1) / 2;
    v0 = mid - least / 2;
    v1 = mid + least / 2;
  }
  const now = CHAIN !== "fc";
  const from = t0 + v0 * per, to = t0 + v1 * per;
  // The window is shared by every chart on the tab, so the swell's week
  // decides whether the archive is wanted, whichever chart was zoomed.
  const week = now ? (steps.kind === "wt" ? nowSteps() : steps) : [];
  if (week.length > 1) {
    const w0 = Date.parse(week[0].valid_utc);
    if (from < w0 - HOUR_MS / 2 || to - from > (week.length - 1) * HOUR_MS + HOUR_MS / 2) wantAll();
  }
  CHART_VIEW = {from, to, follow: now && v1 >= last - 0.5};
}

function setChartRange(hours) {
  if (!isFinite(hours) && CHAIN !== "fc") wantAll();
  const span = isFinite(hours) ? hours : 1e9;
  CHART_VIEW = {from: 0, to: span * HOUR_MS, follow: true};
}

// Fetched once, the first time the reader asks for more than the week.
function wantAll() {
  if (ALL_STATE !== "idle") return;
  ALL_STATE = "loading";
  fetch(fresh(SERIES_ALL_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .then((got) => {
      SERIES_ALL = got;
      ALL_STATE = got ? "loaded" : "failed";
      show();
    })
    .catch(() => { ALL_STATE = "failed"; show(); });
}

// Whether the reader has asked for more than is drawn.
function chartWantsMore(steps) {
  if (!CHART_VIEW || CHAIN === "fc") return false;
  const last = steps.length - 1, t0 = Date.parse(steps[0].valid_utc);
  const span = (CHART_VIEW.to - CHART_VIEW.from) / HOUR_MS;
  return span > last + 0.5 || (!CHART_VIEW.follow && CHART_VIEW.from < t0 - HOUR_MS / 2);
}

// Why the chart is showing less than was asked for, or nothing.
function chartNote(steps) {
  if (steps.kind === "wt") return wtNote(steps);
  if (!chartWantsMore(steps)) return "";
  if (ALL_STATE === "loading") return "Loading earlier hours…";
  if (ALL_STATE === "failed") return "Earlier hours could not be loaded.";
  if (SERIES_ALL && !SERIES_ALL.available) {
    return SERIES_ALL.why === "no archive yet" ? "No earlier hours are archived yet."
      : "Earlier hours are being rebuilt with today's chain, and are not shown until they are.";
  }
  return "";
}

// What one view draws for one tab: its lines (drawn in order, the tab's own
// line last so it sits on top), how its axis scales, and how an hour reads
// out. The axis itself depends on the window, so it is `chartDomain`'s.
const SPECS = new Map();
function chartSpec(id, mode, steps = chartSteps(id)) {
  const memo = `${CHAIN}|${id}|${mode}|${steps.length}|${steps.key || (steps === MERGED ? MERGED_KEY
    : steps === FC_STEPS ? FC_KEY : SERIES && SERIES.generated_utc)}`
    + (mode === "origins" ? `|${ORIGINS && ORIGINS.generated_utc}` : "");
  if (SPECS.has(memo)) return SPECS.get(memo);
  if (SPECS.size > 24) SPECS.clear();
  const spec = buildSpec(id, mode, steps);
  SPECS.set(memo, spec);
  return spec;
}

// ORIGINS (owner's request, 2026-10-03): where the swell arriving at this tab
// came from, over time, from origins.json (forecast.originhistory). Two marks:
//   - a hurricane the card would have NAMED at that moment, a dot every six
//     hours at the distance of NHC's position that sent this tab's train, in
//     ink, with its name once in view;
//   - an arrival read off 46232's spectrum that no storm is named for, a grey
//     bar over the hours it was arriving at its dispersion distance.
// Both belong to this tab only where they were one of its card trains, as on
// the card. Under them, where each came from, as seen from the buoy: a
// bearing, never tested against this break's windows (BRIEFING §10). The y
// axis is distance on a log scale: 500 to 10,000 miles. Every past mark is
// rebuilt with today's chain, as the other charts are.
const ORIGIN_KM = [480, 24000];
const logMi = (km) => Math.log10(km * MI_PER_KM);
function originsSpec(id, steps) {
  const legend = [{cls: "dot", label: "Hurricane named, at NHC's position"},
                  {cls: "og", label: "Read off the swell, no storm named"}];
  const t0 = Date.parse(steps[0].valid_utc), per = stepMs(steps);
  const idx = (iso) => (Date.parse(iso) - t0) / per;
  const site = id;
  const segs = [], dots = [], points = [], labels = [];
  const arrivals = ((ORIGINS && ORIGINS.arrivals) || [])
    .filter((a) => (a.sites || []).includes(site) && !(a.named || {})[site]);
  arrivals.forEach((a) => {
    const i0 = idx(a.first_utc), i1 = idx(a.last_utc), v = logMi(a.distance_km);
    segs.push({i0, i1, v, cls: "og"});
    if (a.bearing_deg != null) {
      for (let i = Math.ceil(i0); i <= i1; i++) points.push({i, v: a.bearing_deg, cls: "dir og"});
    }
  });
  const named = ((ORIGINS && ORIGINS.named) || []).filter((n) => n.sites && n.sites[site])
    .map((n) => ({...n, at: n.sites[site], i: idx(n.time_utc)}));
  const byStorm = new Map();
  named.forEach((n) => {
    const v = logMi(n.at.distance_km);
    dots.push({i: n.i, v, r: 3, cls: "hn"});
    points.push({i: Math.round(n.i), v: n.at.bearing_deg, cls: "dir"});
    if (!byStorm.has(n.storm)) {
      byStorm.set(n.storm, {text: n.name, points: []});
      labels.push(byStorm.get(n.storm));
    }
    byStorm.get(n.storm).points.push({i: n.i, v});
  });
  // What the card said at hour i: for each storm, its newest named moment at
  // or before i, and only while no later moment has been asked (one step).
  // Never the moment after i, which had not happened yet, and never two of
  // one storm: an hour half-way between two moments read both, once each.
  const step = ((ORIGINS && ORIGINS.step_h) || 6) * HOUR_MS;
  const near = (i) => {
    const latest = new Map();
    named.forEach((n) => {
      if (n.i <= i && (i - n.i) * per < step
          && (!latest.has(n.storm) || n.i > latest.get(n.storm).i)) latest.set(n.storm, n);
    });
    return [...latest.values()];
  };
  const value = (text) => `<span class="v">${text}</span>`;
  return {
    scale: "distance", lines: [], segs, dots, labels, legend,
    lane: {points, arcs: []},
    says: `Where the swell arriving ${id === BUOY_TAB ? "at the buoy" : `at ${SHORT[id] || id}`} `
      + "came from, over time: a dot every six hours for a hurricane named from NHC's track at "
      + "the position that sent the train, and a grey bar over the hours an arrival read off "
      + "the swell itself was arriving, at its distance, with no storm named. Distance on a "
      + "log scale; under it, the bearing each came from, as seen from the buoy",
    read: (i) => {
      const t = Date.parse(steps[i].valid_utc);
      const parts = near(i).map((n) => value(`Hurricane ${n.name}`) + `, ${n.word} match `
        + `${Math.round(n.best * 100)}%, ${farAway(n.at.distance_km, 100)} ${point(n.at.bearing_deg)}`);
      arrivals.filter((a) => Date.parse(a.first_utc) <= t && t <= Date.parse(a.last_utc))
        .forEach((a) => parts.push(a.region
          ? `${sea(a.region)}, ${farAway(a.distance_km)} ${point(a.bearing_deg)}`
          : `${farAway(a.distance_km)}, no bearing`));
      return parts.length ? parts.join(" &middot; ") : "no readable arrival this hour";
    },
  };
}
function buildSpec(id, mode, steps) {
  if (isWT(id)) return wtSpec(id, steps, mode);
  if (CHAIN === "fc") return fcSpec(id, mode, steps);
  const station = SERIES.station || "the buoy";
  const live = (s) => !s.gap && !s.pending && !s.unbuilt;
  const brk = (s, bid) => (live(s) && s.breaks && s.breaks[bid]) || {};
  const buoyOf = (s) => (live(s) && s.buoy) || {};
  const num = (v) => (v == null || !isFinite(v) ? null : v);
  const name = SHORT[id] || id;
  const value = (text) => `<span class="v">${text}</span>`;

  if (mode === "origins") return originsSpec(id, steps);
  if (id === BUOY_TAB) {
    const values = steps.map((s) => num(buoyOf(s).hs_m));
    return {
      scale: "height",
      lines: [{cls: "main", label: `Buoy ${station}`, values}],
      says: `The buoy's height at ${station} each hour.`,
      read: (i) => value(`Buoy ${height(values[i])}`),
    };
  }
  if (mode === "height") {
    // The other two breaks under the tab's own line, lighter, north to south,
    // the second dashed so the two can be told apart without colour. A break
    // with no height in the hours loaded is left out, key and readout too.
    // The axis spans all three, so a break's tab does not rescale to its own.
    const values = steps.map((s) => num(brk(s, id).hs_m));
    const others = ORDER.filter((b) => b !== id).map((b, k) => ({
      cls: k ? "other alt" : "other", label: SHORT[b] || b,
      values: steps.map((s) => num(brk(s, b).hs_m)),
    })).filter((ln) => ln.values.some((v) => v != null));
    return {
      scale: "height",
      lines: [...others, {cls: "main", label: name, values}],
      legend: others.length ? [{cls: "main", label: name}, ...others] : undefined,
      says: `${name}'s breaking height each hour`
        + (others.length ? `, with ${others.map((ln) => ln.label).join(" and ")}'s in lighter lines.` : "."),
      read: (i) => [value(`${name} ${height(values[i])}`),
                    ...others.map((ln) => `${ln.label} ${height(ln.values[i])}`)].join(" &middot; "),
    };
  }

  if (mode === "diff") {
    // North less South, so the line reads the way the menu names it: above
    // zero, the first-named break is the bigger. The payload carries south
    // less north; the page only flips its sign.
    const values = steps.map((s) => {
      const v = num(live(s) ? s.south_minus_north_m : null);
      return v == null ? null : -v;
    });
    return {
      scale: "diff",
      lines: [{cls: "main", label: "North less South", values}],
      zero: true, above: "North bigger", below: "South bigger",
      says: "North's breaking height less South's, the same on every break's tab. "
        + "Where the line crosses zero, which of the two is bigger has flipped.",
      read: (i) => value(`North less South ${signedHeight(values[i])}`),
    };
  }

  if (mode === "window") {
    const values = steps.map((s) => num(brk(s, id).transmission));
    // The direction strip under it: where the buoy's peak came from each
    // hour, against this break's open windows. The windows are today's
    // geometry, the same chain every hour of the chart is rebuilt with.
    const card = ((NOW && NOW.breaks) || []).find((b) => b.id === id) || {};
    const arcs = (card.swell_window || []).filter((w) => isFinite(w.from) && isFinite(w.to));
    const from = steps.map((s) => num(buoyOf(s).from_deg));
    return {
      scale: "window",
      lines: [{cls: "main", label: name, values}],
      lane: {values: from, arcs},
      legend: [{cls: "main", label: `${name}'s share`}, {cls: "winband", label: `${name}'s windows`},
               {cls: "dir", label: "Buoy peak from"}],
      says: `${name}'s height through its windows as a share of the buoy's, before the `
        + "seabed and the surf zone. Under it, where the buoy's peak came from each hour, "
        + `with ${name}'s open windows shaded. The share is the whole spectrum through the `
        + "windows, so it moves with how widely the swell is spread as well as with where "
        + "its peak sits",
      read: (i) => {
        const v = values[i], d = from[i];
        return value(`${name} ${v == null ? "—" : Math.round(100 * v) + "%"}`)
          + " of the buoy's height"
          + (d == null ? "" : ` &middot; buoy peak from ${value(compass(d))}`);
      },
    };
  }

  // The range view, off the menu since 2026-10-05 (see CHART_MODES): where the
  // buoy sits in its own last day's range, less where this break sits in its
  // (a chartist's %K, which the payload still calls it).
  // The page only subtracts; forecast.series computes both and leaves an hour
  // without enough readings undefined, never filled.
  const diff = (key) => steps.map((s) => {
    const a = num(buoyOf(s)[key]), b = num(brk(s, id)[key]);
    return a == null || b == null ? null : a - b;
  });
  const lookback = SERIES.k_lookback_h || 24;
  return {
    scale: "range",
    lines: [{cls: "slow", label: `${SERIES.d_hours || 3} h mean`, values: diff("pct_d")},
            {cls: "main", label: `Buoy less ${name}`, values: diff("pct_k")}],
    zero: true, above: "Buoy higher in its range", below: `${name} higher in its range`,
    says: `Where the buoy's height sits in its own last ${lookback} hours, 0 at the low and `
      + `100 at the high, less where ${name}'s sits in its. Above zero, the buoy is nearer its `
      + "own high than the break is to its own. A position in a range, not a height.",
    // The difference is taken from the two whole numbers printed beside it,
    // so the readout's own arithmetic always checks.
    read: (i) => {
      const a = num(buoyOf(steps[i]).pct_k), b = num(brk(steps[i], id).pct_k);
      const k = (v) => (v == null ? null : Math.round(v));
      const d = a == null || b == null ? null : k(a) - k(b);
      const at = (v) => (v == null ? "—" : `${v}%`);
      return `Buoy at ${at(k(a))} of its day's range &middot; ${name} at ${at(k(b))} &middot; `
        + value(`difference ${d == null ? "—" : (d > 0 ? "+" : d < 0 ? "−" : "") + Math.abs(d)}`);
    },
  };
}

// THE FORECAST TAB'S CHARTS, over the model's hours: one every 3 h from the
// earliest hour the page reaches back to the last the run covers. A slot no
// forecast covered is a gap in the line, never the hour beside it.
//
// Each slot carries three things and keeps them apart:
//   shown     what the page showed for that hour: an earlier run's figure from
//             the log before this run was published, this run's after
//   run       what THIS run says for it, including the hours it covered
//             after they had passed (the Runs chart)
//   observed  46232's own spectrum at that hour carried in by the same chain
//             (measured.json), only once the hour has passed
// and `earlier`, what each of the last few runs said (forecast.json's `runs`).
// Only a breaking height is drawn for a break, as on Now: the 5 m figure is
// another quantity, and a line that switched to it would draw a step nothing
// caused.
let FC_STEPS = [], FC_KEY = "";
function fcSteps() {
  if (!DATA || !STEPS.length) return [];
  const key = `${DATA.generated_utc}|${MEASURED ? MEASURED.generated_utc : ""}|${STEPS.length}`;
  if (key === FC_KEY) return FC_STEPS;
  const per = 3 * HOUR_MS;
  const t0 = Date.parse(STEPS[0].valid_utc);
  const tn = Date.parse(STEPS[STEPS.length - 1].valid_utc);
  const offered = new Map(STEPS.map((st) => [st.valid_utc, st]));
  const hoursOf = new Map((DATA.breaks || []).map((b) =>
    [b.id, new Map((b.hours || []).map((h) => [h.valid_utc, h]))]));
  const buoyAt = new Map((DATA.buoy || []).map((b) => [b.valid_utc, b]));
  const seen = new Map(((MEASURED && MEASURED.steps) || []).map((m) => [m.valid_utc, m]));
  const builtUntil = MEASURED && MEASURED.generated_utc;
  const runs = (DATA.runs || []).map((r) => ({...r, t0: Date.parse(r.start_utc),
                                               per: (r.step_h || 3) * HOUR_MS}));
  const ens = DATA.ensemble && DATA.ensemble.available
    ? new Map((DATA.ensemble.hours || []).map((h) => [h.valid_utc, h])) : new Map();
  const num = (v) => (v == null || !isFinite(v) ? null : v);
  const breaking = (h) => (h && h.nearshore && h.nearshore.breaking ? num(h.hs_nearshore_m) : null);
  const logged = (e) => (e && e.hs_basis === "breaking" ? num(e.hs_m) : null);
  const out = [];
  for (let ms = t0; ms <= tn; ms += per) {
    const v = isoHour(ms);
    const step = offered.get(v);
    const past = !!step && step.from === "past";
    const detail = past ? step.entry.detail : null;
    const run = {breaks: {}, buoy: null};
    const shown = {breaks: {}, buoy: null};
    ORDER.forEach((id) => {
      const h = (hoursOf.get(id) || new Map()).get(v);
      run.breaks[id] = h ? {hs_m: breaking(h), trains: h.trains || []} : null;
      if (past) {
        const e = (step.entry.breaks || {})[id];
        const kept = detail && (detail.breaks || {})[id];
        shown.breaks[id] = e || kept ? {hs_m: logged(e), trains: kept ? kept.trains || [] : null} : null;
      } else if (step) {
        shown.breaks[id] = run.breaks[id];
      }
    });
    const b = buoyAt.get(v);
    run.buoy = b ? {hs_m: num(b.hs_m), trains: b.trains || []} : null;
    if (past) {
      const e = step.entry.buoy;
      const kept = detail && detail.buoy;
      shown.buoy = e || kept ? {hs_m: e ? num(e.hs_m) : null, trains: kept ? kept.trains || [] : null} : null;
    } else if (step) {
      shown.buoy = run.buoy;
    }
    // Observed only once the hour has gone by; "not in yet" until a
    // collection has rebuilt it, and a missing spectrum is a gap.
    const m = seen.get(v);
    const passed = ms <= Date.now();
    const state = !passed ? "future" : !m ? (builtUntil && v > builtUntil ? "pending" : "none")
      : m.gap ? "gap" : m.pending ? "pending" : "value";
    const observed = state !== "value" ? null : {
      buoy: m.buoy ? num(m.buoy.hs_m) : null,
      breaks: Object.fromEntries(ORDER.map((id) => [id, logged((m.breaks || {})[id])])),
    };
    const earlier = runs.map((r) => {
      const k = (ms - r.t0) / r.per;
      const reach = Math.max(0, ...Object.values(r.hs_m || {}).map((col) => col.length));
      if (k < 0 || k % 1 || k >= reach) return null;
      const pick = (site) => ((r.hs_m || {})[site] || [])[k];
      return {buoy: num(pick("buoy")),
              breaks: Object.fromEntries(ORDER.map((id) => [id, num(pick(id))]))};
    });
    out.push({valid_utc: v, from: step ? step.from : null, lead_h: step ? step.lead_h : null,
              cycle_utc: past ? step.entry.cycle_utc : step ? DATA.cycle_utc : null,
              shown, run, observed, state, earlier, ens: ens.get(v) || null});
  }
  FC_STEPS = out;
  FC_KEY = key;
  return out;
}

// Where "now" falls on the forecast's axis, as a step index, or null when it
// is off either end.
function fcNowAt(steps) {
  if (steps.length < 2) return null;
  const at = (Date.now() - Date.parse(steps[0].valid_utc)) / stepMs(steps);
  return at >= 0 && at <= steps.length - 1 ? at : null;
}

// A date without its time: "27 Sep".
const dayOnly = (iso) => new Date(iso).toLocaleDateString(undefined, {day: "numeric", month: "short"});

// Heights either side of a spread of runs, imperial first: "2.8–3.4 ft
// (0.85–1.04 m)".
const heightSpan = (lo, hi) => (Math.abs(hi - lo) < 0.005 ? height(lo)
  : `${(lo * FT_PER_M).toFixed(1)}–${(hi * FT_PER_M).toFixed(1)} ft `
    + `<span class="unit">(${lo.toFixed(2)}–${hi.toFixed(2)} m)</span>`);

function fcSpec(id, mode, steps) {
  const station = DATA.station || "the buoy";
  const buoy = id === BUOY_TAB;
  const name = buoy ? "The buoy" : SHORT[id] || id;
  const of = (side) => (!side ? null : buoy ? side.buoy : (side.breaks || {})[id]);
  const at = (side) => { const got = of(side); return got && typeof got === "object" ? got.hs_m : got; };
  const value = (text, cls = "") => `<span class="v${cls ? " " + cls : ""}">${text}</span>`;
  const now = fcNowAt(steps);
  const obsLabel = `Observed at ${station}, carried in`;
  // The observed half of a readout: a value, or why there is none. Nothing
  // for an hour still ahead -- the line is only ever beside something that
  // has already happened.
  const obsRead = (i, v) => {
    const st = steps[i].state;
    if (st === "future") return "";
    if (st === "value") return v == null ? "" : ` &middot; ${value(`observed ${v}`, "obs")}`;
    return st === "gap" ? ` &middot; no ${station} spectrum, left as a gap`
      : st === "pending" ? " &middot; observed: not in yet" : "";
  };
  const which = (i) => (steps[i].from === "past" ? "shown then" : "forecast");

  if (mode === "diff" && !buoy) {
    const diff = (side) => {
      const n = side && side.breaks && side.breaks.coronado_north;
      const so = side && side.breaks && side.breaks.coronado_south;
      const a = n && typeof n === "object" ? n.hs_m : n, z = so && typeof so === "object" ? so.hs_m : so;
      return a == null || z == null ? null : a - z;
    };
    const values = steps.map((st) => diff(st.shown));
    const observed = steps.map((st) => diff(st.observed));
    return {
      scale: "diff", now,
      lines: [{cls: "obs", label: obsLabel, values: observed},
              {cls: "main", label: "North less South", values}],
      zero: true, above: "North bigger", below: "South bigger",
      says: "North's forecast breaking height less South's, every 3 hours, the same on every "
        + "break's tab. Before this run was published it is what the page showed then; the red "
        + `line is ${station}'s own spectrum at those hours, carried in by the same chain`,
      read: (i) => value(`${which(i) === "forecast" ? "Forecast" : "Shown then"}, North less South `
        + signedHeight(values[i])) + obsRead(i, observed[i] == null ? null : signedHeight(observed[i])),
    };
  }

  if (mode === "trains") {
    // A dot per train per hour, at its period, sized by its height; under
    // it, the same trains at the heading each comes from, over this break's
    // open windows. Local chop is left out: it is made at the beach, not a
    // train that travelled there.
    const trainsAt = steps.map((st) => {
      const got = of(st.shown);
      return got && got.trains ? got.trains.filter((tr) => !tr.local && isFinite(tr.period_s)) : null;
    });
    const dots = [], points = [];
    trainsAt.forEach((list, i) => (list || []).forEach((tr) => {
      const r = Math.max(1.2, Math.min(5, 2.4 * Math.sqrt(Math.max(0, tr.hs_m || 0))));
      dots.push({i, v: tr.period_s, r, cls: tr.wind_sea ? "tr ws" : "tr"});
      headings(tr).filter(isFinite).forEach((deg) => points.push({i, v: deg}));
    }));
    const card = buoy ? {} : (DATA.breaks || []).find((b) => b.id === id) || {};
    const arcs = (card.swell_window || []).filter((w) => isFinite(w.from) && isFinite(w.to));
    const legend = [{cls: "dot", label: "Swell train, sized by its height"},
                    {cls: "ring", label: "Wind sea"}];
    if (arcs.length) legend.push({cls: "winband", label: `${name}'s windows`});
    return {
      scale: "period", now, lines: [], dots, legend,
      lane: {points, arcs},
      says: `The wave trains ${buoy ? "at the buoy" : `at ${name}`} every 3 hours: each dot is one `
        + "train at its period, larger for a bigger train, and under it the heading it comes "
        + `from${arcs.length ? `, over ${name}'s open windows shaded` : ""}. A new swell arrives `
        + "long-period first, so it shows as dots stepping down in period over a day or two. "
        + "Trains are split hour by hour; a dot is not the same train as the dot beside it",
      read: (i) => {
        const list = trainsAt[i];
        if (!list) {
          return steps[i].shown && of(steps[i].shown) ? "the trains for this hour were not kept"
            : "no forecast for this hour";
        }
        if (!list.length) return "no trains";
        return list.slice(0, 3).map((tr, k) => (k === 0 ? value : (t) => t)(
          `${height(tr.hs_m)} at ${tr.period_s.toFixed(1)} s from ${fromText(tr)}`
          + (tr.wind_sea ? " (wind sea)" : ""))).join(" &middot; ");
      },
    };
  }

  if (mode === "ensemble" && buoy) {
    // GEFS-Wave: 31 runs of the same wave model, each from a slightly
    // different atmosphere. The band is their mean and one standard deviation
    // either side, AT THE BUOY -- the members disagreeing with each other.
    // It is shown only with how often 46232 has fallen inside it,
    // measured (forecast.ensemble), because a band that reads as a range the
    // swell will fall in, and is not, is worse than none.
    const E = DATA.ensemble || {};
    const mean = steps.map((st) => (st.ens ? st.ens.hs_mean_m : null));
    const lo = steps.map((st) => (st.ens ? Math.max(0, st.ens.hs_mean_m - st.ens.hs_spread_m) : null));
    const hi = steps.map((st) => (st.ens ? st.ens.hs_mean_m + st.ens.hs_spread_m : null));
    const single = steps.map((st) => at(st.run));
    const observed = steps.map((st) => at(st.observed));
    const held = (E.coverage || []).filter((c) => c.inside_1 != null);
    const span = (c) => (c.lead_from_h === 0 ? "within a day"
      : `at ${Math.round(c.lead_from_h / 24)}–${Math.round(c.lead_to_h / 24)} days`);
    const n = held.reduce((sum, c) => sum + c.n, 0);
    const dates = held.length ? `${dayOnly(held[0].first_utc)} to ${dayOnly(held[held.length - 1].last_utc)}` : "";
    const measured = held.length
      ? `Measured against ${station} itself, the buoy fell inside the band on `
        + held.map((c) => `${Math.round(100 * c.inside_1)}% of hours ${span(c)}`).join(", ")
        + ` (${n.toLocaleString()} forecast hours, ${dates}). A band that held the buoy as `
        + "often as it claims would hold it about 68% of the time: this one is the members "
        + "agreeing with each other more closely than any of them agrees with the sea"
      : `How often ${station} falls inside the band has not been measured yet, so read it as `
        + "the members disagreeing with each other and nothing more";
    const run = E.cycle_utc ? `the ${when(E.cycle_utc)} GEFS-Wave run` : "GEFS-Wave";
    return {
      scale: "height", now,
      band: {lo, hi},
      lines: [{cls: "obs", label: obsLabel, values: observed},
              {cls: "main", label: "Newest GFS-Wave run", values: single},
              {cls: "ens", label: "GEFS-Wave mean", values: mean}],
      legend: [{cls: "ens", label: "Ensemble mean, 31 members"},
               {cls: "ensband", label: "One spread either side"},
               {cls: "main", label: "Newest GFS-Wave run"},
               {cls: "obs", label: obsLabel}],
      says: `The buoy's height from ${run}: the mean of its 31 members and, shaded, one `
        + "standard deviation of them either side, beside the newest GFS-Wave run. It is total "
        + "height at the buoy with no direction, so it says nothing of a break's windows. "
        + measured,
      // The one line kept under a chart once the descriptions went (owner's
      // call, 2026-10-01): the band is drawn only beside how often the buoy
      // has fallen inside it (CLAUDE.md, build order 5).
      held: measured,
      read: (i) => {
        const e = steps[i].ens;
        if (!e) return "no ensemble for this hour";
        const pm = `±${(e.hs_spread_m * FT_PER_M).toFixed(1)} ft <span class="unit">(±${e.hs_spread_m.toFixed(2)} m)</span>`;
        // Only the 2 m share: the bulletin's shares are read by what they hold,
        // not their printed labels (forecast.ensemble.P_ABOVE), and 1 m is
        // exceeded on nearly every hour here.
        const shares = e.p_gt_2m != null
          ? ` &middot; ${Math.round(100 * e.p_gt_2m)}% of members above 6.6 ft (2 m)` : "";
        return value(`Ensemble mean ${height(e.hs_mean_m)}`) + ` ${pm}` + shares
          + (single[i] != null ? ` &middot; newest GFS-Wave run ${height(single[i])}` : "")
          + obsRead(i, observed[i] == null ? null : height(observed[i]));
      },
    };
  }

  // Forecast + Observed (owner's name, 2026-09-30): the newest GFS-Wave
  // run over what each of the last few runs said for the same hours, and
  // 46232 carried in beside the hours that have passed. No difference or
  // percentage between them: that would be a claim about the forecast
  // without a verification series named beside it, and the red line
  // checks nothing at the beach. Every view not named above lands here.
  const n = (DATA.runs || []).length;
  const earlier = (DATA.runs || []).map((r, k) => ({
    cls: "run", label: `The ${when(r.cycle_utc)} run`,
    values: steps.map((st) => { const e = st.earlier[k]; return e ? at(e) : null; }),
  }));
  const values = steps.map((st) => at(st.run));
  const observed = steps.map((st) => at(st.observed));
  return {
    scale: "height", now,
    lines: [...earlier, {cls: "obs", label: obsLabel, values: observed},
            {cls: "main", label: "Newest GFS-Wave run", values}],
    legend: [{cls: "main", label: "Newest GFS-Wave run"},
             {cls: "run", label: `${n} earlier run${n === 1 ? "" : "s"}`},
             {cls: "obs", label: obsLabel}],
    says: `${name}'s ${buoy ? "height" : "breaking height"} from the newest GFS-Wave run, over what each of the `
      + `last ${n} runs said for the same hours. Where the lines bunch, the runs agree; where `
      + "they fan out, the model has been changing its mind. Runs agreeing is not the same as "
      + "being right, and the spread is not a range the swell will fall in",
    read: (i) => {
      const said = earlier.map((ln) => ln.values[i]).filter((v) => v != null);
      const spread = said.length
        ? ` &middot; ${said.length} earlier run${said.length === 1 ? "" : "s"} `
          + heightSpan(Math.min(...said), Math.max(...said))
        : " &middot; no earlier run covered this hour";
      return value(`Newest GFS-Wave run ${height(values[i])}`) + spread
        + obsRead(i, observed[i] == null ? null : height(observed[i]));
    },
  };
}

// The y axis for the hours in view: heights and the difference rescale to
// what is on screen, so zooming in on a small day does not flatten it; the
// window ratio and the day's range keep their fixed scales.
function chartDomain(spec, a, z) {
  if (spec.scale === "window") {
    return {domain: [0, 1], ticks: [0, 0.5, 1].map((v) => ({at: v, text: `${v * 100}%`}))};
  }
  if (spec.scale === "distance") {
    return {domain: ORIGIN_KM.map(logMi),
            ticks: [500, 1000, 2000, 5000, 10000].map((mi) => ({at: Math.log10(mi),
              text: `${mi.toLocaleString("en-US")} mi`}))};
  }
  if (spec.scale === "period") {
