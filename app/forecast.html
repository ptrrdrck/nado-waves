const dayClock = (iso) => new Date(iso).toLocaleString(undefined, {
  weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit",
});

// A heights axis in feet, placed in metres: the data stays SI and the
// conversion is the page's one constant. The top (and, for a signed axis, the
// bottom) is rounded up to a whole tick, so the frame is always a gridline --
// the edges of the plot are drawn on every chart, whatever the heights in
// view -- and the furthest line never touches it. At most four steps from
// zero to the top, or three either side of zero when the axis is signed.
function feetAxis(reach, {floor = 0.3, signed = false} = {}) {
  const ft = Math.max(floor, reach) * FT_PER_M;
  const most = signed ? 3 : 4;
  const step = [0.5, 1, 2, 5, 10, 20, 50].find((f) => Math.ceil(ft / f + 0.05) <= most) || 100;
  const n = Math.ceil(ft / step + 0.05);
  const ticks = [];
  for (let k = signed ? -n : 0; k <= n; k++) {
    const v = Number((k * step).toFixed(1));
    const text = v === 0 ? "0" : `${v < 0 ? "−" : signed ? "+" : ""}${Math.abs(v)} ft`;
    ticks.push({at: v / FT_PER_M, text});
  }
  const top = n * step / FT_PER_M;
  return {domain: [signed ? -top : 0, top], ticks};
}

// Every hour the chart can show, oldest first: the archive's hours before the
// week, then the week. Hours that fall between the two are "not rebuilt yet"
// -- never a gap, because nothing says their spectrum is missing, and never
// filled. Without the archive (not asked for, not loaded, or withheld because
// it no longer matches today's chain) it is the week alone.
let MERGED = null, MERGED_KEY = "";
function chartSteps() {
  const recent = (SERIES && SERIES.steps) || [];
  const A = SERIES_ALL;
  if (!A || !A.available || !A.hours || !recent.length) return recent;
  const key = `${SERIES.generated_utc}|${A.start_utc}|${A.hours}`;
  if (key === MERGED_KEY) return MERGED;
  const start = Date.parse(A.start_utc), first = Date.parse(recent[0].valid_utc);
  const held = Math.max(0, Math.min(A.hours, Math.round((first - start) / HOUR_MS)));
  const gaps = new Set(A.gaps || []);
  const col = (arr, i, per = 1) => (arr && arr[i] != null ? arr[i] / per : null);
  const older = [];
  for (let i = 0; i < held; i++) {
    const valid_utc = isoHour(start + i * HOUR_MS);
    if (gaps.has(i)) { older.push({valid_utc, gap: true}); continue; }
    const breaks = {};
    (A.breaks || []).forEach((b) => {
      breaks[b] = {hs_m: col(A.hs_mm[b], i, 1000), transmission: col(A.tr_pm[b], i, 1000),
                   pct_k: col(A.k[b], i), pct_d: col(A.d[b], i)};
    });
    const south = (breaks.coronado_south || {}).hs_m, north = (breaks.coronado_north || {}).hs_m;
    older.push({
      valid_utc, gap: false, breaks,
      buoy: {hs_m: col(A.hs_mm.buoy, i, 1000), from_deg: col(A.from_deg, i),
             pct_k: col(A.k.buoy, i), pct_d: col(A.d.buoy, i)},
      south_minus_north_m: south != null && north != null ? south - north : null,
    });
  }
  for (let ms = start + held * HOUR_MS; ms < first; ms += HOUR_MS) {
    older.push({valid_utc: isoHour(ms), unbuilt: true});
  }
  MERGED = older.concat(recent);
  MERGED_KEY = key;
  return MERGED;
}

// The window as drawn, in hour indices into `steps`: what was asked for,
// clamped to what is loaded.
function chartView(steps) {
  const last = steps.length - 1;
  const t0 = Date.parse(steps[0].valid_utc);
  const want = CHART_VIEW
    ? {span: (CHART_VIEW.to - CHART_VIEW.from) / HOUR_MS,
       end: CHART_VIEW.follow ? last : (CHART_VIEW.to - t0) / HOUR_MS}
    : {span: CHART_DEFAULT_H, end: last};
  const span = Math.max(Math.min(CHART_MIN_H, last), Math.min(want.span, last));
  const end = Math.max(span, Math.min(last, want.end));
  return {v0: end - span, v1: end, t0, last};
}

// Ask for a window, in hour indices. Past the loaded hours on the left, or
// wider than all of them, asks for the archive.
function setChartView(steps, v0, v1) {
  const last = steps.length - 1;
  const t0 = Date.parse(steps[0].valid_utc);
  if (v1 - v0 < CHART_MIN_H) {
    const mid = (v0 + v1) / 2;
    v0 = mid - CHART_MIN_H / 2;
    v1 = mid + CHART_MIN_H / 2;
  }
  if (v0 < -0.5 || v1 - v0 > last + 0.5) wantAll();
  CHART_VIEW = {from: t0 + v0 * HOUR_MS, to: t0 + v1 * HOUR_MS, follow: v1 >= last - 0.5};
}

function setChartRange(hours) {
  if (!isFinite(hours)) wantAll();
  const span = isFinite(hours) ? hours : 1e9;
  CHART_VIEW = {from: 0, to: span * HOUR_MS, follow: true};
}

// Fetched once, the first time the reader asks for more than the week.
function wantAll() {
  if (ALL_STATE !== "idle") return;
  ALL_STATE = "loading";
  fetch(fresh(SERIES_ALL_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .then((got) => {
      SERIES_ALL = got;
      ALL_STATE = got ? "loaded" : "failed";
      show();
    })
    .catch(() => { ALL_STATE = "failed"; show(); });
}

// Whether the reader has asked for more than is drawn.
function chartWantsMore(steps) {
  if (!CHART_VIEW) return false;
  const last = steps.length - 1, t0 = Date.parse(steps[0].valid_utc);
  const span = (CHART_VIEW.to - CHART_VIEW.from) / HOUR_MS;
  return span > last + 0.5 || (!CHART_VIEW.follow && CHART_VIEW.from < t0 - HOUR_MS / 2);
}

// Why the chart is showing less than was asked for, or nothing.
function chartNote(steps) {
  if (!chartWantsMore(steps)) return "";
  if (ALL_STATE === "loading") return "Loading earlier hours…";
  if (ALL_STATE === "failed") return "Earlier hours could not be loaded.";
  if (SERIES_ALL && !SERIES_ALL.available) {
    return SERIES_ALL.why === "no archive yet" ? "No earlier hours are archived yet."
      : "Earlier hours are being rebuilt with today's chain, and are not shown until they are.";
  }
  return "";
}

// What one view draws for one tab: its lines (drawn in order, the tab's own
// line last so it sits on top), how its axis scales, and how an hour reads
// out. The axis itself depends on the window, so it is `chartDomain`'s.
const SPECS = new Map();
function chartSpec(id, mode, steps = chartSteps()) {
  const memo = `${id}|${mode}|${steps.length}|${steps === MERGED ? MERGED_KEY : SERIES.generated_utc}`;
  if (SPECS.has(memo)) return SPECS.get(memo);
  if (SPECS.size > 24) SPECS.clear();
  const spec = buildSpec(id, mode, steps);
  SPECS.set(memo, spec);
  return spec;
}

function buildSpec(id, mode, steps) {
  const station = SERIES.station || "the buoy";
  const live = (s) => !s.gap && !s.pending && !s.unbuilt;
  const brk = (s, bid) => (live(s) && s.breaks && s.breaks[bid]) || {};
  const buoyOf = (s) => (live(s) && s.buoy) || {};
  const num = (v) => (v == null || !isFinite(v) ? null : v);
  const name = SHORT[id] || id;
  const named = (v, text) => (v == null ? `${text} —` : `${text} ${v}`);
  const value = (text) => `<span class="v">${text}</span>`;

  if (id === BUOY_TAB || mode === "height") {
    const buoy = id === BUOY_TAB;
    const values = steps.map((s) => num(buoy ? buoyOf(s).hs_m : brk(s, id).hs_m));
    return {
      scale: "height",
      lines: [{cls: "main", label: buoy ? `Buoy ${station}` : name, values}],
      says: buoy ? `The buoy's height at ${station} each hour.`
        : `${name}'s breaking height each hour.`,
      read: (i) => value(`${buoy ? "Buoy" : name} ${height(values[i])}`),
    };
  }

  if (mode === "diff") {
    // North less south, so the line reads the way the menu names it: above
    // zero, the first-named break is the bigger. The payload carries south
    // less north; the page only flips its sign.
    const values = steps.map((s) => {
      const v = num(live(s) ? s.south_minus_north_m : null);
      return v == null ? null : -v;
    });
    return {
      scale: "diff",
      lines: [{cls: "main", label: "North less south", values}],
      zero: true, above: "North bigger", below: "South bigger",
      says: "North's breaking height less south's, the same on every break's tab. "
        + "Where the line crosses zero, which of the two is bigger has flipped.",
      read: (i) => value(`North less south ${signedHeight(values[i])}`),
    };
  }

  if (mode === "window") {
    const values = steps.map((s) => num(brk(s, id).transmission));
    // The direction strip under it: where the buoy's peak came from each
    // hour, against this break's open windows. The windows are today's
    // geometry, the same chain every hour of the chart is rebuilt with.
    const card = ((NOW && NOW.breaks) || []).find((b) => b.id === id) || {};
    const arcs = (card.swell_window || []).filter((w) => isFinite(w.from) && isFinite(w.to));
    const from = steps.map((s) => num(buoyOf(s).from_deg));
    return {
      scale: "window",
      lines: [{cls: "main", label: name, values}],
      lane: {values: from, arcs},
      legend: [{cls: "main", label: `${name}'s share`}, {cls: "winband", label: `${name}'s windows`},
               {cls: "dir", label: "Buoy peak from"}],
      says: `${name}'s height through its windows as a share of the buoy's, before the `
        + "seabed and the surf zone. Under it, where the buoy's peak came from each hour, "
        + `with ${name}'s open windows shaded. The share is the whole spectrum through the `
        + "windows, so it moves with how widely the swell is spread as well as with where "
        + "its peak sits",
      read: (i) => {
        const v = values[i], d = from[i];
        return value(`${name} ${v == null ? "—" : Math.round(100 * v) + "%"}`)
          + " of the buoy's height"
          + (d == null ? "" : ` &middot; buoy peak from ${value(compass(d))}`);
      },
    };
  }

  // Range %K: where the buoy sits in its own last day's range, less where this
  // break sits in its. The page only subtracts; forecast.series computes both
  // and leaves an hour without enough readings undefined, never filled.
  const diff = (key) => steps.map((s) => {
    const a = num(buoyOf(s)[key]), b = num(brk(s, id)[key]);
    return a == null || b == null ? null : a - b;
  });
  const lookback = SERIES.k_lookback_h || 24;
  return {
    scale: "range",
    lines: [{cls: "slow", label: `${SERIES.d_hours || 3} h mean`, values: diff("pct_d")},
            {cls: "main", label: "Buoy %K less break %K", values: diff("pct_k")}],
    zero: true, above: "Buoy higher in its range", below: `${name} higher in its range`,
    says: `Where the buoy's height sits in its own last ${lookback} hours, 0 at the low and `
      + `100 at the high, less where ${name}'s sits in its. Above zero, the buoy is nearer its `
      + "own high than the break is to its own. A position in a range, not a height.",
    // The difference is taken from the two whole numbers printed beside it,
    // so the readout's own arithmetic always checks.
    read: (i) => {
      const a = num(buoyOf(steps[i]).pct_k), b = num(brk(steps[i], id).pct_k);
      const k = (v) => (v == null ? null : Math.round(v));
      const d = a == null || b == null ? null : k(a) - k(b);
      return `${named(k(a), "Buoy %K")} &middot; ${named(k(b), `${name} %K`)} &middot; `
        + value(`difference ${d == null ? "—" : (d > 0 ? "+" : d < 0 ? "−" : "") + Math.abs(d)}`);
    },
  };
}

// The y axis for the hours in view: heights and the difference rescale to
// what is on screen, so zooming in on a small day does not flatten it; the
// window ratio and %K keep their fixed scales.
function chartDomain(spec, a, z) {
  if (spec.scale === "window") {
    return {domain: [0, 1], ticks: [0, 0.5, 1].map((v) => ({at: v, text: `${v * 100}%`}))};
  }
  if (spec.scale === "range") {
    return {domain: [-100, 100],
            ticks: [-100, 0, 100].map((v) => ({at: v, text: v > 0 ? "+100" : v < 0 ? "−100" : "0"}))};
  }
  let reach = 0;
  spec.lines.forEach((ln) => {
    for (let i = a; i <= z; i++) {
      const v = ln.values[i];
      if (v != null && Math.abs(v) > reach) reach = Math.abs(v);
    }
  });
  return spec.scale === "diff" ? feetAxis(reach, {floor: 0.1, signed: true}) : feetAxis(reach);
}

// Where the x axis is marked, for the window in view: hours, days, weeks,
// months or years, whichever puts about six marks across it. Local time.
function timeTicks(steps, v0, v1) {
  const span = v1 - v0, days = span / 24;
  const fmt = (d, o) => d.toLocaleString(undefined, o);
  const dayNo = (d) => Math.round(new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() / 86400000);
  let pick, label;
  if (span <= 36) {
    const step = [1, 2, 3, 6, 12].find((s) => span / s <= 6) || 12;
    pick = (d) => d.getHours() % step === 0;
    label = (d) => (d.getHours() === 0 ? fmt(d, {weekday: "short"}) : fmt(d, {hour: "numeric"}));
  } else if (days <= 60) {
    const step = [1, 2, 7, 14].find((s) => days / s <= 7) || 14;
    pick = (d) => d.getHours() === 0 && (step < 7 ? dayNo(d) % step === 0
      : d.getDay() === 1 && (step === 7 || Math.floor(dayNo(d) / 7) % 2 === 0));
    label = (d) => (step === 1 ? fmt(d, {weekday: "short"}) : fmt(d, {month: "short", day: "numeric"}));
  } else if (days <= 800) {
    const step = [1, 2, 3, 6].find((s) => days / 30.4 / s <= 6) || 6;
    pick = (d) => d.getHours() === 0 && d.getDate() === 1 && d.getMonth() % step === 0;
    label = (d) => (d.getMonth() === 0 ? String(d.getFullYear()) : fmt(d, {month: "short"}));
  } else {
    const step = Math.max(1, Math.ceil(days / 365 / 6));
    pick = (d) => d.getHours() === 0 && d.getDate() === 1 && d.getMonth() === 0
      && d.getFullYear() % step === 0;
    label = (d) => String(d.getFullYear());
  }
  const t0 = Date.parse(steps[0].valid_utc);
  const out = [];
  for (let i = Math.max(0, Math.ceil(v0)); i <= Math.min(steps.length - 1, Math.floor(v1)); i++) {
    const d = new Date(t0 + i * HOUR_MS);
    if (pick(d)) out.push({i, label: label(d)});
  }
  return out;
}

// One line's path over the hours in view. Where there are more hours than
// columns to draw them in, each column carries the lowest and highest hour it
// covers, in the order they came; a column with any hour missing is drawn on
// its own, never joined to its neighbours, so a gap stays a break in the line
// at every zoom. A run of one point is a dot.
function chartPath(values, a, z, X, Y, cols, cls) {
  const f = (v) => v.toFixed(1);
  const runs = [];
  let run = [];
  const flush = () => { if (run.length) runs.push(run); run = []; };
  const per = (z - a + 1) / cols;
  if (per <= 2) {
    for (let i = a; i <= z; i++) {
      const v = values[i];
      if (v == null) { flush(); continue; }
      run.push([X(i), Y(v)]);
    }
  } else {
    for (let c = 0; c < cols; c++) {
      const i0 = a + Math.floor(c * per), i1 = Math.min(z, a + Math.floor((c + 1) * per) - 1);
      if (i1 < i0) continue;
      let lo = null, hi = null, broken = false;
      for (let i = i0; i <= i1; i++) {
        const v = values[i];
        if (v == null) { broken = true; continue; }
        if (!lo || v < lo.v) lo = {v, i};
        if (!hi || v > hi.v) hi = {v, i};
      }
      if (broken) flush();
      if (lo) (lo.i <= hi.i ? [lo, hi] : [hi, lo]).forEach((p) => run.push([X(p.i), Y(p.v)]));
      if (broken) flush();
    }
  }
  flush();
  let d = "", dots = "";
  runs.forEach((pts) => {
    if (pts.every((p) => f(p[0]) === f(pts[0][0]) && f(p[1]) === f(pts[0][1]))) {
      dots += `<circle class="pt ${cls}" cx="${f(pts[0][0])}" cy="${f(pts[0][1])}" r="1.8"/>`;
    } else {
      d += "M" + pts.map((p) => `${f(p[0])},${f(p[1])}`).join("L");
    }
  });
  return (d ? `<path class="ln ${cls}" d="${d}"/>` : "") + dots;
}

// The hour the chart reads out: the one the reader picked, while it is still
// in the file, else the newest hour with a reading.
function chartIndex(steps = chartSteps()) {
  const pinned = CHART_AT == null ? -1 : steps.findIndex((s) => s.valid_utc === CHART_AT);
  if (pinned >= 0) return pinned;
  for (let i = steps.length - 1; i >= 0; i--) {
    if (!steps[i].gap && !steps[i].pending && !steps[i].unbuilt) return i;
  }
  return steps.length - 1;
}

// The direction strip's axis: the bearings from south-east round to
// north-west, which hold every hour 46232 has recorded, widened a compass
// point at a time for any hour in view that falls outside them.
const LANE = {gap: 8, h: 60};
function laneDomain(values, a, z) {
  let lo = 135, hi = 315;
  for (let i = a; i <= z; i++) {
    const v = values[i];
    if (v == null) continue;
    while (v < lo && lo > 0) lo -= 45;
    while (v > hi && hi < 360) hi += 45;
  }
  return [lo, hi];
}

function chartPlot(id, spec, at, steps = chartSteps(), view = chartView(steps)) {
  const {w, l, r, t, b} = CHART;
  const h = CHART.h + (spec.lane ? LANE.gap + LANE.h : 0);
  const n = steps.length;
  const {v0, v1} = view;
  const plotW = w - l - r;
  const X = (i) => l + (i - v0) / (v1 - v0) * plotW;
  const a = Math.max(0, Math.floor(v0) - 1), z = Math.min(n - 1, Math.ceil(v1) + 1);
  const {domain, ticks} = chartDomain(spec, a, z);
  const [lo, hi] = domain;
  // The main plot keeps its height; the direction strip, when there is one,
  // sits under it on the same hours, and the time labels go under both.
  const bottom = CHART.h - b;
  const floor = h - b;
  const Y = (v) => t + (bottom - t) * (hi - Math.max(lo, Math.min(hi, v))) / (hi - lo);
  const f = (v) => v.toFixed(1);

  const grid = ticks.map((tk) => {
    const y = f(Y(tk.at));
    const cls = spec.zero && tk.at === 0 ? "zero" : "grid";
    return `<line class="${cls}" x1="${l}" x2="${w - r}" y1="${y}" y2="${y}"/>`
      + `<text class="tick ytick" x="${l + 2}" y="${f(Y(tk.at) - 3)}">${tk.text}</text>`;
  }).join("");

  let lastLabel = -Infinity;
  const marks = timeTicks(steps, v0, v1).map((tk) => {
    const x = X(tk.i);
    const room = x - lastLabel >= 30 && x < w - r - 14;
    if (room) lastLabel = x;
    return `<line class="day" x1="${f(x)}" x2="${f(x)}" y1="${t}" y2="${floor}"/>`
      + (room ? `<text class="tick" x="${f(x + 3)}" y="${h - 6}">${tk.label}</text>` : "");
  }).join("");

  // Runs of missing hours as one band each, never thinner than a pixel.
  let bands = "";
  for (let i = a; i <= z; i++) {
    if (!steps[i].gap) continue;
    let j = i;
    while (j + 1 <= z && steps[j + 1].gap) j++;
    const x0 = X(i - 0.5), x1 = X(j + 0.5);
    bands += `<rect class="gapband" x="${f(x0)}" y="${t}" width="${f(Math.max(1, x1 - x0))}" height="${floor - t}"/>`;
    i = j;
  }

  const lines = spec.lines.map((ln) => chartPath(ln.values, a, z, X, Y, plotW, ln.cls)).join("");

  // Where the buoy's peak came from: a dot an hour, never joined, because the
  // peak jumps between trains and a line would draw the swing between them
  // as though the swell had turned through every bearing in between. The
  // break's windows are shaded behind the dots.
  let lane = "", laneGrid = "", laneHot = "";
  if (spec.lane) {
    const top = bottom + LANE.gap;
    const [d0, d1] = laneDomain(spec.lane.values, a, z);
    const D = (v) => top + LANE.h * (d1 - v) / (d1 - d0);
    for (let g = d0; g <= d1; g += 45) {
      const y = f(D(g));
      laneGrid += `<line class="${g === d0 || g === d1 ? "lane" : "grid"}" x1="${l}" x2="${w - r}" y1="${y}" y2="${y}"/>`;
      if (g > d0 && g < d1) {
        laneGrid += `<text class="tick ytick" x="${l + 2}" y="${f(D(g) - 3)}">${point(g % 360)}</text>`;
      }
    }
    spec.lane.arcs.forEach((wn) => {
      const span = ((wn.to - wn.from) % 360 + 360) % 360;
      [[wn.from, wn.from + span], [wn.from - 360, wn.from + span - 360], [wn.from + 360, wn.from + span + 360]]
        .forEach(([p, q]) => {
          const y0 = D(Math.min(d1, q)), y1 = D(Math.max(d0, p));
          if (y1 > y0) lane += `<rect class="winband" x="${l}" y="${f(y0)}" width="${plotW}" height="${f(y1 - y0)}"/>`;
        });
    });
    const seen = new Set();
    for (let i = a; i <= z; i++) {
      const v = spec.lane.values[i];
      if (v == null) continue;
      const x = X(i), y = D(v), key = `${Math.round(x)}|${Math.round(y)}`;
      if (seen.has(key)) continue;
      seen.add(key);
      lane += `<circle class="dir" cx="${f(x)}" cy="${f(y)}" r="1.5"/>`;
    }
    const d = spec.lane.values[at];
    if (d != null && at >= v0 - 0.5 && at <= v1 + 0.5) {
      laneHot = `<circle class="hot" cx="${f(X(at))}" cy="${f(D(d))}" r="3.5"/>`;
    }
  }

  const sides = (spec.above ? `<text class="side" x="${w - r - 4}" y="${t + 9}" text-anchor="end">${spec.above}</text>` : "")
    + (spec.below ? `<text class="side" x="${w - r - 4}" y="${bottom - 4}" text-anchor="end">${spec.below}</text>` : "");

  const main = spec.lines[spec.lines.length - 1];
  const v = main.values[at];
  const cross = at >= v0 - 0.5 && at <= v1 + 0.5
    ? `<line class="cross" x1="${f(X(at))}" x2="${f(X(at))}" y1="${t}" y2="${floor}"/>`
      + (v != null ? `<circle class="hot" cx="${f(X(at))}" cy="${f(Y(v))}" r="3.5"/>` : "") + laneHot
    : "";

  const label = `${spec.says} From ${dayClock(steps[Math.max(0, Math.ceil(v0))].valid_utc)} to `
    + `${dayClock(steps[Math.min(n - 1, Math.floor(v1))].valid_utc)}, hourly. Arrow keys step `
    + "through the hours; plus and minus zoom; shift and an arrow pans.";
  return `<svg class="series" viewBox="0 0 ${w} ${h}" role="group" tabindex="0"`
    + ` aria-label="${svgText(label)}" data-series="${id}">`
    + `<clipPath id="plot-clip-${id}"><rect x="${l}" y="${t - 4}" width="${plotW}" height="${floor - t + 8}"/></clipPath>`
    + grid + laneGrid + marks + `<g clip-path="url(#plot-clip-${id})">${bands}${lane}${lines}${cross}</g>`
    + sides + `</svg>`;
}

function chartReadout(spec, i, steps = chartSteps()) {
  const s = steps[i];
  const stamp = `<b>${dayClock(s.valid_utc)}</b>`;
  if (s.gap) return `${stamp} &middot; no ${SERIES.station || "buoy"} spectrum for this hour, left as a gap`;
  if (s.pending) return `${stamp} &middot; not in yet`;
  if (s.unbuilt) return `${stamp} &middot; not rebuilt yet`;
  return `${stamp} &middot; ${spec.read(i)}`;
}

// A chart with more than one mark says which is which in words; a chart of
// one line needs no key.
function chartLegend(spec) {
  const items = spec.legend || spec.lines.slice().reverse();
  if (items.length < 2) return "";
  return `<div class="legend">${items.map((ln) =>
    `<span><i class="sw ${ln.cls}"></i>${ln.label}</span>`).join("")}</div>`;
}

// The time buttons: the gesture-free way to zoom, and the way back. One is
// pressed while the window is the span it asked for, running to the newest
// hour; after a pinch or a pan, none is.
function chartRanges() {
  const asked = CHART_VIEW ? (CHART_VIEW.to - CHART_VIEW.from) / HOUR_MS : CHART_DEFAULT_H;
  const follow = !CHART_VIEW || CHART_VIEW.follow;
  return CHART_RANGES.map((rg) => {
    const on = follow && (isFinite(rg.hours) ? Math.abs(asked - rg.hours) < 0.5 : asked >= 1e8);
    return `<button type="button" data-chart-range="${rg.id}" aria-pressed="${on}">${rg.label}</button>`;
  }).join("");
}

// The parts of a chart that move with the hour and the window, so a gesture
// redraws them without rebuilding the card.
function chartMoving(id, at, steps, view) {
  const spec = chartSpec(id, id === BUOY_TAB ? "height" : CHART_MODE, steps);
  const note = chartNote(steps);
  return {
    readout: `<div>${chartReadout(spec, at, steps)}</div>`,
    plot: chartPlot(id, spec, at, steps, view),
    under: `<div class="ranges" role="group" aria-label="How much time the chart shows">`
      + `${chartRanges()}</div>${note ? `<span class="chart-note">${note}</span>` : ""}`,
  };
}

// The line the charts fold out from, and the fold.
function seriesChart(id) {
  return `<div class="chart">
    <div class="chart-head"><span>Charts</span>${chartToggle(id)}</div>
    <div class="chart-fold" id="chart-fold-${id}"${CHART_OPEN ? "" : " hidden"}>${chartBody(id)}</div>
  </div>`;
}

function chartBody(id) {
  const steps = chartSteps();
  if (!steps || steps.length < 2) {
    return `<span class="src">The week's hourly chart is not loaded.</span>`;
  }
  const mode = id === BUOY_TAB ? "height" : CHART_MODE;
  const spec = chartSpec(id, mode, steps);
  const view = chartView(steps);
  const moving = chartMoving(id, chartIndex(steps), steps, view);
  const modes = id === BUOY_TAB ? "" : `<span class="pick-wrap"><select class="pick" data-chart-mode aria-label="Which chart">`
    + CHART_MODES.map((m) => `<option value="${m.id}"${m.id === mode ? " selected" : ""}>`
      + `${m.label}</option>`).join("") + `</select></span>`;
  // The readout sits ABOVE the plot, so a finger swiping along the lines
  // never covers the values it is reading.
  return `<div class="chart-body" data-chart="${id}">
    ${modes}
    <div class="readout" aria-live="polite">${moving.readout}</div>
    <div class="plot">${moving.plot}</div>
    <div class="under">${moving.under}</div>
    ${chartLegend(spec)}
    <span class="src">${period(spec.says)}</span>
  </div>`;
}

// Redraw one chart's moving parts for an hour, in place.
function chartUpdate(body, at) {
  const steps = chartSteps();
  const moving = chartMoving(body.getAttribute("data-chart"), at, steps, chartView(steps));
  body.querySelector(".readout").innerHTML = moving.readout;
  body.querySelector(".plot").innerHTML = moving.plot;
  body.querySelector(".under").innerHTML = moving.under;
}

// A point's x in the plot's own units, and the hour nearest it.
function plotX(plot, clientX) {
  const box = plot.getBoundingClientRect();
  return box.width ? (clientX - box.left) / box.width * CHART.w : CHART.l;
}
function hourAtX(x, view, n) {
  const at = view.v0 + (x - CHART.l) / (CHART.w - CHART.l - CHART.r) * (view.v1 - view.v0);
  return Math.max(0, Math.min(n - 1, Math.round(at)));
}

// Re-render, then put focus back where it was: the strip is rebuilt whole.
function chartRedraw(selector) {
  show();
  const el = selector && $("conditions").querySelector(selector);
  if (el) el.focus();
}

// The gesture in progress on one chart, or null. While it runs, a refresh or
// the minute's tick does nothing (`show` returns), so nothing is rebuilt under
// a finger; the card is redrawn once when it ends.
let GESTURE = null;
let WHEEL_SETTLE = null;

// Delegated once, like the drawings, because the cards are rebuilt on every
// render.
//
// Touch: one finger swiping sideways reads the hours under it, and lifting
// keeps that hour; a tap picks an hour and the same tap again returns to the
// newest; two fingers pinch to zoom and slide to pan. A vertical swipe is the
// page's own scroll (touch-action: pan-y). Mouse: hovering reads, dragging
// pans, a click picks; a trackpad pinch or ctrl + wheel zooms and a sideways
// swipe pans, while an ordinary wheel still scrolls the page. Keyboard: the
// arrows step an hour, plus and minus zoom, shift and an arrow pans.
function wireCharts() {
  const strip = $("conditions");
  const plotW = CHART.w - CHART.l - CHART.r;

  strip.addEventListener("click", (e) => {
    if (e.target.closest("[data-chart-toggle]")) {
      setChartOpen(!CHART_OPEN);
      return;
    }
    const range = e.target.closest("[data-chart-range]");
    if (range) {
      const pick = CHART_RANGES.find((rg) => rg.id === range.getAttribute("data-chart-range"));
      setChartRange(pick.hours);
      const pane = range.closest("[data-chart]").getAttribute("data-chart");
      chartRedraw(`[data-chart="${pane}"] [data-chart-range="${pick.id}"]`);
      return;
    }
  });

  strip.addEventListener("change", (e) => {
    const pick = e.target.closest("select[data-chart-mode]");
    if (!pick || !CHART_MODES.some((m) => m.id === pick.value)) return;
    CHART_MODE = pick.value;
    remember(KEEP.chart, CHART_MODE);
    const pane = pick.closest("[data-chart]").getAttribute("data-chart");
    chartRedraw(`[data-chart="${pane}"] select[data-chart-mode]`);
  });

  strip.addEventListener("pointerdown", (e) => {
    const plot = e.target.closest(".chart-body .plot");
    if (!plot || !SERIES || (e.pointerType === "mouse" && e.button !== 0)) return;
    const steps = chartSteps();
    if (steps.length < 2) return;
    if (!GESTURE || GESTURE.plot !== plot) {
      GESTURE = {plot, body: plot.closest("[data-chart]"), pointers: new Map(), kind: null, at: null};
    }
    const g = GESTURE;
    try { plot.setPointerCapture(e.pointerId); } catch (err) { /* not capturable */ }
    g.pointers.set(e.pointerId, {x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY,
                                 type: e.pointerType});
    g.view0 = chartView(steps);
    if (g.pointers.size === 2) {
      const [p, q] = [...g.pointers.values()];
      g.kind = "pinch";
      g.pinch0 = {d: Math.max(8, Math.hypot(p.x - q.x, p.y - q.y)), c: plotX(plot, (p.x + q.x) / 2)};
    } else if (e.pointerType !== "mouse") {
      // A finger down reads the hour under it at once.
      g.at = hourAtX(plotX(plot, e.clientX), g.view0, steps.length);
      chartUpdate(g.body, g.at);
    }
    if (e.pointerType === "mouse") e.preventDefault();
  });

  strip.addEventListener("pointermove", (e) => {
    const plot = e.target.closest(".chart-body .plot");
    if (!plot || !SERIES) return;
    const steps = chartSteps();
    if (steps.length < 2) return;
    const g = GESTURE && GESTURE.plot === plot ? GESTURE : null;
    if (!g) {
      if (e.pointerType === "mouse") {
        chartUpdate(plot.closest("[data-chart]"), hourAtX(plotX(plot, e.clientX), chartView(steps), steps.length));
      }
      return;
    }
    const p = g.pointers.get(e.pointerId);
    if (!p || g.kind === "done" || g.kind === "scroll") return;
    p.x = e.clientX;
    p.y = e.clientY;
    const dx = p.x - p.x0, dy = p.y - p.y0;
    if (!g.kind && Math.hypot(dx, dy) > 6) {
      g.kind = p.type === "mouse" ? "pan" : Math.abs(dx) >= Math.abs(dy) ? "scrub" : "scroll";
    }
    if (g.kind === "pinch" && g.pointers.size >= 2) {
      const [a1, b1] = [...g.pointers.values()];
      const d = Math.max(8, Math.hypot(a1.x - b1.x, a1.y - b1.y));
      const c = plotX(plot, (a1.x + b1.x) / 2);
      const s0 = g.view0.v1 - g.view0.v0;
      const under = g.view0.v0 + (g.pinch0.c - CHART.l) / plotW * s0;
      const span = s0 * g.pinch0.d / d;
      const v0 = under - (c - CHART.l) / plotW * span;
      setChartView(steps, v0, v0 + span);
      const now = chartSteps();
      chartUpdate(g.body, g.at != null && now === steps ? g.at : chartIndex(now));
      return;
    }
    if (g.kind === "pan") {
      const shift = -(plotX(plot, p.x) - plotX(plot, p.x0)) / plotW * (g.view0.v1 - g.view0.v0);
      setChartView(steps, g.view0.v0 + shift, g.view0.v1 + shift);
      chartUpdate(g.body, chartIndex(chartSteps()));
      return;
    }
    if (g.kind === "scrub" || (!g.kind && p.type !== "mouse")) {
      g.at = hourAtX(plotX(plot, p.x), chartView(steps), steps.length);
      chartUpdate(g.body, g.at);
    }
  });

  const end = (e) => {
    const g = GESTURE;
    if (!g || !g.pointers.has(e.pointerId)) return;
    const p = g.pointers.get(e.pointerId);
    g.pointers.delete(e.pointerId);
    if (g.pointers.size) {
      // Lifting one finger of two ends the zoom; the other does nothing more.
      if (g.kind === "pinch") g.kind = "done";
      return;
    }
    GESTURE = null;
    if (e.type === "pointerup") {
      const steps = chartSteps();
      if (g.kind === "scrub" && g.at != null) {
        CHART_AT = steps[g.at].valid_utc;
      } else if (!g.kind && steps.length > 1) {
        const hour = steps[hourAtX(plotX(g.plot, p.x), chartView(steps), steps.length)].valid_utc;
        CHART_AT = CHART_AT === hour ? null : hour;
      }
    }
    show();
  };
  strip.addEventListener("pointerup", end);
  strip.addEventListener("pointercancel", end);

  // Leaving the plot with no button down puts the picked hour back.
  strip.addEventListener("pointerout", (e) => {
    const plot = e.target.closest(".chart-body .plot");
    if (!plot || GESTURE || e.pointerType !== "mouse" || (e.relatedTarget && plot.contains(e.relatedTarget))) return;
    if (SERIES && chartSteps().length > 1) chartUpdate(plot.closest("[data-chart]"), chartIndex());
  });

  strip.addEventListener("wheel", (e) => {
    const plot = e.target.closest(".chart-body .plot");
    if (!plot || !SERIES || GESTURE) return;
    const zoom = e.ctrlKey || e.metaKey;
    if (!zoom && Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;  // the page's scroll
    const steps = chartSteps();
    if (steps.length < 2) return;
    e.preventDefault();
    const view = chartView(steps);
    const span = view.v1 - view.v0;
    if (zoom) {
      const frac = (plotX(plot, e.clientX) - CHART.l) / plotW;
      const under = view.v0 + frac * span;
      const next = span * Math.exp(Math.max(-1, Math.min(1, e.deltaY * 0.01)));
      setChartView(steps, under - frac * next, under - frac * next + next);
    } else {
      const shift = e.deltaX / Math.max(1, plot.getBoundingClientRect().width) * CHART.w / plotW * span;
      setChartView(steps, view.v0 + shift, view.v1 + shift);
    }
    chartUpdate(plot.closest("[data-chart]"), chartIndex(chartSteps()));
    clearTimeout(WHEEL_SETTLE);
    WHEEL_SETTLE = setTimeout(show, 300);
  }, {passive: false});

  strip.addEventListener("keydown", (e) => {
    const svg = e.target.closest("svg.series");
    if (!svg || !SERIES) return;
    const steps = chartSteps();
    const n = steps.length;
    if (n < 2) return;
    const view = chartView(steps);
    const span = view.v1 - view.v0;
    const from = chartIndex(steps);
    const selector = `svg.series[data-series="${svg.getAttribute("data-series")}"]`;
    if (e.key === "+" || e.key === "=" || e.key === "-" || e.key === "_") {
      const next = span * (e.key === "-" || e.key === "_" ? 2 : 0.5);
      const frac = Math.max(0, Math.min(1, (from - view.v0) / span));
      setChartView(steps, from - frac * next, from - frac * next + next);
    } else if (e.shiftKey && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
      const shift = (e.key === "ArrowLeft" ? -1 : 1) * span / 4;
      setChartView(steps, view.v0 + shift, view.v1 + shift);
    } else {
      const to = e.key === "ArrowLeft" ? Math.max(0, from - 1)
        : e.key === "ArrowRight" ? Math.min(n - 1, from + 1)
        : e.key === "Home" ? 0
        : e.key === "End" ? n - 1
        : null;
      if (to == null) return;
      CHART_AT = steps[to].valid_utc;
      // The window follows the picked hour when it steps out of view.
      if (to < view.v0) setChartView(steps, to, to + span);
      else if (to > view.v1) setChartView(steps, to - span, to);
    }
    e.preventDefault();
    chartRedraw(selector);
  });
}

// The swell card, for either chain. Same shape, different provenance: an
// observed spectrum on one tab and a modelled one on the other.
//
// One tab per break, ranked by window energy, and the buoy ALWAYS last: it is
// the input the three are derived from, not a fourth break to rank against
// them. Its title comes from the file, never typed.
//
// The provenance sits under the tabs rather than inside the buoy's,
// because every tab is that one spectrum, through an aperture or not -- and a
// stale reading has to be marked whichever tab is open. Tucked into the
// buoy's tab, an overdue spectrum would sit behind three tabs of window
// energy derived from it with no mark on any of them.
function swellCard({label, buoy, station, cards, source, due = "", measured = null,
                    chart = false}) {
  const tabs = rankByEnergy(cards || []).map((c) => ({
    id: c.id, title: SHORT[c.id] || c.name, body: breakPanel(c),
  }));
  tabs.push({id: BUOY_TAB, title: station ? `Buoy ${station}` : "Buoy",
             body: buoyPanel(buoy, measured, chart)});
  const chosen = tabs.some((tab) => tab.id === SWELL_TAB) ? SWELL_TAB : tabs[0].id;
  // The Wind card, built after this one, shows the line for the open tab.
  SWELL_TAB = chosen;

  return `<div class="cond swell" data-card="swell">
    <span class="lbl">${label}</span>
    <div class="subtabs" role="tablist" aria-label="${label} at each break, then at the buoy">
      ${tabs.map((tab) => `<button type="button" role="tab" id="swell-tab-${tab.id}"
        data-swell-tab="${tab.id}" aria-controls="swell-pane-${tab.id}"
        aria-selected="${tab.id === chosen}" tabindex="${tab.id === chosen ? 0 : -1}"
        >${tab.title}</button>`).join("")}
    </div>
    ${tabs.map((tab) => `<div class="pane" role="tabpanel" id="swell-pane-${tab.id}"
      aria-labelledby="swell-tab-${tab.id}"${tab.id === chosen ? "" : " hidden"}>${tab.body}</div>`).join("")}
    ${srcLines(source, due)}
  </div>`;
}

// What the measured wind means at each break, on the Wind card, one line per
// break and only the one whose swell tab is open. The measurement is hoisted;
// the interpretation is not, because it is made against each break's own
// shore normal and those span 27° -- the same wind reads cross-shore at north
// and onshore at south. So the line names its break ("at this break") and
// changes with the tab; on the buoy's tab there is no shore and no line.
//
// Now tab only (owner's decision, 2026-09-26). The forecast's wind is
// GFS-Wave's at the buoy, 29 km offshore, which is not the wind KNZY measures
// at the beach, and a verdict against the shore normal needs the local one.
function windAtBreaks(cards) {
  return (cards || []).map((c) => {
    const s = sense(c.windOffshore);
    if (!s) return "";
    return `<span class="turn" data-wind-for="${c.id}"${c.id === SWELL_TAB ? "" : " hidden"}>`
      + `<b>${s}</b> at this break`
      + (c.windNote ? ` <span class="tag">${c.windNote}</span>` : "")
      + `</span>`;
  }).join("");
}

// Switching tabs flips attributes rather than re-rendering, so focus stays on
// the tab the reader is on and the countdowns keep their place.
function selectSwellTab(id, {focus = false} = {}) {
  SWELL_TAB = id;
  remember(KEEP.swell, id);
  document.querySelectorAll("[data-wind-for]").forEach((line) => {
    line.hidden = line.getAttribute("data-wind-for") !== id;
  });
  document.querySelectorAll("[data-swell-tab]").forEach((btn) => {
    const on = btn.getAttribute("data-swell-tab") === id;
    btn.setAttribute("aria-selected", String(on));
    btn.tabIndex = on ? 0 : -1;
    const pane = $(btn.getAttribute("aria-controls"));
    if (pane) pane.hidden = !on;
    if (on && focus) btn.focus();
  });
}

// Delegated once, on the strip, because the card is rebuilt on every render.
// Arrow keys move along the row the way a tablist is expected to.
function wireSwellTabs() {
  const strip = $("conditions");
  strip.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-swell-tab]");
    if (btn) selectSwellTab(btn.getAttribute("data-swell-tab"));
    if (e.target.closest("[data-calc-toggle]")) setCalcOpen(!CALC_OPEN);
  });
  strip.addEventListener("keydown", (e) => {
    const btn = e.target.closest("[data-swell-tab]");
    if (!btn) return;
    const all = [...strip.querySelectorAll("[data-swell-tab]")];
    const at = all.indexOf(btn);
    const to = e.key === "ArrowRight" ? (at + 1) % all.length
      : e.key === "ArrowLeft" ? (at - 1 + all.length) % all.length
      : e.key === "Home" ? 0
      : e.key === "End" ? all.length - 1
      : null;
    if (to == null) return;
    e.preventDefault();
    selectSwellTab(all[to].getAttribute("data-swell-tab"), {focus: true});
  });
}

function renderConditions(step, cards) {
  const rows = [];

  if (MODE === "now") {
    const wind = (NOW && NOW.wind) || {};
    const tide = (NOW && NOW.tide) || {};
    const buoy = (NOW && NOW.buoy) || {};

    // Each card is titled for the quantity alone. Which chain it belongs to
    // is the tab, and when it was taken is the first provenance line
    // beneath it, so repeating either in the title tells the reader nothing
    // they cannot already see. The card carries what the buoy saw AND where
    // it was seen, which is why the separate provenance line below the cards
    // is gone: the measurement and its source belong together.
    // The swell card is the one that can be forced overdue by the build: the
    // countdown only knows the hour it expected, and `stale` knows the reasons
    // it cannot see.
    const due = (NOW && NOW.next_expected) || {};
    const late = (NOW && NOW.overdue_after) || {};
    rows.push(swellCard({
      label: "Swell",
      buoy,
      station: NOW && NOW.station,
      cards,
      source: [
        NOW && NOW.observed_utc ? `Observed ${observedAt(NOW.observed_utc)}` : "",
        NOW && NOW.station_name
          ? `Spectral wave data, ${NOW.station_name} (NDBC ${NOW.station})` : "",
      ],
      due: dueSpan(due.swell, late.swell, {forceOver: nowIsStale()}),
      chart: true,
    }));

    rows.push(`<div class="cond" data-card="wind">
      <span class="lbl">Wind</span>
      <span class="val">${wind.from_deg != null
        ? `${compass(wind.from_deg)} <span class="unit">at</span> ${speed(wind.speed_kt || 0)}`
          + (wind.gust_kt ? ` <span class="unit">gusting ${Math.round(wind.gust_kt * MPH_PER_KT)} mph</span>` : "")
        : '<span class="unit">not collected</span>'}</span>
      ${wind.from_deg != null ? windAtBreaks(cards) : ""}
      ${wind.from_deg != null
        ? srcLines([`Observed ${observedAt(wind.observed_utc)}`,
                    `METAR, ${wind.station_name} (${wind.station})`],
                   dueSpan(due.wind, late.wind))
        : srcLines(wind.note)}
    </div>`);
    // The turn is asked for against the READER's clock, not the build's, so
    // it keeps being the next turn as turns pass beneath an open page.
    rows.push(`<div class="cond" data-card="tide">
      <span class="lbl">Tide</span>
      <span class="val">${tide.height_m != null
        ? height(tide.height_m)
        : '<span class="unit">not collected</span>'}</span>
      ${turnLine((NOW && NOW.tide_turns) || [], new Date().toISOString(), {tagged: true})}
      ${tide.height_m != null
        ? srcLines([`Measured ${observedAt(tide.observed_utc)}`, tideSource(NOW)],
                   dueSpan(due.tide, late.tide))
        : srcLines(tide.note)}
    </div>`);
  } else {
    const wind = DATA.wind || {};
    const past = step.from === "past";
    // An earlier run's hour in full, when its build kept it: the model's wind
    // is on each break's hour, the buoy and the tide beside them.
    const detail = past ? step.entry.detail : null;
    const stamp = past
      ? (detail ? Object.values(detail.breaks || {})[0] || null : null)
      : ((DATA.breaks[0] || {}).hours || [])[step.index];
    const tide = (detail && detail.tide) || TIDE_BY_TIME[step.valid_utc] || {};
    const hour = stamp || {};
    const stampWhen = when(step.valid_utc);
    const run = runLine(step);
    const modelled = hour.wind_from_deg != null;
    const measured = measuredAt(step.valid_utc);
    const got = measured.state === "value" ? measured.entry : null;

    // Same card as the observed tab, so a reader comparing the two is
    // comparing like with like rather than two different presentations.
    const buoy = past ? ((detail && detail.buoy) || step.entry.buoy)
      : (DATA.buoy || []).find((b) => b.valid_utc === step.valid_utc);
    rows.push(swellCard({
      label: "Swell",
      buoy,
      station: DATA.station,
      cards,
      measured,
      source: [
        `Forecast for ${stampWhen}`,
        buoy
          ? `GFS-Wave ${(past ? step.entry.wave_source : DATA.wave_source) === "partitions"
              ? "partitions" : "spectrum"}, ${DATA.station_name} (NDBC ${DATA.station})`
          : `The spectral product was unavailable for this cycle, so there are no trains`,
        run,
      ],
    }));

    // Wind and tide under an earlier run's hour: the log kept neither, so
    // those cards carry only the measurement, in the same green and saying so.
    const seenWind = got && got.wind_kt != null
      ? `<div class="measured"><span class="lbl">Observed at ${clock(step.valid_utc)}</span>`
        + `<span class="mval">${got.wind_from_deg != null ? compass(got.wind_from_deg) + " " : ""}`
        + `<span class="unit">at</span> ${speed(got.wind_kt)}</span></div>` : "";
    const seenTide = got && got.tide_m != null
      ? `<div class="measured"><span class="lbl">Measured at ${clock(step.valid_utc)}</span>`
        + `<span class="mval">${height(got.tide_m)}</span></div>` : "";
    if (past && !detail) {
      rows.push(`<div class="cond" data-card="wind">
        <span class="lbl">Wind</span>
        <span class="val"><span class="unit">not kept for earlier runs</span></span>
        ${seenWind}
      </div>`);
      rows.push(`<div class="cond" data-card="tide">
        <span class="lbl">Tide</span>
        <span class="val"><span class="unit">not kept for earlier runs</span></span>
        ${seenTide}
      </div>`);
      $("conditions").innerHTML = rows.join("");
      restorePicks();
      tickDue();
      return;
    }

    // Today's KNZY reading stands in for a run without model wind -- but never
    // under a past hour, where it would be a reading from the wrong time.
    const fallback = past ? {note: "not kept for earlier runs"} : wind;
    rows.push(`<div class="cond" data-card="wind">
      <span class="lbl">Wind</span>
      <span class="val">${modelled
        ? `${compass(hour.wind_from_deg)} <span class="unit">at</span> ${speed(hour.wind_kt || 0)}`
        : fallback.from_deg != null
          ? `${compass(fallback.from_deg)} <span class="unit">at</span> ${speed(fallback.speed_kt || 0)}`
          : `<span class="unit">${past ? fallback.note : "not collected yet"}</span>`}</span>
      ${seenWind}
      ${modelled
        ? srcLines([`Forecast for ${stampWhen}`,
                    `GFS-Wave wind, ${DATA.station_name} (NDBC ${DATA.station})`,
                    run])
        : fallback.from_deg != null
          ? srcLines([`Observed ${observedAt(fallback.observed_utc)}`,
                      `METAR, ${fallback.station_name} (${fallback.station})`])
          : srcLines(past ? "" : fallback.note)}
    </div>`);
    rows.push(`<div class="cond" data-card="tide">
      <span class="lbl">Tide</span>
      <span class="val">${tide.height_m != null
        ? height(tide.height_m)
        : '<span class="unit">not collected for this hour</span>'}</span>
      ${stamp && stamp.valid_utc
        ? turnLine(DATA.tide_turns || [], step.valid_utc)
        : ""}
      ${seenTide}
      ${srcLines([`Harmonic tide for ${stampWhen}`, departureLine(tide), tideSource(DATA)])}
    </div>`);
  }

  $("conditions").innerHTML = rows.join("");
  restorePicks();
  // Fill the countdowns now rather than leaving them blank until the first
  // second's tick lands.
  tickDue();
}

function renderBreaks(step) {
  const cards = MODE === "now" ? cardsForNow() : cardsForForecast(step);
  renderConditions(step, cards);
}

function show() {
  // Never rebuild the cards under a finger: a chart gesture redraws its own
  // chart, and the card is rebuilt once when it ends.
  if (GESTURE) return;
  const forecasting = MODE === "forecast";
  $("seek").hidden = !forecasting;
  $("tab-now").setAttribute("aria-selected", String(!forecasting));
  $("tab-forecast").setAttribute("aria-selected", String(forecasting));

  if (forecasting) {
    const step = STEPS[CURSOR];
    $("when-label").textContent = when(step.valid_utc);
    $("when").value = String(CURSOR);
    $("earlier").disabled = CURSOR === 0;
    $("later").disabled = CURSOR === STEPS.length - 1;
    renderBreaks(step);
    // Only reachable by default when every hour in the file has gone by —
    // the forecast chain has stopped — and that must not read as upcoming.
    const last = STEPS[STEPS.length - 1];
    const spent = new Date(last.valid_utc).getTime() < Date.now();
    $("stale").hidden = !spent;
    if (spent) {
      $("stale").innerHTML = `<b>Every hour in this forecast has passed.</b> `
        + `The newest cycle has not arrived; nothing here is upcoming.`;
    }
    return;
  }

  // Now. If there is nothing usable, say why and point at the other chain
  // rather than rendering something that looks current and is not.
  if (!NOW || !NOW.breaks || !NOW.breaks.length) {
    $("conditions").innerHTML = "";
    $("stale").hidden = false;
    $("stale").innerHTML = `<b>No current observation.</b> `
      + ((NOW && NOW.warnings && NOW.warnings.join(" ")) ||
         "now.json could not be loaded.")
      + ` Switch to <b>Forecast</b> for the modelled view.`;
    return;
  }

  renderBreaks(null);

  // No banner over the cards. It spoke for all three at once while naming only
  // the spectrum, so a fresh wind reading sat under a banner calling it not
  // current, and a dead wind station sat under nothing at all. The same judgement now renders
  // on the card whose own source is late, in red, beside the reading it
  // qualifies -- see `dueSpan` and `nowIsStale`, which is where the floor the
  // build set is still applied.
  //
  // The banner element stays for the case below, where there is no reading to
  // put a card under at all.
  $("stale").hidden = true;
}

function setMode(mode) {
  MODE = mode;
  if (mode === "forecast") advancePastDefault();
  remember(KEEP.mode, mode);
  show();
}

// What each card currently reads, keyed by `data-card`.
//
// Keyed rather than positional because the swell tabs re-rank by energy and a
// card can move in the strip without its contents changing.
// Everything on the page that is derived from the reader's clock rather than
// from the payload. These change on their own schedule, so comparing them
// would flash cards that had not changed.
//
// Measured: without this, the wind card flashed alongside the tide on a
// refresh that only moved the tide. `show()` re-runs `tickDue`, so a snapshot
// and a render either side of a second boundary disagree on the countdown --
// and at a minute boundary, on the age. Both are marked in the DOM rather than
// stripped by pattern, so the rule stays true as the wording changes.
const VOLATILE = "[data-due], .age";

function cardText() {
  const out = new Map();
  document.querySelectorAll("[data-card]").forEach((el) => {
    const copy = el.cloneNode(true);
    copy.querySelectorAll(VOLATILE).forEach((v) => v.remove());
    out.set(el.getAttribute("data-card"),
            copy.textContent.replace(/\s+/g, " ").trim());
  });
  return out;
}

// Flash the cards whose rendered text changed across a refresh.
//
// The snapshot and the comparison sit either side of the SAME re-render,
// milliseconds apart, which is what makes this work: the clock-derived parts --
// "4 min ago", "Update in 4:59" -- read identically across that gap, so only
// real new data differs. Comparing across any longer interval would flash every
// card every time, because those two strings are always changing.
//
// It follows that navigation never flashes. Stepping the forecast to +48 h
// re-renders without a refresh, and nothing here runs.
function flashChanged(before) {
  const after = cardText();
  document.querySelectorAll("[data-card]").forEach((el) => {
    const key = el.getAttribute("data-card");
    const was = before.get(key), now = after.get(key);
    if (was === undefined || was === now) return;
    el.classList.remove("fresh");
    void el.offsetWidth;   // reflow, so a flash still mid-flight restarts
    el.classList.add("fresh");
  });
}

// Re-render and flash whatever that changed, as one move.
function showAndFlash() {
  const before = cardText();
  show();
  flashChanged(before);
}

// REFRESH.
//
// The page fetched both payloads once, at load, and never again. The minute
// tick re-rendered from memory, so on a tab left open the age climbed and the
// countdown ran -- truthfully, about a payload that had stopped moving. With
// collection every ten minutes the repository was six times fresher than any
// open tab, and every improvement upstream stopped at the browser.
//
// The two chains are refetched on their own cadences because they move on
// their own cadences. now.json is ~6 KB and changes every collection;
// forecast.json is ~128 KB and changes four times a day, so refetching it as
// often would be twenty times the bytes for nothing.
//
// The two intervals themselves are declared far above, beside the countdown
// that has to add NOW_REFRESH_MS to what now.json publishes.

// A unique URL per fetch, because `no-store` alone is not enough against a
// shared cache.
//
// GitHub Pages serves every file through Fastly with **`Cache-Control:
// max-age=600`**, and Pages gives you no way to change it -- there is no
// header configuration, so this cannot be fixed on the publishing side.
// Measured on the live bundle 2026-09-25T15:48:58Z:
//
//     Cache-Control: max-age=600
//     Age: 0            x-cache: MISS      x-cache-hits: 0
//     Last-Modified: Fri, 25 Sep 2026 15:45:44 GMT
//     Via: 1.1 varnish  x-served-by: cache-bur-kbur8200041-BUR
//
// Ten minutes of permitted staleness against a ten-minute collection cadence:
// a cache HIT inside that window can serve a reader a now.json one whole
// collection behind, and its own age line would then be honest about a reading
// that was already superseded.
//
// That sample was a MISS with Age 0, so it came from origin and was NOT stale
// -- `cache: "no-store"` reached the CDN as `Cache-Control: no-cache` and was
// honoured. The mechanism is measured; that instance is not an instance of it.
// The reason to fix it anyway is that honouring a client `no-cache` is Fastly
// CONFIGURATION, not a guarantee, and it says nothing about what some other
// edge node has already cached for the next reader. A distinct URL cannot be
// answered from any cache by definition, which turns a policy we do not
// control into arithmetic we do.
//
// `no-store` stays alongside it: the query parameter defeats shared caches,
// `no-store` defeats this browser's own. They are different caches.
//
// Cost: every fetch is a guaranteed origin miss. now.json is 1.5 KB gzipped on
// a five-minute refresh, so this is a rounding error against the bandwidth of
// the page that fetches it.
function fresh(url) {
  return url + (url.includes("?") ? "&" : "?") + "v=" + Date.now();
}

// Both keep what is on screen when a fetch fails or returns something
// unusable. Blanking the page because one request lost would be worse than
// showing a reading whose own age line already says how old it is -- and on a
// phone at the beach, a lost request is the normal case, not the exception.
function refreshNow() {
  fetch(fresh(NOW_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .then((observed) => {
      if (!observed || !observed.generated_utc) return;
      if (NOW && observed.generated_utc === NOW.generated_utc) return;
      NOW = observed;
      if (MODE === "now") showAndFlash();
    })
    .catch(() => {});
}

// Rebuilt with every collection, so a past hour's measurement lands on the
// page within one refresh of the spectrum being collected.
function refreshMeasured() {
  fetch(fresh(MEASURED_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .then((got) => {
      if (!got || !got.generated_utc || !got.steps) return;
      if (MEASURED && got.generated_utc === MEASURED.generated_utc) return;
      MEASURED = got;
      if (MODE === "forecast") showAndFlash();
    })
    .catch(() => {});
}

// Rebuilt with every collection, like measured.json. Redrawn without the
// flash: a new hour on the chart is not a change in the reading above it.
function refreshSeries() {
  fetch(fresh(SERIES_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .then((got) => {
      if (!got || !got.generated_utc || !got.steps) return;
      if (SERIES && got.generated_utc === SERIES.generated_utc) return;
      SERIES = got;
      if (MODE === "now") show();
    })
    .catch(() => {});
}

// The archive changes once a day; refetched hourly, and only once it has
// been asked for.
function refreshSeriesAll() {
  if (ALL_STATE !== "loaded") return;
  fetch(fresh(SERIES_ALL_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .then((got) => {
      if (!got) return;
      if (SERIES_ALL && got.available === SERIES_ALL.available && got.hours === SERIES_ALL.hours
          && got.start_utc === SERIES_ALL.start_utc) return;
      SERIES_ALL = got;
      if (MODE === "now") show();
    })
    .catch(() => {});
}

function refreshForecast() {
  fetch(fresh(SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .then((data) => {
      if (!data || !data.breaks || !data.generated_utc) return;
      if (DATA && data.generated_utc === DATA.generated_utc) return;
      if (!adoptForecast(data, currentHour())) return;
      if (MODE === "forecast") showAndFlash();
    })
    .catch(() => {});
}

// The valid_utc the picker is sitting on, or null. Read before adopting a new
// cycle so the reader can be put back on the hour they chose.
function currentHour() {
  const step = STEPS[CURSOR];
  return step ? step.valid_utc : null;
}

// Everything on the page derived from forecast.json. Called at boot and again
// whenever a NEWER cycle arrives, because a new cycle changes which hours
// exist: the picker has to be rebuilt against them or it offers indices into
// an array that no longer has that shape.
//
// `keep` is the valid_utc the reader was looking at. If the new cycle still
// carries that hour they stay on it; a refresh that yanked someone from +48 h
// back to now would be a worse bug than the staleness it fixed.
function adoptForecast(data, keep) {
  DATA = data;

  const notes = (data.warnings && data.warnings.length) ? data.warnings : null;
  $("warnings").hidden = !notes;
  if (notes) $("warnings").textContent = notes.join("  ·  ");

  TIDE_BY_TIME = Object.fromEntries((data.tide || []).map((t) => [t.valid_utc, t]));

  const first = (data.breaks[0] || {}).hours || [];
  if (!first.length) {
    STEPS = [];
    $("conditions").innerHTML = '<p class="warn">No forecast hours in this file.</p>';
    return false;
  }
  // Keyed on lead_h and carrying the real array index, so the same page works
  // against the hourly file in the repository and the 3-hourly file published
  // to the web. Filtering by array position and then multiplying the index by
  // three assumed hourly data, and would have silently shown the wrong hour.
  const cycle = first.map((h, i) => ({h, i})).filter(({h}) => h.lead_h % 3 === 0)
    .map(({h, i}) => ({valid_utc: h.valid_utc, from: "cycle", index: i, lead_h: h.lead_h}));
  // Before this run was published, an earlier run was on screen, and the log
  // kept what it said (`past`, 48 h). This run's own first hours were already
  // gone when it appeared, so for any hour the log covers, the log's entry is
  // what a reader had in front of them; the run's own figure for
  // that hour is used only where the log has nothing.
  const generated = data.generated_utc || "";
  const past = (data.past || []).filter((p) => p.valid_utc < generated)
    .map((p) => ({valid_utc: p.valid_utc, from: "past", entry: p, lead_h: p.lead_h}));
  const logged = new Set(past.map((p) => p.valid_utc));
  STEPS = past.concat(cycle.filter((c) => c.valid_utc >= generated || !logged.has(c.valid_utc)))
    .sort((a, b) => (a.valid_utc < b.valid_utc ? -1 : a.valid_utc > b.valid_utc ? 1 : 0));

  $("when").innerHTML = STEPS
    .map((step, n) => `<option value="${n}">${when(step.valid_utc)}</option>`)
    .join("");

  // Only an hour the reader stepped to is kept. The default hour is not a
  // choice, so it is re-derived: kept verbatim it would sit on 11 p.m. long
  // after 11 p.m. had passed.
  const kept = keep == null || keep !== CHOSEN
    ? -1 : STEPS.findIndex((step) => step.valid_utc === keep);
  if (kept >= 0) {
    CURSOR = kept;
    return true;
  }
  CHOSEN = null;
  CURSOR = firstUpcoming();
  return true;
}

// Open on the first hour that has NOT YET HAPPENED, never on one that has. A
// GFS-Wave cycle publishes about five hours after its nominal time, so hour
// zero is already in the past when anyone loads the page — it opened on
// 5 a.m. for a reader standing on the sand at 2 p.m. Picking the hour nearest
// now fixed that and kept half the bug: at 0:20 on Saturday the 3-hourly steps
// are Friday 11 p.m. and Saturday 2 a.m., and nearest chose 11 p.m. — a
// forecast for a time already gone, opened by default.
//
// If every hour in the file has passed, the last one is the least stale thing
// there is; `show` says so rather than presenting it as upcoming.
function firstUpcoming() {
  const now = Date.now();
  const n = STEPS.findIndex((step) => new Date(step.valid_utc).getTime() >= now);
  return n >= 0 ? n : Math.max(0, STEPS.length - 1);
}

// Move a default cursor off an hour that has since passed. The page can sit
// open for hours — on either tab — and the hour it opened on goes by; showing
// it then would be opening on the past, one step removed. An hour the reader
// stepped to is theirs, past or not, and is left alone. True if it moved.
function advancePastDefault() {
  const hour = currentHour();
  if (hour == null || hour === CHOSEN) return false;
  if (new Date(hour).getTime() >= Date.now()) return false;
  const next = firstUpcoming();
  if (next === CURSOR) return false;
  CURSOR = next;
  return true;
}

// The reader stepped the picker: that hour is now theirs.
function choose(cursor) {
  CURSOR = cursor;
  CHOSEN = currentHour();
  show();
}

function boot(data, observed, measured, series) {
  NOW = observed;
  MEASURED = measured;
  SERIES = series;
  $("tab-now").onclick = () => setMode("now");
  $("tab-forecast").onclick = () => setMode("forecast");
  wireSwellTabs();
  wireDrawings();
  wireCharts();

  if (!adoptForecast(data, null)) return;

  $("when").onchange = (e) => {
    choose(Math.max(0, Math.min(STEPS.length - 1, Number(e.target.value))));
  };
  $("earlier").onclick = () => { if (CURSOR > 0) choose(CURSOR - 1); };
  $("later").onclick = () => { if (CURSOR < STEPS.length - 1) choose(CURSOR + 1); };

  // `adoptForecast` has already put CURSOR on the first hour not yet passed.
  //
  // Opens on Now: it is what someone standing on the sand wants, and if the
  // observed chain is broken the tab says so rather than hiding it behind a
  // silent fallback to the model. A refresh puts the reader back on the tab
  // THEY chose, which is not a fallback; anything unrecognised in storage
  // opens on Now. The swell tab is restored by id, and one that no longer
  // exists falls through to the leader, as an unmade choice does.
  SWELL_TAB = recall(KEEP.swell);
  // The calculation table opens as the reader left it; anything else, closed.
  CALC_OPEN = recall(KEEP.calc) === "open";
  // The chart's view likewise; anything unrecognised is the heights.
  const view = recall(KEEP.chart);
  CHART_MODE = CHART_MODES.some((m) => m.id === view) ? view : "height";
  // Folded away until the reader opens it, as the calculation is.
  CHART_OPEN = recall(KEEP.chartOpen) === "open";
  setMode(recall(KEEP.mode) === "forecast" ? "forecast" : "now");

  // The observed age moves whether or not anything else does, so the observed
  // tab is redrawn on the minute rather than only on load or a tab change.
  setInterval(() => { if (MODE === "now") show(); }, 60000);

  // The forecast tab is redrawn only when its default hour has just passed.
  setInterval(() => { if (MODE === "forecast" && advancePastDefault()) show(); }, 60000);

  // A second's tick for the countdowns alone. The minute tick above re-renders
  // the whole page, which is the right cadence for "2 h ago" and far too heavy
  // for a clock that has to move every second.
  setInterval(tickDue, 1000);

  // And the payloads themselves, which used to be fetched once and never
  // again. See REFRESH above.
  setInterval(refreshNow, NOW_REFRESH_MS);
  setInterval(refreshMeasured, NOW_REFRESH_MS);
  setInterval(refreshSeries, NOW_REFRESH_MS);
  setInterval(refreshSeriesAll, FORECAST_REFRESH_MS);
  setInterval(refreshForecast, FORECAST_REFRESH_MS);
}

Promise.all([
  fetch(fresh(SOURCE), {cache: "no-store"})
    .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }),
  // now.json may legitimately be absent -- it is published by a different job
  // on a different schedule. Absent is handled; wrong is not.
  fetch(fresh(NOW_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .catch(() => null),
  // measured.json likewise: without it, past hours say no reading is loaded.
  fetch(fresh(MEASURED_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .catch(() => null),
  // series.json likewise: without it, the chart says it is not loaded.
  fetch(fresh(SERIES_SOURCE), {cache: "no-store"})
    .then((r) => (r.ok ? r.json() : null))
    .catch(() => null),
])
  .then(([forecast, observed, measured, series]) => boot(forecast, observed, measured, series))
  .catch((err) => {
    $("warnings").hidden = false;
    $("warnings").textContent =
      "Could not load " + SOURCE + " (" + err.message + "). Run "
      + "`python -m forecast.live` to write it, and open this page over HTTP "
      + "rather than from the filesystem.";
  });
</script>
