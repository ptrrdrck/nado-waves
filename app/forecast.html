    return {domain: [0, 24], ticks: [0, 6, 12, 18, 24].map((v) => ({at: v, text: v ? `${v} s` : "0"}))};
  }
  if (spec.scale === "range") {
    return {domain: [-100, 100],
            ticks: [-100, 0, 100].map((v) => ({at: v, text: v > 0 ? "+100" : v < 0 ? "−100" : "0"}))};
  }
  if (spec.scale === "speed" || spec.scale === "tide" || spec.scale === "dep") {
    let lo = Infinity, hi = -Infinity;
    const take = (v) => { if (v != null && isFinite(v)) { lo = Math.min(lo, v); hi = Math.max(hi, v); } };
    spec.lines.forEach((ln) => { for (let i = a; i <= z; i++) take(ln.values[i]); });
    (spec.dots || []).forEach((d) => { if (d.i >= a && d.i <= z) take(d.v); });
    if (spec.scale === "dep") return depAxis(isFinite(lo) ? lo : 0, isFinite(hi) ? hi : 0);
    return spec.scale === "speed" ? mphAxis(isFinite(hi) ? hi : 0)
      : tideAxis(isFinite(lo) ? lo : 0, isFinite(hi) ? hi : 1);
  }
  let reach = 0;
  if (spec.band) {
    for (let i = a; i <= z; i++) if (spec.band.hi[i] != null) reach = Math.max(reach, spec.band.hi[i]);
  }
  spec.lines.forEach((ln) => {
    for (let i = a; i <= z; i++) {
      const v = ln.values[i];
      if (v != null && Math.abs(v) > reach) reach = Math.abs(v);
    }
  });
  return spec.scale === "diff" ? feetAxis(reach, {floor: 0.1, signed: true}) : feetAxis(reach);
}

// Where the x axis is marked, for the window in view: hours, days, weeks,
// months or years, whichever puts about six marks across it. Local time.
function timeTicks(steps, v0, v1) {
  const per = stepMs(steps);
  const span = (v1 - v0) * per / HOUR_MS, days = span / 24;
  const fmt = (d, o) => d.toLocaleString(undefined, o);
  const dayNo = (d) => Math.round(new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() / 86400000);
  let pick, label;
  if (span <= 36) {
    const step = [1, 2, 3, 6, 12].find((s) => span / s <= 6) || 12;
    pick = (d) => d.getHours() % step === 0;
    label = (d) => (d.getHours() === 0 ? fmt(d, {weekday: "short"}) : fmt(d, {hour: "numeric"}));
  } else if (days <= 60) {
    const step = [1, 2, 7, 14].find((s) => days / s <= 7) || 14;
    pick = (d) => d.getHours() === 0 && (step < 7 ? dayNo(d) % step === 0
      : d.getDay() === 1 && (step === 7 || Math.floor(dayNo(d) / 7) % 2 === 0));
    label = (d) => (step === 1 ? fmt(d, {weekday: "short"}) : fmt(d, {month: "short", day: "numeric"}));
  } else if (days <= 800) {
    const step = [1, 2, 3, 6].find((s) => days / 30.4 / s <= 6) || 6;
    pick = (d) => d.getHours() === 0 && d.getDate() === 1 && d.getMonth() % step === 0;
    label = (d) => (d.getMonth() === 0 ? String(d.getFullYear()) : fmt(d, {month: "short"}));
  } else {
    const step = Math.max(1, Math.ceil(days / 365 / 6));
    pick = (d) => d.getHours() === 0 && d.getDate() === 1 && d.getMonth() === 0
      && d.getFullYear() % step === 0;
    label = (d) => String(d.getFullYear());
  }
  // Every whole hour in view, placed by time, so a 3-hourly axis still marks
  // a local midnight that falls between two of its hours.
  const t0 = Date.parse(steps[0].valid_utc);
  const from = Math.ceil((t0 + Math.max(0, v0) * per) / HOUR_MS) * HOUR_MS;
  const to = t0 + Math.min(steps.length - 1, v1) * per;
  const out = [];
  for (let ms = from; ms <= to; ms += HOUR_MS) {
    const d = new Date(ms);
    if (pick(d)) out.push({i: (ms - t0) / per, label: label(d)});
  }
  return out;
}

// One line's path over the hours in view. Where there are more hours than
// columns to draw them in, each column carries the lowest and highest hour it
// covers, in the order they came; a column with any hour missing is drawn on
// its own, never joined to its neighbours, so a gap stays a break in the line
// at every zoom. A run of one point is a dot.
//
// `bridge` is for a source that is coarser than the axis on purpose -- GFS-Wave
// every third hour past +120 h on the hourly wind chart: a run of missing
// hours shorter than it is the model's own spacing, joined across as the
// model's line always is, and only a longer run breaks the line.
function chartPath(values, a, z, X, Y, cols, cls, bridge = 1) {
  const f = (v) => v.toFixed(1);
  const hole = new Uint8Array(values.length);
  for (let i = a; i <= z; i++) {
    if (values[i] != null) continue;
    let j = i;
    while (j + 1 <= z && values[j + 1] == null) j++;
    const edge = i === 0 || j === values.length - 1;
    if (j - i + 1 >= bridge || edge) hole.fill(1, i, j + 1);
    i = j;
  }
  const runs = [];
  let run = [];
  const flush = () => { if (run.length) runs.push(run); run = []; };
  const per = (z - a + 1) / cols;
  if (per <= 2) {
    for (let i = a; i <= z; i++) {
      const v = values[i];
      if (v == null) { if (hole[i]) flush(); continue; }
      run.push([X(i), Y(v)]);
    }
  } else {
    for (let c = 0; c < cols; c++) {
      const i0 = a + Math.floor(c * per), i1 = Math.min(z, a + Math.floor((c + 1) * per) - 1);
      if (i1 < i0) continue;
      let lo = null, hi = null, broken = false;
      for (let i = i0; i <= i1; i++) {
        const v = values[i];
        if (v == null) { if (hole[i]) broken = true; continue; }
        if (!lo || v < lo.v) lo = {v, i};
        if (!hi || v > hi.v) hi = {v, i};
      }
      if (broken) flush();
      if (lo) (lo.i <= hi.i ? [lo, hi] : [hi, lo]).forEach((p) => run.push([X(p.i), Y(p.v)]));
      if (broken) flush();
    }
  }
  flush();
  let d = "", dots = "";
  runs.forEach((pts) => {
    if (pts.every((p) => f(p[0]) === f(pts[0][0]) && f(p[1]) === f(pts[0][1]))) {
      dots += `<circle class="pt ${cls}" cx="${f(pts[0][0])}" cy="${f(pts[0][1])}" r="1.8"/>`;
    } else {
      d += "M" + pts.map((p) => `${f(p[0])},${f(p[1])}`).join("L");
    }
  });
  return (d ? `<path class="ln ${cls}" d="${d}"/>` : "") + dots;
}

// The hour the chart reads out: the one the reader picked, while it is still
// in the file, else the newest hour with a reading.
function chartIndex(steps = chartSteps()) {
  const pinned = CHART_AT == null ? -1 : steps.findIndex((s) => s.valid_utc === CHART_AT);
  if (pinned >= 0) return pinned;
  // On the forecast, the hour the page is showing above it.
  if (CHAIN === "fc") {
    const hour = STEPS[CURSOR];
    const k = hour ? steps.findIndex((s) => s.valid_utc === hour.valid_utc) : -1;
    return k >= 0 ? k : 0;
  }
  // A chart that knows its newest reading (the wind and tide), else the
  // newest hour with one.
  if (steps.latest != null) return steps.latest;
  for (let i = steps.length - 1; i >= 0; i--) {
    if (!steps[i].gap && !steps[i].pending && !steps[i].unbuilt) return i;
  }
  return steps.length - 1;
}

// The direction strip's axis: the bearings from south-east round to
// north-west, which hold every hour 46232 has recorded, widened a compass
// point at a time for any hour in view that falls outside them.
const LANE = {gap: 8, h: 60};
function laneDomain(values, a, z) {
  let lo = 135, hi = 315;
  for (let i = a; i <= z; i++) {
    const v = values[i];
    if (v == null) continue;
    while (v < lo && lo > 0) lo -= 45;
    while (v > hi && hi < 360) hi += 45;
  }
  return [lo, hi];
}

function chartPlot(id, spec, at, steps = chartSteps(id), view = chartView(steps)) {
  const {w, l, r, t, b} = CHART;
  const h = CHART.h + (spec.lane ? LANE.gap + LANE.h : 0);
  const n = steps.length;
  const {v0, v1} = view;
  const plotW = w - l - r;
  const X = (i) => l + (i - v0) / (v1 - v0) * plotW;
  const a = Math.max(0, Math.floor(v0) - 1), z = Math.min(n - 1, Math.ceil(v1) + 1);
  const {domain, ticks} = chartDomain(spec, a, z);
  const [lo, hi] = domain;
  // The main plot keeps its height; the direction strip, when there is one,
  // sits under it on the same hours, and the time labels go under both.
  const bottom = CHART.h - b;
  const floor = h - b;
  const Y = (v) => t + (bottom - t) * (hi - Math.max(lo, Math.min(hi, v))) / (hi - lo);
  const f = (v) => v.toFixed(1);

  const grid = ticks.map((tk) => {
    const y = f(Y(tk.at));
    const cls = spec.zero && tk.at === 0 ? "zero" : "grid";
    return `<line class="${cls}" x1="${l}" x2="${w - r}" y1="${y}" y2="${y}"/>`
      + `<text class="tick ytick" x="${l + 2}" y="${f(Y(tk.at) - 3)}">${tk.text}</text>`;
  }).join("");

  let lastLabel = -Infinity;
  const marks = timeTicks(steps, v0, v1).map((tk) => {
    const x = X(tk.i);
    const room = x - lastLabel >= 30 && x < w - r - 14;
    if (room) lastLabel = x;
    return `<line class="day" x1="${f(x)}" x2="${f(x)}" y1="${t}" y2="${floor}"/>`
      + (room ? `<text class="tick" x="${f(x + 3)}" y="${h - 6}">${tk.label}</text>` : "");
  }).join("");

  // Night, sunset to sunrise, under everything else (the Tide chart's).
  let nights = "";
  if (spec.night && n > 1) {
    const t0 = Date.parse(steps[0].valid_utc), per = stepMs(steps);
    spec.night.forEach(([a, b]) => {
      const x0 = Math.max(l, X((a - t0) / per)), x1 = Math.min(w - r, X((b - t0) / per));
      if (x1 > x0) nights += `<rect class="nightband" x="${f(x0)}" y="${t}" width="${f(x1 - x0)}" height="${floor - t}"/>`;
    });
  }

  // Runs of missing hours as one band each, never thinner than a pixel.
  let bands = "";
  for (let i = a; i <= z; i++) {
    if (!steps[i].gap) continue;
    let j = i;
    while (j + 1 <= z && steps[j + 1].gap) j++;
    const x0 = X(i - 0.5), x1 = X(j + 0.5);
    bands += `<rect class="gapband" x="${f(x0)}" y="${t}" width="${f(Math.max(1, x1 - x0))}" height="${floor - t}"/>`;
    i = j;
  }

  const lines = spec.lines.map((ln) => chartPath(ln.values, a, z, X, Y, plotW, ln.cls, ln.bridge)).join("");

  // A shaded band, one polygon per run of hours that have both edges, so a
  // missing hour is a gap in it as it is in a line.
  let band = "";
  if (spec.band) {
    let run = [];
    const close = () => {
      if (run.length > 1) {
        const top = run.map((i) => `${f(X(i))},${f(Y(spec.band.hi[i]))}`);
        const foot = run.slice().reverse().map((i) => `${f(X(i))},${f(Y(spec.band.lo[i]))}`);
        band += `<polygon class="ensband" points="${top.concat(foot).join(" ")}"/>`;
      }
      run = [];
    };
    for (let i = a; i <= z; i++) {
      if (spec.band.hi[i] == null || spec.band.lo[i] == null) close();
      else run.push(i);
    }
    close();
  }

  // Where the buoy's peak came from: a dot an hour, never joined, because the
  // peak jumps between trains and a line would draw the swing between them
  // as though the swell had turned through every bearing in between. The
  // break's windows are shaded behind the dots.
  let lane = "", laneGrid = "", laneHot = "";
  if (spec.lane) {
    const top = bottom + LANE.gap;
    // One value an hour (Now's buoy peak), or any number (the forecast's
    // trains, several an hour).
    const pts = (spec.lane.points || spec.lane.values.map((v, i) => ({i, v})))
      .filter((p) => p.v != null && p.i >= a && p.i <= z);
    const [d0, d1] = spec.lane.domain || laneDomain(pts.map((p) => p.v), 0, pts.length - 1);
    const D = (v) => top + LANE.h * (d1 - v) / (d1 - d0);
    for (let g = d0; g <= d1; g += spec.lane.step || 45) {
      const y = f(D(g));
      laneGrid += `<line class="${g === d0 || g === d1 ? "lane" : "grid"}" x1="${l}" x2="${w - r}" y1="${y}" y2="${y}"/>`;
      if (g > d0 && g < d1) {
        laneGrid += `<text class="tick ytick" x="${l + 2}" y="${f(D(g) - 3)}">${point(g % 360)}</text>`;
      }
    }
    spec.lane.arcs.forEach((wn) => {
      const span = ((wn.to - wn.from) % 360 + 360) % 360;
      [[wn.from, wn.from + span], [wn.from - 360, wn.from + span - 360], [wn.from + 360, wn.from + span + 360]]
        .forEach(([p, q]) => {
          const y0 = D(Math.min(d1, q)), y1 = D(Math.max(d0, p));
          if (y1 > y0) lane += `<rect class="winband" x="${l}" y="${f(y0)}" width="${plotW}" height="${f(y1 - y0)}"/>`;
        });
    });
    const seen = new Set();
    pts.forEach(({i, v, cls}) => {
      const x = X(i), y = D(v), key = `${Math.round(x)}|${Math.round(y)}|${cls || ""}`;
      if (seen.has(key)) return;
      seen.add(key);
      lane += `<circle class="${cls || "dir"}" cx="${f(x)}" cy="${f(y)}" r="1.5"/>`;
    });
    if (at >= v0 - 0.5 && at <= v1 + 0.5) {
      pts.filter((p) => p.i === at).forEach((p) => {
        const obs = p.cls && /\bobs\b/.test(p.cls) ? " obs" : "";
        laneHot += `<circle class="hot${obs}" cx="${f(X(at))}" cy="${f(D(p.v))}" r="3.5"/>`;
      });
    }
  }

  const sides = (spec.above ? `<text class="side" x="${w - r - 4}" y="${t + 9}" text-anchor="end">${spec.above}</text>` : "")
    + (spec.below ? `<text class="side" x="${w - r - 4}" y="${bottom - 4}" text-anchor="end">${spec.below}</text>` : "");

  // The forecast's trains: a dot per train per hour, never joined, because a
  // train is split hour by hour and is not followed from one to the next.
  // Origins: an arrival is a bar over the hours it was arriving, clipped to
  // the hours in view; a named storm's name sits once, by its first dot in
  // view.
  let segs = "";
  (spec.segs || []).forEach((sg) => {
    const p = Math.max(sg.i0, a), q = Math.min(sg.i1, z);
    if (q < p) return;
    segs += `<line class="${sg.cls}" x1="${f(X(p))}" x2="${f(X(q))}" y1="${f(Y(sg.v))}" y2="${f(Y(sg.v))}"/>`;
  });
  const placed = [];
  (spec.labels || []).forEach((lb) => {
    const pt = lb.points.find((p) => p.i >= v0 - 0.5 && p.i <= v1);
    if (!pt) return;
    // Two storms named close together stack their names rather than overprint.
    const x = Math.min(w - r - 6 * lb.text.length, Math.max(l + 2, X(pt.i) - 4));
    let y = Y(pt.v) - 6;
    while (placed.some((q) => Math.abs(q.x - x) < 6 * Math.max(q.n, lb.text.length) && Math.abs(q.y - y) < 11)) y -= 11;
    placed.push({x, y, n: lb.text.length});
    segs += `<text class="tick oglabel" x="${f(x)}" y="${f(y)}">${svgText(lb.text)}</text>`;
  });
  let dots = "";
  (spec.dots || []).forEach((d) => {
    if (d.i < a || d.i > z) return;
    dots += `<circle class="${d.cls}${d.i === at ? " on" : ""}" cx="${f(X(d.i))}" cy="${f(Y(d.v))}" r="${d.r.toFixed(1)}"/>`;
  });

  // Where the reader's present falls on the forecast's axis.
  const nowLine = spec.now != null && spec.now >= v0 && spec.now <= v1
    ? `<line class="nowline" x1="${f(X(spec.now))}" x2="${f(X(spec.now))}" y1="${t}" y2="${floor}"/>`
      + `<text class="tick nowtick" x="${f(X(spec.now) + 3)}" y="${t + 9}">now</text>`
    : "";

  // A hot dot on the tab's own line and on the observed one beside it.
  const hotOn = spec.lines.filter((ln) => /\b(main|obs|ens|pred|model)\b/.test(ln.cls));
  const cross = at >= v0 - 0.5 && at <= v1 + 0.5
    ? `<line class="cross" x1="${f(X(at))}" x2="${f(X(at))}" y1="${t}" y2="${floor}"/>`
      + hotOn.map((ln) => (ln.values[at] != null
        ? `<circle class="hot${ln.cls === "obs" || ln.cls === "ens" || ln.cls === "model" ? " " + ln.cls : ""}" cx="${f(X(at))}" cy="${f(Y(ln.values[at]))}" r="3.5"/>` : "")).join("")
      + laneHot
    : "";

  const label = `${spec.says} From ${dayClock(steps[Math.max(0, Math.ceil(v0))].valid_utc)} to `
    + `${dayClock(steps[Math.min(n - 1, Math.floor(v1))].valid_utc)}, hourly. Arrow keys step `
    + "through the hours; plus and minus zoom; shift and an arrow pans.";
  return `<svg class="series" viewBox="0 0 ${w} ${h}" role="group" tabindex="0"`
    + ` aria-label="${svgText(label)}" data-series="${id}">`
    + `<clipPath id="plot-clip-${id}"><rect x="${l}" y="${t - 4}" width="${plotW}" height="${floor - t + 8}"/></clipPath>`
    + grid + laneGrid + marks + `<g clip-path="url(#plot-clip-${id})">${nights}${bands}${lane}${band}${nowLine}${lines}${segs}${dots}${cross}</g>`
    + sides + `</svg>`;
}

function chartReadout(spec, i, steps = chartSteps()) {
  const s = steps[i];
  const stamp = `<b>${dayClock(s.valid_utc)}</b>`;
  if (s.gap) return `${stamp} &middot; no ${SERIES.station || "buoy"} spectrum for this hour, left as a gap`;
  if (s.pending) return `${stamp} &middot; not in yet`;
  if (s.unbuilt) return `${stamp} &middot; not rebuilt yet`;
  return `${stamp} &middot; ${spec.read(i)}`;
}

// A chart with more than one mark says which is which in words; a chart of
// one line needs no key.
function chartLegend(spec) {
  const items = spec.legend || spec.lines.slice().reverse();
  if (items.length < 2) return "";
  return `<div class="legend">${items.map((ln) =>
    `<span><i class="sw ${ln.cls}"></i>${ln.label}</span>`).join("")}</div>`;
}

// The time buttons: the gesture-free way to zoom, and the way back. One is
// pressed while the window is the span it asked for, running to the newest
// hour; after a pinch or a pan, none is.
function chartRanges(steps) {
  const asked = CHART_VIEW ? (CHART_VIEW.to - CHART_VIEW.from) / HOUR_MS
    : (steps && steps.defaultH) || (CHAIN === "fc" ? FC_DEFAULT_H : CHART_DEFAULT_H);
  const follow = !CHART_VIEW || CHART_VIEW.follow;
  return chartRangeList(steps).map((rg) => {
    const on = follow && (isFinite(rg.hours) ? Math.abs(asked - rg.hours) < 0.5 : asked >= 1e8);
    return `<button type="button" data-chart-range="${rg.id}" aria-pressed="${on}">${rg.label}</button>`;
  }).join("");
}

// The parts of a chart that move with the hour and the window, so a gesture
// redraws them without rebuilding the card.
function chartMoving(id, at, steps, view) {
  const spec = chartSpec(id, chartModeFor(id), steps);
  const note = chartNote(steps);
  return {
    readout: `<div>${chartReadout(spec, at, steps)}</div>`,
    plot: chartPlot(id, spec, at, steps, view),
    under: `<div class="ranges" role="group" aria-label="How much time the chart shows">`
      + `${chartRanges(steps)}</div>${note ? `<span class="chart-note">${note}</span>` : ""}`,
  };
}

// The line the charts fold out from, and the fold. One per swell tab, below
// the card's provenance, shown with its tab (`selectSwellTab`).
function seriesChart(id, hidden = false) {
  return `<div class="chart" data-chart-tab="${id}"${hidden ? " hidden" : ""}>
    <div class="chart-head"><span>Charts</span>${chartToggle(id)}</div>
    <div class="chart-fold" id="chart-fold-${id}"${CHART_OPEN ? "" : " hidden"}>${chartBody(id)}</div>
  </div>`;
}

function chartBody(id) {
  const steps = chartSteps(id);
  if (isWT(id) && WT_STATIC[chartModeFor(id)]) return WT_STATIC[chartModeFor(id)]();
  if (!steps || steps.length < 2) {
    return `<span class="src">${period(isWT(id) ? `The ${id}'s hours are not loaded`
      : CHAIN === "fc" ? "The forecast's hours are not loaded"
      : "The week's hourly chart is not loaded")}</span>`;
  }
  const mode = chartModeFor(id);
  const spec = chartSpec(id, mode, steps);
  const view = chartView(steps);
  const moving = chartMoving(id, chartIndex(steps), steps, view);
  const offered = chartModes(id);
  const modes = !offered.length ? "" : `<span class="pick-wrap"><select class="pick" data-chart-mode aria-label="Which chart">`
    + offered.map((m) => `<option value="${m.id}"${m.id === mode ? " selected" : ""}>`
      + `${m.label}</option>`).join("") + `</select></span>`;
  // The readout sits ABOVE the plot, so a finger swiping along the lines
  // never covers the values it is reading.
  return `<div class="chart-body" data-chart="${id}">
    ${modes}
    <div class="readout" aria-live="polite">${moving.readout}</div>
    <div class="plot">${moving.plot}</div>
    <div class="under">${moving.under}</div>
    ${chartLegend(spec)}
    ${spec.held ? `<span class="chart-note">${period(spec.held)}</span>` : ""}
  </div>`;
}

// Redraw one chart's moving parts for an hour, in place.
function chartUpdate(body, at) {
  const id = body.getAttribute("data-chart");
  const steps = chartSteps(id);
  const moving = chartMoving(id, at, steps, chartView(steps));
  body.querySelector(".readout").innerHTML = moving.readout;
  body.querySelector(".plot").innerHTML = moving.plot;
  body.querySelector(".under").innerHTML = moving.under;
}

// A point's x in the plot's own units, and the hour nearest it.
function plotX(plot, clientX) {
  const box = plot.getBoundingClientRect();
  return box.width ? (clientX - box.left) / box.width * CHART.w : CHART.l;
}
function hourAtX(x, view, n) {
  const at = view.v0 + (x - CHART.l) / (CHART.w - CHART.l - CHART.r) * (view.v1 - view.v0);
  return Math.max(0, Math.min(n - 1, Math.round(at)));
}

// Re-render, then put focus back where it was: the strip is rebuilt whole.
function chartRedraw(selector) {
  show();
  const el = selector && $("conditions").querySelector(selector);
  if (el) el.focus();
}

// The gesture in progress on one chart, or null. While it runs, a refresh or
// the minute's tick does nothing (`show` returns), so nothing is rebuilt under
// a finger; the card is redrawn once when it ends.
let GESTURE = null;
let WHEEL_SETTLE = null;

// Delegated once, like the drawings, because the cards are rebuilt on every
// render.
//
// Touch: one finger swiping sideways reads the hours under it, and lifting
// keeps that hour; a tap picks an hour and the same tap again returns to the
// newest; two fingers pinch to zoom and slide to pan. A vertical swipe is the
// page's own scroll (touch-action: pan-y). Mouse: hovering reads, dragging
// pans, a click picks; a trackpad pinch or ctrl + wheel zooms and a sideways
// swipe pans, while an ordinary wheel still scrolls the page. Keyboard: the
// arrows step an hour, plus and minus zoom, shift and an arrow pans.
function wireCharts() {
  const strip = $("conditions");
  const plotW = CHART.w - CHART.l - CHART.r;
  // Which chart an element belongs to: a break, the buoy, the wind or the tide.
  const idOf = (el) => el.closest("[data-chart]").getAttribute("data-chart");

  strip.addEventListener("click", (e) => {
    // The caret, or anywhere else on its "Charts" line.
    const head = e.target.closest(".chart-head");
    const pick = (sel) => e.target.closest(sel) || (head && head.querySelector(sel));
    if (pick("[data-chart-toggle]")) {
      setChartOpen(!CHART_OPEN);
      return;
    }
    const card = pick("[data-card-chart-toggle]");
    if (card) {
      const which = card.getAttribute("data-card-chart-toggle");
      setCardChartOpen(which, !CARD_CHART_OPEN[which]);
      return;
    }
    const range = e.target.closest("[data-chart-range]");
    if (range) {
      const pane = idOf(range);
      const pick = chartRangeList(chartSteps(pane)).find((rg) => rg.id === range.getAttribute("data-chart-range"));
      setChartRange(pick.hours);
      chartRedraw(`[data-chart="${pane}"] [data-chart-range="${pick.id}"]`);
      return;
    }
  });

  strip.addEventListener("change", (e) => {
    const pick = e.target.closest("select[data-chart-mode]");
    if (!pick) return;
    const pane = pick.closest("[data-chart]").getAttribute("data-chart");
    if (isWT(pane)) {
      // The Wind and Tide cards keep their own view, the same on both tabs.
      if (!WT_MODES[CHAIN][pane].some((m) => m.id === pick.value)) return;
      WT_MODE[CHAIN][pane] = pick.value;
      remember(`${KEEP.wtView}.${CHAIN}.${pane}`, pick.value);
      chartRedraw(`[data-chart="${pane}"] select[data-chart-mode]`);
      return;
    }
    if (!(CHAIN === "fc" ? FC_MODES : CHART_MODES).some((m) => m.id === pick.value)) return;
    CHART_MODE = pick.value;
    remember(CHAIN === "fc" ? KEEP.fcChart : KEEP.chart, CHART_MODE);
    chartRedraw(`[data-chart="${pane}"] select[data-chart-mode]`);
  });

  strip.addEventListener("pointerdown", (e) => {
    const plot = e.target.closest(".chart-body .plot");
    if (plot && plot.classList.contains("profile")) { staticHover(plot, e.clientX, e.clientY); return; }
    if (!plot || !chartLive(idOf(plot)) || (e.pointerType === "mouse" && e.button !== 0)) return;
    const steps = chartSteps(idOf(plot));
    if (steps.length < 2) return;
    if (!GESTURE || GESTURE.plot !== plot) {
      GESTURE = {plot, body: plot.closest("[data-chart]"), pointers: new Map(), kind: null, at: null};
    }
    const g = GESTURE;
    try { plot.setPointerCapture(e.pointerId); } catch (err) { /* not capturable */ }
    g.pointers.set(e.pointerId, {x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY,
                                 type: e.pointerType});
    g.view0 = chartView(steps);
    if (g.pointers.size === 2) {
      const [p, q] = [...g.pointers.values()];
      g.kind = "pinch";
      g.pinch0 = {d: Math.max(8, Math.hypot(p.x - q.x, p.y - q.y)), c: plotX(plot, (p.x + q.x) / 2)};
    } else if (e.pointerType !== "mouse") {
      // A finger down reads the hour under it at once.
      g.at = hourAtX(plotX(plot, e.clientX), g.view0, steps.length);
      chartUpdate(g.body, g.at);
    }
    if (e.pointerType === "mouse") e.preventDefault();
  });

  strip.addEventListener("pointermove", (e) => {
    const plot = e.target.closest(".chart-body .plot");
    if (plot && plot.classList.contains("profile")) { staticHover(plot, e.clientX, e.clientY); return; }
    if (!plot || !chartLive(idOf(plot))) return;
    const steps = chartSteps(idOf(plot));
    if (steps.length < 2) return;
    const g = GESTURE && GESTURE.plot === plot ? GESTURE : null;
    if (!g) {
      if (e.pointerType === "mouse") {
        chartUpdate(plot.closest("[data-chart]"), hourAtX(plotX(plot, e.clientX), chartView(steps), steps.length));
      }
      return;
    }
    const p = g.pointers.get(e.pointerId);
    if (!p || g.kind === "done" || g.kind === "scroll") return;
    p.x = e.clientX;
    p.y = e.clientY;
    const dx = p.x - p.x0, dy = p.y - p.y0;
    if (!g.kind && Math.hypot(dx, dy) > 6) {
      g.kind = p.type === "mouse" ? "pan" : Math.abs(dx) >= Math.abs(dy) ? "scrub" : "scroll";
    }
    if (g.kind === "pinch" && g.pointers.size >= 2) {
      const [a1, b1] = [...g.pointers.values()];
      const d = Math.max(8, Math.hypot(a1.x - b1.x, a1.y - b1.y));
      const c = plotX(plot, (a1.x + b1.x) / 2);
      const s0 = g.view0.v1 - g.view0.v0;
      const under = g.view0.v0 + (g.pinch0.c - CHART.l) / plotW * s0;
      const span = s0 * g.pinch0.d / d;
      const v0 = under - (c - CHART.l) / plotW * span;
      setChartView(steps, v0, v0 + span);
      const now = chartSteps(idOf(plot));
      chartUpdate(g.body, g.at != null && now === steps ? g.at : chartIndex(now));
      return;
    }
    if (g.kind === "pan") {
      const shift = -(plotX(plot, p.x) - plotX(plot, p.x0)) / plotW * (g.view0.v1 - g.view0.v0);
      setChartView(steps, g.view0.v0 + shift, g.view0.v1 + shift);
      chartUpdate(g.body, chartIndex(chartSteps(idOf(plot))));
      return;
    }
    if (g.kind === "scrub" || (!g.kind && p.type !== "mouse")) {
      g.at = hourAtX(plotX(plot, p.x), chartView(steps), steps.length);
      chartUpdate(g.body, g.at);
    }
  });

  const end = (e) => {
    const g = GESTURE;
    if (!g || !g.pointers.has(e.pointerId)) return;
    const p = g.pointers.get(e.pointerId);
    g.pointers.delete(e.pointerId);
    if (g.pointers.size) {
      // Lifting one finger of two ends the zoom; the other does nothing more.
      if (g.kind === "pinch") g.kind = "done";
      return;
    }
    GESTURE = null;
    if (e.type === "pointerup") {
      const steps = chartSteps(idOf(g.plot));
      if (g.kind === "scrub" && g.at != null) {
        CHART_AT = steps[g.at].valid_utc;
      } else if (!g.kind && steps.length > 1) {
        const hour = steps[hourAtX(plotX(g.plot, p.x), chartView(steps), steps.length)].valid_utc;
        CHART_AT = CHART_AT === hour ? null : hour;
      }
    }
    show();
  };
  strip.addEventListener("pointerup", end);
  strip.addEventListener("pointercancel", end);

  // Leaving the plot with no button down puts the picked hour back.
  strip.addEventListener("pointerout", (e) => {
    const plot = e.target.closest(".chart-body .plot");
    if (plot && plot.classList.contains("profile")) {
      if (e.pointerType === "mouse" && !(e.relatedTarget && plot.contains(e.relatedTarget))) staticHover(plot, null, null);
      return;
    }
    if (!plot || GESTURE || e.pointerType !== "mouse" || (e.relatedTarget && plot.contains(e.relatedTarget))) return;
    const id = idOf(plot);
    const steps = chartSteps(id);
    if (chartLive(id) && steps.length > 1) chartUpdate(plot.closest("[data-chart]"), chartIndex(steps));
  });

  strip.addEventListener("wheel", (e) => {
    const plot = e.target.closest(".chart-body .plot");
    if (!plot || plot.classList.contains("profile") || !chartLive(idOf(plot)) || GESTURE) return;
    const zoom = e.ctrlKey || e.metaKey;
    if (!zoom && Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;  // the page's scroll
    const steps = chartSteps(idOf(plot));
    if (steps.length < 2) return;
    e.preventDefault();
    const view = chartView(steps);
    const span = view.v1 - view.v0;
    if (zoom) {
      const frac = (plotX(plot, e.clientX) - CHART.l) / plotW;
      const under = view.v0 + frac * span;
      const next = span * Math.exp(Math.max(-1, Math.min(1, e.deltaY * 0.01)));
      setChartView(steps, under - frac * next, under - frac * next + next);
    } else {
      const shift = e.deltaX / Math.max(1, plot.getBoundingClientRect().width) * CHART.w / plotW * span;
      setChartView(steps, view.v0 + shift, view.v1 + shift);
    }
    chartUpdate(plot.closest("[data-chart]"), chartIndex(chartSteps(idOf(plot))));
    clearTimeout(WHEEL_SETTLE);
    WHEEL_SETTLE = setTimeout(show, 300);
  }, {passive: false});

  strip.addEventListener("keydown", (e) => {
    const svg = e.target.closest("svg.series");
    if (!svg || svg.closest(".profile") || !chartLive(svg.getAttribute("data-series"))) return;
    const steps = chartSteps(svg.getAttribute("data-series"));
    const n = steps.length;
    if (n < 2) return;
    const view = chartView(steps);
    const span = view.v1 - view.v0;
    const from = chartIndex(steps);
    const selector = `svg.series[data-series="${svg.getAttribute("data-series")}"]`;
    if (e.key === "+" || e.key === "=" || e.key === "-" || e.key === "_") {
      const next = span * (e.key === "-" || e.key === "_" ? 2 : 0.5);
      const frac = Math.max(0, Math.min(1, (from - view.v0) / span));
      setChartView(steps, from - frac * next, from - frac * next + next);
    } else if (e.shiftKey && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
      const shift = (e.key === "ArrowLeft" ? -1 : 1) * span / 4;
      setChartView(steps, view.v0 + shift, view.v1 + shift);
    } else {
      const to = e.key === "ArrowLeft" ? Math.max(0, from - 1)
        : e.key === "ArrowRight" ? Math.min(n - 1, from + 1)
        : e.key === "Home" ? 0
        : e.key === "End" ? n - 1
        : null;
      if (to == null) return;
      CHART_AT = steps[to].valid_utc;
      // The window follows the picked hour when it steps out of view.
      if (to < view.v0) setChartView(steps, to, to + span);
      else if (to > view.v1) setChartView(steps, to - span, to);
    }
    e.preventDefault();
    chartRedraw(selector);
  });
}

// THE WIND AND TIDE CHARTS (owner's request, 2026-09-30): the same fold,
// plot and gestures as the Swell card's, under each of those cards on both
// tabs. The window and the picked hour are the tab's, shared with the swell's
// charts, so zooming one lines them all up on the same hours.
//
// Now: what was MEASURED each hour (windtide.json, forecast.windtide) -- KNZY's
// report taken in the hour up to it, the gauge's sample at the hour carried
// to the open coast -- and on the tide, the next 24 h of harmonic prediction,
// dashed and labelled, the one modelled line on the tab (owner's call: the
// card already carries a predicted turn). Forecast: the forecast each hour to
// the end of the run (forecast.json's `hourly`: the NWS local wind, and the
// harmonic tide with the measured departure the card carries), with the
// measured hours beside it in red. A missing reading is a gap in its
// line, never the hour beside it. Nothing here is a difference or a score.
function isWT(id) {
  return id === "wind" || id === "tide";
}
// Each card's views, picked from the same menu as the Swell card's, and kept
// across a refresh. The same on both tabs: each tab draws its own chain.
// Each tab has its own second view (owner's call, 2026-10-02): the measured
// record's on "LIVE", and on Forecast the ones a forecast can answer --
// shore direction day by day through the run, and each day's tide range --
// because folding a week's forecast into one "how often" day threw away the
// which-day it exists to say, and a measured departure has no future hours.
const WT_MODES = {
  now: {wind: [{id: "wind", label: "Wind"}, {id: "shore", label: "Shore direction"}],
        tide: [{id: "tide", label: "Tide"}, {id: "departure", label: "Departure"}]},
  fc: {wind: [{id: "wind", label: "Wind"}, {id: "week", label: "Shore direction"}],
       tide: [{id: "tide", label: "Tide"}, {id: "range", label: "Daily range"}]},
};
const WT_MODE = {now: {wind: "wind", tide: "tide"}, fc: {wind: "wind", tide: "tide"}};
// The views drawn by their own renderer: a grid or bars, not a line over the
// tab's time axis, so they take no zoom, pan or shared hour.
const WT_STATIC = {shore: () => shoreBody(chartSteps("wind")), week: () => weekBody(), range: () => rangeBody()};
function wtMenu(id, mode) {
  return `<span class="pick-wrap"><select class="pick" data-chart-mode aria-label="Which chart">`
    + WT_MODES[CHAIN][id].map((m) => `<option value="${m.id}"${m.id === mode ? " selected" : ""}>${m.label}</option>`).join("")
    + `</select></span>`;
}
// The Now tab's tide runs a day past the present, so it opens on two days
// with the present in the middle, and has a button for that.
const NOW_TIDE_RANGES = [
  {id: "1d", label: "1D", hours: 24},
  {id: "2d", label: "2D", hours: 48},
  {id: "7d", label: "7D", hours: 168},
  {id: "1m", label: "1M", hours: 720},
  {id: "all", label: "All", hours: Infinity},
];

// Each column of windtide.json at one hour, or null for an hour it does not
// hold.
function wtAt(k) {
  if (!WT || k < 0 || k >= (WT.hours || 0)) return null;
  const col = (arr) => (arr && arr[k] != null ? arr[k] : null);
  const w = WT.wind || {};
  return {kt: col(w.kt), from: col(w.from_deg), gust: col(w.gust_kt), age: col(w.age_min),
          tide: col(WT.tide_m), dep: col(WT.departure_m), depMean: col(WT.departure_mean_m)};
}
function wtIndex(ms) {
  if (!WT || !WT.start_utc) return -1;
  const k = (ms - Date.parse(WT.start_utc)) / HOUR_MS;
  return Number.isInteger(k) ? k : -1;
}

const WT_STEPS = {};
function wtSteps(id) {
  const fc = CHAIN === "fc";
  const key = `${CHAIN}|${id}|${WT ? WT.generated_utc : ""}|${fc && DATA ? DATA.generated_utc : ""}`;
  const kept = WT_STEPS[`${CHAIN}|${id}`];
  if (kept && kept.key === key) return kept;
  const out = fc ? wtForecastSteps(id) : wtNowSteps(id);
  out.kind = "wt";
  out.id = id;
  out.key = key;
  WT_STEPS[`${CHAIN}|${id}`] = out;
  return out;
}

function wtNowSteps(id) {
  if (!WT || !WT.hours) return [];
  const t0 = Date.parse(WT.start_utc);
  const P = id === "tide" && WT.prediction ? WT.prediction : null;
  const pred = (P && P.heights_m) || [];
  const p0 = pred.length ? Date.parse(P.start_utc) : t0;
  const end = Math.max(t0 + (WT.hours - 1) * HOUR_MS, pred.length ? p0 + (pred.length - 1) * HOUR_MS : 0);
  const out = [];
  let latest = null;
  for (let ms = t0; ms <= end; ms += HOUR_MS) {
    const seen = wtAt(wtIndex(ms));
    const j = (ms - p0) / HOUR_MS;
    const got = seen && (id === "tide" ? seen.tide : seen.kt) != null;
    if (got) latest = out.length;
    out.push({valid_utc: isoHour(ms), seen, pred: j >= 0 && j < pred.length ? pred[j] : null});
  }
  out.latest = latest == null ? Math.min(WT.hours, out.length) - 1 : latest;
  if (pred.length) {
    out.ahead = 0.5;
    out.defaultH = 48;
    out.ranges = NOW_TIDE_RANGES;
  }
  return out;
}

// The forecast's hours, hourly, from the earliest past hour the tab offers
// to the run's end; the measured hours beside the ones that have passed.
function wtForecastSteps(id) {
  const H = (DATA && DATA.hourly) || {};
  const fcs = fcSteps();
  const t0 = H.start_utc ? Date.parse(H.start_utc) : fcs.length ? Date.parse(fcs[0].valid_utc) : null;
  if (t0 == null) return [];
  const n = (H.tide_m || []).length;
  const tn = Math.max(t0 + (n - 1) * HOUR_MS, fcs.length ? Date.parse(fcs[fcs.length - 1].valid_utc) : t0);
  const lw = H.local_wind || {};
  const mw = H.model_wind || {};
  const col = (arr, k) => (arr && k < arr.length && arr[k] != null ? arr[k] : null);
  const out = [];
  for (let ms = t0, k = 0; ms <= tn; ms += HOUR_MS, k++) {
    out.push({valid_utc: isoHour(ms), seen: wtAt(wtIndex(ms)),
              fc: {kt: col(lw.kt, k), from: col(lw.from_deg, k), gust: col(lw.gust_kt, k),
                   tide: col(H.tide_m, k)},
              model: {kt: col(mw.kt, k), from: col(mw.from_deg, k)}});
  }
  return out;
}

// Where the wind and tide charts stop, when the window asks for more.
function wtNote(steps) {
  if (CHAIN === "fc" || !CHART_VIEW || steps.length < 2) return "";
  const t0 = Date.parse(steps[0].valid_utc);
  if (CHART_VIEW.to - CHART_VIEW.from <= (steps.length - 1) * HOUR_MS + HOUR_MS / 2
      && (CHART_VIEW.follow || CHART_VIEW.from >= t0 - HOUR_MS / 2)) return "";
  return `The ${steps.id} chart reaches back to ${dayOnly(steps[0].valid_utc)}.`;
}

// A wind in words, imperial first: "WSW at 12 mph (10 kt), gusting 18 mph".
// A calm has no direction, and neither does a variable wind.
function windWords(w) {
  if (!w || w.kt == null) return null;
  if (w.kt === 0) return "calm";
  return `${w.from == null ? "variable" : compass(w.from)} at ${speed(w.kt)}`
    + (w.gust != null ? `, gusting ${Math.round(w.gust * MPH_PER_KT)} mph` : "");
}

// A wind axis in mph, placed in knots: the data stays in knots and the
// conversion is the page's one constant. Framed by gridlines, as the heights'.
function mphAxis(reachKt) {
  const mph = Math.max(10, reachKt * MPH_PER_KT);
  const step = [5, 10, 20, 25, 50].find((f) => Math.ceil(mph / f + 0.05) <= 4) || 100;
  const n = Math.ceil(mph / step + 0.05);
  const ticks = [];
  for (let k = 0; k <= n; k++) ticks.push({at: k * step / MPH_PER_KT, text: k ? `${k * step} mph` : "0"});
  return {domain: [0, n * step / MPH_PER_KT], ticks};
}

// A water-level axis in feet on MLLW, placed in metres. A low tide goes
// below zero, so both ends are rounded outward to a whole tick.
function tideAxis(lo, hi) {
  const a = lo * FT_PER_M, b = Math.max(hi * FT_PER_M, a + 1);
  const step = [1, 2, 5, 10].find((f) => Math.ceil(b / f + 0.05) - Math.floor(a / f - 0.05) <= 5) || 20;
  const k0 = Math.floor(a / step - 0.05), k1 = Math.ceil(b / step + 0.05);
  const ticks = [];
  for (let k = k0; k <= k1; k++) {
    const v = k * step;
    ticks.push({at: v / FT_PER_M, text: v === 0 ? "0" : `${v < 0 ? "−" : ""}${Math.abs(v)} ft`});
  }
  return {domain: [k0 * step / FT_PER_M, k1 * step / FT_PER_M], ticks};
}

// The departure's axis: from zero to the furthest reading either side, in
// signed feet, rounded outward to a whole tick -- not symmetric, because the
// gauge has run on one side of its prediction for weeks at a time and a
// mirrored empty half would flatten the line that matters.
function depAxis(lo, hi) {
  const a = Math.min(0, lo) * FT_PER_M, b = Math.max(0, hi) * FT_PER_M;
  // Only a side that has readings gets the margin; zero itself is the edge.
  const lowK = (f) => (a < 0 ? Math.floor(a / f - 0.05) : 0);
  const highK = (f) => (b > 0 ? Math.ceil(b / f + 0.05) : 0);
  const step = [0.25, 0.5, 1, 2, 5].find((f) => highK(f) - lowK(f) <= 4) || 10;
  const k0 = lowK(step), k1 = Math.max(k0 + 1, highK(step));
  const ticks = [];
  for (let k = k0; k <= k1; k++) {
    const v = Number((k * step).toFixed(2));
    ticks.push({at: v / FT_PER_M, text: v === 0 ? "0" : `${v < 0 ? "−" : "+"}${Math.abs(v)} ft`});
  }
  return {domain: [k0 * step / FT_PER_M, k1 * step / FT_PER_M], ticks};
}

function wtSpec(id, steps, mode) {
  const fc = CHAIN === "fc";
  const value = (text, cls = "") => `<span class="v${cls ? " " + cls : ""}">${text}</span>`;
  const now = fcNowAt(steps);
  const W = WT || {};
  const station = W.wind_station || "KNZY";
  // An hour the measured file covers and holds nothing for is a gap, said so.
  const covered = (i) => W.generated_utc && steps[i].valid_utc <= W.generated_utc
    && Date.parse(steps[i].valid_utc) >= Date.parse(W.start_utc || steps[i].valid_utc);
  const time = (i, age) => new Date(Date.parse(steps[i].valid_utc) - age * 60000)
    .toLocaleTimeString(undefined, {hour: "numeric", minute: "2-digit"});

  if (id === "wind") {
    const seen = steps.map((s) => (s.seen ? s.seen.kt : null));
    const said = steps.map((s) => (s.fc ? s.fc.kt : null));
    // The direction strip runs all the way round, cut at the east: the
    // rarest wind at KNZY (45-90° on 2 of the 262 reports with a direction,
    // 2026-09-18 to 09-30), so the west-to-north-west most of them come
    // from sits whole in the middle rather than split across the edges.
    const round = (v) => (v < 90 ? v + 360 : v);
    const dots = [], points = [];
    steps.forEach((s, i) => {
      if (s.seen && s.seen.gust != null) dots.push({i, v: s.seen.gust, r: 1.8, cls: fc ? "gust obs" : "gust"});
      if (s.fc && s.fc.gust != null) dots.push({i, v: s.fc.gust, r: 1.8, cls: "gust"});
      if (s.seen && s.seen.from != null) points.push({i, v: round(s.seen.from), cls: fc ? "dir obs" : "dir"});
      if (s.fc && s.fc.from != null) points.push({i, v: round(s.fc.from), cls: "dir"});
      if (s.model && s.model.from != null) points.push({i, v: round(s.model.from), cls: "dir model"});
    });
    const lane = {points, arcs: [], domain: [90, 450], step: 90};
    const measured = (i) => {
      const s = steps[i];
      const words = windWords(s.seen);
      if (words) return {words, when: s.seen.age != null ? time(i, s.seen.age) : null};
      return null;
    };
    if (!fc) {
      return {
        scale: "speed", lines: [{cls: "main", label: `Wind at ${station}`, values: seen}], dots, lane,
        legend: [{cls: "main", label: "Speed"}, {cls: "gdot", label: "Gust"},
                 {cls: "dir", label: "Direction it blows from"}],
        says: `${station}'s measured wind each hour: the speed, a dot for any gust, and under it `
          + "the direction it blows from, which a calm or a variable wind does not have. Each hour "
          + "is the report taken in the hour up to it; an hour without one is a gap, never the "
          + "report beside it",
        read: (i) => {
          const m = measured(i);
          return m ? value(m.words) + (m.when ? ` &middot; reported ${m.when}` : "")
            : `no ${station} report in the hour to this one, left as a gap`;
        },
      };
    }
    const L = (DATA && DATA.local_wind) || {};
    const none = !said.some((v) => v != null);
    // GFS-Wave's own wind: at the buoy, 29 km offshore, the wind the model
    // grows its wind sea from. Hourly to +120 h and every third hour after,
    // so the line joins across the two hours the model does not give.
    const model = steps.map((s) => (s.model ? s.model.kt : null));
    return {
      scale: "speed", now, dots, lane,
      // The measured line last, so it sits on top where they meet.
      lines: [{cls: "model", label: "GFS-Wave wind", values: model, bridge: 3},
              {cls: "main", label: "Local forecast", values: said},
              {cls: "obs", label: `Observed at ${station}`, values: seen}],
      legend: [{cls: "main", label: "Local forecast, NWS"}, {cls: "model", label: "GFS-Wave wind"},
               {cls: "obs", label: `Observed at ${station}`},
               {cls: "gdot", label: "Gust"}, {cls: "dir", label: "Direction it blows from"}],
      says: "The National Weather Service's hourly forecast wind at Coronado, the Local wind on "
        + "the card; GFS-Wave's own wind, the one on the card above it, in grey: it is at the "
        + `buoy, 29 km offshore, the wind the model makes its wind sea from; and beside the `
        + `hours that have passed, ${station}'s measured wind in red. Dots are gusts; under it, `
        + "the direction each blows from"
        + (none ? `. No local forecast came with this run${L.why ? ` (${L.why})` : ""}` : ""),
      read: (i) => {
        const f = windWords(steps[i].fc);
        const g = windWords(steps[i].model);
        const m = measured(i);
        const obs = m ? ` &middot; ${value(`observed ${m.words}`, "obs")}`
          : covered(i) ? ` &middot; no ${station} report, left as a gap` : "";
        return (f ? value(`Local forecast ${f}`) : "no local forecast for this hour")
          + (g ? ` &middot; GFS-Wave ${g}` : "") + obs;
      },
    };
  }

  // The gauge's measured departure from its own harmonic prediction, each
  // hour, and the trailing 3-day mean of it a forecast built at that hour
  // would have added (forecast.windtide). Measured on both tabs: red on
  // the forecast's, as everything measured there is.
  if (mode === "departure") {
    const dep = steps.map((s) => (s.seen ? s.seen.dep : null));
    const mean = steps.map((s) => (s.seen ? s.seen.depMean : null));
    const days = Math.round((W.departure_hours || 72) / 24);
    return {
      scale: "dep", now, zero: true,
      lines: [{cls: "slow", label: `${days}-day mean`, values: mean},
              {cls: fc ? "obs" : "main", label: "Measured less predicted", values: dep}],
      legend: [{cls: fc ? "obs" : "main", label: "Measured less predicted, each hour"},
               {cls: "slow", label: `${days}-day mean, what the forecast adds`}],
      says: "The gauge's measured level less its harmonic prediction each hour, on the open "
        + `coast, and the ${days}-day mean of it that the forecast's tide carries`,
      read: (i) => {
        const d = dep[i], m = mean[i];
        if (d == null && m == null) {
          return covered(i) ? "no gauge sample at this hour, left as a gap" : "not measured yet";
        }
        return value(`Measured less predicted ${signedHeight(d)}`, fc ? "obs" : "")
          + (m != null ? ` &middot; ${days}-day mean ${signedHeight(m)}` : "");
      },
    };
  }

  // The tide, over night shaded from sunset to sunrise at the center break
  // (owner's request, 2026-10-02; forecast.daylight).
  const night = ((fc ? (DATA && DATA.hourly) || {} : W).nights || [])
    .map(([a, b]) => [Date.parse(a), Date.parse(b)]);
  const seen = steps.map((s) => (s.seen ? s.seen.tide : null));
  const site = W.tide_site || "the open coast";
  const gauge = W.tide_station ? `${W.tide_station_name || "the"} gauge (${W.tide_station})` : "the bay gauge";
  const noSample = "no gauge sample at this hour, left as a gap";
  if (!fc) {
    const P = W.prediction || {};
    const pred = steps.map((s) => s.pred);
    const dep = P.departure_m != null ? ` (${signedHeight(P.departure_m).replace(/<[^>]+>/g, "")})` : "";
    return {
      scale: "tide", now,
      lines: [{cls: "pred", label: "Predicted", values: pred},
              {cls: "main", label: "Measured", values: seen}],
      legend: [{cls: "main", label: "Measured"}, {cls: "pred", label: "Predicted, next 24 h"},
               {cls: "nightband", label: "Night"}],
      night,
      says: `The water level each hour at ${site}, measured at the ${gauge} and carried out to the `
        + "open coast, on its MLLW. Dashed, the next 24 hours of harmonic prediction, carried out "
        + "the same way"
        + (P.departure_m != null ? ", plus the gauge's measured departure from it over the last "
          + `3 days${dep}` : "")
        + ". The dashed line is a model, the one on this tab; the solid line is not",
      read: (i) => {
        const m = seen[i], p = pred[i];
        if (m != null) return value(`Measured ${height(m)}`) + (p != null ? ` &middot; predicted ${height(p)}` : "");
        if (p != null) return value(`Predicted ${height(p)}`, "pred");
        return noSample;
      },
    };
  }
  const said = steps.map((s) => (s.fc ? s.fc.tide : null));
  return {
    scale: "tide", now,
    // The measured line last, so it shows where it runs along the prediction.
    lines: [{cls: "main", label: "Predicted", values: said},
            {cls: "obs", label: "Measured", values: seen}],
    legend: [{cls: "main", label: "Predicted"}, {cls: "obs", label: "Measured"},
             {cls: "nightband", label: "Night"}],
    night,
    says: `The harmonic tide each hour at ${site} to the end of the run, carried out from the `
      + `${gauge} with the gauge's measured departure from it over the last 3 days added, as the `
      + "card's is; beside the hours that have passed, the level measured there, in red. On MLLW",
    read: (i) => {
      const f = said[i], m = seen[i];
      return (f != null ? value(`Predicted ${height(f)}`) : "no prediction for this hour")
        + (m != null ? ` &middot; ${value(`measured ${height(m)}`, "obs")}`
          : covered(i) ? ` &middot; ${noSample}` : "");
    },
  };
}

// SHORE DIRECTION (owner's request and name, 2026-10-01): how often the wind
// at the open break's tab has been offshore, cross-shore or onshore, and at
// what time of day. One bar per hour of the reader's clock, and each bar is
// that hour on EVERY day counted -- 6 AM on each of 14 days is 14 readings,
// one a day -- split by how many of those days it was each kind; the
// readout says "over 14 days" so the bar is never read as one hour's wind. The verdict
// is the card's own (`sense`, against that break's shore normal), so the
// chart and the line on the card can never disagree. On Now it is KNZY's
// measured hours in windtide.json; on Forecast, the NWS forecast hours the
// Local reading comes from. An hour with no report counts nowhere; a calm
// or variable wind has no direction and is its own share.
const SHORE = {w: 320, h: 150, l: 4, r: 6, t: 10, b: 20};
const SHORE_KINDS = [
  {id: "off", label: "Offshore", cls: "sh-off"},
  {id: "cross", label: "Cross-shore", cls: "sh-cross"},
  {id: "on", label: "Onshore", cls: "sh-on"},
  {id: "still", label: "Light or variable", cls: "sh-still"},
];

function shoreProfile(steps) {
  const fc = CHAIN === "fc";
  const cards = fc ? (DATA && DATA.breaks) || [] : (NOW && NOW.breaks) || [];
  const card = cards.find((b) => b.id === SWELL_TAB);
  if (!card || card.shore_normal_deg == null) return null;
  const blank = () => ({off: 0, cross: 0, on: 0, still: 0, n: 0});
  const rows = Array.from({length: 24}, blank);
  const total = blank();
  steps.forEach((s) => {
    const w = fc ? s.fc : s.seen;
    const kind = shoreKind(w, card.shore_normal_deg);
    if (!kind) return;
    const row = rows[new Date(s.valid_utc).getHours()];
    row[kind] += 1; row.n += 1;
    total[kind] += 1; total.n += 1;
  });
  return {id: card.id, name: SHORT[card.id] || card.name, rows, total};
}

// "6 AM" on the reader's clock, as every other time on the page is.
const hourName = (h) => new Date(2026, 0, 1, h).toLocaleTimeString(undefined, {hour: "numeric"});

function shoreRead(p, at) {
  const r = at == null ? p.total : p.rows[at];
  const when = at == null ? "all hours" : `${hourName(at)}, over ${r.n} day${r.n === 1 ? "" : "s"}`;
  if (!r.n) return `<b>${p.name}, ${at == null ? "all hours" : hourName(at)}</b> &middot; nothing to count`;
  const pc = (k) => `${Math.round(100 * r[k] / r.n)}%`;
  return `<b>${p.name}, ${when}</b> &middot; <span class="v">offshore ${pc("off")}</span>`
    + ` &middot; cross-shore ${pc("cross")} &middot; onshore ${pc("on")}`
    + (r.still ? ` &middot; light or variable ${pc("still")}` : "");
}

function shorePlot(p, at) {
  const {w, h, l, r, t, b} = SHORE;
  const plotW = w - l - r, bottom = h - b;
  const slot = plotW / 24;
  const Y = (share) => bottom - (bottom - t) * share;
  const f = (v) => v.toFixed(1);
  let out = "", labels = "";
  // Gridlines under the bars, their labels over them (haloed like every
  // other chart's), so a full bar never hides its own scale.
  [0, 0.5, 1].forEach((v) => {
    out += `<line class="grid" x1="${l}" x2="${w - r}" y1="${f(Y(v))}" y2="${f(Y(v))}"/>`;
    labels += `<text class="tick ytick" x="${l + 2}" y="${f(Y(v) - 3)}">${v ? `${v * 100}%` : "0"}</text>`;
  });
  p.rows.forEach((row, k) => {
    const x = l + k * slot + 1, bw = Math.max(1, slot - 2);
    if (k % 6 === 0) {
      out += `<line class="day" x1="${f(l + k * slot)}" x2="${f(l + k * slot)}" y1="${t}" y2="${bottom}"/>`
        + `<text class="tick" x="${f(l + k * slot + 3)}" y="${h - 6}">${hourName(k)}</text>`;
    }
    if (!row.n) return;
    let base = 0;
    SHORE_KINDS.forEach((kind) => {
      const share = row[kind.id] / row.n;
      if (!share) return;
      // A 2 px surface gap between stacked segments, as between bars.
      const y0 = Y(base + share), y1 = Y(base);
      out += `<rect class="${kind.cls}" x="${f(x)}" y="${f(y0 + 1)}" width="${f(bw)}" height="${f(Math.max(0.5, y1 - y0 - 1))}" rx="1"/>`;
      base += share;
    });
    if (k === at) {
      out += `<rect class="sh-on-hour" x="${f(x - 1)}" y="${t - 2}" width="${f(bw + 2)}" height="${f(bottom - t + 3)}" rx="2"/>`;
    }
  });
  return `<svg class="series shore" viewBox="0 0 ${w} ${h}" role="img"`
    + ` aria-label="${svgText(`How often the wind at ${p.name} has been offshore, cross-shore or onshore, by hour of day.`)}">`
    + out + labels + `</svg>`;
}

function shoreBody(steps) {
  const menu = wtMenu("wind", "shore");
  const p = steps && steps.length ? shoreProfile(steps) : null;
  const body = !SWELL_TAB || SWELL_TAB === BUOY_TAB
    ? `<span class="src">Open a break's tab: the buoy has no shore, so no offshore or onshore.</span>`
    : !p ? `<span class="src">${period(CHAIN === "fc" ? "No local forecast hours to count" : "The wind's hours are not loaded")}</span>`
    : `<div class="readout" aria-live="polite"><div>${shoreRead(p, null)}</div></div>
       <div class="plot profile" data-kind="shore">${shorePlot(p, null)}</div>
       <div class="legend">${SHORE_KINDS.map((k) => `<span><i class="sw ${k.cls}"></i>${k.label}</span>`).join("")}</div>`;
  return `<div class="chart-body" data-chart="wind">${menu}${body}</div>`;
}

// The hour under a pointer, read out and outlined; none puts the totals back.
function shoreHover(plot, clientX) {
  const p = shoreProfile(chartSteps("wind"));
  if (!p) return;
  let at = null;
  if (clientX != null) {
    const x = plotX(plot, clientX);
    at = Math.max(0, Math.min(23, Math.floor((x - SHORE.l) / ((SHORE.w - SHORE.l - SHORE.r) / 24))));
  }
  const body = plot.closest("[data-chart]");
  body.querySelector(".readout").innerHTML = `<div>${shoreRead(p, at)}</div>`;
  plot.innerHTML = shorePlot(p, at);
}

// A grid or bar view's readout and outline follow the pointer; off the plot
// they go back to the summary.
function staticHover(plot, clientX, clientY) {
  const kind = plot.getAttribute("data-kind");
  if (kind === "shore") { shoreHover(plot, clientX); return; }
  const view = kind === "week" ? weekData() : rangeData();
  if (!view) return;
  const at = clientX == null ? null : (kind === "week" ? weekAt : rangeAt)(plot, view, clientX, clientY);
  plot.closest("[data-chart]").querySelector(".readout").innerHTML =
    `<div>${(kind === "week" ? weekRead : rangeRead)(view, at)}</div>`;
  plot.innerHTML = (kind === "week" ? weekPlot : rangePlot)(view, at);
}
// One hour's kind on the Shore direction charts: the card's own verdict, so
// the two never disagree; calm, light and variable share the last.
const shoreKind = (w, normal) => {
  if (!w || w.kt == null) return null;
  if (w.from == null) return "still";
  const s = sense(-Math.cos((w.from - normal) * Math.PI / 180), w.kt);
  return s === "calm" || s.startsWith("light ") ? "still"
    : {offshore: "off", "cross-shore": "cross", onshore: "on"}[s];
};
const dayKey = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; };
// "Sat 3": the weekday first, whatever order the locale would put them in.
const dayName = (ms) => `${new Date(ms).toLocaleDateString(undefined, {weekday: "short"})} ${new Date(ms).getDate()}`;

// SHORE DIRECTION ON THE FORECAST TAB (owner's request, 2026-10-02): the
// local forecast's verdict at the open break hour by hour through the run,
// one row a day and one column an hour of the reader's clock, so "offshore
// Tuesday 5-9 AM" reads straight off it. The card's own verdict on the NWS
// hours the Local reading uses; an hour the forecast does not cover is an
// empty cell, never the hour beside it.
const WEEK = {w: 320, l: 40, r: 6, t: 4, row: 15, b: 18};
function weekData() {
  if (CHAIN !== "fc" || !SWELL_TAB || SWELL_TAB === BUOY_TAB) return null;
  const card = ((DATA && DATA.breaks) || []).find((b) => b.id === SWELL_TAB);
  if (!card || card.shore_normal_deg == null) return null;
  const rows = [], byDay = new Map();
  chartSteps("wind").forEach((s) => {
    const kind = shoreKind(s.fc, card.shore_normal_deg);
    if (!kind) return;
    const ms = Date.parse(s.valid_utc), key = dayKey(ms);
    if (!byDay.has(key)) { byDay.set(key, {ms, cells: Array(24).fill(null)}); rows.push(byDay.get(key)); }
    byDay.get(key).cells[new Date(ms).getHours()] = {kind, w: s.fc, valid_utc: s.valid_utc};
  });
  return rows.length ? {name: SHORT[card.id] || card.name, rows} : null;
}
function weekAt(plot, v, clientX, clientY) {
  const box = plot.getBoundingClientRect();
  const x = plotX(plot, clientX), y = (clientY - box.top) / box.width * WEEK.w;
  const col = Math.floor((x - WEEK.l) / ((WEEK.w - WEEK.l - WEEK.r) / 24));
  const row = Math.floor((y - WEEK.t) / WEEK.row);
  return row >= 0 && row < v.rows.length && col >= 0 && col < 24 ? {row, col} : null;
}
function weekRead(v, at) {
  if (!at) {
    const n = {off: 0, cross: 0, on: 0, still: 0};
    v.rows.forEach((r) => r.cells.forEach((c) => { if (c) n[c.kind] += 1; }));
    return `<b>${v.name}, through the run</b> &middot; <span class="v">offshore ${n.off} h</span>`
      + ` &middot; cross-shore ${n.cross} h &middot; onshore ${n.on} h`
      + (n.still ? ` &middot; light or variable ${n.still} h` : "");
  }
  const c = v.rows[at.row].cells[at.col];
  const when = `${dayName(v.rows[at.row].ms)}, ${hourName(at.col)}`;
  if (!c) return `<b>${v.name}, ${when}</b> &middot; no local forecast for this hour`;
  const label = SHORE_KINDS.find((k) => k.id === c.kind).label.toLowerCase();
  return `<b>${v.name}, ${when}</b> &middot; <span class="v">${label}</span> &middot; ${windWords(c.w)}`;
}
function weekPlot(v, at) {
  const {w, l, r, t, row, b} = WEEK;
  const h = t + v.rows.length * row + b, cw = (w - l - r) / 24;
  const f = (x) => x.toFixed(1);
  let out = "";
  [0, 6, 12, 18].forEach((k) => {
    out += `<line class="day" x1="${f(l + k * cw)}" x2="${f(l + k * cw)}" y1="${t}" y2="${t + v.rows.length * row}"/>`
      + `<text class="tick" x="${f(l + k * cw + 2)}" y="${h - 5}">${hourName(k)}</text>`;
  });
  v.rows.forEach((d, i) => {
    const y = t + i * row;
    out += `<text class="tick" x="0" y="${f(y + row - 4)}">${dayName(d.ms)}</text>`;
    d.cells.forEach((c, k) => {
      if (!c) return;
      const cls = SHORE_KINDS.find((x) => x.id === c.kind).cls;
      out += `<rect class="${cls}" x="${f(l + k * cw + 0.5)}" y="${f(y + 1)}" width="${f(cw - 1)}" height="${row - 2}" rx="1"/>`;
    });
    if (at && at.row === i) {
      out += `<rect class="sh-on-hour" x="${f(l + at.col * cw - 0.5)}" y="${f(y)}" width="${f(cw + 1)}" height="${row}" rx="2"/>`;
    }
  });
  return `<svg class="series week" viewBox="0 0 ${w} ${h}" role="img"`
    + ` aria-label="${svgText(`The local forecast's wind at ${v.name}, offshore, cross-shore or onshore, hour by hour through the run.`)}">`
    + out + `</svg>`;
}
function weekBody() {
  const v = weekData();
  const body = !SWELL_TAB || SWELL_TAB === BUOY_TAB
    ? `<span class="src">Open a break's tab: the buoy has no shore, so no offshore or onshore.</span>`
    : !v ? `<span class="src">No local forecast hours came with this run.</span>`
    : `<div class="readout" aria-live="polite"><div>${weekRead(v, null)}</div></div>
       <div class="plot profile" data-kind="week">${weekPlot(v, null)}</div>
       <div class="legend">${SHORE_KINDS.map((k) => `<span><i class="sw ${k.cls}"></i>${k.label}</span>`).join("")}</div>`;
  return `<div class="chart-body" data-chart="wind">${wtMenu("wind", "week")}${body}</div>`;
}

// DAILY RANGE (owner's request, 2026-10-02): each day of the run as one bar,
// its biggest swing -- the largest rise or fall between two consecutive
// turns that starts that day -- from the harmonic turns the card's own
// "rising to ..." line uses (CO-OPS's hilo, carried to the open coast with
// the measured departure), never found in the hourly curve. Consecutive
// turns, not the calendar day's highest high and lowest low: this coast's
// lower low drifts ~50 min a day and crosses midnight every few days, and a
// calendar day that lost it read as a neap that was not there. Long bars
// are spring tides, short ones neaps. A day with no swing starting in it
// inside the run is left out, not guessed.
const RANGE = {w: 320, h: 150, l: 30, r: 6, t: 10, b: 20};
function rangeData() {
  if (CHAIN !== "fc" || !DATA) return null;
  const turns = (DATA.tide_turns || []).slice()
    .sort((a, b) => (a.valid_utc < b.valid_utc ? -1 : 1));
  const days = [], byDay = new Map();
  for (let i = 0; i + 1 < turns.length; i++) {
    const a = turns[i], b = turns[i + 1];
    if (a.event === b.event) continue;
    const hi = a.event === "high" ? a : b, lo = a.event === "high" ? b : a;
    const ms = Date.parse(a.valid_utc), key = dayKey(ms);
    const span = hi.height_m - lo.height_m;
    if (!byDay.has(key)) { byDay.set(key, {ms, hi, lo, falling: a === hi}); days.push(byDay.get(key)); }
    const d = byDay.get(key);
    if (span > d.hi.height_m - d.lo.height_m) Object.assign(d, {hi, lo, falling: a === hi});
  }
  return days.length ? {days} : null;
}
function rangeAt(plot, v, clientX) {
  const x = plotX(plot, clientX);
  const k = Math.floor((x - RANGE.l) / ((RANGE.w - RANGE.l - RANGE.r) / v.days.length));
  return k >= 0 && k < v.days.length ? k : null;
}
// The day the forecast's picked hour falls in, so the bars open on it.
function rangeDefault(v) {
  const hour = STEPS[CURSOR];
  const key = hour ? dayKey(Date.parse(hour.valid_utc)) : null;
  const k = v.days.findIndex((d) => dayKey(d.ms) === key);
  return k >= 0 ? k : null;
}
function rangeRead(v, at) {
  const k = at == null ? rangeDefault(v) : at;
  if (k == null) return "<b>Each day's tide</b>";
  const d = v.days[k];
  const t = (iso) => clock(iso);
  const span = d.hi.height_m - d.lo.height_m;
  const [first, second] = d.falling ? [["high", d.hi], ["low", d.lo]] : [["low", d.lo], ["high", d.hi]];
  return `<b>${dayName(d.ms)}</b> &middot; <span class="v">range ${height(span)}</span>`
    + ` &middot; ${first[0]} ${height(first[1].height_m)} at ${t(first[1].valid_utc)}`
    + ` to ${second[0]} ${height(second[1].height_m)} at ${t(second[1].valid_utc)}`;
}
function rangePlot(v, at) {
  const {w, h, l, r, t, b} = RANGE;
  const k0 = at == null ? rangeDefault(v) : at;
  const lo = Math.min(...v.days.map((d) => d.lo.height_m)), hi = Math.max(...v.days.map((d) => d.hi.height_m));
  const {domain, ticks} = tideAxis(lo, hi);
  const bottom = h - b, Y = (m) => t + (bottom - t) * (domain[1] - m) / (domain[1] - domain[0]);
  const slot = (w - l - r) / v.days.length, bw = Math.min(18, slot - 4);
  const f = (x) => x.toFixed(1);
  let grid = "", labels = "", bars = "";
  ticks.forEach((tk) => {
    grid += `<line class="grid" x1="${l}" x2="${w - r}" y1="${f(Y(tk.at))}" y2="${f(Y(tk.at))}"/>`;
    // Left of the bars, in their own margin, so no bar sits on its scale.
    labels += `<text class="tick ytick" x="0" y="${f(Y(tk.at) + 3)}">${tk.text}</text>`;
  });
  v.days.forEach((d, k) => {
    const cx = l + (k + 0.5) * slot, y0 = Y(d.hi.height_m), y1 = Y(d.lo.height_m);
    bars += `<rect class="rangebar${k === k0 ? " on" : ""}" x="${f(cx - bw / 2)}" y="${f(y0)}" width="${f(bw)}" height="${f(Math.max(1, y1 - y0))}" rx="${f(Math.min(4, bw / 2))}"/>`;
    labels += `<text class="tick" x="${f(cx)}" y="${h - 6}" text-anchor="middle">${new Date(d.ms).toLocaleDateString(undefined, {weekday: "narrow"})}</text>`;
  });
  return `<svg class="series range" viewBox="0 0 ${w} ${h}" role="img"`
    + ` aria-label="${svgText("Each day's lowest predicted low and highest predicted high at the open coast, through the run.")}">`
    + grid + bars + labels + `</svg>`;
}
function rangeBody() {
  const v = rangeData();
  const body = !v ? `<span class="src">No predicted turns came with this run.</span>`
    : `<div class="readout" aria-live="polite"><div>${rangeRead(v, null)}</div></div>
       <div class="plot profile" data-kind="range">${rangePlot(v, null)}</div>`;
  return `<div class="chart-body" data-chart="tide">${wtMenu("tide", "range")}${body}</div>`;
}

// The fold under the Wind and Tide cards: its own caret and its own open
// state, kept across a refresh like the swell's.
const CARD_CHART_OPEN = {wind: false, tide: false};
function setCardChartOpen(id, open) {
  CARD_CHART_OPEN[id] = open;
  remember(id === "wind" ? KEEP.windChart : KEEP.tideChart, open ? "open" : "closed");
  document.querySelectorAll(`[data-card-chart-toggle="${id}"]`).forEach((btn) => {
    btn.setAttribute("aria-expanded", String(open));
    const fold = $(btn.getAttribute("aria-controls"));
    if (fold) fold.hidden = !open;
  });
}
function cardChart(id) {
  const open = !!CARD_CHART_OPEN[id];
  return `<div class="chart">
    <div class="chart-head"><span>Charts</span><button type="button" class="calc-toggle"
      data-card-chart-toggle="${id}" aria-controls="chart-fold-${id}" aria-expanded="${open}"
      aria-label="Charts"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 10 8 5.5 12.5 10"/></svg></button></div>
    <div class="chart-fold" id="chart-fold-${id}"${open ? "" : " hidden"}>${chartBody(id)}</div>
  </div>`;
}

// The swell card, for either chain. Same shape, different provenance: an
// observed spectrum on one tab and a modelled one on the other.
//
// One tab per break, ranked by window energy, and the buoy ALWAYS last: it is
// the input the three are derived from, not a fourth break to rank against
// them. Its title comes from the file, never typed.
//
// The provenance sits under the tabs rather than inside the buoy's,
// because every tab is that one spectrum, through an aperture or not -- and a
// stale reading has to be marked whichever tab is open. Tucked into the
// buoy's tab, an overdue spectrum would sit behind three tabs of window
// energy derived from it with no mark on any of them.
function swellCard({label, buoy, station, stationName = null, others = [], cards, source,
                    due = "", measured = null, chart = false, origin = null, buoyRose = ""}) {
  const tabs = rankByEnergy(cards || []).map((c) => ({
    id: c.id, title: SHORT[c.id] || c.name, body: breakPanel(c), chart: !!c.chart,
    origin: c.origin || null,
  }));
  // "Buoys" on both chains (owner's request, 2026-10-06), though only the
  // LIVE tab carries a second one: GFS-Wave's run is at 46232 alone. The id
  // stays "buoy", so a reader's remembered tab and chart still find it.
  // The context buoys render AFTER the provenance lines below, so 46232's
  // provenance stays under 46232's reading and each context buoy's under its
  // own; shown and hidden with the tab like its pane.
  tabs.push({id: BUOY_TAB, title: "Buoys",
             body: buoyPanel(buoy, measured, {id: station, name: stationName}, others.length > 0,
                             buoyRose),
             after: others.map(contextBuoy).join(""), chart, origin});
  const chosen = tabs.some((tab) => tab.id === SWELL_TAB) ? SWELL_TAB : tabs[0].id;
  // The Wind card, built after this one, shows the line for the open tab.
  SWELL_TAB = chosen;

  return `<div class="cond swell" data-card="swell">
    <span class="lbl">${label}</span>
    <div class="subtabs" role="tablist" aria-label="${label} at each break, then at the buoys">
      ${tabs.map((tab) => `<button type="button" role="tab" id="swell-tab-${tab.id}"
        data-swell-tab="${tab.id}" aria-controls="swell-pane-${tab.id}"
        aria-selected="${tab.id === chosen}" tabindex="${tab.id === chosen ? 0 : -1}"
        >${tab.title}</button>`).join("")}
    </div>
    ${tabs.map((tab) => `<div class="pane" role="tabpanel" id="swell-pane-${tab.id}"
      aria-labelledby="swell-tab-${tab.id}"${tab.id === chosen ? "" : " hidden"}>${tab.body}</div>`).join("")}
    ${srcLines(source, due)}
    ${tabs.filter((tab) => tab.after).map((tab) => `<div class="pane after" data-after-tab="${tab.id}"`
      + `${tab.id === chosen ? "" : " hidden"}>${tab.after}</div>`).join("")}
    ${tabs.map((tab) => originFold(tab.id, tab.origin, tab.id !== chosen)).join("")}
    ${tabs.filter((tab) => tab.chart).map((tab) => seriesChart(tab.id, tab.id !== chosen)).join("")}
  </div>`;
}

// What the measured wind means at each break, on the Wind card, one line per
// break and only the one whose swell tab is open. The measurement is hoisted;
// the interpretation is not, because it is made against each break's own
// shore normal and those span 27° -- the same wind reads cross-shore at north
// and onshore at south. So the line names its break ("at this break") and
// changes with the tab; on the buoy's tab there is no shore and no line.
//
// Now tab only (owner's decision, 2026-09-26). The forecast's wind is
// GFS-Wave's at the buoy, 29 km offshore, which is not the wind KNZY measures
// at the beach, and a verdict against the shore normal needs the local one.
function windAtBreaks(cards) {
  return (cards || []).map((c) => {
    // A variable wind has no side at any break; it says so rather than
    // leaving the line out, as the Shore direction charts count it.
    const s = c.windVariable ? (c.windKt <= LIGHT_KT ? "light and variable" : "variable")
      : sense(c.windOffshore, c.windKt);
    if (!s) return "";
    return `<span class="turn" data-wind-for="${c.id}"${c.id === SWELL_TAB ? "" : " hidden"}>`
      + `<b>${s}</b> at this break`
      + (c.windNote ? ` <span class="tag">${c.windNote}</span>` : "")
      + `</span>`;
  }).join("");
}

// Switching tabs flips attributes rather than re-rendering, so focus stays on
// the tab the reader is on and the countdowns keep their place.
function selectSwellTab(id, {focus = false} = {}) {
  SWELL_TAB = id;
  remember(KEEP.swell, id);
  const shore = $("chart-fold-wind");
  if (shore && ["shore", "week"].includes(chartModeFor("wind"))) shore.innerHTML = chartBody("wind");
  document.querySelectorAll("[data-wind-for]").forEach((line) => {
    line.hidden = line.getAttribute("data-wind-for") !== id;
  });
  document.querySelectorAll("[data-chart-tab]").forEach((chart) => {
    chart.hidden = chart.getAttribute("data-chart-tab") !== id;
  });
  document.querySelectorAll("[data-origin-tab]").forEach((fold) => {
    fold.hidden = fold.getAttribute("data-origin-tab") !== id;
  });
  document.querySelectorAll("[data-after-tab]").forEach((block) => {
    block.hidden = block.getAttribute("data-after-tab") !== id;
  });
  document.querySelectorAll("[data-swell-tab]").forEach((btn) => {
    const on = btn.getAttribute("data-swell-tab") === id;
    btn.setAttribute("aria-selected", String(on));
    btn.tabIndex = on ? 0 : -1;
    const pane = $(btn.getAttribute("aria-controls"));
    if (pane) pane.hidden = !on;
    if (on && focus) btn.focus();
  });
}

// Delegated once, on the strip, because the card is rebuilt on every render.
// Arrow keys move along the row the way a tablist is expected to.
function wireSwellTabs() {
  const strip = $("conditions");
  strip.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-swell-tab]");
    if (btn) selectSwellTab(btn.getAttribute("data-swell-tab"));
    // The caret, or anywhere else on the headline's line.
    if (e.target.closest("[data-calc-toggle]") || e.target.closest(".val-row")) setCalcOpen(!CALC_OPEN);
    // Origin's caret, or anywhere else on its line.
    if (e.target.closest("[data-origin-head]")) setOriginOpen(!ORIGIN_OPEN);
  });
  strip.addEventListener("keydown", (e) => {
    const btn = e.target.closest("[data-swell-tab]");
    if (!btn) return;
    const all = [...strip.querySelectorAll("[data-swell-tab]")];
    const at = all.indexOf(btn);
    const to = e.key === "ArrowRight" ? (at + 1) % all.length
      : e.key === "ArrowLeft" ? (at - 1 + all.length) % all.length
      : e.key === "Home" ? 0
      : e.key === "End" ? all.length - 1
      : null;
    if (to == null) return;
    e.preventDefault();
    selectSwellTab(all[to].getAttribute("data-swell-tab"), {focus: true});
  });
}

// The Wind card's second reading on the Forecast tab, "Local": the forecast
// wind on the sand (the NWS forecast grid at Coronado, `collector.localwind`),
// under the model's wind at the buoy. The buoy's wind says how much wind sea
// the model is making offshore; this one says whether it is offshore at a
// break, per break, as the Now tab's measured KNZY wind does. A past hour
// whose build kept no local wind says nothing rather than borrowing today's.
function localWindBlock(hour, cards, stampWhen, past) {
  const L = (DATA && DATA.local_wind) || {};
  if (hour && hour.local_wind_from_deg != null) {
    const gust = hour.local_gust_kt ? ` <span class="unit">gusting ${Math.round(hour.local_gust_kt * MPH_PER_KT)} mph</span>` : "";
    const grid = L.office ? `NWS forecast grid ${L.office} ${L.grid_x},${L.grid_y} at Coronado` : "NWS forecast grid at Coronado";
    const issued = L.updated_utc ? `, updated ${when(L.updated_utc)}` : "";
    return `<div class="subcond" data-wind="local">
      <span class="sublbl">Local</span>
      <span class="val">${windVal(hour.local_wind_from_deg, hour.local_wind_kt)}${gust}</span>
      ${windAtBreaks(cards)}
      ${srcLines([`Forecast for ${stampWhen}`, `${grid}${past ? "" : issued}`])}
    </div>`;
  }
  if (past) return "";
  const why = L.available === false && L.why ? L.why : "no local forecast for this hour";
  return `<div class="subcond" data-wind="local">
    <span class="sublbl">Local</span>
    <span class="val"><span class="unit">no local forecast</span></span>
    ${srcLines(why)}
  </div>`;
}

function renderConditions(step, cards) {
  const rows = [];
  useChain(MODE === "now" ? "now" : "fc");

  if (MODE === "now") {
    const wind = (NOW && NOW.wind) || {};
    const tide = (NOW && NOW.tide) || {};
    const buoy = (NOW && NOW.buoy) || {};

    // Each card is titled for the quantity alone. Which chain it belongs to
    // is the tab, and when it was taken is the first provenance line
    // beneath it, so repeating either in the title tells the reader nothing
    // they cannot already see. The card carries what the buoy saw AND where
    // it was seen, which is why the separate provenance line below the cards
    // is gone: the measurement and its source belong together.
    // The swell card is the one that can be forced overdue by the build: the
    // countdown only knows the hour it expected, and `stale` knows the reasons
    // it cannot see.
    const due = (NOW && NOW.next_expected) || {};
    const late = (NOW && NOW.overdue_after) || {};
    rows.push(swellCard({
      label: "Swell",
      buoy,
      station: NOW && NOW.station,
      stationName: NOW && NOW.station_name,
      others: (BUOYS && BUOYS.buoys) || [],
      buoyRose: roseBlock(NOW && NOW.station),
      cards,
      source: [
        NOW && NOW.observed_utc ? `Observed ${observedAt(NOW.observed_utc)}` : "",
        NOW && NOW.station_name
          ? `Spectral wave data, ${NOW.station_name} (NDBC ${NOW.station})` : "",
      ],
      due: dueSpan(due.swell, late.swell, {forceOver: nowIsStale()}),
      chart: true,
      origin: originFor("buoy"),
    }));

    rows.push(`<div class="cond" data-card="wind">
      <span class="lbl">Wind</span>
      <span class="val">${windHeard(wind)
        ? windVal(wind.from_deg, wind.speed_kt)
          + (wind.gust_kt ? ` <span class="unit">gusting ${Math.round(wind.gust_kt * MPH_PER_KT)} mph</span>` : "")
        : '<span class="unit">not collected</span>'}</span>
      ${windHeard(wind) ? windAtBreaks(cards) : ""}
      ${windHeard(wind)
        ? srcLines([`Observed ${observedAt(wind.observed_utc)}`,
                    `METAR, ${wind.station_name} (${wind.station})`],
                   dueSpan(due.wind, late.wind))
        : srcLines(wind.note)}
      ${cardChart("wind")}
    </div>`);
    // The turn is asked for against the READER's clock, not the build's, so
    // it keeps being the next turn as turns pass beneath an open page.
    rows.push(`<div class="cond" data-card="tide">
      <span class="lbl">Tide</span>
      <span class="val">${tide.height_m != null
        ? height(tide.height_m)
        : '<span class="unit">not collected</span>'}</span>
      ${turnLine((NOW && NOW.tide_turns) || [], new Date().toISOString(), {tagged: true})}
      ${tide.height_m != null
        ? srcLines([`Measured ${observedAt(tide.observed_utc)}`, tideSource(NOW)],
                   dueSpan(due.tide, late.tide))
        : srcLines(tide.note)}
      ${cardChart("tide")}
    </div>`);
  } else {
    const wind = DATA.wind || {};
    const past = step.from === "past";
    // An earlier run's hour in full, when its build kept it: the model's wind
    // is on each break's hour, the buoy and the tide beside them.
    const detail = past ? step.entry.detail : null;
    const stamp = past
      ? (detail ? Object.values(detail.breaks || {})[0] || null : null)
      : ((DATA.breaks[0] || {}).hours || [])[step.index];
    const tide = (detail && detail.tide) || TIDE_BY_TIME[step.valid_utc] || {};
    const hour = stamp || {};
    const stampWhen = when(step.valid_utc);
    const run = runLine(step);
    const modelled = hour.wind_from_deg != null;
    const measured = measuredAt(step.valid_utc);
    const got = measured.state === "value" ? measured.entry : null;

    // Same card as the observed tab, so a reader comparing the two is
    // comparing like with like rather than two different presentations.
    const buoy = past ? ((detail && detail.buoy) || step.entry.buoy)
      : (DATA.buoy || []).find((b) => b.valid_utc === step.valid_utc);
    rows.push(swellCard({
      label: "Swell",
      buoy,
      station: DATA.station,
      cards,
      measured,
      source: [
        `Forecast for ${stampWhen}`,
        buoy
          ? `GFS-Wave ${(past ? step.entry.wave_source : DATA.wave_source) === "partitions"
              ? "partitions" : "spectrum"}, ${DATA.station_name} (NDBC ${DATA.station})`
          : `The spectral product was unavailable for this cycle, so there are no trains`,
        run,
      ],
      chart: true,
    }));

    // Wind and tide under an earlier run's hour: the log kept neither, so
    // those cards carry only the measurement, in the same red and saying so.
    const seenWind = got && got.wind_kt != null
      ? `<div class="measured"><span class="lbl">Observed at ${clock(step.valid_utc)}</span>`
        + `<span class="mval">${windVal(got.wind_from_deg, got.wind_kt)}</span></div>` : "";
    const seenTide = got && got.tide_m != null
      ? `<div class="measured"><span class="lbl">Measured at ${clock(step.valid_utc)}</span>`
        + `<span class="mval">${height(got.tide_m)}</span></div>` : "";
    if (past && !detail) {
      rows.push(`<div class="cond" data-card="wind">
        <span class="lbl">Wind</span>
        <span class="val"><span class="unit">not kept for earlier runs</span></span>
        ${seenWind}
        ${cardChart("wind")}
      </div>`);
      rows.push(`<div class="cond" data-card="tide">
        <span class="lbl">Tide</span>
        <span class="val"><span class="unit">not kept for earlier runs</span></span>
        ${seenTide}
        ${cardChart("tide")}
      </div>`);
